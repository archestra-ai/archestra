{{- $mcpNamespace := .Values.archestra.orchestrator.kubernetes.namespace | default .Release.Namespace }}
{{- $runtimeNamespaces := concat (list $mcpNamespace) (.Values.archestra.orchestrator.kubernetes.rbac.environmentNamespaces | default (list)) | uniq }}
{{- range $namespace := $runtimeNamespaces }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "archestra-platform.mcpRuntimeAnchorName" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "archestra-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: mcp-runtime-anchor
{{- end }}
