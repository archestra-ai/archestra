name: Platform Linting and Tests

on:
  workflow_call:
    inputs:
      should-skip-running-and-always-succeed:
        description: "Whether to force the checks to succeed"
        required: false
        type: boolean

jobs:
  platform-linting-and-tests:
    name: Platform Linting and Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./platform
    steps:
      - name: Checkout project
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup environment
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: ./.github/actions/setup-env
        continue-on-error: ${{ inputs.should-skip-running-and-always-succeed }}
        with:
          working-directory: ./platform

      - name: Setup environment variables
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        run: cp .env.example .env

      - name: Turbo Cache
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: actions/cache@v4
        with:
          path: ./platform/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Type checking, linting, formatting checks
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        run: pnpm check:ci

  platform-e2e-tests:
    name: Platform e2e Tests
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # runs-on: ubuntu-latest
    permissions:
      contents: read
    # container:
    #   image: europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public/e2e-test-ci:latest
    #   options: --user 0 --privileged --volume /var/run/docker.sock:/var/run/docker.sock
    #   # https://docs.blacksmith.sh/blacksmith-caching/dependencies-actions#using-the-blacksmith-cache-inside-a-container
    #   env:
    #     # BLACKSMITH_CACHE_TOKEN: ${{ env.BLACKSMITH_CACHE_TOKEN }}
    #     # BLACKSMITH_CACHE_URL: ${{ env.BLACKSMITH_CACHE_URL }}
    #     # GITHUB_REPO_NAME: ${{ env.GITHUB_REPO_NAME }}
    #     KUBECONFIG: /github/home/.kube/config
    steps:
      - name: Checkout repository
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup environment
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: ./.github/actions/setup-env
        with:
          working-directory: ./platform

      - name: Setup environment variables
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        working-directory: ./platform
        run: cp .env.example .env

      - name: Install Kind
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: helm/kind-action@92086f6be054225fa813e0a4b13787fc9088faab # v1.13.0
        with:
          config: .github/kind.yaml
          cluster_name: archestra-ci-cluster
          install_only: false

      # - name: Create Kind cluster
      #   if: ${{ inputs.should-skip-running-and-always-succeed != true }}
      #   run: |
      #     NETWORK_NAME=$(docker network ls --filter "label=bdf586" --format "{{.Name}}" | head -n 1)
      #     export KIND_EXPERIMENTAL_DOCKER_NETWORK="${NETWORK_NAME:-kind}"

      #     if ! kind get clusters | grep -q "archestra-ci-cluster"; then
      #       kind create cluster --name archestra-ci-cluster --config .github/kind.yaml --wait 120s
      #     else
      #       echo "Kind cluster already exists"
      #     fi

      #     RUNNER_CONTAINER_ID=$(cat /etc/hostname 2>/dev/null || true)
      #     if [ -n "$RUNNER_CONTAINER_ID" ]; then
      #       echo "Connecting runner container ${RUNNER_CONTAINER_ID} to $KIND_EXPERIMENTAL_DOCKER_NETWORK network"
      #       docker network connect "$KIND_EXPERIMENTAL_DOCKER_NETWORK" "$RUNNER_CONTAINER_ID" >/dev/null 2>&1 || echo "Runner container already connected to $KIND_EXPERIMENTAL_DOCKER_NETWORK"
      #     else
      #       echo "Unable to determine runner container id; skipping network connect"
      #     fi

      #     mkdir -p ~/.kube
      #     kind get kubeconfig --name archestra-ci-cluster --internal > ~/.kube/config

      - name: Debug Kind cluster
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        run: |
          echo "=== Kind version ==="
          kind version
          echo "=== Available clusters ==="
          kind get clusters || echo "No clusters found"
          echo "=== Docker containers ==="
          docker ps -a | grep kind || echo "No kind containers found"
          echo "=== Kubectl context ==="
          kubectl config current-context || echo "No kubectl context"
          echo "=== Kubectl cluster info ==="
          kubectl cluster-info || echo "Cluster info failed"

      # - name: Setup Blacksmith Builder
      #   if: ${{ inputs.should-skip-running-and-always-succeed != true }}
      #   uses: useblacksmith/setup-docker-builder@f9b57e1c7d5a57eed0b5609e1ffeadbf3bb0b726 # v1.1.0

      - name: Turbo Cache
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: actions/cache@v4
        with:
          path: ./platform/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup Blacksmith Builder
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: useblacksmith/setup-docker-builder@f9b57e1c7d5a57eed0b5609e1ffeadbf3bb0b726 # v1.1.0

      - name: Build Docker image
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: useblacksmith/build-push-action@30c71162f16ea2c27c3e21523255d209b8b538c1 # v2
        with:
          context: ./platform
          file: ./platform/Dockerfile
          push: false
          load: true
          tags: archestra/platform:ci-test

      # - name: Set up Docker Buildx
      #   if: ${{ inputs.should-skip-running-and-always-succeed != true }}
      #   uses: docker/setup-buildx-action@v3

      # - name: Build Docker image
      #   if: ${{ inputs.should-skip-running-and-always-succeed != true }}
      #   # uses: useblacksmith/build-push-action@30c71162f16ea2c27c3e21523255d209b8b538c1 # v2
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: ./platform
      #     file: ./platform/Dockerfile
      #     push: false
      #     load: true
      #     tags: archestra/platform:ci-test

      - name: Load Docker image into kind
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        run: kind load docker-image archestra/platform:ci-test --name archestra-ci-cluster

      - name: Deploy Archestra Platform (and WireMock) with Helm
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        run: |
          # No need to wait for wiremock as we wait in the next step when installing the platform
          helm install wiremock ./platform/helm/wiremock

          helm install archestra-platform ./platform/helm/archestra \
            --values .github/values-ci.yaml \
            --set archestra.image=archestra/platform:ci-test \
            --wait --timeout=5m

      - name: Verify deployment
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        run: |
          echo "=== Kubernetes Pods ==="
          kubectl get pods -o wide

          echo "=== Kubernetes Services ==="
          kubectl get services

          echo "=== Archestra Platform Logs ==="
          kubectl logs -l app.kubernetes.io/name=archestra-platform --tail=50

      - name: Wait for services to be healthy
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        run: |
          echo "Waiting for platform pods to be ready..."
          kubectl wait --for=condition=Ready pods -l app.kubernetes.io/name=archestra-platform --timeout=120s
          echo "Platform pods are ready"

          echo "Verifying services are accessible..."
          curl --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3000/ || (echo "Frontend not accessible" && exit 1)
          curl --retry 10 --retry-delay 2 --retry-connrefused http://localhost:9000/health || (echo "Backend not accessible" && exit 1)
          echo "All services are ready"

      # Check migration consistency using drizzle-kit check
      # https://orm.drizzle.team/docs/drizzle-kit-check
      # The drizzle-kit check command lets you check consistency of your generated SQL migrations history
      - name: Check drizzle-kit migrations consistency
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        working-directory: ./platform/backend
        run: pnpm drizzle-kit check

      - name: Check for codegen'd changes
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        working-directory: ./platform
        run: |
          pnpm codegen:api-client
          # Ensure generated files are properly formatted and linted
          pnpm lint:fix

          # Check both unstaged and staged changes
          if ! git diff --exit-code || ! git diff --cached --exit-code; then
            echo "::error::Generated code is not up to date. Please run 'pnpm codegen:api-client && pnpm lint:fix' locally and commit the changes."
            exit 1
          else
            echo "Generated code is up to date"
            echo "codegen-changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify no pending database migrations
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        id: db-migration-check
        working-directory: ./platform
        run: |
          # Run db generate with timeout to prevent hanging on interactive prompts
          set +e  # Don't exit on command failure

          echo "Running pnpm db:generate -- awaiting up to 15 seconds for a potential drizzle-kit generate interactive prompt (which could indicate a pending database migration, such as a table rename)"

          # Use timeout and expect no interaction - if it hangs, it means there's a pending migration which requires
          # user input to continue
          if timeout 15s pnpm db:generate > /tmp/db_generate_output.txt 2>&1; then
            # Command completed successfully within timeout
            output=$(cat /tmp/db_generate_output.txt)
            echo "Output from pnpm db:generate:"
            echo "$output"

            # Check if there's an interactive prompt in the output (shouldn't happen if it completed)
            if echo "$output" | grep -q "❯\|Is.*table created or renamed"; then
              echo "❌ Interactive prompt detected - there are pending database migrations that need to be committed"
              echo "Run 'pnpm db:generate' locally, make your choices, and commit the resulting migration files"
              exit 1
            fi
          else
            # Command timed out or failed
            exit_code=$?
            output=$(cat /tmp/db_generate_output.txt 2>/dev/null || echo "No output captured")

            echo "Output from pnpm db:generate (before timeout/failure):"
            echo "$output"

            if [ $exit_code -eq 124 ]; then
              # Timeout occurred - likely waiting for interactive input
              echo "❌ Command timed out - likely waiting for interactive input about pending database migrations"
              echo "Run 'pnpm db:generate' locally, make your choices, and commit the resulting migration files"
            else
              echo "❌ pnpm db:generate failed with exit code $exit_code"
            fi
            exit 1
          fi

          set -e  # Re-enable exit on error

          # Check both unstaged and staged changes
          if ! git diff --exit-code || ! git diff --cached --exit-code; then
            echo "New migration files were generated - committing changes"
            echo "db-migration-check=true" >> $GITHUB_OUTPUT
          else
            echo "No new migration files were generated"
            echo "db-migration-check=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail if PR from a fork has uncommitted migration changes
        if: steps.db-migration-check.outputs.db-migration-check == 'true' && github.event.pull_request.head.repo.fork == true
        working-directory: ./platform
        run: |
          echo "::error::Database migrations need to be generated. Please run 'pnpm db:generate' locally and commit the changes."
          exit 1

      - name: Get Playwright version
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        working-directory: ./platform/e2e-tests
        run: |
          echo "PLAYWRIGHT_VERSION=$(cat ./package.json | jq -r '.devDependencies["@playwright/test"]')" >> $GITHUB_ENV

      - name: Cache Playwright binaries and dependencies
        id: playwright-cache
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-chromium-webkit-firefox

      # see https://github.com/microsoft/playwright/issues/7249#issuecomment-2806545369
      - name: Install Playwright browsers
        if: inputs.should-skip-running-and-always-succeed != true && steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./platform/e2e-tests
        run: pnpm exec playwright install --with-deps chromium webkit firefox

      - name: Run E2E tests
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        working-directory: ./platform
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: platform/e2e-tests/playwright-report/
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Kubernetes Pods ==="
          kubectl get pods -o wide

          echo "=== Kubernetes Services ==="
          kubectl get services

          echo "=== Archestra Platform Logs ==="
          kubectl logs -l app.kubernetes.io/name=archestra-platform --tail=200

          echo "=== PostgreSQL Logs ==="
          kubectl logs -l app.kubernetes.io/name=postgresql --tail=200

          echo "=== WireMock Logs ==="
          kubectl logs -l app=wiremock --tail=200

          echo "=== Describe Archestra Platform Pod ==="
          kubectl describe pod -l app.kubernetes.io/name=archestra-platform

          echo "=== Describe PostgreSQL Pod ==="
          kubectl describe pod -l app.kubernetes.io/name=postgresql

  helm-chart-linting-and-tests:
    name: Helm Chart Linting and Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./platform/helm/archestra
    steps:
      - name: Checkout project
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Linting
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        run: helm lint .

      - name: Tests
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git
          helm unittest .

      - name: helm package
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        # NOTE: can't use ${{ github.sha }} for version here because it's not a valid version number
        # and helm package explicitly checks this
        run: |
          helm package . --version v0.0.1 --app-version v0.0.1
