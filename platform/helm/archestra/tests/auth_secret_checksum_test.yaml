suite: auth Secret checksum rolls web and worker pods
templates:
  - archestra-platform.yaml
  - archestra-worker.yaml
  - migration-job.yaml
release:
  name: archestra-platform
  namespace: archestra
tests:
  # sha256 of an empty string: no values-sourced keys, only generated ones.
  - it: hashes only values-sourced keys, so the generated keys leave the web checksum unchanged
    template: archestra-platform.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/auth-secret"]
          value: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

  - it: keeps the checksum on an upgrade that reads the generated keys back from the cluster
    template: archestra-platform.yaml
    documentIndex: 1
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: archestra-platform-auth
            namespace: archestra
          data:
            auth-secret: ZXhpc3RpbmctYXV0aA==
            session-secret: ZXhpc3Rpbmctc2Vzc2lvbg==
            secrets-encryption-secret: ZXhpc3RpbmctZW5j
            offer-signing-secret: ZXhpc3Rpbmctb2ZmZXI=
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/auth-secret"]
          value: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

  - it: gives the same values the same checksum on web and worker pods
    set:
      archestra.env.ARCHESTRA_METRICS_SECRET: a
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/auth-secret"]
          value: 4360e4b0cbe40a7ffe5c53d710dae086999ff2f50432bbb39fa4bad96addf460
        template: archestra-platform.yaml
        documentIndex: 1
      - equal:
          path: spec.template.metadata.annotations["checksum/auth-secret"]
          value: 4360e4b0cbe40a7ffe5c53d710dae086999ff2f50432bbb39fa4bad96addf460
        template: archestra-worker.yaml

  - it: changes the checksum when a sensitive archestra.env value changes
    template: archestra-platform.yaml
    documentIndex: 1
    set:
      archestra.env.ARCHESTRA_METRICS_SECRET: b
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/auth-secret"]
          value: 4360e4b0cbe40a7ffe5c53d710dae086999ff2f50432bbb39fa4bad96addf460

  - it: changes the checksum when a chat provider API key changes
    template: archestra-worker.yaml
    set:
      archestra.env.ARCHESTRA_CHAT_OPENAI_API_KEY: sk-new
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/auth-secret"]
          value: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

  - it: keeps operator pod annotations next to the checksum
    template: archestra-platform.yaml
    documentIndex: 1
    set:
      archestra.podAnnotations:
        example.com/team: platform
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/team"]
          value: platform
      - exists:
          path: spec.template.metadata.annotations["checksum/auth-secret"]

  - it: adds no checksum when an external Secret holds the auth keys
    set:
      archestra.authSecret.existingSecretName: my-auth
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/auth-secret"]
        template: archestra-platform.yaml
        documentIndex: 1
      - notExists:
          path: spec.template.metadata.annotations["checksum/auth-secret"]
        template: archestra-worker.yaml

  - it: leaves the migration Job without a checksum
    template: migration-job.yaml
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/auth-secret"]
