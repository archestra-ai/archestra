{{- if not .Values.archestra.authSecret.existingSecretName }}
{{- $secretName := include "archestra-platform.authSecretName" . }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- if $secret }}
  auth-secret: {{ index $secret.data "auth-secret" }}
  {{- else }}
  auth-secret: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
  {{/*
  Session-signing and secret-encryption secrets, split out from the combined
  auth-secret so they rotate independently. Each is preserved once generated
  (resource-policy: keep + lookup). On an upgrade of an existing install these
  keys don't exist yet, so they are generated fresh here — which rotates the
  session secret (users re-login) and triggers the re-encryption migration.
  */}}
  {{- if and $secret (index $secret.data "session-secret") }}
  session-secret: {{ index $secret.data "session-secret" }}
  {{- else }}
  session-secret: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
  {{- if and $secret (index $secret.data "secrets-encryption-secret") }}
  secrets-encryption-secret: {{ index $secret.data "secrets-encryption-secret" }}
  {{- else }}
  secrets-encryption-secret: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
  {{/*
  OpenAPPA offer-signing key, generated and preserved like the other split
  keys. Offer claims stay verifiable across upgrades and replicas with no
  extra configuration; backend config.ts would otherwise derive the key from
  the auth secret, which ties offer rotation to session rotation.
  */}}
  {{- if and $secret (index $secret.data "offer-signing-secret") }}
  offer-signing-secret: {{ index $secret.data "offer-signing-secret" }}
  {{- else }}
  offer-signing-secret: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
  {{- /* Values-sourced keys; their checksum rolls the web and worker pods. */}}
  {{- include "archestra-platform.authSecretValuesData" . | trim | nindent 2 }}
{{- end }}
