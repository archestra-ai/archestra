name: Validate MCP Catalog

on:
  pull_request:
    paths:
      - "mcp-catalog/**"

permissions: {}

concurrency:
  group: "validate-mcp-catalog-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate MCP Catalog Data
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout this repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      # The validation script and manifest schema live in the website repo,
      # which consumes this data at build time.
      - name: Checkout website repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: archestra-ai/website
          path: website
          persist-credentials: false
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.4.1"
          cache: "pnpm"
          cache-dependency-path: website/app/pnpm-lock.yaml

      - name: Install website dependencies
        working-directory: website/app
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Copy catalog data into website checkout
        run: |
          mkdir -p website/app/app/mcp-catalog/data
          cp mcp-catalog/mcp-servers.json website/app/app/mcp-catalog/data/mcp-servers.json
          rm -rf website/app/app/mcp-catalog/data/mcp-evaluations
          cp -R mcp-catalog/mcp-evaluations website/app/app/mcp-catalog/data/mcp-evaluations

      - name: Validate catalog data
        working-directory: website/app
        run: pnpm catalog:validate
