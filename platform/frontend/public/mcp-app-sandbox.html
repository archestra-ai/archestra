<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP App Sandbox</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      line-height: 1.5;
      color: #333;
      background: transparent;
    }

    #root {
      width: 100%;
      min-height: 100vh;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      color: #666;
    }

    .error {
      padding: 16px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      color: #dc2626;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">Initializing MCP App...</div>
  </div>

  <script>
    /**
     * MCP App Sandbox
     * 
     * 提供与宿主的安全通信通道
     */

    // MCP SDK 模拟
    const mcpSDK = {
      resourceUri: null,
      toolInput: null,
      toolResult: null,
      resource: null,

      /**
       * 初始化 MCP App
       */
      init(data) {
        this.resourceUri = data.resourceUri;
        this.toolInput = data.toolInput;
        this.toolResult = data.toolResult;
        this.resource = data.resource;

        // 渲染内容
        this.render();
      },

      /**
       * 发送消息到宿主
       */
      postMessage(type, payload) {
        window.parent.postMessage({
          type: `mcp-app-${type}`,
          payload,
        }, '*');
      },

      /**
       * 打开链接
       */
      openLink(url) {
        this.postMessage('open-link', { url });
      },

      /**
       * 发送消息
       */
      sendMessage(message) {
        this.postMessage('message', message);
      },

      /**
       * 渲染资源内容
       */
      render() {
        const root = document.getElementById('root');

        if (!this.resource) {
          root.innerHTML = '<div class="error">No resource available</div>';
          return;
        }

        const { mimeType, text, blob } = this.resource;

        // 根据 MIME 类型渲染
        if (mimeType === 'text/html' || mimeType === 'text/html;profile=mcp-app') {
          // HTML 内容
          if (text) {
            root.innerHTML = text;
            this.setupScripts();
          } else if (blob) {
            // 解码 base64
            const decoded = atob(blob);
            root.innerHTML = decoded;
            this.setupScripts();
          }
        } else if (mimeType === 'text/uri-list') {
          // 外部 URL
          const url = text || '';
          root.innerHTML = `
            <iframe 
              src="${url}" 
              style="width:100%;min-height:400px;border:none;"
              sandbox="allow-scripts allow-same-origin"
            ></iframe>
          `;
        } else {
          // 其他类型，显示为代码
          root.innerHTML = `
            <pre style="padding:16px;background:#f5f5f5;border-radius:8px;overflow:auto;">
${text || 'No content'}
            </pre>
          `;
        }
      },

      /**
       * 设置脚本执行环境
       */
      setupScripts() {
        // 为所有链接添加点击处理
        document.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', (e) => {
            const href = link.getAttribute('href');
            if (href && (href.startsWith('http://') || href.startsWith('https://'))) {
              e.preventDefault();
              this.openLink(href);
            }
          });
        });

        // 暴露 MCP API 给 App
        window.MCP = {
          resourceUri: this.resourceUri,
          toolInput: this.toolInput,
          toolResult: this.toolResult,
          sendMessage: (msg) => this.sendMessage(msg),
          openLink: (url) => this.openLink(url),
        };

        // 触发 App 加载完成事件
        document.dispatchEvent(new CustomEvent('mcp-app-loaded', {
          detail: {
            resourceUri: this.resourceUri,
            toolInput: this.toolInput,
            toolResult: this.toolResult,
          }
        }));
      }
    };

    // 监听来自宿主的消息
    window.addEventListener('message', (event) => {
      // 验证消息来源
      if (event.source !== window.parent) {
        return;
      }

      const { type, payload } = event.data;

      switch (type) {
        case 'mcp-app-init':
          mcpSDK.init(payload);
          break;
        default:
          break;
      }
    });

    // 通知宿主沙盒已准备好
    window.parent.postMessage({ type: 'mcp-app-ready' }, '*');
  </script>
</body>
</html>
