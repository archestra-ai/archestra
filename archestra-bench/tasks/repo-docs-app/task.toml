[[stages]]
text = """We've got a DeepWiki connection wired into this workspace. Could you build a small app called `repo-docs-app-{{cell}}` that lets a teammate type a plain-English question about a GitHub repo's documentation and shows the answer back to them? Have it use DeepWiki for the lookups. Once it's working and validates cleanly, call submit_result with result = {"app_id": "<the app's id>", "app_name": "<the app's name>"}."""

[result_schema]
type = "object"
required = ["app_id", "app_name"]
additionalProperties = false

  [result_schema.properties.app_id]
  type = "string"
  minLength = 1

  [result_schema.properties.app_name]
  type = "string"
  minLength = 1

[state]
rest = ["/api/apps?search=repo-docs-app-{{cell}}&limit=100"]
