<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark">
  <!-- CSP is set via HTTP headers by server.ts for cross-origin modes (localhost swap, domain).
       For opaque-origin fallback (srcdoc), CSP is injected as a meta tag into the HTML. -->
  <title>MCP-UI Proxy</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100vh;
      width: 100vw;
      /* Transparent background allows parent page to show through */
      background-color: transparent;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    * {
      box-sizing: border-box;
    }
    iframe {
      background-color: transparent;
      border: 0px none transparent;
      padding: 0px;
      overflow: hidden;
      flex-grow: 1;
      /* Inherit color scheme from parent for consistent transparency */
      color-scheme: inherit;
    }
  </style>
</head>
<body>
<script>

// The ext-apps guest SDK, served same-deployment next to this proxy. The
// Archestra Apps SDK imports it (via window.__ARCHESTRA_APP_SDK_URL__, injected
// below) to connect to the host. location.origin is this proxy's real origin
// (the proxy is never the opaque srcdoc guest), and /_sandbox/ is proxied to the
// backend in every mode, so this absolute URL resolves + loads everywhere.
const APP_SDK_URL = location.origin + "/_sandbox/ext-apps-app.js";

// The Archestra Apps SDK (window.archestra), loaded by the <script src> the
// backend injects into owned apps at serve time (app-sdk-injection.ts). Its
// root-relative src resolves against this proxy's base URL — which srcdoc and
// document.write children inherit — so the absolute form below is what CSP
// must allowlist.
const ARCHESTRA_APP_SDK_URL = location.origin + "/_sandbox/archestra-app-sdk.js";

// The platform baseline stylesheet, loaded by the <link> the backend injects
// into owned apps at serve time (app-sdk-injection.ts). Root-relative href
// resolves against this proxy origin, so style-src must allowlist this URL.
const ARCHESTRA_APP_BASE_CSS_URL = location.origin + "/_sandbox/archestra-app-base.css";

// Warm the guest-SDK assets NOW, while the host handshake (proxy-ready →
// bridge connect → resource-ready) is still in flight: the inner document is
// about to load these same-origin files, its parser blocks on the SDK script,
// and on a cold sandbox origin those fetches are exactly what a viewer waits
// on before an app can appear. All three are served cacheable,
// so the preloads land in the HTTP cache the inner document reads from. The
// ext-apps preload carries `crossorigin` to match the SDK's module import
// (cors request mode); the classic script and stylesheet must not, or the
// preload wouldn't match their no-cors fetches. Best-effort — a failed
// preload costs nothing, the inner document just fetches as before.
try {
  [
    [ARCHESTRA_APP_SDK_URL, "script", false],
    [APP_SDK_URL, "script", true],
    [ARCHESTRA_APP_BASE_CSS_URL, "style", false],
  ].forEach(function (spec) {
    var warm = document.createElement("link");
    warm.rel = "preload";
    warm.href = spec[0];
    warm.as = spec[1];
    if (spec[2]) warm.crossOrigin = "anonymous";
    document.head.appendChild(warm);
  });
} catch (e) {
  // never let warming break the proxy
}

function buildAllowAttribute(permissions) {
  if (!permissions) return "";

  const allowList = [];
  if (permissions.camera) allowList.push("camera");
  if (permissions.microphone) allowList.push("microphone");
  if (permissions.geolocation) allowList.push("geolocation");
  if (permissions.clipboardWrite) allowList.push("clipboard-write");

  return allowList.join("; ");
}

/**
 * Sanitize a CSP domain value to prevent injection.
 * Only allows valid hostnames, wildcard subdomains, scheme-prefixed domains, and optional ports.
 */
function sanitizeDomain(d) {
  if (typeof d !== "string") return "";
  return d.replace(/['"<>;]/g, "");
}

/**
 * Build CSP string from _meta.ui.csp metadata (Inspector pattern).
 * No 'self' — doesn't work in srcdoc iframes (refers to about:srcdoc).
 * Uses 'unsafe-inline' for scripts/styles since all widget code is inline.
 */
function buildCSP(csp) {
  if (!csp) {
    return [
      "default-src 'none'",
      "script-src 'unsafe-inline' " + APP_SDK_URL + " " + ARCHESTRA_APP_SDK_URL,
      "style-src 'unsafe-inline' " + ARCHESTRA_APP_BASE_CSS_URL,
      "img-src data: blob:",
      "font-src data: blob:",
      "media-src data: blob:",
      "connect-src 'none'",
      "form-action 'none'",
      "frame-src 'none'",
      "object-src 'none'",
      "base-uri 'none'",
    ].join("; ");
  }

  var connectDomains = (csp.connectDomains || []).map(sanitizeDomain).filter(Boolean);
  var resourceDomains = (csp.resourceDomains || []).map(sanitizeDomain).filter(Boolean);
  var frameDomains = (csp.frameDomains || []).map(sanitizeDomain).filter(Boolean);
  var baseUriDomains = (csp.baseUriDomains || []).map(sanitizeDomain).filter(Boolean);

  var connectSrc = connectDomains.length > 0 ? connectDomains.join(" ") : "'none'";
  var resourceSrc = resourceDomains.length > 0
    ? ["data:", "blob:", ...resourceDomains].join(" ")
    : "data: blob:";
  var frameSrc = frameDomains.length > 0 ? frameDomains.join(" ") : "'none'";
  var baseUri = baseUriDomains.length > 0 ? baseUriDomains.join(" ") : "'none'";

  return [
    "default-src 'none'",
    "script-src 'unsafe-inline' " + APP_SDK_URL + " " + ARCHESTRA_APP_SDK_URL + " " + resourceSrc,
    "style-src 'unsafe-inline' " + ARCHESTRA_APP_BASE_CSS_URL + " " + resourceSrc,
    "img-src " + resourceSrc,
    "font-src " + resourceSrc,
    "media-src " + resourceSrc,
    "connect-src " + connectSrc,
    "form-action 'none'",
    "frame-src " + frameSrc,
    "object-src 'none'",
    "base-uri " + baseUri,
  ].join("; ");
}

/**
 * Build the guest's inline bootstrap: a CSP-violation listener plus a
 * document-ready announcement.
 *
 * Forwards securitypolicyviolation events to the host via postMessage so
 * violations can be surfaced for debugging, and posts
 * `mcp-apps:sandbox-content-loaded` at DOMContentLoaded — the one signal a
 * host can trust to mean the GUEST document is really on screen. Everything
 * else the host observes (proxy-ready, bridge connect, resource-ready)
 * happens while the inner frame is still empty, and the inner frame's own
 * load event cannot be told apart from the about:blank it starts on. It
 * comes from the guest document itself, so there is no such ambiguity, and
 * it fires even when the app's SDK script fails to load — the recorded
 * markup is still on screen, which is what the app-session player waits for.
 *
 * Violations originating from a platform-served guest SDK file are not
 * forwarded: the SDK probes code-generation support at load with a try/catch
 * `new Function("")`, and the caught probe still fires a
 * securitypolicyviolation (script-src blocks eval). That is platform noise an
 * app author cannot act on — forwarding it would flag every render as
 * "1 runtime error". Matched by the `/_sandbox/` asset path (where both SDK
 * files are served from) rather than `window.__ARCHESTRA_APP_SDK_URL__`, which
 * is only injected for external apps — owned apps carry their SDK URL in the
 * backend envelope, so keying off the global leaked the probe for every owned
 * app.
 */
function buildViolationListenerScript() {
  return '<script>\
document.addEventListener("securitypolicyviolation", function(e) {\
  var src = e.sourceFile || "";\
  if (src.indexOf("/_sandbox/ext-apps-app.js") !== -1 || src.indexOf("/_sandbox/archestra-app-sdk.js") !== -1) return;\
  var violation = {\
    type: "mcp-apps:csp-violation",\
    directive: e.violatedDirective,\
    blockedUri: e.blockedURI,\
    sourceFile: e.sourceFile || null,\
    lineNumber: e.lineNumber || null,\
    effectiveDirective: e.effectiveDirective,\
    timestamp: Date.now()\
  };\
  window.parent.postMessage(violation, "*");\
});\
document.addEventListener("DOMContentLoaded", function() {\
  window.parent.postMessage({ type: "mcp-apps:sandbox-content-loaded" }, "*");\
});\
<\/script>';
}

function safeJsonForInlineScript(value) {
  return JSON.stringify(value === undefined ? null : value)
    .replace(/</g, "\\u003c")
    .replace(/>/g, "\\u003e")
    .replace(/&/g, "\\u0026")
    .replace(/\u2028/g, "\\u2028")
    .replace(/\u2029/g, "\\u2029");
}

/**
 * Guest bootstrap that captures UI filter/parameter state (form controls,
 * tabs/toggles/chips, localStorage/sessionStorage including opaque-origin
 * fallback, and URL/history state) and restores it when the host reloads the
 * app iframe.
 */
function guestStateBootstrap(restored) {
  var STATE_SYNC_TYPE = "mcp-apps:state-sync";
  var RESTORE_WINDOW_MS = 8000;
  var TOGGLE_RPC_GATE_MAX_MS = 2500;
  // Matches SANDBOX_REVEAL_FALLBACK_MS in platform/frontend/src/components/mcp-app/mcp-app-view.tsx
  var GUEST_READY_FALLBACK_MS = 1200;
  var MAX_GUEST_READY_RESTORE_RETRIES = 40;
  var MAX_GUEST_READY_HYDRATION_RETRIES = 20;
  var MAX_RESTORE_ATTEMPTS_PER_CONTROL = 4;

  var DATA_KEY_ATTRS = [
    "data-list",
    "data-tab",
    "data-view",
    "data-filter",
    "data-range",
    "data-scope",
    "data-mode",
    "data-period",
    "data-status",
    "data-category",
    "data-value",
    "data-id",
    "data-key",
  ];

  var TOGGLE_SELECTOR = [
    "[aria-pressed]",
    "[aria-selected]",
    '[role="tab"]',
    '[role="switch"]',
    '[role="radio"]',
    "[data-tab]",
    "[data-view]",
    "[data-list]",
    "[data-filter]",
    "[data-range]",
    "[data-scope]",
    "[data-mode]",
    "[data-period]",
    "[data-status]",
    "[data-category]",
    "button.tab",
    "button.view-btn",
    "button.nav-item",
    "button.seg-btn",
    "button.filter-btn",
    "button.chip",
    "button.client-chip",
  ].join(", ");

  var hasRestoredControls = !!(
    restored &&
    restored.controls &&
    typeof restored.controls === "object" &&
    Object.keys(restored.controls).length > 0
  );

  var currentControls = {};
  var dirtyControlKeys = {};
  var pendingFormKeys = {};
  var pendingToggleKeys = {};
  var restoreAttempts = {};
  var appliedMultiValues = {};

  if (hasRestoredControls) {
    var initKeys = Object.keys(restored.controls);
    for (var i = 0; i < initKeys.length; i++) {
      var rk = initKeys[i];
      var entry = restored.controls[rk];
      currentControls[rk] = entry;
      dirtyControlKeys[rk] = true;
      if (entry && typeof entry.selector === "string") {
        dirtyControlKeys[entry.selector] = true;
      }
      if (entry && entry.kind === "form") {
        pendingFormKeys[rk] = true;
      } else if (entry && entry.kind === "toggle") {
        pendingToggleKeys[rk] = true;
      }
    }
  }

  var userInteracted = false;
  var restorationActive = hasRestoredControls;
  var isRestoringNow = false;
  var restoreReady = false;
  var activeRpcCount = 0;
  var toggleGateExpired = false;
  var guestReadySent = false;
  var guestReadyRetryCount = 0;
  var restoredContentHeight =
    restored &&
    typeof restored.contentHeight === "number" &&
    restored.contentHeight > 0
      ? restored.contentHeight
      : 0;
  var currentContentHeight = restoredContentHeight;
  var lastSentJson = "";
  var syncTimer = null;
  var restoreTimer = null;
  var guestReadyTimer = null;
  var guestReadyRafId = null;

  var localStore = {};
  if (
    restored &&
    restored.localStorage &&
    typeof restored.localStorage === "object"
  ) {
    var lk = Object.keys(restored.localStorage);
    for (var li = 0; li < lk.length; li++) {
      if (typeof restored.localStorage[lk[li]] === "string") {
        localStore[lk[li]] = restored.localStorage[lk[li]];
      }
    }
  }

  var sessionStore = {};
  if (
    restored &&
    restored.sessionStorage &&
    typeof restored.sessionStorage === "object"
  ) {
    var sk = Object.keys(restored.sessionStorage);
    for (var si = 0; si < sk.length; si++) {
      if (typeof restored.sessionStorage[sk[si]] === "string") {
        sessionStore[sk[si]] = restored.sessionStorage[sk[si]];
      }
    }
  }

  function createMemoryStorage(backing, onMutate) {
    var api = {
      getItem: function (key) {
        var k = String(key);
        return Object.prototype.hasOwnProperty.call(backing, k)
          ? backing[k]
          : null;
      },
      setItem: function (key, value) {
        backing[String(key)] = String(value);
        onMutate();
      },
      removeItem: function (key) {
        delete backing[String(key)];
        onMutate();
      },
      clear: function () {
        var keys = Object.keys(backing);
        for (var idx = 0; idx < keys.length; idx++) delete backing[keys[idx]];
        onMutate();
      },
      key: function (index) {
        var keys = Object.keys(backing);
        return index >= 0 && index < keys.length ? keys[index] : null;
      },
    };
    Object.defineProperty(api, "length", {
      enumerable: true,
      configurable: true,
      get: function () {
        return Object.keys(backing).length;
      },
    });
    return api;
  }

  function setupStorage(propName, backing, onMutate) {
    var nativeStorage = null;
    try {
      nativeStorage = window[propName];
      var probeKey = "__mcp_app_probe__";
      nativeStorage.setItem(probeKey, "1");
      nativeStorage.removeItem(probeKey);
    } catch (e) {
      nativeStorage = null;
    }

    if (nativeStorage) {
      try {
        var restoredKeys = Object.keys(backing);
        for (var idx = 0; idx < restoredKeys.length; idx++) {
          var k = restoredKeys[idx];
          nativeStorage.setItem(k, backing[k]);
        }
        for (var j = 0; j < nativeStorage.length; j++) {
          var nk = nativeStorage.key(j);
          if (nk !== null && nk !== "__mcp_app_probe__") {
            var nv = nativeStorage.getItem(nk);
            if (typeof nv === "string") backing[nk] = nv;
          }
        }
      } catch (e) {}

      try {
        var origSet = nativeStorage.setItem.bind(nativeStorage);
        var origRemove = nativeStorage.removeItem.bind(nativeStorage);
        var origClear = nativeStorage.clear.bind(nativeStorage);
        nativeStorage.setItem = function (key, value) {
          backing[String(key)] = String(value);
          try {
            origSet(key, value);
          } catch (e) {}
          onMutate();
        };
        nativeStorage.removeItem = function (key) {
          delete backing[String(key)];
          try {
            origRemove(key);
          } catch (e) {}
          onMutate();
        };
        nativeStorage.clear = function () {
          var keys = Object.keys(backing);
          for (var cIdx = 0; cIdx < keys.length; cIdx++) {
            delete backing[keys[cIdx]];
          }
          try {
            origClear();
          } catch (e) {}
          onMutate();
        };
      } catch (e) {}
    } else {
      var shim = createMemoryStorage(backing, onMutate);
      try {
        Object.defineProperty(window, propName, {
          configurable: true,
          enumerable: true,
          get: function () {
            return shim;
          },
        });
      } catch (e) {}
    }
  }

  function readStorageSnapshot(propName, backing) {
    try {
      var s = window[propName];
      if (s && typeof s.length === "number") {
        var out = {};
        for (var idx = 0; idx < s.length; idx++) {
          var k = s.key(idx);
          if (k !== null && k !== "__mcp_app_probe__") {
            var v = s.getItem(k);
            if (typeof v === "string") out[k] = v;
          }
        }
        return out;
      }
    } catch (e) {}
    return Object.assign({}, backing);
  }

  setupStorage("localStorage", localStore, function () {
    postSync();
  });
  setupStorage("sessionStorage", sessionStore, function () {
    postSync();
  });

  var currentUrlHash =
    restored && typeof restored.urlHash === "string" ? restored.urlHash : "";
  var currentUrlSearch =
    restored && typeof restored.urlSearch === "string"
      ? restored.urlSearch
      : "";
  var currentHistoryState =
    restored && restored.historyState !== undefined
      ? restored.historyState
      : null;

  if (restored) {
    try {
      if (currentUrlSearch || currentUrlHash || currentHistoryState !== null) {
        var targetUrl = (currentUrlSearch || "") + (currentUrlHash || "");
        if (targetUrl || currentHistoryState !== null) {
          window.history.replaceState(
            currentHistoryState,
            "",
            targetUrl || undefined,
          );
        }
      }
    } catch (e) {
      if (currentUrlHash) {
        try {
          window.location.hash = currentUrlHash;
        } catch (err) {}
      }
    }
  }

  function captureUrlState() {
    try {
      currentUrlHash = window.location.hash || "";
      currentUrlSearch = window.location.search || "";
      if (window.history && window.history.state !== undefined) {
        currentHistoryState = window.history.state;
      }
    } catch (e) {}
  }

  try {
    var origPushState = window.history.pushState.bind(window.history);
    var origReplaceState = window.history.replaceState.bind(window.history);
    window.history.pushState = function (state, unused, url) {
      currentHistoryState = state;
      var res = origPushState(state, unused, url);
      captureUrlState();
      postSync();
      return res;
    };
    window.history.replaceState = function (state, unused, url) {
      currentHistoryState = state;
      var res = origReplaceState(state, unused, url);
      captureUrlState();
      postSync();
      return res;
    };
  } catch (e) {}

  window.addEventListener("hashchange", function () {
    captureUrlState();
    postSync();
  });
  window.addEventListener("popstate", function () {
    captureUrlState();
    postSync();
  });

  function escapeCss(val) {
    var str = String(val);
    if (typeof CSS !== "undefined" && typeof CSS.escape === "function") {
      return CSS.escape(str);
    }
    return str.replace(/([!"#$%&'()*+,./:;<=>?@[\\\]^`{|}~ ])/g, "\\$1");
  }

  function isExcludedElement(el) {
    if (!el || el.nodeType !== 1 || typeof el.closest !== "function") {
      return true;
    }
    if (
      el.closest(
        'dialog, [role="dialog"], [aria-modal="true"], .modal, .modal-backdrop, .modal-overlay, .picker, .menu-pop, [id*="modal" i], [class*="modal-" i], [class*="-modal" i]',
      )
    ) {
      return true;
    }
    return false;
  }

  function hasAnyDataAttr(el) {
    if (!el || !el.attributes) return false;
    for (var idx = 0; idx < el.attributes.length; idx++) {
      if (el.attributes[idx].name.indexOf("data-") === 0) return true;
    }
    return false;
  }

  function getStableButtonLabel(el) {
    if (!el) return "";
    var walker = document.createTreeWalker(el, 4 /* NodeFilter.SHOW_TEXT */, null);
    var node = walker.nextNode();
    while (node) {
      var txt = (node.nodeValue || "").trim();
      if (txt) return txt;
      node = walker.nextNode();
    }
    return (
      el.getAttribute("aria-label") ||
      el.getAttribute("title") ||
      ""
    ).trim();
  }

  function getCssSelector(el) {
    if (!el || el.nodeType !== 1) return null;
    var tag = el.tagName.toLowerCase();
    if (el.id) {
      return "#" + escapeCss(el.id);
    }
    for (var idx = 0; idx < DATA_KEY_ATTRS.length; idx++) {
      var attr = DATA_KEY_ATTRS[idx];
      if (el.hasAttribute(attr)) {
        var val = el.getAttribute(attr) || "";
        var ancestorWithId = el.parentElement
          ? el.parentElement.closest("[id]")
          : null;
        var prefix =
          ancestorWithId && ancestorWithId.id
            ? "#" + escapeCss(ancestorWithId.id) + " "
            : "";
        return prefix + tag + "[" + attr + '="' + escapeCss(val) + '"]';
      }
    }
    if (
      el.name &&
      (tag === "input" || tag === "select" || tag === "textarea")
    ) {
      var nameSel = tag + '[name="' + escapeCss(el.name) + '"]';
      if (el.type === "radio" || el.type === "checkbox") {
        nameSel += '[value="' + escapeCss(el.value || "") + '"]';
      }
      return nameSel;
    }
    var parts = [];
    var cur = el;
    while (
      cur &&
      cur.nodeType === 1 &&
      cur !== document.body &&
      cur !== document.documentElement
    ) {
      if (cur.id) {
        parts.unshift("#" + escapeCss(cur.id));
        break;
      }
      var curTag = cur.tagName.toLowerCase();
      var parent = cur.parentElement;
      if (parent) {
        var sameTagSiblings = [];
        for (var c = 0; c < parent.children.length; c++) {
          if (parent.children[c].tagName === cur.tagName) {
            sameTagSiblings.push(parent.children[c]);
          }
        }
        if (sameTagSiblings.length > 1) {
          var sIdx = sameTagSiblings.indexOf(cur) + 1;
          curTag += ":nth-of-type(" + sIdx + ")";
        }
      }
      parts.unshift(curTag);
      cur = parent;
    }
    return parts.length > 0 ? parts.join(" > ") : null;
  }

  function isIndexBasedSelector(sel) {
    return typeof sel === "string" && /:nth-of-type\(\d+\)$/.test(sel);
  }

  function readToggleState(el) {
    if (!el || el.nodeType !== 1) return null;
    var parent = el.parentElement;
    var role = el.getAttribute("role");
    if (el.hasAttribute("aria-pressed")) {
      return {
        mode: "aria-pressed",
        active: el.getAttribute("aria-pressed") === "true",
        isGroup: role === "tab" || role === "radio",
      };
    }
    if (el.hasAttribute("aria-selected") || role === "tab") {
      var selectedActive =
        el.getAttribute("aria-selected") === "true" ||
        el.classList.contains("active") ||
        el.classList.contains("selected") ||
        el.classList.contains("is-active");
      return {
        mode: "aria-selected",
        active: selectedActive,
        isGroup: true,
      };
    }
    if (
      el.hasAttribute("aria-checked") ||
      role === "switch" ||
      role === "radio"
    ) {
      return {
        mode: "aria-checked",
        active: el.getAttribute("aria-checked") === "true",
        isGroup: role === "radio",
      };
    }
    if (el.hasAttribute("data-state")) {
      var ds = el.getAttribute("data-state");
      if (
        ds === "active" ||
        ds === "inactive" ||
        ds === "on" ||
        ds === "off" ||
        ds === "checked" ||
        ds === "unchecked"
      ) {
        return {
          mode: "data-state",
          active: ds === "active" || ds === "on" || ds === "checked",
          isGroup: role === "tab" || role === "radio",
        };
      }
    }
    var hasActiveClass =
      el.classList.contains("active") ||
      el.classList.contains("selected") ||
      el.classList.contains("is-active") ||
      el.classList.contains("on");
    var siblingHasActiveClass = parent
      ? Array.from(parent.children).some(function (child) {
          return (
            child.classList &&
            (child.classList.contains("active") ||
              child.classList.contains("selected") ||
              child.classList.contains("is-active") ||
              child.classList.contains("on"))
          );
        })
      : false;
    if (hasActiveClass || siblingHasActiveClass) {
      return {
        mode: "class",
        active: hasActiveClass,
        isGroup: true,
      };
    }
    return null;
  }

  function findControlElement(key, saved) {
    var sel = (saved && saved.selector) || key;
    var el = null;
    try {
      el = document.querySelector(sel);
    } catch (e) {
      el = null;
    }
    if (saved && saved.kind === "toggle" && saved.label) {
      if (el && getStableButtonLabel(el) === saved.label) {
        return el;
      }
      var containerSel =
        sel.indexOf(" > ") !== -1 ? sel.slice(0, sel.lastIndexOf(" > ")) : null;
      var container = null;
      if (containerSel) {
        try {
          container = document.querySelector(containerSel);
        } catch (e) {
          container = null;
        }
      }
      if (!container && el && el.parentElement) {
        container = el.parentElement;

      }
    }
  });

  var observer = null;
  function startObserver() {
    if (!document.documentElement || observer) return;
    observer = new MutationObserver(function () {
      if (isRestoringNow) return;
      if (
        hasRestoredControls &&
        !userInteracted &&
        restorationActive &&
        restoreReady
      ) {
        runRestorePass();
        scheduleRestore();
      }
      if (
        !guestReadySent &&
        guestReadyRafId === null &&
        restoreReady &&
        (activeRpcCount === 0 || toggleGateExpired) &&
        !hasPendingRestorations() &&
        !hasPendingHydration()
      ) {
        scheduleGuestReady(24);
      }
      if (userInteracted || !hasRestoredControls || !restorationActive) {
        scheduleMutationCapture();
      }
    });
    observer.observe(document.documentElement, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: [
        "aria-pressed",
        "aria-selected",
        "aria-checked",
        "data-state",
        "class",
        "hidden",
        "value",
        "selected",
        "checked",
      ],
    });
  }

  function onDomReady() {
    startObserver();
    var isSdkApp = !!(
      window.__ARCHESTRA_APP_CONTEXT__ ||
      window.__ARCHESTRA_APP_SDK_URL__ ||
      window.MCP_EXTAPPS ||
      window.archestra
    );
    if (!isSdkApp) {
      restoreReady = true;
      if (hasRestoredControls) {
        runRestoreMicrotask();
      }
      scheduleGuestReady(16);
    } else {
      setTimeout(function () {
        if (activeRpcCount === 0) {
          restoreReady = true;
          if (hasRestoredControls) {
            runRestoreMicrotask();
          }
          scheduleGuestReady(16);
        }
      }, 250);
      setTimeout(function () {
        if (activeRpcCount === 0 && !hasPendingRestorations()) {
          restoreReady = true;
          if (hasRestoredControls) {
            runRestoreMicrotask();
          }
          notifyGuestReady();
        }
      }, GUEST_READY_FALLBACK_MS);
      setTimeout(function () {
        toggleGateExpired = true;
        restoreReady = true;
        if (hasRestoredControls && !userInteracted && restorationActive) {
          runRestoreMicrotask();
        }
        notifyGuestReady();
      }, TOGGLE_RPC_GATE_MAX_MS);
    }
    if (hasRestoredControls) {
      setTimeout(function () {
        toggleGateExpired = true;
        restoreReady = true;
        if (!userInteracted && restorationActive) {
          runRestoreMicrotask();
        }
        scheduleGuestReady(16);
      }, TOGGLE_RPC_GATE_MAX_MS);
      setTimeout(function () {
        restorationActive = false;
        scheduleMutationCapture();
      }, RESTORE_WINDOW_MS);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", onDomReady);
  } else {
    onDomReady();
  }
}

function buildStatePreservationScript(restoredState) {
  var serializedState = safeJsonForInlineScript(restoredState || null);
  return (
    "<script>(" +
    guestStateBootstrap.toString() +
    ")(" +
    serializedState +
    ");<\/script>"
  );
}

/**
 * Inject CSP meta tag, violation listener, and state preservation bootstrap into HTML (Inspector pattern).
 * Used for srcdoc loading where HTTP headers aren't available.
 */
function injectCSP(html, cspValue, ownedApp, restoredState) {
  var violationListener = buildViolationListenerScript();
  var statePreservation = buildStatePreservationScript(restoredState);
  var injection;
  // Owned apps carry their CSP and the SDK bundle URL in the backend-injected
  // envelope (app-sdk-injection.ts), so they work identically here and in a
  // foreign host. The proxy must NOT add a second CSP for them — a differing
  // policy would intersect and break the render — so it only adds the violation
  // listener and state preservation bootstrap. This MUST key off the trusted
  // host-set `ownedApp` flag, never the HTML: the HTML for external MCP-UI apps
  // is attacker-controlled, so a content marker could be spoofed to suppress the
  // platform CSP. External apps get the full proxy CSP + SDK-URL injection.
  if (ownedApp === true) {
    injection = violationListener + statePreservation;
  } else {
    var cspMeta = '<meta http-equiv="Content-Security-Policy" content="' + cspValue + '">';
    // Expose the served SDK URL so the injected Apps SDK can import it (apps
    // themselves never touch it). APP_SDK_URL is
    // location.origin-derived (no user input), but JSON-encode defensively so it
    // can never break out of the inline script.
    var sdkGlobal = '<script>window.__ARCHESTRA_APP_SDK_URL__=' + JSON.stringify(APP_SDK_URL) + ';<\/script>';
    injection = cspMeta + sdkGlobal + violationListener + statePreservation;
  }

  // Anchors tolerate attributes (<head lang="en">) and mirror the backend's
  // serve-time SDK injection (app-sdk-injection.ts) exactly: both chains
  // resolve to the SAME first anchor, so this injection always lands before
  // the SDK bootstrap and the SDK URL global is defined when the SDK runs.
  // (\s[^>]*)? — attributes allowed, never a longer tag name (<header>).
  var head = /(<head(\s[^>]*)?>)/i.exec(html);
  if (head) {
    return html.replace(head[1], function () {
      return head[1] + injection;
    });
  }
  var htmlTag = /(<html(\s[^>]*)?>)/i.exec(html);
  if (htmlTag) {
    return html.replace(htmlTag[1], function () {
      return htmlTag[1] + "<head>" + injection + "</head>";
    });
  }
  var doctype = /(<!DOCTYPE[^>]*>)/i.exec(html);
  if (doctype) {
    return html.replace(doctype[1], function () {
      return doctype[1] + "<head>" + injection + "</head>";
    });
  }
  return injection + html;
}

// Injected at serve time by server.ts. Empty array = allow any origin (open/dev deployment).
const ALLOWED_ORIGINS = __ARCHESTRA_ALLOWED_ORIGINS__;

if (window.self === window.top) {
  throw new Error("This file is only to be used in an iframe sandbox.");
}

// Extract the expected host origin from the referrer for origin validation.
// document.referrer may be absent if the parent sets Referrer-Policy: no-referrer,
// so fall back to ALLOWED_ORIGINS-only validation when referrer is unavailable.
let EXPECTED_HOST_ORIGIN = document.referrer
  ? new URL(document.referrer).origin
  : null;

if (EXPECTED_HOST_ORIGIN && ALLOWED_ORIGINS.length > 0 && !ALLOWED_ORIGINS.includes(EXPECTED_HOST_ORIGIN)) {
  throw new Error(
    `Embedding domain not allowed: ${EXPECTED_HOST_ORIGIN}. Configure ARCHESTRA_FRONTEND_URL to allow your domain.`,
  );
}

if (!EXPECTED_HOST_ORIGIN) {
  if (ALLOWED_ORIGINS.length === 0) {
    // No referrer and no ALLOWED_ORIGINS — open/dev mode, accept any origin.
    // EXPECTED_HOST_ORIGIN stays null; message validation uses "*".
  } else {
    // No referrer but ALLOWED_ORIGINS configured — use the first allowed origin
    // for postMessage targeting. Message validation checks ALLOWED_ORIGINS list.
    EXPECTED_HOST_ORIGIN = ALLOWED_ORIGINS[0];
  }
}

// Detect opaque origin (sandbox without allow-same-origin on this iframe).
// With localhost swap or domain mode, this is false (real cross-origin).
// With production fallback (no domain, not localhost), this is true (opaque).
const OWN_ORIGIN = window.origin;
const IS_OPAQUE_ORIGIN = OWN_ORIGIN === "null";

// Security self-test: verify iframe isolation is working correctly.
// This MUST throw a SecurityError -- if `window.top` is accessible, the sandbox
// configuration is dangerously broken and untrusted content could escape.
 try {
  window.top?.alert("If you see this, the sandbox is not setup securely.");
  throw "FAIL";
} catch (e) {
  if (e === "FAIL") {
    throw new Error("The sandbox is not setup securely.");
  }

  // Expected: SecurityError confirms proper sandboxing.
}

// Double-iframe sandbox architecture: THIS file is the outer sandbox proxy
// iframe on a different origin from the host. It creates an inner iframe
// for untrusted HTML content.
const inner = document.createElement("iframe");
inner.style = "width:100%; height:100%; border:none;";
// allow-same-origin on the inner iframe lets it retain its inherited origin.
// In cross-origin modes (localhost swap, domain), both outer and inner share
// the sandbox origin — enabling document.write() access.
// In opaque mode, both share the opaque origin.
inner.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms");
// Note: allow attribute is set later when receiving sandbox-resource-ready notification
// based on the permissions requested by the app
document.body.appendChild(inner);

const RESOURCE_READY_NOTIFICATION =
  "ui/notifications/sandbox-resource-ready";
const PROXY_READY_NOTIFICATION =
  "ui/notifications/sandbox-proxy-ready";
const GUEST_RPC_FLIGHT_MAX_MS = 2500;
const pendingGuestRpcTimers = new Map();

function postGuestRpcFlightCount() {
  if (inner && inner.contentWindow) {
    inner.contentWindow.postMessage(
      { type: "mcp-apps:rpc-flight", count: pendingGuestRpcTimers.size },
      IS_OPAQUE_ORIGIN ? "*" : OWN_ORIGIN,
    );
  }
}

function clearPendingGuestRpc(id, notify) {
  const timer = pendingGuestRpcTimers.get(id);
  if (timer !== undefined) {
    clearTimeout(timer);
    pendingGuestRpcTimers.delete(id);
    if (notify) {
      postGuestRpcFlightCount();
    }
    return true;
  }
  return false;
}

function clearAllPendingGuestRpcs() {
  for (const timer of pendingGuestRpcTimers.values()) {
    clearTimeout(timer);
  }
  pendingGuestRpcTimers.clear();
}


// Message relay: This Sandbox (outer iframe) acts as a bidirectional bridge,
// forwarding messages between:
//
//   Host (parent window) ↔ Sandbox (outer frame) ↔ View (inner iframe)
//
// Special case: The "sandbox-resource-ready" message is intercepted here
// (not relayed) because the Sandbox uses it to configure and load the
// inner iframe with the view HTML content.

window.addEventListener("message", async (event) => {
  if (event.source === window.parent) {
    if(location.hostname === "localhost" || location.hostname === "127.0.0.1") {
      console.debug('[Sandbox] Message from parent:', event.data)
    }
    // Validate that messages from parent come from the expected host origin.
    if (EXPECTED_HOST_ORIGIN && event.origin !== EXPECTED_HOST_ORIGIN) {
      console.error(
        "[Sandbox] Rejecting message from unexpected origin:",
        event.origin,
        "expected:",
        EXPECTED_HOST_ORIGIN
      );
      return;
    }

    if (event.data && event.data.method === RESOURCE_READY_NOTIFICATION) {
      clearAllPendingGuestRpcs();
      // `ownedApp` is set by the trusted host (origin-validated above) only for
      // Archestra-owned apps, whose envelope already carries the platform CSP.
      const { html, sandbox, csp, permissions, ownedApp, restoredState } = event.data.params;
      if (typeof sandbox === "string") {
        // Only allow known-safe sandbox tokens to prevent a compromised MCP
        // server from injecting e.g. allow-top-navigation to escape the sandbox.
        const ALLOWED_SANDBOX_TOKENS = new Set([
          "allow-scripts", "allow-same-origin", "allow-forms",
          "allow-popups", "allow-downloads", "allow-modals",
        ]);
        const filtered = sandbox.split(" ").filter(t => ALLOWED_SANDBOX_TOKENS.has(t)).join(" ");
        inner.setAttribute("sandbox", filtered);
      }
      // Set Permission Policy allow attribute if permissions are requested
      const allowAttribute = buildAllowAttribute(permissions);
      if (allowAttribute) {
        inner.setAttribute("allow", allowAttribute);
      }
      if (typeof html === "string") {
        // Inject CSP as meta tag + violation listener into the HTML (Inspector pattern).
        // One code path for all modes — CSP is always in the HTML, not HTTP headers.
        const processedHtml = injectCSP(html, buildCSP(csp), ownedApp === true, restoredState);

        if (IS_OPAQUE_ORIGIN) {
          // Opaque origin (production fallback): use srcdoc
          inner.srcdoc = processedHtml;
        } else {
          // Cross-origin (localhost swap or domain mode): document.write
          try {
            const doc = inner.contentDocument || inner.contentWindow?.document;
            if (doc) {
              doc.open();
              doc.write(processedHtml);
              doc.close();
            } else {
              inner.srcdoc = processedHtml;
            }
          } catch {
            inner.srcdoc = processedHtml;
          }
        }
      }
    } else {
      if (inner && inner.contentWindow) {
        const wasPendingRpc =
          event.data &&
          typeof event.data === "object" &&
          event.data.jsonrpc === "2.0" &&
          event.data.method === undefined &&
          (event.data.result !== undefined || event.data.error !== undefined) &&
          event.data.id !== undefined &&
          clearPendingGuestRpc(event.data.id, false);
        // With opaque origin, postMessage targetOrigin cannot be a specific origin.
        // Use "*" — safe because the inner iframe is sandboxed.
        const targetOrigin = IS_OPAQUE_ORIGIN ? "*" : OWN_ORIGIN;
        inner.contentWindow.postMessage(event.data, targetOrigin);
        if (wasPendingRpc) {
          postGuestRpcFlightCount();
        }
      }
    }
  } else if (event.source === inner.contentWindow) {
    // Message filtering (Inspector pattern): only forward JSON-RPC 2.0 messages,
    // CSP violations, runtime-error diagnostics, and state-sync snapshots.
    // Prevents noise from browser extensions or widget internals from reaching
    // PostMessageTransport and causing parse errors.
    var data = event.data;
    if (data && typeof data === "object") {
      if (
        data.jsonrpc === "2.0" &&
        data.id !== undefined &&
        (data.method === "tools/call" ||
          data.method === "resources/read" ||
          data.method === "prompts/get")
      ) {
        clearPendingGuestRpc(data.id, false);
        const rpcId = data.id;
        const expiryTimer = setTimeout(() => {
          clearPendingGuestRpc(rpcId, true);
        }, GUEST_RPC_FLIGHT_MAX_MS);
        pendingGuestRpcTimers.set(rpcId, expiryTimer);
        postGuestRpcFlightCount();
      }
      if (
        data.jsonrpc === "2.0" ||
        data.type === "mcp-apps:csp-violation" ||
        data.type === "mcp-apps:runtime-error" ||
        data.type === "mcp-apps:screenshot" ||
        data.type === "mcp-apps:sandbox-content-loaded" ||
        data.type === "mcp-apps:state-sync" ||
        data.type === "mcp-apps:guest-ready"
      ) {
        window.parent.postMessage(data, EXPECTED_HOST_ORIGIN || "*");
      }
    }
  }
});

// Notify the Host that the Sandbox is ready to receive view HTML.
// Use specific origin when available; fall back to "*" in open/dev mode.
  window.parent.postMessage({
    jsonrpc: "2.0",
    method: PROXY_READY_NOTIFICATION,
    params: {},
  }, EXPECTED_HOST_ORIGIN || "*");
</script>
</body>
</html>
