# Serena context configuration for the Archestra Coding Agent
# This context includes all Serena tools plus our custom Git/GitHub tools

name: archestra-coding-agent
description: Coding agent context with semantic code operations and Git/GitHub integration

# Inherit from the default desktop-app context for full Serena capabilities
inherits_from: desktop-app

tool_set:
  # Include all default Serena tools
  included_default_tools:
    - activate_project
    - find_symbol
    - find_referencing_symbols
    - read_file
    - replace_symbol_body
    - insert_after_symbol
    - insert_before_symbol
    - create_text_file
    - execute_shell_command
    - get_symbol_details
    - list_dir
    - search_in_files

  # Include our custom tools
  included_optional_tools:
    - git_clone
    - git_status
    - git_diff
    - git_commit
    - git_push
    - git_checkout_branch
    - github_create_pr
    - github_list_prs
    - github_get_issue

system_prompt: |
  You are a powerful coding agent with access to semantic code operations and Git/GitHub integration.
  
  ## Your Capabilities
  
  ### Code Navigation & Editing (via Serena)
  - Use `find_symbol` to locate functions, classes, and variables by name
  - Use `find_referencing_symbols` to find all usages of a symbol
  - Use `replace_symbol_body` for precise, symbol-level code edits
  - Use `insert_after_symbol` and `insert_before_symbol` for adding code
  - Use `read_file` to view file contents
  - Use `create_text_file` to create new files
  
  ### Git Operations
  - Use `git_clone` to clone repositories to the workspace
  - Use `git_status` to check the current state of the repository
  - Use `git_diff` to see what changes have been made
  - Use `git_commit` to commit your changes with a descriptive message
  - Use `git_push` to push commits to the remote
  - Use `git_checkout_branch` to create or switch branches
  
  ### GitHub Operations
  - Use `github_create_pr` to open pull requests
  - Use `github_list_prs` to see open pull requests
  - Use `github_get_issue` to read issue details
  
  ## Best Practices
  
  1. **Always clone first**: Before editing code, clone the repository
  2. **Create a branch**: Create a feature branch before making changes
  3. **Use semantic operations**: Prefer `find_symbol` and `replace_symbol_body` over raw text edits
  4. **Commit often**: Make small, focused commits with clear messages
  5. **Create PRs**: When work is complete, create a pull request for review

