suite: test archestra platform -- SRE ServiceAccount/RoleBinding
templates:
  - sre-serviceaccount.yaml
release:
  name: archestra
  namespace: archestra
tests:
  - it: creates nothing while the SRE agent is off
    asserts:
      - hasDocuments:
          count: 0

  - it: creates nothing without the MCP server RBAC it binds to
    set:
      archestra.sre.enabled: true
      archestra.orchestrator.kubernetes.mcpServerRbac.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: creates the SRE ServiceAccount the backend is pointed at
    set:
      archestra.sre.enabled: true
    documentIndex: 0
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: archestra-archestra-platform-sre
      - equal:
          path: metadata.namespace
          value: archestra

  - it: binds only the namespaced read-only Role, even with additional operator bindings
    set:
      archestra.sre.enabled: true
      archestra.orchestrator.kubernetes.mcpServerRbac.additionalClusterRoleBindings:
        - clusterRoleName: cluster-reader
      archestra.orchestrator.kubernetes.mcpServerRbac.additionalRoleBindings:
        - roleName: other-admin
          namespace: other
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: RoleBinding
        documentIndex: 1
      - equal:
          path: roleRef
          value:
            kind: Role
            name: archestra-archestra-platform-mcp-server-operator
            apiGroup: rbac.authorization.k8s.io
        documentIndex: 1
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: archestra-archestra-platform-sre
              namespace: archestra
        documentIndex: 1
