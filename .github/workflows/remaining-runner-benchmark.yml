        tags: ${{ env.PLATFORM_IMAGE_REGISTRY }}/${{ env.PLATFORM_IMAGE_NAME }}:ci-runner-benchmark-${{ github.run_id }}-${{ matrix.slug }}-slim
        provenance: 'false'
        sbom: generator=docker/scout-sbom-indexer:1.24.0@sha256:4b67f29eb0d1244ab0f62de867ac5dafd7262fcd7ebbdefa6ec8aacd6b15252d
        turbo-team: ${{ secrets.TURBOREPO_REMOTE_CACHING_TEAM }}
        turbo-token: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
        cache-from: 'type=registry,ref=${{ env.PLATFORM_IMAGE_REGISTRY }}/${{ env.PLATFORM_IMAGE_NAME }}:buildcache

          type=registry,ref=${{ env.PLATFORM_IMAGE_REGISTRY }}/${{ env.PLATFORM_IMAGE_NAME }}:buildcache-amd64

          '
        cache-to: type=registry,ref=${{ env.PLATFORM_IMAGE_REGISTRY }}/${{ env.PLATFORM_IMAGE_NAME }}:ci-runner-benchmark-cache-${{ matrix.slug }},mode=min
    - name: Build Platform image and push to Artifact Registry
      uses: ./.github/actions/build-docker-image
      with:
        context: ./platform
        outputs: type=image,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true,push=true
        tags: ${{ env.PLATFORM_IMAGE_REGISTRY }}/${{ env.PLATFORM_IMAGE_NAME }}:ci-runner-benchmark-${{ github.run_id }}-${{ matrix.slug }}-full
        provenance: 'false'
        sbom: generator=docker/scout-sbom-indexer:1.24.0@sha256:4b67f29eb0d1244ab0f62de867ac5dafd7262fcd7ebbdefa6ec8aacd6b15252d
        turbo-team: ${{ secrets.TURBOREPO_REMOTE_CACHING_TEAM }}
        turbo-token: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
        setup-builder: 'false'
        cache-from: 'type=registry,ref=${{ env.PLATFORM_IMAGE_REGISTRY }}/${{ env.PLATFORM_IMAGE_NAME }}:buildcache

          type=registry,ref=${{ env.PLATFORM_IMAGE_REGISTRY }}/${{ env.PLATFORM_IMAGE_NAME }}:buildcache-amd64

          '
  docs-capture:
    name: Docs capture (${{ matrix.mode }}, ${{ matrix.provider }})
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.repository.private
    needs:
    - images
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - provider: Blacksmith
          mode: duplicate
          runner: blacksmith-8vcpu-ubuntu-2404
        - provider: Blacksmith
          mode: reuse
          runner: blacksmith-8vcpu-ubuntu-2404
        - provider: Ubicloud
          mode: reuse
          runner: ubicloud-standard-8-ubuntu-2404
        - provider: GitHub
          mode: reuse
          runner: ubuntu-24.04
    steps:
    - name: Checkout benchmark source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: 52e58e213bd2e3e49e77f5afe5288b82b7d9008e
    - name: Record runner identity
      run: 'node -e ''const os=require("os"); console.log(JSON.stringify({cpuCount:os.cpus().length,cpuModel:os.cpus()[0].model,memoryBytes:os.totalmem()}))''

        git rev-parse HEAD

        docker version --format ''{{.Server.Version}}''

        '
    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        working-directory: ./platform
    - name: Install Chromium
      working-directory: ./platform
      shell: bash
      run: pnpm --filter @archestra/docs-screenshots exec playwright install --with-deps chromium
    - name: Check screenshot determinism helpers
      working-directory: ./platform
      shell: bash
      run: pnpm --filter @archestra/docs-screenshots exec playwright test --project=determinism
    - name: Build duplicate platform image (observed fallback control)
      if: matrix.mode == 'duplicate'
      run: docker build -t archestra-platform:ci-docs-control ./platform
    - name: Start Archestra (e2e-lite stack)
      env:
        ARCHESTRA_BETA: 'true'
        ARCHESTRA_AGENT_RUNTIME_ENABLED: 'true'
        PLATFORM_IMAGE: ${{ matrix.mode == 'duplicate' && 'archestra-platform:ci-docs-control' || needs.images.outputs.platform-slim }}
        MCP_SERVER_BASE_IMAGE: ${{ needs.images.outputs.mcp-base }}
      shell: bash
      run: ./platform/scripts/e2e-lite.sh up
    - name: Seed demo data and capture screenshots
      working-directory: ./platform
      env:
        ARCHESTRA_URL: http://localhost:3000
        DOCS_SCREENSHOTS_ONLY: ''
      shell: bash
      run: pnpm docs:screenshots
    - name: Upload capture results
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: docs-screenshots-results-${{ matrix.mode }}-${{ matrix.provider }}
        path: platform/tools/docs-screenshots/test-results
        retention-days: 7
    - name: Docs image policy
      shell: bash
      run: python3 .github/scripts/check-docs-image-policy.py
    - name: Stop Archestra
      if: always()
      shell: bash
      run: ./platform/scripts/e2e-lite.sh down
