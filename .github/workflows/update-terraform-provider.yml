name: Update Terraform Provider

# Release Please starts this workflow after it publishes each release from
# main. The daily run is a fallback; pushes run it when the updater changes.
on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-terraform-provider.yml
      - platform/scripts/terraform-provider/**

permissions:
  contents: read

concurrency:
  group: update-terraform-provider
  cancel-in-progress: false

jobs:
  prepare:
    name: Generate provider update without write credentials
    if: github.repository == 'archestra-ai/archestra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.generate.outputs.ready }}
    steps:
      - name: Checkout trusted platform main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout trusted provider tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: archestra-ai/terraform-provider-archestra
          ref: main
          path: provider-tools
          persist-credentials: false
      - name: Checkout provider candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: archestra-ai/terraform-provider-archestra
          ref: main
          path: provider-candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: provider-tools/go.mod
          cache-dependency-path: |
            provider-tools/go.sum
            provider-tools/tools/go.sum
      # Provider CI regenerates its client from the release in
      # platform-version.txt and fails on any difference. So generate from that
      # release's spec, not from the newer spec on main. The token is passed to
      # this one git command only.
      - name: Read the released platform spec
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 platform/scripts/terraform-provider/release_version.py docs/openapi.json)"
          # Release Please tags first and publishes the GitHub release after the
          # images. Until then provider CI cannot pull the image, so skip and let
          # a later run propose the release. A draft is not found with this token.
          # Any other gh error fails the run, so a broken token stays visible.
          if ! published="$(gh release view "platform-v${version}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft | not' 2>&1)"; then
            case "$published" in
              *"release not found"*) published=false ;;
              *) echo "::error::Could not read release platform-v${version}: ${published}"; exit 1 ;;
            esac
          fi
          if [ "$published" != "true" ]; then
            reason="platform-v${version} is not a published release yet; a later run proposes it."
            echo "::notice::$reason"
            mkdir -p provider-update
            python3 -c 'import json, sys; json.dump({"skipped": sys.argv[1]}, open(sys.argv[2], "w"))' "$reason" provider-update/result.json
            exit 0
          fi
          git -c credential.helper= \
              -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
              fetch --no-tags --depth=1 origin "refs/tags/platform-v${version}"
          spec="$RUNNER_TEMP/openapi-release.json"
          git show FETCH_HEAD:docs/openapi.json > "$spec"
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse 'FETCH_HEAD^{commit}')" >> "$GITHUB_OUTPUT"
          echo "Platform release: platform-v${version}" >> "$GITHUB_STEP_SUMMARY"
      - name: Configure candidate Git identity
        if: steps.release.outputs.spec != ''
        uses: $/.github/actions/configure-git-identity
        with:
          working-directory: provider-candidate
      # The trusted helper detects single-client or legacy bridge layout from
      # provider main. platform-version.txt must be added by the provider first.
      - name: Generate and record test results
        id: generate
        if: steps.release.outputs.spec != ''
        working-directory: platform
        env:
          RELEASE_SPEC: ${{ steps.release.outputs.spec }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          python3 scripts/terraform-provider/update_provider.py prepare \
            --provider ../provider-candidate --tools ../provider-tools \
            --spec "$RELEASE_SPEC" --platform-commit "$RELEASE_COMMIT" \
            --output ../provider-update
      - name: Retain generated patch and test failures
        if: always()
        uses: $/.github/actions/github-upload-artifact
        with:
          name: terraform-provider-update
          path: provider-update/
          retention-days: "14"
          if-no-files-found: error

  publish:
    name: Propose generated provider update
    needs: prepare
    if: github.repository == 'archestra-ai/archestra' && github.ref == 'refs/heads/main' && needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted platform publication script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download this run's generated patch
        uses: $/.github/actions/github-download-artifact
        with:
          name: terraform-provider-update
          path: provider-update
      - name: Checkout provider history without executing provider code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: archestra-ai/terraform-provider-archestra
          ref: main
          path: provider-publish
          fetch-depth: 0
          persist-credentials: false
      - name: Generate provider-scoped releaser token
        id: token
        uses: archestra-ai/.github/actions/github-app-token@c3001f82a468e05482bd7c8cd08ff97f94e80d2e # v1.14.0
        with:
          app-id: ${{ secrets.ARCHESTRA_RELEASER_GITHUB_APP_ID }}
          private-key: ${{ secrets.ARCHESTRA_RELEASER_GITHUB_APP_PRIVATE_KEY }}
          owner: archestra-ai
          repositories: terraform-provider-archestra
          permission-contents: write
          permission-pull-requests: write
      - name: Configure publication Git identity
        uses: $/.github/actions/configure-git-identity
        with:
          working-directory: provider-publish
      # Publication derives its file allowlist from provider main without
      # executing its Makefile or any repair-branch tooling.
      - name: Push normally and create or reuse repair PR
        working-directory: platform
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh auth setup-git --hostname github.com --force
          python3 scripts/terraform-provider/update_provider.py publish \
            --provider ../provider-publish --output ../provider-update --run-url "$RUN_URL"
      # Run after publication: semantic failures must remain visible without
      # preventing creation/recovery of the PR where humans can fix them.
      - name: Report provider validation outcome
        if: always()
        working-directory: platform
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path('../provider-update/result.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Provider compile/unit test exit: {result['test_exit']}. Full log in terraform-provider-update artifact.\n")
          if result['test_exit'] != 0:
              raise SystemExit('Generated provider needs human semantic fixes; see repair PR and tests.log artifact.')
          PY

  # Quiet unless the updater fails. A merge conflict, a codegen error and a
  # repair PR whose provider tests fail each stall provider updates, so every
  # failing run posts to the alerts channel until someone fixes the PR.
  notify:
    name: Report updater failures
    needs: [prepare, publish]
    if: >-
      always() && github.repository == 'archestra-ai/archestra' && github.ref == 'refs/heads/main' &&
      (needs.prepare.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      id-token: write # Workload Identity Federation to read the webhook from Secret Manager.
    steps:
      # The webhook lives in GCP Secret Manager. A dedicated service account
      # reads only the alerting secrets, so no repository secret holds it.
      - name: Authenticate to read the alerting webhook
        uses: archestra-ai/.github/actions/google-auth@c3001f82a468e05482bd7c8cd08ff97f94e80d2e # v1.14.0
        with:
          service_account: ${{ vars.CI_ALERTS_SECRETS_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ vars.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}

      - name: Read the alerting webhook
        id: alerting
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            slack_webhook_url:friendly-path-465518-r6/ci-alerts-slack-webhook-url

      - name: Post the failure to alerting
        env:
          SLACK_WEBHOOK_URL: ${{ steps.alerting.outputs.slack_webhook_url }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "::warning::The alerting webhook secret is empty; skipping Slack notification."
            exit 0
          fi
          pulls="https://github.com/archestra-ai/terraform-provider-archestra/pulls?q=is%3Apr+is%3Aopen+head%3Aautomation%2Fplatform-api"
          if [[ "$PREPARE_RESULT" == "failure" ]]; then
            detail="could not generate the provider update (merge conflict with provider main, or a codegen error)."
          else
            detail="proposed an update whose provider tests fail. Fix it on the <$pulls|repair pull request>."
          fi
          message=":rotating_light: Terraform provider update failed: the updater $detail <$RUN_URL|View workflow run>"
          jq -n --arg text "$message" '{text: $text}' |
            curl --fail-with-body -sS --max-time 15 -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
