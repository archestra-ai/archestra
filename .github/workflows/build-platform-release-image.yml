# Stages the platform release image in ghcr.io/archestra-ai/ci/platform. The
# archestra-ai/release-publisher publisher copies the attested digest to
# docker.io/archestra/platform; this repository cannot write there.
name: Build platform release image

on:
  workflow_call:
    inputs:
      image_directory:
        description: "Directory containing the Dockerfile"
        required: true
        type: string
      image_name:
        description: "Name of the Docker image"
        required: true
        type: string
      version:
        description: "Version tag for the Docker image"
        required: true
        type: string
      previous_version:
        description: "Previous release on this branch to carry frontend chunks from; empty skips the carry-over"
        required: false
        type: string
        default: ""
      push_image:
        description: "Whether to push the image to the ci/ staging registry"
        required: true
        type: boolean
      checkout_ref:
        description: "Optional ref to checkout when building the image"
        required: false
        type: string
        default: ""
      environment:
        description: "GitHub Environment whose OIDC subject the publishing jobs use (release-publish for releases); empty for none"
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: build-platform-release-image-${{ inputs.image_name }}-${{ inputs.version }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-platform-release-image:
    name: Build platform release image
    permissions:
      contents: read # Required to checkout the repository and build the image.
      packages: write # Push to the ci/ staging registry.
      id-token: write # Required for Workload Identity Federation when pushing images.
    uses: ./.github/workflows/build-native-multi-arch-image.yml
    with:
      environment: ${{ inputs.environment }}
      image_directory: ${{ inputs.image_directory }}
      image_name: ${{ inputs.image_name }}
      image_registry: ghcr.io/archestra-ai/ci
      version: ${{ inputs.version }}
      push_image: ${{ inputs.push_image }}
      auth_provider: ghcr
      checkout_fetch_depth: 0
      checkout_ref: ${{ inputs.checkout_ref }}
      # This reusable workflow currently publishes the compile-bound Platform
      # image; keep release builds on the same measured native runners as dev.
      amd64_runner: ubuntu-24.04-16core
      arm64_runner: ubuntu-24.04-arm-32core
      previous_image: ${{ inputs.previous_version && format('docker.io/archestra/{0}:{1}', inputs.image_name, inputs.previous_version) || '' }}
