# Reusable workflow for core team Claude PR review.
# Called by claude-pr-review.yml with user-specific OAuth tokens.
name: Claude PR Review (Implementation)

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  pr-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: PR Review with Claude
        uses: anthropics/claude-code-action@1b8ee3b94104046d71fde52ec3557651ad8c0d71 # v1.0.29
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR_NUMBER: ${{ inputs.pr_number }}

            Perform a code review with the following focus areas:

            1. **Code Quality** — Clean code, error handling, edge cases, readability
            2. **Security** — Injection vulnerabilities, input sanitization, auth/authz, secrets exposure
            3. **Performance** — N+1 queries, unnecessary computation, memory leaks
            4. **Testing** — Adequate coverage, edge cases, test quality
            5. **Project conventions** — Check CLAUDE.md for coding standards

            Guidelines:
            - Be concise. No filler praise.
            - Use inline review comments for specific issues.
            - If the PR is clean, approve with a one-line summary.
            - Flag blocking issues as REQUEST_CHANGES. Use COMMENT for suggestions.
            - Group related issues.
          claude_args: |
            --model claude-opus-4-5-20251101
            --allowedTools Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)
