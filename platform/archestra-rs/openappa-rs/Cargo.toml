[package]
name = "openappa_rs"
version = "0.1.0"
edition = "2024"
build = "build.rs"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# OpenAPPA #807: typed child-turn completion with the recorded return contract.
# Pin the reviewed release before merging this integration.
appa-runtime = { package = "appa", git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "52426a85d91301266ff5ec6765bf7487d06848ef", features = ["archestra"] }
appa-runtime-api = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "52426a85d91301266ff5ec6765bf7487d06848ef" }
appa-eventlog = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "52426a85d91301266ff5ec6765bf7487d06848ef", features = ["postgres"] }
appa-package = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "52426a85d91301266ff5ec6765bf7487d06848ef" }
opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics", "experimental_metrics_custom_reader", "spec_unstable_metrics_views"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
napi = { version = "3", features = ["tokio_rt"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
tempfile = "3"
toml = "1.1"
# The runtime's own editor speaks this document type; reading a root's declarations
# with their spans needs the same version the runtime holds.
toml_edit = "0.25"
tokio = { version = "1", features = ["sync", "time", "rt", "net", "io-util"] }
futures-util = "0.3"
# Stream bounded receipt lookups through the store's existing PostgreSQL client.
postgres = "0.19"
# The owner id a dispatch leases its receipts under; tests also build consult records with it.
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
# A paused clock: the connection-wait test does not spend its thirty seconds.
tokio = { version = "1", features = ["rt", "test-util"] }
proptest = "1"

[target.'cfg(target_env = "musl")'.dependencies]
# Cross-builds need OpenSSL compiled for musl. The Docker builder uses its
# installed OpenSSL through OPENSSL_NO_VENDOR instead.
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
napi-build = "2"
