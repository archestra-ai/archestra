[[stages]]
text = """Attached is orders.xlsx (worksheet "Orders", columns: order_id, region, amount_cents, status). Working from the order rows themselves, which region has the highest total amount_cents, and what's the overall total across every order? If two regions tie on total, go with the one that comes first alphabetically."""

  [[stages.files]]
  src = "workbook.xlsx"
  dest = "/home/sandbox/attachments/orders.xlsx"
  mime_type = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"

[[stages]]
text = """Actually, hold on before you give me that. Some of those rows are refunds or orders that got cancelled -- there's a status column for it. I only care about the ones that actually completed, so leave the refunded and cancelled ones out. On that basis, which region comes out on top, and what's the net total for completed orders?

Call submit_result with result = {"top_region": "<region>", "total_cents": <integer net total across completed orders>}."""

[result_schema]
type = "object"
required = ["top_region", "total_cents"]
additionalProperties = false

  [result_schema.properties.top_region]
  type = "string"
  minLength = 1

  [result_schema.properties.total_cents]
  type = "integer"
  minimum = 1

[state]
rest = ["/api/agents/{{agent_id}}/tools"]

[verifier]
deps = ["openpyxl==3.1.5"]
