packages:
  - "backend"
  - "tools/drizzle-migration-linter"
  - "frontend"
  - "shared"
  - "archestra-rs/napi-loader"
  - "archestra-rs/sandbox-rs"
  - "archestra-rs/openappa-rs"
  - "archestra-rs/app-runtime-rs"
  - "archestra-rs/image-rs"
  - "e2e-tests"
  - "tools/docs-screenshots"

catalog:
  ai: ^6.0.193
  # GHSA-qq9h-g4jm-xgf3 (HIGH, improper authentication) affects >=1.1.3 and is
  # fixed in 1.6.22. The @better-auth/* packages release in lockstep with it.
  better-auth: 1.6.22
  "@better-auth/core": 1.6.22
  "@better-auth/oauth-provider": 1.6.22
  "@better-auth/sso": 1.6.22
  # TypeScript 7 ships a `tsc` binary but no programmatic API until 7.1. knip,
  # @hey-api/openapi-ts and next import the compiler as a library, so `typescript`
  # stays on the 6.x API via a shim whose binary is renamed `tsc6` — two packages
  # cannot both install a `tsc` bin.
  typescript: "npm:@typescript/typescript6@^6.0.0"
  typescript-7: "npm:typescript@7.0.1-rc"
  zod: ^4.3.4
overrides:
  # iconv-lite 0.6.x publishes a .idea/ folder, which sandboxed agents can't
  # write, so installs fail there. 0.7 keeps the same API and ships without it.
  iconv-lite@<0.7: ^0.7.2
  # CVE-2026-49356 (GHSA-4x5r-pxfx-6jf8, LOW, arbitrary source-map read via
  # sourceMappingURL handling) fixed in 7.29.6. Transitive-only (build tooling),
  # so an override is the only way to lift every resolution past the vulnerable
  # range. Bounded to <8 so the floor can't drag the toolchain onto Babel 8 while
  # the sibling @babel/* plugins are still 7.x.
  '@babel/core': '>=7.29.6 <8'
  # CVE-2026-73089 (uncontrolled resource consumption) and CVE-2026-73088
  # (prototype pollution), both HIGH / CVSS 7.5, affect <=4.28.6 and are fixed
  # in 4.28.7. Transitive-only (webpack, @babel/helper-compilation-targets and
  # header-generator all resolve it), so an override is the only way to lift
  # every resolution past the vulnerable range.
  browserslist: '>=4.28.7'
  '@fastify/reply-from': '>=12.6.2'
  '@fastify/http-proxy': '>=11.4.4'
  # GHSA-jfj6-75fj-8934 (map prototype mutation) fixed in 8.6.5,
  # GHSA-j3f2-48v5-ccww (infinite loop in .proto option parsing) in 8.6.6.
  protobufjs: '>=8.6.6'
  '@protobufjs/utf8': '>=1.1.1'
  vite: 7.3.5
  # GHSA-395f-4hp3-45gv (HIGH): quadratic-complexity DoS in shell-quote's
  # parse(), fixed in 1.9.0. GHSA-pqg4-j6r4-53mv (CVE-2026-102422, CRITICAL):
  # command injection in quote() via a line terminator after a { comment }
  # token, vulnerable >=1.8.4 <1.11.0 — the floor must be >=1.11.0.
  shell-quote: '>=1.11.0'
  ws@>=8: '>=8.21.0'
  # botframework-streaming pins ws 8.20.1, which the range selector above doesn't
  # catch; force that edge to the CVE-2026-48779 fix too.
  botframework-streaming>ws: '>=8.21.0'
  # CVE-2026-54466 (GHSA-xv26-6w52-cph6, message corruption via protocol
  # length-header abuse) fixed in 0.7.5, the package's latest release.
  websocket-driver: '>=0.7.5'
  # GHSA-vcvr-r3jv-pc5j (CRITICAL) fixed in 16.3.6; CVE-2026-94483 (HIGH, SSRF)
  # fixed in 16.3.8.
  next: 16.3.8
  # form-data 3.0.5 / 4.0.6 fix CVE-2026-12143 (HIGH). Floors rather than exact
  # pins, and bounded per major so a <4 consumer is not jumped onto 4.x.
  form-data@>=4: '>=4.0.6'
  form-data@<4: '>=3.0.5 <4'
  # GHSA-frvp-7c67-39w9 (serve-static path traversal) fixed in 1.19.15.
  # Bounded to <2 to keep the MCP SDK on the 1.x line.
  '@hono/node-server': '>=1.19.15 <2'
  # GHSA-v422-hmwv-36x6 (invalid limit disables size enforcement) fixed in
  # 2.3.0.
  body-parser: '>=2.3.0 <3'
  # GHSA-cmwh-pvxp-8882 (fixed 3.4.11), GHSA-c2j3-45gr-mqc4 (fixed 3.4.12),
  # GHSA-p98j-92pf-mc4p and GHSA-6688-9rhm-gjv2 (IN_PLACE XSS, fixed 3.4.16).
  # One range for every consumer keeps dompurify deduped to one version.
  dompurify: '>=3.4.16 <4'
  glob: 11.1.0
  # GHSA-gv7w-rqvm-qjhr (esbuild "Untrusted Search Path", HIGH) fixed in 0.28.1.
  esbuild: '>=0.28.1'
  # CVE-2026-77301 (HIGH, excessive memory allocation) fixed in 0.6.1.
  adm-zip: 0.6.1
  mdast-util-to-hast: 13.2.1
  express: 5.2.0
  express-rate-limit: 8.3.1
  jws: 4.0.1
  # CVE-2026-59869 (HIGH, uncontrolled resource consumption) affects >=4.0.0,
  # fixed in 4.3.0. Bounded to <5 so consumers expecting the 4.x API aren't
  # force-jumped onto the js-yaml 5 major.
  # Then GHSA-5p4m-2wfm-xmqj (HIGH, quadratic CPU in !!omap resolution) fixed
  # in 4.3.1.
  # CVE-2026-84375: resource consumption fixed in 4.3.2.
  js-yaml: '>=4.3.2 <5'
  # GHSA-4mjr-xmp4-gh2g (DoS via isBuffer) and GHSA-x5fp-wj9c-mxmx (array
  # limit bypass) fixed in 6.16.0.
  qs: '>=6.16.0 <7'
  d3-path: 3.1.0
  # CVE-2026-54290 (HIGH, permissive cross-domain policy) fixed in 4.12.25;
  # later JSX XSS, cross-request disclosure, DoS and parser advisories
  # (GHSA-hxh3-vqpv-xpqv and others) are all fixed by 4.13.7.
  hono: '>=4.13.7 <5'
  kysely: 0.28.17
  lodash-es: 4.18.1
  fast-xml-parser: 5.7.2
  fast-xml-builder: '>=1.1.7'
  samlify: '>=2.13.0'
  # CVE-2026-84394 (HIGH, host confusion) fixed in 3.1.7. Use the 3.1.8
  # release to include the subsequent URI parsing fixes while keeping every
  # transitive consumer on the patched 3.x line.
  fast-uri: '>=3.1.8 <4'
  ajv: 8.18.0
  # CVE-2026-101898, CVE-2026-101901, CVE-2026-101903, CVE-2026-101905,
  # CVE-2026-101906, CVE-2026-101907, CVE-2026-101909 (HIGH) fixed in 1.20.0.
  axios: '>=1.20.0 <2'
  minimatch: '>=10.2.3'
  rollup: '>=4.59.0'
  # CVE-2026-9697 (HIGH, improper certificate validation) fixed in 7.28.0, then
  # CVE-2026-13697 (HIGH, affects >=7.0.0) fixed in 7.29.0. 7.29.0 was published
  # 2026-07-24 and is past the 7-day window, so the release-age exclusion this
  # pin needed is gone and a floor is safe again — minimumReleaseAge holds the
  # line against an unvetted newer release on its own. Bounded to <8 so the
  # floor can't carry the backend's upstream dispatcher onto undici 8.x, which
  # is a major-version change and not this pin's business.
  undici: '>=7.29.1 <8'
  # CVE-2026-83605 through CVE-2026-83619: XML injection/DoS fixes.
  # Preserve the consumers' release lines.
  '@xmldom/xmldom': 0.9.12
  mammoth>@xmldom/xmldom: 0.8.15
  samlify>@xmldom/xmldom: 0.8.15
  path-to-regexp: '>=8.4.0'
  picomatch@>=4: '>=4.0.4'
  picomatch@<4: '>=2.3.2'
  # CVE-2026-76169, CVE-2026-84428, CVE-2026-84469, CVE-2026-84504
  # (HIGH, request validation/authentication bypass) fixed in 5.12.2.
  fastify: '>=5.12.2 <6'
  # CVE-2026-47219 (HIGH, prototype pollution) fixed in 9.7.0.
  find-my-way: '>=9.7.0'
  # CVE-2026-45623 (HIGH, sensitive information exposure) fixed in 8.5.12, and
  # GHSA-r28c-9q8g-f849 (HIGH, path traversal) fixed in 8.5.18. The image
  # carried two postcss copies (8.5.11 and 8.5.17) under the old >=8.5.10
  # floor, so the floor has to clear the higher of the two fixes.
  # GHSA-fxqj-rqcc-2cmp (incomplete fix of the .map read) fixed in 8.5.23.
  postcss: '>=8.5.23'
  # CVE-2026-90711 (CRITICAL, authentication bypass by spoofing) fixed in 2.0.8.
  proxy-addr: '>=2.0.8 <3'
  # CVE-2026-93749 (HIGH, improper validation of specified quantity) fixed in
  # 1.2.2.
  source-map-js: '>=1.2.2'
  # CVE-2026-67213 (GHSA-2v37-7h3g-55p8, HIGH, custom generators loop forever
  # when size is 0): the 3.3.17 fix was incomplete, advisory now requires
  # 3.3.18 on the v3 line. Transitive via postcss and points-on-path; scoped
  # to <4 so the frontend's direct nanoid ^5.1.6 (already past the 5.1.6 v5
  # fix) keeps its own resolution.
  nanoid@<4: '>=3.3.18 <4'
  uuid@^11: '>=11.1.1'
  # GHSA-w5hq-g745-h8pq (missing buffer bounds check in v3/v5/v6) is fixed only
  # on the 11 line. msal-node (^8), @sentry/webpack-plugin (^9) and botbuilder
  # (^10) only call v4 through named imports, which 11 still exports for CJS.
  # Bounded to <12 because 12 drops the CommonJS build.
  uuid@<11: '>=11.1.1 <12'
  # CVE-2026-69192 (HIGH) affects <=10.3.0, fixed in 10.3.1 — the previous
  # >=10.1.1 floor resolved 10.2.0, inside the vulnerable range.
  # Then GHSA-rpw4-54j3-4h4q and GHSA-2vr4-cq9g-pvrc (SSRF classifier gaps,
  # fixed 10.5.1), GHSA-j6r3-76f7-8jcv and GHSA-h3mg-xc3c-68pw (fixed 10.7.1).
  ip-address: '>=10.7.1'
  # CVE-2026-13149 (HIGH, uncontrolled resource consumption) fixed in 5.0.7, then
  # CVE-2026-14257 (HIGH, same class) fixed in 5.0.8, then CVE-2026-69152 (HIGH,
  # same class again) fixed in 5.0.9.
  # CVE-2026-102276 and CVE-2026-102278 require the 5.0.11 fix.
  brace-expansion: '>=5.0.11'
  # GHSA-r4xh-jqrq-34v2 (quadratic-time parse) fixed in 1.9.0.
  smol-toml: '>=1.9.0'
  # GHSA-ch52-4w7c-c8xp (cross-user cached response via max-stale) affects
  # <=4.2.0. Transitive via cacheable-request.
  http-cache-semantics: '>=4.3.0 <5'
  # GHSA-jggr-w7fw-pc2j (stack exhaustion) fixed in 4.1.0. Transitive via
  # pino-pretty.
  fast-copy: '>=4.1.0 <5'
  # GHSA-px8p-9vwx-vf98 (ZIP64 infinite loop) fixed in 0.4.9. Scoped to the
  # 0.4 line posthog-js uses; the 0.8 line is unaffected.
  fflate@<0.5: '>=0.4.9 <0.5'
  # GHSA-866g-f22w-33x8 (uncontrolled resource consumption) fixed in 4.0.33.
  # The @ai-sdk/* providers pin exact 4.0.x patch releases.
  '@ai-sdk/provider-utils@^4': '>=4.0.33 <5'
  # GHSA-396q-4vc8-28x9 (bearer token and cookie leak on cross-origin
  # redirect) fixed in 1.0.0-preview.102. Transitive via kiota-bundle. The
  # abstractions floor keeps the Kiota packages on one shared abstractions copy.
  '@microsoft/kiota-http-fetchlibrary': '>=1.0.0-preview.102'
  '@microsoft/kiota-abstractions': '>=1.0.0-preview.102'
  '@opentelemetry/exporter-prometheus': 0.223.0
  '@opentelemetry/sdk-node': 0.223.0
  # CVE-2026-54285 (GHSA-8988-4f7v-96qf, unbounded memory allocation when
  # W3CBaggagePropagator.extract parses inbound baggage headers) fixed in 2.8.0.
  # sdk-node 0.223 is built against the 2.12 stable packages, so both floors
  # sit at 2.12.0 to keep core and the propagators in step with it.
  '@opentelemetry/core': '>=2.12.0'
  # CVE-2026-59892 (HIGH, uncaught exception) fixed in 2.9.0.
  '@opentelemetry/propagator-jaeger': '>=2.12.0'
  # CVE-2026-101916 (HIGH, certificate validation) fixed in 1.14.5.
  '@grpc/grpc-js': '>=1.14.5 <2'
  # GHSA-f88m-g3jw-g9cj (HIGH, dependency on vulnerable third-party component)
  # fixed in 0.35.0. Transitive-only (optional dep of next's image optimizer).
  # GHSA-rgj7-g3m4-5g8c: heap buffer overflow fixed in 0.35.4.
  # GHSA-wq5f-xc86-pv6w (HIGH, dependency on vulnerable third-party component)
  # fixed in 0.35.5.
  sharp: 0.35.5
packageExtensions:
  '@hookform/resolvers@*':
    dependencies:
      zod: ^4.3.4

patchedDependencies:
  # Preserve function-call IDs across SDK responses and request history.
  # OpenAPPA uses these IDs to match released calls to returned results.
  # Remove when the provider preserves both functionCall.id and functionResponse.id.
  '@ai-sdk/google@3.0.43': patches/@ai-sdk__google@3.0.43.patch
  # Grok can think, start its answer, and think again in one response. The chat
  # model named every reasoning run `reasoning-<completion id>` and sent the
  # second run's deltas to the part it had already closed, so chat stopped with
  # "Received reasoning-delta for missing reasoning part". The patch opens a new
  # part for each run of reasoning or text. Pinned by
  # backend/src/clients/xai-interleaved-reasoning.unit.test.ts; drop it after an
  # upgrade passes that test unpatched.
  '@ai-sdk/xai@3.0.67': patches/@ai-sdk__xai@3.0.67.patch
  # OAuth-only SSO (GitHub) has userinfo but no JWKS/discovery document.
  # Skip runtime discovery only with explicit non-OIDC scopes and complete
  # OAuth endpoints; retain OIDC discovery and URL/SSRF validation.
  # Also resolve private GitHub emails through its verified-email API.
  # Related upstream email tracking (social OAuth, not a fix for this SSO flow):
  # https://github.com/better-auth/better-auth/issues/9124
  # https://github.com/better-auth/better-auth/pull/9331
  # No matching OAuth-only SSO discovery fix found as of 2026-09-19;
  # upstream v1.7.5 still requires JWKS in needsRuntimeDiscovery.
  # Remove only after an upgrade supports both explicit OAuth-only endpoints
  # without discovery and verified private GitHub email lookup in SSO;
  # re-run backend/src/auth/github-sso.ee.test.ts and real GitHub sign-in.
  '@better-auth/sso@1.6.22': patches/ee/@better-auth__sso@1.6.22.patch
  # Native Ollama /api/chat sends `"content": ""` on every thinking-phase chunk,
  # and the package opened the text part on `content != null` and processed text
  # before thinking — so the UI text part was created before the reasoning part
  # and chat rendered the answer above the thinking block. The patch processes
  # thinking first, opens text only on non-empty content, and orders reasoning
  # before text in non-streaming results too. Upstream master (v4, needs ai@^7)
  # has the same bug; drop the patch when moving to ai v7 after verifying a fix.
  ollama-ai-provider-v2@3.6.0: patches/ollama-ai-provider-v2@3.6.0.patch
  # The package root eagerly re-exports its optional worker implementation. That
  # pulls @eshaz/web-worker's Node shim into Next's Client Component SSR graph and
  # Turbopack cannot resolve the shim's intentionally dynamic import. We use only
  # the main-thread decoder, so keep that worker branch out of the package entry.
  opus-decoder@0.7.11: patches/opus-decoder@0.7.11.patch

# Enforce Node.js version requirements from package.json engines field.
engineStrict: true

# Security: Prevent automatic execution of install scripts.
# Packages requiring scripts must be manually rebuilt with: pnpm rebuild <package-name>
ignoreScripts: true

# Runtime containers build dependencies into the image. Do not let `pnpm run`
# or `pnpm exec` try to repair dependencies on startup.
verifyDepsBeforeRun: false

# Security: Delay installation of newly published packages.
# 10080 minutes = 7 days.
# https://daniakash.com/posts/simplest-supply-chain-defense/
minimumReleaseAge: 10080
# CVE-2026-106445 / CVE-2026-106446: urgent Handlebars security fix.
# Published 2026-10-05; remove after 2026-10-12 22:38 UTC (7-day window).
minimumReleaseAgeExclude:
  - handlebars@4.7.10
# OpenTelemetry instrumentation requires these packages hoisted to root.
# @hookform/resolvers/zod statically imports `zod/v4/core` but does not declare
# zod as a peer dependency, so hoist zod to the root node_modules.
publicHoistPattern:
  - '*import-in-the-middle*'
  - '*require-in-the-middle*'
  - shiki
  - zod
