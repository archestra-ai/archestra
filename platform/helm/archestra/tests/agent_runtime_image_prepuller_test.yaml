suite: agent runtime image cache
templates:
  - agent-runtime-image-prepuller.yaml
tests:
  - it: creates no workloads unless images are selected
    asserts:
      - hasDocuments:
          count: 0
  - it: isolates each distinct image so a broken pull cannot block another
    set:
      archestra.agentRuntime.imagePrepull.images:
        - example.test/agent:b
        - example.test/agent:a
        - example.test/agent:a
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: DaemonSet
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: example.test/agent:a
        documentIndex: 0
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: example.test/agent:b
        documentIndex: 1
      - equal:
          path: spec.template.spec.initContainers[1].command
          value: [/prepull/true]
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.initContainers[1].securityContext.readOnlyRootFilesystem
          value: true
  - it: warms the configured runtime pool using registry credentials in the release namespace
    set:
      archestra.agentRuntime.imagePrepull.images: [example.test/agent:a]
      archestra.agentRuntime.imagePrepull.nodeSelector:
        runtime: "true"
      archestra.agentRuntime.imagePrepull.tolerations:
        - key: runtime
          operator: Equal
          value: "true"
          effect: NoSchedule
      archestra.agentRuntime.imagePrepull.imagePullSecrets:
        - name: runtime-registry
      archestra.agentRuntime.imagePrepull.priorityClassName: best-effort
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value: {runtime: "true"}
      - equal:
          path: spec.template.spec.tolerations[0].effect
          value: NoSchedule
      - equal:
          path: spec.template.spec.imagePullSecrets
          value: [{name: runtime-registry}]
      - equal:
          path: spec.template.spec.priorityClassName
          value: best-effort
