name: Publish platform Helm chart

on:
  workflow_call:
    inputs:
      version:
        description: "Version tag for the Helm chart"
        required: true
        type: string
      checkout_ref:
        description: "Optional ref to checkout when packaging the chart"
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: publish-platform-helm-chart-${{ inputs.version }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Packages the chart for the release run. The archestra-ai/release-publisher
  # publisher pushes it to Artifact Registry once the release attests it.
  publish-platform-helm-chart:
    name: Publish platform Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read # Package the chart from the checked-out repository.
    defaults:
      run:
        working-directory: ./platform/helm/archestra
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}

      - name: helm package
        env:
          IMAGE_TAG: ${{ inputs.version }}
        run: |
          helm package . --version "$IMAGE_TAG" --app-version "$IMAGE_TAG"

      - name: Preserve chart for attestation and publication
        uses: ./.github/actions/github-upload-artifact
        with:
          name: release-helm-chart
          path: platform/helm/archestra/archestra-platform-${{ inputs.version }}.tgz
          if-no-files-found: error
