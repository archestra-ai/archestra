name: Trigger Website Deploy

# Rebuild staging with platform docs from the selected branch or commit.
# Production docs are refreshed separately after stable release publication.
# Staging pulls docs and catalog data at build time, so release branch pushes
# that change them trigger a rebuild.

on:
  push:
    branches:
      - release/1.3
    paths:
      - "mcp-catalog/data/**"
      - "docs/**"
      - ".github/workflows/trigger-website-deploy.yml"
  workflow_dispatch:
    inputs:
      docs_ref:
        description: Platform docs ref to preview (empty uses the selected workflow branch)
        type: string
        default: ""

permissions: {}

concurrency:
  group: trigger-website-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger-website-deploy:
    name: Trigger Website Vercel Deploy
    runs-on: ubuntu-latest
    # The website deploy app key lives only in this environment, so the job
    # reads it directly instead of through a caller's secrets.
    environment:
      name: website-deploy
      deployment: false # A secrets and branch gate; nothing is deployed.
    permissions:
      contents: read
    steps:
      - name: Checkout GitHub App token action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/github-app-token

      - name: Generate website deployment token
        id: generate-token
        uses: ./.github/actions/github-app-token
        with:
          app-id: ${{ secrets.ARCHESTRA_WEBSITE_DEPLOY_GITHUB_APP_ID }}
          private-key: ${{ secrets.ARCHESTRA_WEBSITE_DEPLOY_GITHUB_APP_PRIVATE_KEY }}
          owner: archestra-ai
          repositories: website
          permission-actions: write

      - name: Dispatch website deploy workflow
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          DOCS_REF: ${{ inputs.docs_ref || github.sha }}
        run: |
          gh workflow run deploy-to-vercel.yml \
            --repo archestra-ai/website \
            --ref main \
            -f "docs_ref=$DOCS_REF"
