name: Trigger Website Deploy

# Dispatches the website repo's "Deploy to Vercel" GitHub Actions workflow,
# which deploys production via the Vercel CLI. We can NOT use a Vercel deploy
# hook here: deploy hooks create Git-integration deployments, and Vercel
# blocks those whenever the website's head commit author is not a Vercel team
# member (archestra-ai/website#659).

on:
  workflow_call:
    secrets:
      ARCHESTRA_WEBSITE_DEPLOY_GITHUB_APP_ID:
        required: true
        description: App ID for the Archestra Website Deploy GitHub App
      ARCHESTRA_WEBSITE_DEPLOY_GITHUB_APP_PRIVATE_KEY:
        required: true
        description: Private key for the Archestra Website Deploy GitHub App
  workflow_dispatch:

permissions: {}

concurrency:
  group: trigger-website-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger-website-deploy:
    name: Trigger Website Vercel Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Generate website deployment token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ARCHESTRA_WEBSITE_DEPLOY_GITHUB_APP_ID }}
          private-key: ${{ secrets.ARCHESTRA_WEBSITE_DEPLOY_GITHUB_APP_PRIVATE_KEY }}
          owner: archestra-ai
          repositories: website
          permission-actions: write

      - name: Dispatch website deploy workflow
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh workflow run deploy-to-vercel.yml \
            --repo archestra-ai/website \
            --ref main
