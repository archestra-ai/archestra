name: Setup node/pnpm + install dependencies
description: Setup node/pnpm + install dependencies
inputs:
  working-directory:
    description: The working directory to install dependencies in
    required: false
    default: platform
runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: 11.9.0
        # https://github.com/pnpm/action-setup?tab=readme-ov-file#run_install
        run_install: false #  Crucial to prevent premature install before Node.js setup, improves pnpm caching
        # Per-runner install dir: the default ~/setup-pnpm is shared state that
        # concurrent self-hosted runners on one machine race on and clobber.
        dest: ${{ runner.temp }}/setup-pnpm

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24.22.1"
        cache: "pnpm"
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

    - name: Setup environment variables
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: cp .env.example .env
