[[stages]]
text = """Download scikit-image's classic "lena" sample image from this exact pinned source in the sandbox:

  https://raw.githubusercontent.com/scikit-image/scikit-image/v0.10.0/skimage/data/lena.png

Report its file size in kilobytes rounded down, where 1 KB = 1024 bytes -- i.e. floor(byte_size / 1024). Submit your answer with result = {"size_kb": <integer>}."""

[result_schema]
type = "object"
required = ["size_kb"]
additionalProperties = false

  [result_schema.properties.size_kb]
  type = "integer"
  minimum = 1

[verifier]
deps = []
