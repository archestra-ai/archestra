suite: test archestra platform -- ServiceAccount/Role/RoleBinding
templates:
  - serviceaccount.yaml
tests:
  # ServiceAccount tests
  - it: should create a ServiceAccount by default
    documentIndex: 0
    asserts:
      - isKind:
          of: ServiceAccount
      - matchRegex:
          path: metadata.name
          pattern: -archestra-platform$

  - it: should use custom ServiceAccount name when provided
    set:
      archestra.orchestrator.kubernetes.serviceAccount.name: "custom-sa-name"
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: "custom-sa-name"

  - it: should add custom annotations to ServiceAccount
    set:
      archestra.orchestrator.kubernetes.serviceAccount.annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/my-role"
        custom-annotation: "custom-value"
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: "arn:aws:iam::123456789012:role/my-role"
      - equal:
          path: metadata.annotations["custom-annotation"]
          value: "custom-value"

  - it: should not have imagePullSecrets when not configured
    documentIndex: 0
    asserts:
      - isNull:
          path: imagePullSecrets

  - it: should add imagePullSecrets to ServiceAccount when configured
    set:
      archestra.orchestrator.kubernetes.serviceAccount.imagePullSecrets:
        - name: myregistrykey
        - name: anotherregistrykey
    documentIndex: 0
    asserts:
      - equal:
          path: imagePullSecrets[0].name
          value: myregistrykey
      - equal:
          path: imagePullSecrets[1].name
          value: anotherregistrykey

  # MCP Manager Role tests
  - it: should create a MCP Manager Role by default
    documentIndex: 1
    asserts:
      - isKind:
          of: Role
      - matchRegex:
          path: metadata.name
          pattern: -archestra-platform-mcp-manager$

  - it: should have correct pod permissions in MCP Manager Role
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods"]
            verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]

  - it: should have pod/exec permissions in MCP Manager Role
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods/exec"]
            verbs: ["get", "create"]

  - it: should have pod/log permissions in MCP Manager Role
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods/log"]
            verbs: ["get", "list"]

  - it: should have pod/attach permissions in MCP Manager Role
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods/attach"]
            verbs: ["get", "create"]

  - it: should have services permissions in MCP Manager Role
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["services"]
            verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]

  - it: should have secrets permissions in MCP Manager Role
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]

  - it: should have configmaps permissions in MCP Manager Role
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["configmaps"]
            verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]

  - it: should have deployments + statefulsets permissions in MCP Manager Role
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments", "statefulsets"]
            verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]

  # Without this the MCP image pre-puller's reconcile is rejected with 403 and
  # every node the autoscaler adds stays cold, so a hibernated server can only
  # wake by reaching the registry.
  - it: should have daemonsets permissions in MCP Manager Role
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["daemonsets"]
            verbs: ["get", "list", "create", "update", "patch", "delete"]

  - it: should keep owner read permission out of the MCP Manager Role
    documentIndex: 1
    asserts:
      - lengthEqual:
          path: rules
          count: 15
      - notContains:
          path: rules
          content:
            apiGroups: ["rbac.authorization.k8s.io"]
            resources: ["roles"]
            resourceNames: ["RELEASE-NAME-archestra-platform-mcp-runtime-owner"]
            verbs: ["get"]

  - it: should create a narrow Role as the runtime resource owner
    documentIndex: 3
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: "RELEASE-NAME-archestra-platform-mcp-runtime-owner"
      - equal:
          path: rules
          value:
            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["roles"]
              resourceNames: ["RELEASE-NAME-archestra-platform-mcp-runtime-owner"]
              verbs: ["get"]

  - it: should bind the runtime owner Role to the platform ServiceAccount
    documentIndex: 4
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: roleRef.name
          value: "RELEASE-NAME-archestra-platform-mcp-runtime-owner"
      - equal:
          path: subjects[0].name
          value: "RELEASE-NAME-archestra-platform"
      - equal:
          path: subjects[0].namespace
          value: NAMESPACE

  - it: should preserve the existing manager Role name for long fullnames
    set:
      fullnameOverride: "123456789012345678901234567890123456789012345678901234567890123"
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: "123456789012345678901234567890123456789012345678901234567890123-mcp-manager"

  - it: should grant access to an external owner without replacing the default owner
    set:
      archestra.env:
        ARCHESTRA_ORCHESTRATOR_MCP_RUNTIME_OWNER_ROLE: "external-runtime-owner"
    documentIndex: 3
    asserts:
      - equal:
          path: metadata.name
          value: "RELEASE-NAME-archestra-platform-mcp-runtime-owner"
      - equal:
          path: rules
          value:
            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["roles"]
              resourceNames:
                - "RELEASE-NAME-archestra-platform-mcp-runtime-owner"
                - "external-runtime-owner"
              verbs: ["get"]

  - it: should trim an explicitly configured owner Role
    set:
      archestra.env:
        ARCHESTRA_ORCHESTRATOR_MCP_RUNTIME_OWNER_ROLE: "  external-runtime-owner  "
    documentIndex: 3
    asserts:
      - equal:
          path: rules[0].resourceNames
          value:
            - "RELEASE-NAME-archestra-platform-mcp-runtime-owner"
            - "external-runtime-owner"

  - it: should grant no external owner permission for a whitespace-only override
    set:
      archestra.env:
        ARCHESTRA_ORCHESTRATOR_MCP_RUNTIME_OWNER_ROLE: "   "
    documentIndex: 3
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["roles"]
              resourceNames: ["RELEASE-NAME-archestra-platform-mcp-runtime-owner"]
              verbs: ["get"]

  - it: should have network policy permissions in MCP Manager Role
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["networkpolicies"]
            verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["cilium.io"]
            resources: ["ciliumnetworkpolicies"]
            verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["networking.gke.io"]
            resources: ["fqdnnetworkpolicies"]
            verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["networking.k8s.aws"]
            resources: ["applicationnetworkpolicies"]
            verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]

  - it: should grant narrow Agent background execution Job permissions in MCP Manager Role
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["batch"]
            resources: ["jobs"]
            verbs: ["get", "create", "delete"]
      - contains:
          path: rules
          content:
            apiGroups: ["batch"]
            resources: ["jobs/status"]
            verbs: ["get"]
      - notContains:
          path: rules
          content:
            apiGroups: ["batch"]
            resources: ["cronjobs"]
            verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]

  # MCP Manager RoleBinding tests
  - it: should create a MCP Manager RoleBinding by default
    documentIndex: 2
    asserts:
      - isKind:
          of: RoleBinding
      - matchRegex:
          path: metadata.name
          pattern: -archestra-platform-mcp-manager$

  - it: MCP Manager RoleBinding should bind to the correct ServiceAccount
    documentIndex: 2
    asserts:
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - matchRegex:
          path: subjects[0].name
          pattern: -archestra-platform$
      - equal:
          path: subjects[0].namespace
          value: NAMESPACE

  - it: MCP Manager RoleBinding should bind to custom ServiceAccount name
    set:
      archestra.orchestrator.kubernetes.serviceAccount.name: "custom-sa-name"
    documentIndex: 2
    asserts:
      - equal:
          path: subjects[0].name
          value: "custom-sa-name"

  - it: MCP Manager RoleBinding should reference the correct Role
    documentIndex: 2
    asserts:
      - equal:
          path: roleRef.kind
          value: Role
      - matchRegex:
          path: roleRef.name
          pattern: -archestra-platform-mcp-manager$
      - equal:
          path: roleRef.apiGroup
          value: rbac.authorization.k8s.io

  # Integration tests
  - it: should create all resources with default values
    asserts:
      - hasDocuments:
          count: 5

  - it: should create only ServiceAccount when RBAC is disabled
    set:
      archestra.orchestrator.kubernetes.rbac.create: false
    asserts:
      - hasDocuments:
          count: 1

  - it: should create only RBAC resources when ServiceAccount is disabled
    set:
      archestra.orchestrator.kubernetes.serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 4

  - it: should create no resources when both are disabled
    set:
      archestra.orchestrator.kubernetes.serviceAccount.create: false
      archestra.orchestrator.kubernetes.rbac.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should work with all custom configurations
    set:
      archestra.orchestrator.kubernetes.serviceAccount.name: "custom-archestra-sa"
      archestra.orchestrator.kubernetes.serviceAccount.annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/archestra-role"
      archestra.orchestrator.kubernetes.serviceAccount.imagePullSecrets:
        - name: private-registry-secret
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: "custom-archestra-sa"
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: "arn:aws:iam::123456789012:role/archestra-role"
      - equal:
          path: imagePullSecrets[0].name
          value: private-registry-secret

  - it: should ensure MCP Manager RoleBinding references custom ServiceAccount
    set:
      archestra.orchestrator.kubernetes.serviceAccount.name: "custom-archestra-sa"
    documentIndex: 2
    asserts:
      - equal:
          path: subjects[0].name
          value: "custom-archestra-sa"

  # environmentNamespaces tests
  # Default rendering is 5 docs: SA plus manager and owner Role/RoleBinding pairs.
  # Each additional namespace appends the same four RBAC resources.
  - it: should not create extra RBAC for environmentNamespaces by default
    asserts:
      - hasDocuments:
          count: 5

  - it: should create a Role and RoleBinding per additional namespace
    set:
      archestra.orchestrator.kubernetes.rbac.environmentNamespaces:
        - staging
        - prod-ns
    asserts:
      - hasDocuments:
          count: 13  # SA + 3 namespaces * (manager and owner Role/RoleBinding pairs)

  - it: additional namespace Role targets that namespace
    set:
      archestra.orchestrator.kubernetes.rbac.environmentNamespaces:
        - staging
        - prod-ns
    documentIndex: 5
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.namespace
          value: staging
      - matchRegex:
          path: metadata.name
          pattern: -archestra-platform-mcp-manager$

  - it: additional namespace RoleBinding targets that namespace and binds the release-namespace SA
    set:
      archestra.orchestrator.kubernetes.rbac.environmentNamespaces:
        - staging
        - prod-ns
    documentIndex: 6
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.namespace
          value: staging
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - matchRegex:
          path: subjects[0].name
          pattern: -archestra-platform$
      # Subject SA lives in the release namespace, not the target namespace.
      - equal:
          path: subjects[0].namespace
          value: NAMESPACE
      - equal:
          path: roleRef.kind
          value: Role
      - matchRegex:
          path: roleRef.name
          pattern: -archestra-platform-mcp-manager$

  - it: second additional namespace also renders Role and RoleBinding
    set:
      archestra.orchestrator.kubernetes.rbac.environmentNamespaces:
        - staging
        - prod-ns
    documentIndex: 9
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.namespace
          value: prod-ns

  - it: additional namespace Role grants the same MCP-manager rules (no drift)
    set:
      archestra.orchestrator.kubernetes.rbac.environmentNamespaces:
        - staging
    documentIndex: 5
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments", "statefulsets"]
            verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["daemonsets"]
            verbs: ["get", "list", "create", "update", "patch", "delete"]
      - notContains:
          path: rules
          content:
            apiGroups: ["rbac.authorization.k8s.io"]
            resources: ["roles"]
            resourceNames: ["RELEASE-NAME-archestra-platform-mcp-runtime-owner"]
            verbs: ["get"]
      - contains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["networkpolicies"]
            verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["cilium.io"]
            resources: ["ciliumnetworkpolicies"]
            verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["networking.gke.io"]
            resources: ["fqdnnetworkpolicies"]
            verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["networking.k8s.aws"]
            resources: ["applicationnetworkpolicies"]
            verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]

  - it: additional namespace gets a narrow runtime owner Role
    set:
      archestra.orchestrator.kubernetes.rbac.environmentNamespaces:
        - staging
    documentIndex: 7
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.namespace
          value: staging
      - equal:
          path: metadata.name
          value: "RELEASE-NAME-archestra-platform-mcp-runtime-owner"
      - equal:
          path: rules
          value:
            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["roles"]
              resourceNames: ["RELEASE-NAME-archestra-platform-mcp-runtime-owner"]
              verbs: ["get"]

  - it: should not create additional-namespace RBAC when rbac.create is false
    set:
      archestra.orchestrator.kubernetes.rbac.create: false
      archestra.orchestrator.kubernetes.rbac.environmentNamespaces:
        - staging
        - prod-ns
    asserts:
      - hasDocuments:
          count: 1  # Only the ServiceAccount

  - it: should skip an additional namespace equal to the release namespace
    set:
      archestra.orchestrator.kubernetes.rbac.environmentNamespaces:
        - NAMESPACE
    asserts:
      - hasDocuments:
          count: 5  # No duplicate RBAC pairs for the release namespace

  - it: should skip only the release namespace from a mixed list
    set:
      archestra.orchestrator.kubernetes.rbac.environmentNamespaces:
        - NAMESPACE
        - staging
    asserts:
      - hasDocuments:
          count: 9  # SA + release and staging manager/owner RBAC pairs

  - it: additional namespace RoleBinding honors a custom ServiceAccount name
    set:
      archestra.orchestrator.kubernetes.serviceAccount.name: "custom-sa-name"
      archestra.orchestrator.kubernetes.rbac.environmentNamespaces:
        - staging
    documentIndex: 6
    asserts:
      - equal:
          path: subjects[0].name
          value: "custom-sa-name"

  - it: custom MCP namespace automatically receives manager RBAC
    set:
      archestra.orchestrator.kubernetes.namespace: mcp-runtime
    documentIndex: 5
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.namespace
          value: mcp-runtime

  - it: custom MCP namespace RoleBinding points to the release ServiceAccount
    set:
      archestra.orchestrator.kubernetes.namespace: mcp-runtime
    documentIndex: 6
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.namespace
          value: mcp-runtime
      - equal:
          path: subjects[0].namespace
          value: NAMESPACE

  - it: custom MCP namespace is deduplicated against environment namespaces
    set:
      archestra.orchestrator.kubernetes.namespace: mcp-runtime
      archestra.orchestrator.kubernetes.rbac.environmentNamespaces:
        - mcp-runtime
    asserts:
      - hasDocuments:
          count: 9
