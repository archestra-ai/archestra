name: On Pull Requests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  # Required checks must also run on merge_group when merge queue is enabled,
  # otherwise the queue waits for PR-only statuses that never appear on the
  # temporary merge-group SHA.
  merge_group:

permissions: {}

concurrency:
  group: "on-pull-requests-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}"
  cancel-in-progress: true

jobs:
  release-freeze-check:
    name: Release Freeze Check
    # Always run so it can be a required status check - passes immediately for
    # non-release-please PRs and merge queue runs.
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to inspect the repository context for release-please PRs.
      pull-requests: write # Required to request changes on frozen release PRs.
    steps:
      - name: Check if this requires freeze validation
        id: check-context
        run: |
          if [ "$EVENT_NAME" = "merge_group" ]; then
            echo "should_check=false" >> "$GITHUB_OUTPUT"
            echo "Merge queue run - passing release freeze check."
            exit 0
          fi

          if [[ "$HEAD_REF" == release-please--* ]]; then
            echo "should_check=true" >> "$GITHUB_OUTPUT"
            echo "🔖 This is a release-please PR - checking freeze status"
          else
            echo "should_check=false" >> "$GITHUB_OUTPUT"
            echo "✅ Not a release-please PR - passing automatically"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}

      - name: Check if release is frozen
        id: check-freeze
        if: steps.check-context.outputs.should_check == 'true'
        env:
          RELEASE_FREEZE: ${{ vars.RELEASE_FREEZE }}
        run: |
          if [ "$RELEASE_FREEZE" = "true" ]; then
            echo "frozen=true" >> "$GITHUB_OUTPUT"
            echo "❄️ Release freeze is active"
          else
            echo "frozen=false" >> "$GITHUB_OUTPUT"
            echo "✅ No release freeze active. Release-please PR can proceed."
          fi

      - name: Checkout repository
        if: steps.check-context.outputs.should_check == 'true' && steps.check-freeze.outputs.frozen == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Request changes on PR
        if: steps.check-context.outputs.should_check == 'true' && steps.check-freeze.outputs.frozen == 'true'
        uses: $/.github/actions/release-freeze-review
        with:
          action: freeze
          app-id: ${{ secrets.ARCHESTRA_RELEASE_FREEZE_CHECKER_GITHUB_APP_ID }}
          private-key: ${{ secrets.ARCHESTRA_RELEASE_FREEZE_CHECKER_GITHUB_APP_PRIVATE_KEY }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Fail if frozen
        if: steps.check-context.outputs.should_check == 'true' && steps.check-freeze.outputs.frozen == 'true'
        run: |
          echo "::error::❄️ Release freeze is active. Merging release-please PRs is blocked."
          exit 1

  license-compliance-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./platform
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup environment
        uses: $/.github/actions/setup-env
        with:
          working-directory: ./platform

      - name: Run license compliance check
        run: pnpm license-check --ci

      - name: Generate full license report (on failure)
        if: failure()
        run: |
          echo "## License Compliance Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "❌ License check failed. See details below:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pnpm license-check 2>&1 | head -100 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Add success summary
        if: success()
        run: |
          echo "## ✅ License Compliance Check Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No GPL/AGPL/Unknown licenses found in dependencies." >> "$GITHUB_STEP_SUMMARY"

  supply-chain-policy:
    name: Supply Chain Policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Enforce image pinning and download verification policy
        run: |
          python3 -m unittest discover -s .github/scripts -p "test_*.py"
          python3 .github/scripts/check-supply-chain-policy.py

      - name: Check new Cargo dependency release ages
        uses: archestra-ai/.github/actions/cargo-release-age@410c0edb0244ef042e04bfd972ccba90e12db2ed # v1.0.1
        # The action fetches the base SHA, which needs authentication in private
        # mirrors. Keep checkout credentials unpersisted and scope the read-only
        # job token to this pinned action via Git's runtime configuration.
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.https://github.com.helper
          GIT_CONFIG_VALUE_1: '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          lockfiles: |
            ai-labs/Cargo.lock
            platform/archestra-rs/Cargo.lock

  migration-kit-checks:
    name: Migration Kit Checks
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install uv
        uses: $/.github/actions/setup-uv

      # the shipped scripts are zero-dependency; this gates the contributor tooling
      # (pytest + the ty / ruff / zero-dependency gates), pinned to the supported python floor.
      - name: Run migration-kit gates
        run: uv run --python 3.10 --frozen --directory migration-kit --group dev pytest -q

  dependency-review:
    name: Dependency Review
    # Public repos only. The dependency review API is a GitHub Advanced
    # Security feature on private repositories, so in a private mirror of this
    # repo (archestra-private, where task-env sessions open their PRs) the
    # action refuses to run at all — "Dependency review is not supported on
    # this repository" — and paints a red check that no code change can fix.
    # Skipping is the honest outcome there: the canonical repo is public and
    # runs this on the same commits before anything merges. The public API can
    # compare any two Git refs, including the merge queue's synthetic head.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for dependency-review-action to read the PR dependency graph via the API.
      pull-requests: write # Required for dependency-review-action PR comments.
    steps:
      # No checkout: dependency-review-action reads the PR diff via the GitHub
      # API and references no local config file, so the (fetch-depth: 0) checkout
      # was ~74s of the job's ~89s for nothing.
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # NOTE: disable license check here because we are already doing it in the license-compliance-check job
          # allow-licenses: MIT
          license-check: "false"
          # The action derives refs from pull_request events. merge_group has
          # no PR payload, so inspect the temporary merge result explicitly.
          base-ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          head-ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}
          # merge_group has no PR to comment on.
          comment-summary-in-pr: ${{ github.event_name == 'pull_request' && 'on-failure' || 'never' }}

  # Required checks retain their names on PRs, but expensive validation runs
  # against the merge queue's combined SHA. PR-only policy checks above still
  # run on every push. Full E2E lives in the separate workflow.
  #
  # A skipped job satisfies its required PR check under its existing name;
  # the same job runs for real on merge_group. Do not add same-named success
  # placeholders: they could mask a failing merge-group job.
  # Release-please is the exception below: validate its generated head before
  # queue entry. Release PR Generation owns publication of all generated files.
  platform-lint-and-unit-tests:
    name: Platform Lint and Unit Tests
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'archestra-ci[bot]' && startsWith(github.event.pull_request.head.ref, 'release-please--'))
    # Turbo fans out six check tasks; @frontend:check:ci also runs
    # tsc/vitest/knip/biome concurrently, so retain 16 CPUs.
    runs-on: ubicloud-standard-16-ubuntu-2404
    # Backstop: on a turbo remote-cache hit every check here finishes well
    # under 10m, but leaked test-runner processes (vitest fork workers /
    # esbuild) occasionally orphan and hold the step's log pipe open, leaving
    # a *finished* job hanging until GitHub's 6h default. Fail fast instead.
    # Queue entries and release-please PRs may pay a full cold build when
    # caches are empty.
    timeout-minutes: 20
    permissions:
      contents: read # Release generation has a separate, single writer.
    defaults:
      run:
        working-directory: ./platform
    env:
      TURBO_TOKEN: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBOREPO_REMOTE_CACHING_TEAM }}
    steps:
      - name: Check if this is a release-please PR
        id: check-release-please
        working-directory: .
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [[ "$HEAD_REF" == release-please--* ]]; then
            echo "is-release-please=true" >> "$GITHUB_OUTPUT"
            echo "Release-please PR detected; generated files will be auto-committed if needed."
          else
            echo "is-release-please=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # Validate the same source as the generation coordinator, never a moving branch.
      - name: Pin release PR source
        if: ${{ steps.check-release-please.outputs.is-release-please == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Setup environment
        uses: $/.github/actions/setup-env
        with:
          working-directory: ./platform

      # setup-env uses --frozen-lockfile, which skips minimum-release-age checks.
      # --fix-lockfile re-resolves and fails on immature deps (ERR_PNPM_NO_MATURE_MATCHING_VERSION).
      - name: Verify no immature dependencies
        run: pnpm install --fix-lockfile --lockfile-only --ignore-scripts

      # check:commit runs the Drizzle migration linter, which diffs migrations
      # against origin/<default branch>. The checkout above is depth-1 with
      # persist-credentials: false, so that ref is absent AND git holds no
      # credentials — the linter's own fallback fetch then goes out
      # unauthenticated. On this repo that happens to work (public repos allow
      # anonymous fetch); on a private mirror GitHub answers 401, git falls
      # back to prompting, and the step dies with "could not read Username for
      # 'https://github.com'" before it can lint anything. Fetching the ref
      # here with the job token makes the linter's input exist in both cases.
      # The credential helper is passed with -c so it applies to this one
      # command only: the token stays in the environment, never reaching argv,
      # .git/config, or any later step.
      # The release tag fetch feeds the released-tag upgrade replay matrix
      # (backend test:migration-upgrades), which migrates a database with each
      # active stable line's latest released history before upgrading it to
      # this PR's history.
      - name: Fetch base ref and release tags for migration checks
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git -c credential.helper= \
              -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
              fetch --depth=1 origin \
              "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" \
              "+refs/heads/release/*:refs/remotes/origin/release/*" \
              "+refs/tags/platform-v*:refs/tags/platform-v*"

      # The private development mirror does not publish stable release tracks.
      # Test its changes against the actual released public histories, keeping
      # origin/main above tied to this PR's own repository.
      - name: Fetch canonical release histories in the private mirror
        if: github.repository == 'archestra-ai/archestra-private'
        run: |
          git fetch --depth=1 https://github.com/archestra-ai/archestra.git \
            "+refs/heads/release/*:refs/remotes/origin/release/*" \
            "+refs/tags/platform-v*:refs/tags/platform-v*"

      # The private development mirror does not publish stable release tracks.
      # Test its changes against the actual released public histories, keeping
      # origin/main above tied to this PR's own repository.
      - name: Fetch canonical release histories in the private mirror
        if: github.repository == 'archestra-ai/archestra-private'
        run: |
          git fetch --depth=1 https://github.com/archestra-ai/archestra.git \
            "+refs/heads/release/*:refs/remotes/origin/release/*" \
            "+refs/tags/platform-v*:refs/tags/platform-v*"

      - name: Check migration upgrade paths across release tracks
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
        run: |
          python3 ../.github/scripts/test_check_migration_upgrades.py
          python3 ../.github/scripts/check-migration-upgrades.py --base-branch "${BASE_BRANCH#refs/heads/}"

      # Backend unit tests run in the parallel sharded "Backend Unit Tests"
      # jobs below; here the backend runs check:commit (same checks minus
      # vitest) so this job stops being serialized behind the largest suite.
      - name: Fast static and copy checks
        run: |
          pnpm exec turbo check:commit --filter=@backend
          pnpm check:white-label

      # Cold Rust NAPI builds invoke cargo. Sync the
      # pinned toolchain (rust-toolchain.toml) serially first — otherwise
      # turbo's parallel crate builds each trigger a concurrent rustup
      # download of the same components, which races and fails with
      # "could not rename downloaded file".
      # Reuse the warm release target restored by backend test shards. The
      # native addons are intentionally uncached in Turbo because its remote
      # cache is shared across architectures, but Cargo artifacts here are
      # scoped to this CI runner and Rust toolchain.
      - name: Restore Rust build cache
        uses: $/.github/actions/setup-rust-build
        with:
          workspaces: platform/archestra-rs
          shared-key: backend-unit-tests
          save-if: "false"

      - name: Type checking, linting, formatting, unit tests
        run: pnpm exec turbo check:ci --filter=!@backend

      - name: Test migration upgrades across release tracks
        run: pnpm --dir backend test:migration-upgrades

      - name: Release skill harness
        run: pnpm test:release-skill

      - name: Test backport automation
        run: python3 ../.github/scripts/test_backport.py

      # Validates the production build (Next, backend, and Rust NAPI) on the
      # merge queue's combined SHA and on release-please PRs before codegen.
      - name: Production build
        run: pnpm build

      - name: Run validation checks (drizzle-kit, codegen, db migrations)
        env:
          IS_RELEASE_PLEASE_PR: ${{ steps.check-release-please.outputs.is-release-please }}
        run: |
          set -e

          # Start drizzle-kit check in background
          echo "Starting drizzle-kit check in background..."
          (cd backend && pnpm drizzle-kit check) &
          DRIZZLE_PID=$!

          # Run codegen and lint
          echo "Running codegen..."
          pnpm codegen
          pnpm lint:fix

          # Check for codegen changes
          if ! git -C "$GITHUB_WORKSPACE" diff --exit-code -- docs/ platform/ || ! git -C "$GITHUB_WORKSPACE" diff --cached --exit-code -- docs/ platform/; then
            if [ "$IS_RELEASE_PLEASE_PR" = "true" ] && [ "$(git log -1 --format=%s)" != "docs: generate release artifacts" ] && [ "$(git -C "$GITHUB_WORKSPACE" diff --name-only HEAD -- docs/ platform/)" = "docs/openapi.json" ]; then
              # The coordinator will publish all outputs together. This source run
              # may observe the expected OpenAPI drift; the generated head must
              # subsequently pass this entire job with no codegen differences.
              echo "Waiting for combined release generation to publish OpenAPI."
            else
              echo "::error::Codegen produced unexpected changes. Run pnpm codegen && pnpm lint:fix locally."
              git -C "$GITHUB_WORKSPACE" diff --stat -- docs/ platform/
              exit 1
            fi
          fi

          # Wait for drizzle-kit check
          echo "Waiting for drizzle-kit check..."
          wait $DRIZZLE_PID

          # Generate migrations and ensure no new migrations are created
          echo "Checking for missing database migrations..."
          set +e
          if timeout 15s pnpm db:generate > /tmp/db_generate_output.txt 2>&1; then
            output=$(cat /tmp/db_generate_output.txt)
            echo "$output"
            if echo "$output" | grep -q "❯\|Is.*table created or renamed"; then
              echo "::error::Interactive prompt detected. Pending database migrations need to be committed."
              exit 1
            fi
          else
            exit_code=$?
            cat /tmp/db_generate_output.txt 2>/dev/null || true
            if [ $exit_code -eq 124 ]; then
              echo "::error::pnpm db:generate timed out, likely waiting for interactive migration input."
            else
              echo "::error::pnpm db:generate failed with exit code $exit_code."
            fi
            exit 1
          fi
          set -e

          if ! git diff --exit-code -- backend/src/database/migrations/ || ! git diff --cached --exit-code -- backend/src/database/migrations/; then
            echo "::error::Database schema changes require a migration. Please run 'pnpm db:generate' locally and commit the generated migration."
            git diff --stat backend/src/database/migrations/
            exit 1
          fi

          echo "✅ All validation checks passed"

  # mac-mini routing: both Rust checks and the frontend integration tests run
  # on the self-hosted mac-mini-1 runners instead of GitHub-hosted when BOTH
  # hold:
  #   - the event is merge_group (only maintainer-queued code ever reaches the
  #     self-hosted machine; label-triggered PR runs stay on GitHub-hosted
  #     runners), and
  #   - the MAC_MINI_CI repository variable is "on" — the kill switch. Flip it
  #     off (gh variable set MAC_MINI_CI --body off) to instantly route
  #     everything back to GitHub-hosted runners with no workflow change;
  #     unset/missing also means GitHub-hosted.
  # The mac-mini-watchdog job below auto-flips the switch off and cancels the
  # run if the machine stops taking jobs, so a dead mini ejects the PR from
  # the merge queue in minutes instead of blocking it for hours.
  #
  # The backend unit test shards deliberately stay off the mac mini: the
  # merge queue runs several stacked groups concurrently, and even 4 shards
  # per group oversubscribe the machine's 3 runner slots — queued-behind-saturation
  # is indistinguishable from dead for the jobs involved and adds minutes of
  # merge latency per group.
  #
  # Rust toolchain checks, split out of the lint job so cargo work runs in
  # parallel with the pnpm work instead of serializing ~1.5-2 min ahead of it.
  # Needs no pnpm/setup-env: the Dagger sync script is pure shell and cargo
  # operates on the committed lockfile.
  # Rust workspace checks are owned here, once. The package-level check:ci
  # tasks in Platform Lint and Unit Tests retain only NAPI build/load smokes;
  # sandbox-rs's workspace suite previously repeated app-runtime and image
  # core tests after this job had already covered them.
  dagger-sdk-integration:
    name: Dagger SDK Integration
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
    uses: $/.github/workflows/on-pull-requests-dagger-sdk.yml

  platform-rust-checks:
    name: Platform Rust Checks
    needs: dagger-sdk-integration
    if: always() && github.event_name == 'merge_group'
    runs-on: ${{ github.event_name == 'merge_group' && vars.MAC_MINI_CI == 'on' && fromJSON('["self-hosted", "mac-mini-1"]') || 'ubicloud-standard-8-ubuntu-2404' }} # zizmor: ignore[self-hosted-runner] merge-queue only, behind the MAC_MINI_CI kill switch.
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./platform
    steps:
      - name: Require Dagger SDK integration
        if: needs.dagger-sdk-integration.result != 'success'
        working-directory: .
        run: |
          echo "::error::Dagger SDK integration did not succeed."
          exit 1

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # The mac mini keeps its cargo caches on the persistent disk; only the
      # ephemeral Linux runners need a restored cache.
      - name: Cache cargo registry and target
        uses: $/.github/actions/setup-rust-build
        with:
          workspaces: platform/archestra-rs
          targets: x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          shared-key: platform-rust-checks
          cache: ${{ runner.os == 'Linux' }}
          toolchain-before-cache: "true"

      # Prebuilt binary instead of `cargo install` — the source compile was
      # ~2-4 min of pure waste on ephemeral runners. The action verifies the
      # download against its pinned manifest and picks the right platform
      # (Linux runners and the mac mini).
      - name: Install cargo-deny
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2

      - name: Rust dependency policy
        working-directory: ./platform/archestra-rs
        run: cargo deny --config deny.toml check advisories bans licenses sources

      - name: Install Rust musl toolchain dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Verify Dagger version sync
        run: ./scripts/check-dagger-version-sync.sh

      - name: Rust workspace checks and musl compile check
        working-directory: ./platform/archestra-rs
        env:
          # The mac-mini runners have the messense x86_64-linux-musl cross
          # toolchain preinstalled (no musl-gcc there).
          CC_x86_64_unknown_linux_musl: ${{ runner.os == 'Linux' && 'musl-gcc' || 'x86_64-unknown-linux-musl-gcc' }}
        run: |
          cargo fmt --all --check
          cargo check --workspace --locked
          cargo test --workspace --locked
          cargo check --workspace --locked --target x86_64-unknown-linux-musl

  # The only job that exercises the REAL OpenAPPA runtime: the NAPI bridge, its
  # decisions, and the PostgreSQL ledger they are recorded in. Every suite above
  # this one mocks `@archestra/openappa-rs`, so without this job nothing in CI
  # would ever execute the native code path — which is precisely what happened
  # until now: `openappa-rs`'s own tests ran on every PR and skipped every
  # assertion, because they gate on a database URL nothing set.
  #
  # `test-database.cjs` now throws instead of skipping when CI is set, so if
  # this service ever stops being reachable the suite goes red rather than
  # quietly passing again.
  openappa-native-tests:
    name: OpenAPPA Native Tests
    # Release bumps need the real runtime/ledger checks before human review.
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'openappa-archestra-updater[bot]' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'chore/openappa-v'))
    runs-on: ubicloud-standard-8-ubuntu-2404
    # The napi build dominates: ~3 min cold, an incremental no-op against the
    # warm cargo cache the backend shards maintain.
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./platform
    env:
      TURBO_TOKEN: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBOREPO_REMOTE_CACHING_TEAM }}
    services:
      # The ledger tables belong to Archestra's Drizzle migrations, so this is a
      # plain server that the migration step below populates — not a fixture.
      postgres:
        # pgvector, not plain postgres: Archestra's migrations create the
        # vector extension, and a stock image fails the migration step. Same
        # image family the benchmark job uses, digest-pinned because the zizmor
        # audit rejects a floating container tag.
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: archestra
          POSTGRES_PASSWORD: archestra_ci_password
          POSTGRES_DB: archestra_openappa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archestra -d archestra_openappa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup environment
        uses: $/.github/actions/setup-env
        with:
          working-directory: ./platform

      # Read-only restore of the entry the backend shards maintain: same
      # workspace, same shared-key, so the crate build is an incremental no-op
      # without this job racing the shards to save.
      - name: Cache cargo registry and target
        uses: $/.github/actions/setup-rust-build
        with:
          workspaces: platform/archestra-rs
          shared-key: backend-unit-tests
          save-if: "false"

      - name: Apply Archestra migrations to the test database
        env:
          ARCHESTRA_DATABASE_URL: postgresql://archestra:archestra_ci_password@localhost:5432/archestra_openappa_test
        run: pnpm --dir backend db:migrate

      - name: Real PostgreSQL recording replacement tests
        working-directory: ./platform/backend
        env:
          NODE_ENV: test
          ARCHESTRA_DATABASE_POOL_MAX: "16"
          ARCHESTRA_DATABASE_URL: postgresql://archestra:archestra_ci_password@localhost:5432/archestra_openappa_test
        run: pnpm test:agent-transcripts:postgres

      - name: Build the native addon
        run: pnpm exec turbo build --filter=@archestra/openappa-rs

      # Invoked directly rather than through `turbo check:ci`: that task is
      # cacheable, and a cache hit would replay its logs and run nothing.
      #
      # The URL carries no query string — the runtime's PostgreSQL driver
      # rejects the `?schema=public` that ARCHESTRA_DATABASE_URL uses.
      - name: Native runtime and PostgreSQL ledger tests
        env:
          ARCHESTRA_OPENAPPA_TEST_DATABASE_URL: postgresql://archestra:archestra_ci_password@localhost:5432/archestra_openappa_test
        run: pnpm --filter @archestra/openappa-rs test

  ai-labs-rust-checks:
    name: AI Labs Rust Checks
    needs: supply-chain-policy
    if: github.event_name == 'merge_group'
    # mac-mini routing (see comment above platform-rust-checks)
    runs-on: ${{ github.event_name == 'merge_group' && vars.MAC_MINI_CI == 'on' && fromJSON('["self-hosted", "mac-mini-1"]') || 'ubicloud-standard-8-ubuntu-2404' }} # zizmor: ignore[self-hosted-runner] merge-queue only, behind the MAC_MINI_CI kill switch.
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./ai-labs
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # See the cache note in platform-rust-checks.
      - name: Cache cargo registry and target
        uses: $/.github/actions/setup-rust-build
        with:
          workspaces: ai-labs
          shared-key: ai-labs-rust-checks
          cache: ${{ runner.os == 'Linux' }}
          toolchain-before-cache: "true"

      - name: Install uv
        uses: $/.github/actions/setup-uv

      # The Node renderer is the second implementation of the analyzer's
      # persisted triage format. Its golden fixture must remain byte-identical
      # with the Rust analyzer tests below; it has no package dependencies.
      - name: Set up Node.js for triage parity
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      - name: Run Node triage parity test
        run: node --test ../.agents/skills/archestra-dev-bench-analysis/bin/render-triage.test.mjs

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Rust check
        run: cargo check --workspace --locked

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

  # Decides whether the queued merge group can change a backend unit test
  # result. merge_group events do not support `paths:` filters, so this diffs
  # the group's base and head commits itself. Deliberately a SKIP list, not a
  # run list: the shards are skipped only when every changed file sits under a
  # path the backend suite never reads (frontend, docs prose, e2e specs, the
  # MCP catalog, ai-labs, agent instructions). Anything else — backend,
  # shared, archestra-rs, lockfiles, Dockerfiles, helm, .github, the e2e
  # fixtures the backend tests import (e2e-tests/fixtures/**), and
  # docs/openapi.json, which the codegen writes — runs them.
  backend-test-inputs:
    name: Detect Backend Test Inputs
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Required to checkout the repository and fetch the merge group base.
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # The token is passed to this one git command only (private mirrors need
      # it to fetch), never written to .git/config. A depth-1 fetch is enough:
      # diffing two commits only needs their trees, not shared history.
      - name: Diff merge group against its base
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          git -c credential.helper= \
              -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
              fetch --depth=1 origin "${BASE_SHA}"
          changed=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          run=false
          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            case "${file}" in
              docs/openapi.json | platform/e2e-tests/fixtures/*)
                ;;
              platform/frontend/* | platform/e2e-tests/* | docs/* | mcp-catalog/* | ai-labs/* | .agents/* | .claude/* | .codex/*)
                continue
                ;;
            esac
            echo "Backend test input changed: ${file}"
            run=true
            break
          done <<< "${changed}"
          if [ "${run}" = "false" ]; then
            echo "No backend test inputs changed; backend unit test shards will be skipped."
          fi
          echo "run=${run}" >> "${GITHUB_OUTPUT}"

  # Restore/build native dependencies once before allocating test shards.
  # Use the same Ubicloud image as the main-branch native cache publisher;
  # a cold cache must not compile the same four addons on every shard.
  # Keep this on Ubuntu 24.04 x64, matching the consumers' glibc/architecture.
  backend-test-dependencies:
    name: Prepare Backend Test Dependencies
    needs: [backend-test-inputs]
    if: github.event_name == 'merge_group' && needs.backend-test-inputs.outputs.run == 'true'
    runs-on: ubicloud-standard-8-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.bundle.outputs.artifact-name }}
    defaults:
      run:
        working-directory: ./platform
    env:
      TURBO_TOKEN: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBOREPO_REMOTE_CACHING_TEAM }}
    services:
      # One disposable database for the usage-limits suite, not one per shard.
      # Same digest-pinned pgvector image as the native ledger job: migrations
      # create the vector extension, and a stock postgres image fails that step.
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: archestra
          POSTGRES_PASSWORD: archestra_ci_password
          POSTGRES_DB: archestra_limits_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archestra -d archestra_limits_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup environment
        uses: $/.github/actions/setup-env
        with:
          working-directory: ./platform

      - name: Restore backend NAPI binaries
        id: native-cache
        uses: $/.github/actions/cache-backend-napi

      - name: Cache cargo registry and target on native cache miss
        if: steps.native-cache.outputs.usable != 'true'
        uses: $/.github/actions/setup-rust-build
        with:
          workspaces: platform/archestra-rs
          shared-key: backend-unit-tests

      - name: Build backend workspace dependencies
        if: steps.native-cache.outputs.usable != 'true'
        run: |
          pnpm exec turbo build --filter="@backend^..." || {
            echo "Build failed — syncing pinned Rust toolchain and retrying once..."
            rustup show
            pnpm exec turbo build --filter="@backend^..."
          }

      - name: Verify native addons and pack shard dependencies
        id: bundle
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node ../.github/scripts/verify-backend-napi.cjs
          tar -czf /tmp/backend-test-napi.tar.gz \
            archestra-rs/{app-runtime-rs,sandbox-rs,image-rs,openappa-rs}/index.linux-x64-gnu.node
          echo "artifact-name=backend-test-napi-${RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      # A same-run artifact works even on a cold cache. Merge-group cache
      # entries are scoped to their queue ref and cannot warm the next group.
      - name: Share native addons with all shards
        uses: $/.github/actions/github-upload-artifact
        with:
          name: ${{ steps.bundle.outputs.artifact-name }}
          path: /tmp/backend-test-napi.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # After native addons are restored or built. Direct script invocation, not
      # a cacheable turbo task: a cache hit would replay logs and run nothing.
      # Failure fails this job, which the shard gate requires to be success.
      - name: Migrate usage-limits test database
        env:
          ARCHESTRA_DATABASE_URL: postgresql://archestra:archestra_ci_password@localhost:5432/archestra_limits_test
        run: pnpm --dir backend db:migrate

      - name: Real PostgreSQL usage-limits tests
        working-directory: ./platform/backend
        env:
          NODE_ENV: test
          ARCHESTRA_DATABASE_POOL_MAX: "16"
          ARCHESTRA_LLM_LIMITS_TEST_DATABASE_URL: postgresql://archestra:archestra_ci_password@localhost:5432/archestra_limits_test
        run: pnpm test:llm-limits:postgres

  # Backend unit tests, sharded across parallel runners. Vitest's --shard
  # slices the file list deterministically (SHA1 of each path), so the
  # two jobs partition the suite exactly once. This trades about four minutes
  # of test-gate latency for much lower runner usage than the eight-job layout.
  backend-unit-tests:
    name: Backend Unit Tests (shard ${{ matrix.shard }}/2)
    needs: [backend-test-inputs, backend-test-dependencies]
    if: github.event_name == 'merge_group' && needs.backend-test-inputs.outputs.run == 'true'
    runs-on: ubicloud-standard-16-ubuntu-2404
    # A merge-queue shard can take about 15 minutes, including setup and
    # cleanup. Leave room for cold caches while bounding hung test workers.
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./platform
    strategy:
      # A failing shard must not cancel its siblings; we want the full
      # failure picture in one pass.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup environment
        uses: $/.github/actions/setup-env
        with:
          working-directory: ./platform

      - name: Ensure Zsh and PowerShell for shell runtime tests
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zsh
          fi
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "::error::PowerShell is required so shell runtime tests cannot skip."
            exit 1
          fi
          pwsh -NoProfile -Command 'Write-Output $PSVersionTable.PSVersion'

      - name: Download prepared native addons
        uses: $/.github/actions/github-download-artifact
        with:
          # Use the producer's attempt, including a partial rerun that keeps
          # successful preparation from the previous attempt.
          name: ${{ needs.backend-test-dependencies.outputs.artifact-name }}
          path: /tmp

      - name: Load and verify prepared native addons
        run: |
          tar -xzf /tmp/backend-test-napi.tar.gz
          node ../.github/scripts/verify-backend-napi.cjs

      # Vitest uses its results cache to schedule historically slow files
      # first. Persist one cache per shard so fresh runners keep that balancing
      # data without mixing partial result sets across the matrix.
      - name: Cache Vitest timing data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: platform/backend/node_modules/.vite/vitest
          key: backend-vitest-${{ runner.os }}-node24-shard-${{ matrix.shard }}-${{ hashFiles('platform/pnpm-lock.yaml', 'platform/backend/vitest.config.ts', 'platform/backend/src/**/*.test.ts') }}
          restore-keys: |
            backend-vitest-${{ runner.os }}-node24-shard-${{ matrix.shard }}-

      # Node's compile cache persists V8 bytecode for the large module graph
      # that every Vitest fork imports. A same-host 2,616-test shard improved
      # from 312.95s cold to 278.36s warm (-11%). Node validates cached code by
      # content; the source hash bounds stale entries and the restore prefix
      # lets the next commit reuse bytecode for unchanged modules.
      - name: Cache Node compile data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/node-compile-cache
          key: backend-node-compile-${{ runner.os }}-${{ runner.arch }}-node24-shard-${{ matrix.shard }}-${{ hashFiles('platform/pnpm-lock.yaml', 'platform/backend/vitest.config.ts', 'platform/backend/src/**/*.ts') }}
          restore-keys: |
            backend-node-compile-${{ runner.os }}-${{ runner.arch }}-node24-shard-${{ matrix.shard }}-

      - name: Run backend unit tests (shard ${{ matrix.shard }} of 2)
        working-directory: ./platform/backend
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
          SHARD: ${{ matrix.shard }}
        run: pnpm exec vitest run --shard="${SHARD}/2"

  # Stable-named gate over the shard matrix so branch protection / merge queue
  # can require a single check ("Backend Unit Tests") regardless of shard count.
  backend-unit-tests-gate:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    # Skip under the required name on PRs. On merge_group, always() makes
    # failed, cancelled, or skipped shards turn the gate red — except shards
    # skipped because the input check found no backend changes.
    if: always() && github.event_name == 'merge_group'
    needs: [backend-test-inputs, backend-test-dependencies, backend-unit-tests]
    permissions: {}
    steps:
      - name: Check shard results
        env:
          INPUTS_RESULT: ${{ needs.backend-test-inputs.result }}
          RUN_SHARDS: ${{ needs.backend-test-inputs.outputs.run }}
          DEPENDENCIES_RESULT: ${{ needs.backend-test-dependencies.result }}
          SHARDS_RESULT: ${{ needs.backend-unit-tests.result }}
        run: |
          # A failed or cancelled input check never licenses a skip.
          if [ "$INPUTS_RESULT" != "success" ]; then
            echo "::error::Backend test input detection did not succeed (result: $INPUTS_RESULT)."
            exit 1
          fi
          if [ "$RUN_SHARDS" = "false" ] && [ "$DEPENDENCIES_RESULT" = "skipped" ] && [ "$SHARDS_RESULT" = "skipped" ]; then
            echo "✅ No backend test inputs changed in this merge group; shards skipped."
            exit 0
          fi
          if [ "$RUN_SHARDS" != "true" ] || [ "$DEPENDENCIES_RESULT" != "success" ] || [ "$SHARDS_RESULT" != "success" ]; then
            echo "::error::Backend test preparation or shards did not succeed (preparation: $DEPENDENCIES_RESULT, shards: $SHARDS_RESULT)."
            exit 1
          fi
          echo "✅ All backend unit test shards passed."

  frontend-integration-tests:
    name: Frontend Integration Tests (MSW runner)
    if: github.event_name == 'merge_group'
    # mac-mini routing (see comment above platform-rust-checks)
    runs-on: ${{ github.event_name == 'merge_group' && vars.MAC_MINI_CI == 'on' && fromJSON('["self-hosted", "mac-mini-1"]') || 'ubicloud-standard-16-ubuntu-2404' }} # zizmor: ignore[self-hosted-runner] merge-queue only, behind the MAC_MINI_CI kill switch.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./platform
    env:
      TURBO_TOKEN: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBOREPO_REMOTE_CACHING_TEAM }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup environment
        uses: $/.github/actions/setup-env
        with:
          working-directory: ./platform

      - name: Resolve Playwright version
        id: pw-version
        run: |
          version=$(pnpm --filter @frontend exec playwright --version | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        # The mac mini keeps its browser cache on the persistent disk instead.
        if: runner.os == 'Linux'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      # apt mirror outages must not fail the job when the runner image already
      # carries Chromium's system libraries: retry install-deps, then prove the
      # browser launches instead of trusting apt's exit code.
      - name: Install Chromium for Playwright
        if: runner.os == 'Linux' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          pnpm --filter @frontend exec playwright install chromium
          for attempt in 1 2 3; do
            if pnpm --filter @frontend exec playwright install-deps chromium; then
              exit 0
            fi
            echo "install-deps attempt ${attempt} failed; retrying in 20s"
            sleep 20
          done
          echo "install-deps failed; verifying Chromium launches with existing system libraries"
          pnpm --filter @frontend exec playwright screenshot --browser chromium about:blank /tmp/chromium-deps-check.png

      - name: Install Chromium system dependencies
        if: runner.os == 'Linux' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @frontend exec playwright install-deps chromium; then
              exit 0
            fi
            echo "install-deps attempt ${attempt} failed; retrying in 20s"
            sleep 20
          done
          echo "install-deps failed; verifying Chromium launches with existing system libraries"
          pnpm --filter @frontend exec playwright screenshot --browser chromium about:blank /tmp/chromium-deps-check.png

      - name: Install Chromium (macOS)
        # No system deps to install on macOS; a version already present in
        # ~/Library/Caches/ms-playwright makes this a fast no-op.
        if: runner.os == 'macOS'
        run: pnpm --filter @frontend exec playwright install chromium

      # Reuse compiler caches, but regenerate route manifests and server output
      # on each run. Restoring whole dev dist directories can retain stale route
      # state and return 404 for routes that exist in the current source tree.
      # Fresh Linux queue refs cannot reuse these multi-gigabyte archives.
      # Keep persistent macOS runners on their existing cache policy.
      - name: Cache integration test compiler output
        if: runner.os != 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: platform/frontend/.next-pw-shard-*/dev/cache
          key: frontend-integration-next-${{ runner.os }}-compiler-v2-${{ hashFiles('platform/pnpm-lock.yaml', 'platform/frontend/src/**', 'platform/frontend/*.ts', 'platform/frontend/*.mjs', 'platform/frontend/*.json') }}
          restore-keys: |
            frontend-integration-next-${{ runner.os }}-compiler-v2-

      - name: Reap stale MSW webServers
        # Three runner slots share this machine (mac-mini-1, -1-2, -1-3), so
        # cancelled merge-queue runs can leave `next dev` processes behind.
        # Each shard below picks its own free port, so stale servers cannot
        # collide, but reaping old ones keeps the shared host's memory bounded.
        if: runner.os == 'macOS'
        run: |
          for pid in $(pgrep -f "next dev -H 127.0.0.1" || true); do
            age=$(ps -o etime= -p "$pid" | tr -d ' ') || continue
            case "$age" in
              *-*|*:*:*) echo "Reaping orphaned webServer $pid (age $age)"; kill -9 "$pid" || true ;;
            esac
          done

      - name: Run integration tests
        shell: bash
        run: |
          set -euo pipefail
          shard_count=4
          pids=()
          for shard in $(seq 1 "$shard_count"); do
            # Three macOS runner slots share one host. Derive non-overlapping
            # ports from the run/attempt/shard instead of discovering a free
            # port and racing another process to bind it after the probe closes.
            port=$((20000 + ((GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT * 97) % 7000) * shard_count + shard))
            echo "Starting frontend integration shard ${shard}/${shard_count} on port ${port}"
            # Playwright writes its config transform cache with plain,
            # non-atomic writes. Shards that start together and share one cache
            # can load a half-written file and die with "SyntaxError: Unexpected
            # end of input" before running a test, so each shard gets its own.
            PWTEST_CACHE_DIR="${RUNNER_TEMP}/playwright-transform-cache-${shard}" \
              ARCHESTRA_FRONTEND_INT_TESTS_PORT="$port" \
              ARCHESTRA_FRONTEND_INT_TESTS_SHARD="$shard" \
              pnpm --filter @frontend exec playwright test --shard="${shard}/${shard_count}" &
            pids+=("$!")
          done

          status=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              status=1
            fi
          done
          exit "$status"

      - name: Upload Playwright report
        if: failure()
        uses: $/.github/actions/github-upload-artifact
        with:
          name: playwright-integration-report
          path: platform/frontend/playwright-report-shard-*/
          retention-days: "7"

      - name: Upload traces
        if: failure()
        uses: $/.github/actions/github-upload-artifact
        with:
          name: playwright-integration-traces
          path: platform/frontend/test-results-shard-*/
          retention-days: "7"

  # Keep the existing required check name stable. The gate fails if the
  # integration runner fails or is cancelled.
  frontend-integration-tests-gate:
    name: Frontend Integration Tests (MSW)
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'merge_group'
    needs: [frontend-integration-tests]
    permissions: {}
    steps:
      - name: Check integration test results
        env:
          TESTS_RESULT: ${{ needs.frontend-integration-tests.result }}
        run: |
          if [ "$TESTS_RESULT" != "success" ]; then
            echo "::error::Frontend integration tests failed (result: $TESTS_RESULT)."
            exit 1
          fi
          echo "Frontend integration tests passed."

  # Fallback for the mac-mini routing above: GitHub has no queue timeout for
  # self-hosted runners, so if mac-mini-1 dies, its jobs would sit queued (and
  # block the merge queue) for up to 24h. This watchdog polls this run's own
  # jobs; if no mac-mini job has made ANY progress within the grace window it
  # flips the MAC_MINI_CI kill switch off and cancels this run so the merge
  # queue ejects the PR immediately. Re-queueing uses the hosted fallback
  # runners (GitHub for Rust checks, Ubicloud for frontend). Re-enable with:
  # gh variable set MAC_MINI_CI --body on
  mac-mini-watchdog:
    name: Mac Mini Watchdog
    if: github.event_name == 'merge_group' && vars.MAC_MINI_CI == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: write # Required to cancel this workflow run on failover.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # The kill switch is a repo Actions variable; GITHUB_TOKEN cannot write
      # variables, so borrow the app already used for the RELEASE_FREEZE
      # variable (it has actions_variables:write).
      - name: Generate token for the kill switch
        id: generate-token
        uses: archestra-ai/.github/actions/github-app-token@840a8b2c85a9deb01869cc956c9c77fbf50ccd68 # v1.1.0
        with:
          app-id: ${{ secrets.ARCHESTRA_RELEASE_FREEZE_CHECKER_GITHUB_APP_ID }}
          private-key: ${{ secrets.ARCHESTRA_RELEASE_FREEZE_CHECKER_GITHUB_APP_PRIVATE_KEY }}

      - name: Fail over to hosted runners if mac-mini-1 shows no progress
        env:
          GH_TOKEN: ${{ github.token }}
          VAR_TOKEN: ${{ steps.generate-token.outputs.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          # Grace window: a healthy, idle machine picks queued jobs up within
          # seconds, and "picked up" (in_progress) already counts as progress.
          # The merge queue runs several stacked groups concurrently and every
          # group carries this watchdog, so before declaring the machine dead
          # we must rule out "alive but busy with another group's jobs":
          # a mini job executing in ANY in-progress run of this workflow means
          # the machine is fine and this run's jobs are just queued behind it.
          deadline=$((SECONDS + 360))
          while [ "$SECONDS" -lt "$deadline" ]; do
            jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '[.jobs[] | select((.labels // []) | index("mac-mini-1"))]')
            total=$(echo "$jobs" | jq 'length')
            progressed=$(echo "$jobs" | jq '[.[] | select(.status != "queued")] | length')
            if [ "$total" -eq 0 ] || [ "$progressed" -gt 0 ]; then
              echo "mac-mini-1 is alive ($progressed/$total routed jobs progressed)."
              exit 0
            fi
            busy_elsewhere=$(gh api "repos/$REPO/actions/workflows/on-pull-requests.yml/runs?status=in_progress&per_page=10" \
              --jq '.workflow_runs[].id' 2>/dev/null | while read -r rid; do
                [ "$rid" = "$RUN_ID" ] && continue
                gh api "repos/$REPO/actions/runs/$rid/jobs?per_page=100" \
                  --jq '.jobs[] | select(.status == "in_progress") | select((.runner_name // "") | startswith("mac-mini")) | .id' 2>/dev/null
              done | wc -l | tr -d ' ')
            if [ "${busy_elsewhere:-0}" -gt 0 ]; then
              echo "mac-mini-1 is alive: executing $busy_elsewhere job(s) for other runs; ours are queued behind them."
              exit 0
            fi
            echo "Waiting: $total mac-mini jobs queued, none progressed, machine idle elsewhere..."
            sleep 20
          done
          echo "::error::mac-mini-1 accepted no jobs within the grace window and is executing nothing anywhere. Disabling MAC_MINI_CI and cancelling this run — re-queue to use hosted fallback runners. Re-enable with: gh variable set MAC_MINI_CI --body on"
          GH_TOKEN="$VAR_TOKEN" gh variable set MAC_MINI_CI --body off --repo "$REPO" \
            || echo "::warning::Could not flip MAC_MINI_CI — flip it manually before re-queueing."
          gh run cancel "$RUN_ID" --repo "$REPO"
          # Give the cancellation time to land; exit 1 is only reached if it
          # didn't, so the run still turns red instead of hanging.
          sleep 120
          exit 1

  helm-chart-linting-and-tests:
    name: Helm Chart Linting and Tests
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the repository and lint/package the Helm chart.
    defaults:
      run:
        working-directory: ./platform/helm/archestra
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Linting
        run: helm lint .

      - name: Tests
        run: |
          HELM_UNITTEST_VERSION="1.0.3"
          HELM_UNITTEST_ARCHIVE="helm-unittest-linux-amd64-${HELM_UNITTEST_VERSION}.tgz"
          HELM_UNITTEST_BASE_URL="https://github.com/helm-unittest/helm-unittest/releases/download/v${HELM_UNITTEST_VERSION}"
          curl -fsSL -o /tmp/helm-unittest-checksum.sha "${HELM_UNITTEST_BASE_URL}/helm-unittest-checksum.sha"
          curl -fsSL -o "/tmp/${HELM_UNITTEST_ARCHIVE}" "${HELM_UNITTEST_BASE_URL}/${HELM_UNITTEST_ARCHIVE}"
          (
            cd /tmp
            awk -v archive="${HELM_UNITTEST_ARCHIVE}" '
              $2 ~ ("/" archive "$") {
                print $1 " *" archive
              }
            ' helm-unittest-checksum.sha | sha256sum -c -
          )
          HELM_UNITTEST_EXTRACT_DIR="$(mktemp -d)"
          HELM_PLUGINS_DIR="$(helm env HELM_PLUGINS)"
          mkdir -p "${HELM_PLUGINS_DIR}/unittest"
          tar -xzf "/tmp/${HELM_UNITTEST_ARCHIVE}" -C "${HELM_UNITTEST_EXTRACT_DIR}"
          cp -R "${HELM_UNITTEST_EXTRACT_DIR}/." "${HELM_PLUGINS_DIR}/unittest"
          helm unittest .

      - name: helm package
        # NOTE: can't use ${{ github.sha }} for version here because it's not a valid version number
        # and helm package explicitly checks this.
        run: |
          helm package . --version v0.0.1 --app-version v0.0.1
