name: Backend ARM Cost Trial

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  backend-arm-trial:
    name: Backend Unit Tests (16-vCPU ARM trial, shard 7/8)
    if: github.event.pull_request.head.ref == 'perf/one-shard-backend-tests'
    runs-on: blacksmith-16vcpu-ubuntu-2404-arm
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./platform
    env:
      TURBO_TOKEN: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBOREPO_REMOTE_CACHING_TEAM }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          working-directory: ./platform

      - name: Ensure Zsh for shell startup tests
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zsh
          fi

      # The NAPI package builds are deliberately uncacheable in turbo
      # (turbo.json sets cache:false on them — the .node artifacts are
      # platform-specific and the remote cache is shared with dev machines),
      # so every shard really compiles the three Rust crates: measured at
      # 2m30s-3m22s per shard on a cold 4vcpu runner. A warm cargo target
      # dir turns that into an incremental no-op. All eight shards restore
      # the same entry (shared-key); only shard 1 saves. Fresh PR branches
      # restore the entry maintained by the warm-backend-build-cache job on
      # main pushes (Actions caches only flow down from the default branch).
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: platform/archestra-rs
          shared-key: backend-unit-tests
          save-if: "false"

      # Vitest uses its results cache to schedule historically slow files
      # first. Persist one cache per shard so fresh runners keep that balancing
      # data without mixing partial result sets across the matrix.
      - name: Cache Vitest timing data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: platform/backend/node_modules/.vite/vitest
          key: backend-vitest-${{ runner.os }}-node24-shard-7-${{ hashFiles('platform/pnpm-lock.yaml', 'platform/backend/vitest.config.ts', 'platform/backend/src/**/*.test.ts') }}
          restore-keys: |
            backend-vitest-${{ runner.os }}-node24-shard-7-

      # Node's compile cache persists V8 bytecode for the large module graph
      # that every Vitest fork imports. A same-host 2,616-test shard improved
      # from 312.95s cold to 278.36s warm (-11%). Node validates cached code by
      # content; the source hash bounds stale entries and the restore prefix
      # lets the next commit reuse bytecode for unchanged modules.
      - name: Cache Node compile data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/node-compile-cache
          key: backend-node-compile-${{ runner.os }}-${{ runner.arch }}-node24-shard-7-${{ hashFiles('platform/pnpm-lock.yaml', 'platform/backend/vitest.config.ts', 'platform/backend/src/**/*.ts') }}
          restore-keys: |
            backend-node-compile-${{ runner.os }}-${{ runner.arch }}-node24-shard-7-

      # Tests load the Rust NAPI bindings (@archestra/app-runtime-rs etc.),
      # which `turbo check:ci` builds implicitly via the task graph. Running
      # vitest directly skips that, so build backend's workspace deps here.
      # turbo's parallel crate builds each trigger a concurrent rustup
      # download of the same pinned toolchain on a cold runner, which races
      # and fails with "could not rename downloaded file" — so on failure,
      # sync the toolchain serially and retry once.
      - name: Build backend workspace dependencies
        run: |
          pnpm exec turbo build --filter="@backend^..." || {
            echo "Build failed — syncing pinned Rust toolchain and retrying once..."
            rustup show
            pnpm exec turbo build --filter="@backend^..."
          }

      - name: Run backend unit tests (shard 7 of 8)
        working-directory: ./platform/backend
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
          SHARD: "7"
        run: pnpm exec vitest run --shard="${SHARD}/8"
