name: Build Playwright MCP Docker Image

# The built-in browser uses this release-versioned wrapper around Microsoft's
# immutable MCP image and the patched official Node binary. PRs validate both
# architectures without publishing; existing release/dev credentials publish it.
on:
  workflow_call:
    inputs:
      push_to_gcr:
        description: "Whether to push the built image to GCR"
        required: true
        type: boolean
      version:
        description: "Version tag for the Docker image"
        required: true
        type: string
      checkout_ref:
        description: "Optional ref to checkout when building the image"
        required: false
        type: string
        default: ""
      reuse_from_version:
        description: "Previous main SHA whose image may be reused when inputs are unchanged"
        required: false
        type: string
        default: ""
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER:
        required: false
      GCP_SERVICE_ACCOUNT_NAME:
        required: false
  pull_request:
    paths:
      - "platform/docker_images/playwright_mcp/**"
      - ".github/workflows/build-playwright-mcp-docker-image.yml"
      - "platform/backend/scripts/update-playwright-mcp*"
      - "platform/backend/src/database/seed.ts"

permissions: {}

concurrency:
  group: build-playwright-mcp-docker-image-${{ inputs.version || github.event.pull_request.number || github.ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # workflow_call path (release-please / deploy-dev): callers always pass a
  # version, so gate on it — `github.event_name` is the CALLER's event here and
  # can itself be pull_request (deploy-dev's label trigger).
  build-playwright-mcp-image:
    name: Build Playwright MCP Image
    if: ${{ inputs.version != '' }}
    permissions:
      contents: read # Required to checkout the repository and build the image.
      id-token: write # Required for Workload Identity Federation when pushing images.
    uses: $/.github/workflows/build-native-multi-arch-image.yml
    with:
      image_directory: ./platform/docker_images/playwright_mcp
      dockerfile: ./platform/docker_images/playwright_mcp/Dockerfile
      image_name: playwright-mcp
      image_registry: europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public
      version: ${{ inputs.version }}
      push_image: ${{ inputs.push_to_gcr }}
      auth_provider: gar
      checkout_ref: ${{ inputs.checkout_ref }}
      reuse_from_version: ${{ inputs.reuse_from_version }}
      reuse_paths: '["platform/docker_images/playwright_mcp", ".github/workflows/build-playwright-mcp-docker-image.yml"]'
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      GCP_SERVICE_ACCOUNT_NAME: ${{ secrets.GCP_SERVICE_ACCOUNT_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}

  # Direct pull_request path: build-only validation, never pushes. A plain
  # native build and smoke test per architecture instead of the publisher, because
  # that workflow's jobs request `id-token: write`, which fork PRs are not
  # allowed and which would fail the run.
  validate-playwright-mcp-image:
    name: Validate Playwright MCP (${{ matrix.architecture }})
    if: ${{ inputs.version == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # Required to checkout the repository and build the image.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build Playwright MCP image
        uses: $/.github/actions/build-docker-image
        with:
          context: ./platform/docker_images/playwright_mcp
          dockerfile: ./platform/docker_images/playwright_mcp/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          push: "false"
          load: "true"
          tags: playwright-mcp:${{ github.sha }}
          # Read-only: the publish paths own cache export for this image.
          cache-from: type=registry,ref=europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public/playwright-mcp:buildcache-${{ matrix.architecture }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Check immutable inputs and exercise browser MCP
        env:
          IMAGE: playwright-mcp:${{ github.sha }}
        run: |
          node --test platform/backend/scripts/update-playwright-mcp.test.mjs
          node platform/backend/scripts/update-playwright-mcp.mjs --check
          node platform/docker_images/playwright_mcp/smoke-test.mjs "$IMAGE"

      - name: Scan browser image with existing CVE policy
        if: ${{ github.event.pull_request.head.repo.fork == false }}
        uses: $/.github/actions/scan-docker-image
        with:
          image: playwright-mcp:${{ github.sha }}
          platform: linux/${{ matrix.architecture }}
          dockerhub-user: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}
          exit-code: "true"
