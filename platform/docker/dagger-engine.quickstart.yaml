# Dagger Engine for the quickstart image's embedded KinD cluster.
#
# The backend provisions engines in code for real deployments; the quickstart
# instead runs this one engine and points the backend at it through
# ARCHESTRA_CODE_RUNTIME_DAGGER_RUNNER_HOST (the bring-your-own path), because a
# demo container should not wait on an engine being provisioned at first use.
#
# Laptop-sized so the embedded KinD node can schedule it. kube-pod:// transport
# needs no Service or TCP listener. The engine image tag is kept in step with the
# dagger-sdk crate and the Dockerfile CLI by scripts/check-dagger-version-sync.sh.
#
# DO NOT EDIT the image tag by hand — bump it with the rest of the Dagger version.
---
# Source: archestra-dagger-runtime/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dagger-runtime
  namespace: default
  labels:
    helm.sh/chart: archestra-dagger-runtime-0.2.0
    app.kubernetes.io/name: archestra-dagger-runtime
    app.kubernetes.io/instance: dagger-runtime
    app.kubernetes.io/version: "0.21.7"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: archestra
automountServiceAccountToken: false

---
# Source: archestra-dagger-runtime/charts/dagger/templates/engine-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: dagger-runtime-engine-config
  namespace: default
  labels:
    helm.sh/chart: dagger-0.21.7
    app.kubernetes.io/name: dagger
    app.kubernetes.io/instance: dagger-runtime
    app.kubernetes.io/version: v0.21.7
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: dagger
data:
  engine.json: |
    {
      "logLevel": "info",
      "security": {
        "insecureRootCapabilities": false
      },
      "gc": {
        "maxUsedSpace": "40GB",
        "reservedSpace": "5GB",
        "minFreeSpace": "20%"
      }
    }
    
---
# Source: archestra-dagger-runtime/charts/dagger/templates/engine-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dagger-runtime-engine
  namespace: default
  labels:
    helm.sh/chart: dagger-0.21.7
    app.kubernetes.io/name: dagger
    app.kubernetes.io/instance: dagger-runtime
    app.kubernetes.io/version: v0.21.7
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: dagger
spec:
  # DO NOT RUN MORE THAN 1 REPLICA IF USING HOSTPATH.
  # Only one (1) Engine is able to hold the lock, other replicas will not be able to start.
  # If using persistent volumes, this is not an issue. Use more than 1 replica if you know that you need it.
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      name: dagger-runtime-engine
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      annotations:
        checksum/config: 1d1b1fa423b9b17298e9f1f4044d7adb3283d154665c58a651ec92ba56abe706
      labels:
        name: dagger-runtime-engine
        helm.sh/chart: dagger-0.21.7
        app.kubernetes.io/name: dagger
        app.kubernetes.io/instance: dagger-runtime
        app.kubernetes.io/version: v0.21.7
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: dagger
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"
      serviceAccountName: dagger-runtime
      containers:
        - name: dagger-engine
          image: registry.dagger.io/engine:v0.21.7
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add:
                - ALL
          resources:
            limits:
              memory: 6Gi
            requests:
              cpu: 500m
              memory: 2Gi
          lifecycle:
          readinessProbe:
            exec:
              command:
              - sh
              - -exc
              - dagger core version
            failureThreshold: 10
            initialDelaySeconds: 5
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 14
          livenessProbe:
            exec:
              command:
              - sh
              - -exc
              - dagger core version
            failureThreshold: 20
            initialDelaySeconds: 5
            periodSeconds: 30
            successThreshold: 1
            terminationGracePeriodSeconds: 30
            timeoutSeconds: 29
          volumeMounts:
            - name: data
              mountPath: /var/lib/dagger
            - name: config
              mountPath: /etc/dagger/engine.json
              subPath: engine.json
            - mountPath: /run/dagger
              name: run
      terminationGracePeriodSeconds: 300
      volumes:
        - name: config
          configMap:
            name: dagger-runtime-engine-config
            items:
              - key: engine.json
                path: engine.json
        - emptyDir:
            medium: Memory
          name: run
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
