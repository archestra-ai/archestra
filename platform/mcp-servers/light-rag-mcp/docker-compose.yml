services:
  light-rag-mcp:
    build: .
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Storage - using host.docker.internal to reach Neo4j/Qdrant on host
      - LIGHTRAG_NEO4J_URI=${LIGHTRAG_NEO4J_URI:-bolt://host.docker.internal:7687}
      - LIGHTRAG_NEO4J_USERNAME=${LIGHTRAG_NEO4J_USERNAME:-neo4j}
      - LIGHTRAG_NEO4J_PASSWORD=${LIGHTRAG_NEO4J_PASSWORD:-password123}
      - LIGHTRAG_QDRANT_URL=${LIGHTRAG_QDRANT_URL:-http://host.docker.internal:6333}
      # LLM (required)
      - LIGHTRAG_LLM_PROVIDER=${LIGHTRAG_LLM_PROVIDER:-openai}
      - LIGHTRAG_LLM_MODEL=${LIGHTRAG_LLM_MODEL:-gpt-4o-mini}
      - LIGHTRAG_LLM_API_KEY=${LIGHTRAG_LLM_API_KEY:-}
      # Embeddings
      - LIGHTRAG_EMBEDDING_PROVIDER=${LIGHTRAG_EMBEDDING_PROVIDER:-openai}
      - LIGHTRAG_EMBEDDING_MODEL=${LIGHTRAG_EMBEDDING_MODEL:-text-embedding-3-large}
    volumes:
      - lightrag-data:/app/data
    restart: unless-stopped

volumes:
  lightrag-data:
