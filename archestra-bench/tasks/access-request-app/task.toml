[[stages]]
text = """Can you build an app called `access-request-app-{{cell}}` that lets a teammate file a request for access to one of our systems -- they pick the system, choose an access level, add a short justification, and send it off? Everyone signs in with their own account, so if someone hasn't connected theirs yet, don't drop a raw error on them -- show a friendly prompt that lets them connect and authorize first, then continue. When it validates cleanly, call submit_result with result = {"app_id": "<the app's id>", "app_name": "<the app's name>"}."""

[result_schema]
type = "object"
required = ["app_id", "app_name"]
additionalProperties = false

  [result_schema.properties.app_id]
  type = "string"
  minLength = 1

  [result_schema.properties.app_name]
  type = "string"
  minLength = 1

[state]
rest = ["/api/apps?search=access-request-app-{{cell}}&limit=100"]
