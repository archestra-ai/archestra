id = "optimization"
name = "Optimization & operations research"

[agent]
system_prompt = "You are an expert software engineer completing a benchmark task."

# The bike-rebalance skills, pinned from the SkillsBench upstream this task is vendored from.
[[skills]]
repo = "github.com/benchflow-ai/skillsbench"
path = "tasks/bike-rebalance/environment/skills"
ref = "87df9cbd82fcf07fcb0cab960a1f8435d0c415ee"
cap = 4

[[tasks]]
id = "bike-rebalance"
upstream_dir = "tasks/bike-rebalance/upstream"
result_schema_file = "tasks/bike-rebalance/result_schema.json"
max_format_attempts = 3

  [[tasks.stages]]
  instruction_file = "instruction.md"
  text = """
## Runtime environment
The input file `data.json` is available at `/home/sandbox/attachments/data.json`. Use the sandbox tools to read it and do your work. Install any packages you need following the run_command tool's guidance.

When you have your final answer, submit it by calling the `submit_result` tool with the report object as the `result` argument -- a single JSON object in exactly the format described above. Do not write a file; call `submit_result`. If the tool reports a format problem, fix it and call `submit_result` again."""

    [[tasks.stages.files]]
    upstream = "environment/data.json"
    dest = "/home/sandbox/attachments/data.json"
    mime_type = "application/json"

  [tasks.verifier]
  deps = ["pyscipopt==6.1.0", "pytest==8.4.1"]
  test_file = "tests/test_outputs.py"
  data_file = "environment/data.json"
  report_env = "BIKE_REBALANCE_REPORT"
  data_env = "BIKE_REBALANCE_DATA"
  oracle_file = "solution/solve.sh"

    [tasks.verifier.env]
    BIKE_REBALANCE_BENCHMARK_TIME_LIMIT = "600"

    [[tasks.verifier.oracle_replacements]]
    frm = "/root"
    to = "{WORKDIR}"

    [[tasks.verifier.oracle_replacements]]
    frm = "pip3 install --break-system-packages pyscipopt==6.1.0 -q"
    to = "true"
