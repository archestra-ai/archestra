name: Build Docker Image
description: |
  Build a Docker image with `docker buildx build` and registry-backed layer
  caching. Deliberately a shell invocation rather than docker/build-push-action:
  every input reaches the command through an environment variable, so no
  workflow expression ever expands into a code-executing action input
  (zizmor's template-injection remediation), and the interface stays in one
  place for all callers.

inputs:
  context:
    description: "Directory containing the Dockerfile"
    required: true
  dockerfile:
    description: "Path to Dockerfile (defaults to {context}/Dockerfile)"
    required: false
    default: ""
  push:
    description: "Whether to push the image to a registry"
    required: false
    default: "false"
  load:
    description: "Whether to load the image into the local Docker daemon"
    required: false
    default: "false"
  platforms:
    description: "Target platforms for the build (e.g., linux/amd64,linux/arm64)"
    required: false
    default: ""
  tags:
    description: "Image tags (newline or comma separated)"
    required: false
    default: ""
  outputs:
    description: "Custom --output configuration (e.g., for push-by-digest). Takes precedence over push/load."
    required: false
    default: ""
  target:
    description: "Optional Dockerfile target stage"
    required: false
    default: ""
  provenance:
    description: "SLSA provenance attestation. Empty preserves buildx defaults; set 'false' to skip for images that are not published."
    required: false
    default: ""
  sbom:
    description: "SBOM attestation configuration. Empty disables an explicit SBOM; accepts Buildx --sbom values."
    required: false
    default: ""
  version:
    description: "Version to pass as VERSION build arg"
    required: false
    default: ""
  previous-image:
    description: "Optional previously published image to extract static assets from before building"
    required: false
    default: ""
  cache-from:
    description: "External cache sources, one per line (e.g. type=registry,ref=...)"
    required: false
    default: ""
  cache-to:
    description: "Cache export destinations. Leave empty when the job has no push credentials for the cache registry (fork PRs)."
    required: false
    default: ""
  # Secrets must be passed as regular inputs in composite actions
  turbo-team:
    description: "Turborepo remote caching team"
    required: false
    default: ""
  turbo-token:
    description: "Turborepo remote caching token"
    required: false
    default: ""
  sentry-auth-token:
    description: "Sentry auth token for source map uploads (optional)"
    required: false
    default: ""
  setup-builder:
    description: "Set up a new Buildx builder; disable to reuse the current job builder"
    required: false
    default: "true"

outputs:
  digest:
    description: "Image digest"
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Ensure prev-static-assets directory exists
      shell: bash
      run: mkdir -p "${INPUT_CONTEXT}/prev-static-assets"
      env:
        INPUT_CONTEXT: ${{ inputs.context }}

    - name: Extract previous version static assets
      if: ${{ inputs.previous-image != '' }}
      shell: bash
      run: |
        echo "Pulling previous image: $INPUT_PREVIOUS_IMAGE"
        docker pull "$INPUT_PREVIOUS_IMAGE" || {
          echo "Warning: Failed to pull previous image"
          exit 0
        }

        CID=$(docker create "$INPUT_PREVIOUS_IMAGE" 2>/dev/null) || true
        if [ -n "$CID" ]; then
          echo "Extracting previous static assets from container $CID"
          docker cp "${CID}:/static-assets-source/." "${INPUT_CONTEXT}/prev-static-assets/" || echo "Warning: Failed to copy previous assets"
          docker rm "$CID"
          echo "Successfully extracted previous static assets"
        else
          echo "No previous container created, skipping asset extraction"
        fi
      env:
        INPUT_CONTEXT: ${{ inputs.context }}
        INPUT_PREVIOUS_IMAGE: ${{ inputs.previous-image }}

    - name: Setup Docker Builder
      if: ${{ inputs.setup-builder == 'true' }}
      uses: ./.github/actions/setup-docker-builder

    - name: Build Docker image
      id: build
      shell: bash
      env:
        INPUT_CONTEXT: ${{ inputs.context }}
        INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
        INPUT_PUSH: ${{ inputs.push }}
        INPUT_LOAD: ${{ inputs.load }}
        INPUT_PLATFORMS: ${{ inputs.platforms }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_OUTPUTS: ${{ inputs.outputs }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_PROVENANCE: ${{ inputs.provenance }}
        INPUT_SBOM: ${{ inputs.sbom }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_CACHE_FROM: ${{ inputs.cache-from }}
        INPUT_CACHE_TO: ${{ inputs.cache-to }}
        SECRET_TURBO_TEAM: ${{ inputs.turbo-team }}
        SECRET_TURBO_TOKEN: ${{ inputs.turbo-token }}
        SECRET_SENTRY_AUTH_TOKEN: ${{ inputs.sentry-auth-token }}
      run: |
        set -euo pipefail

        FILE="${INPUT_DOCKERFILE:-${INPUT_CONTEXT}/Dockerfile}"
        METADATA_FILE="${RUNNER_TEMP}/build-docker-image-metadata.json"

        ARGS=(
          --file "${FILE}"
          --network host
          --metadata-file "${METADATA_FILE}"
        )

        [ -n "${INPUT_PLATFORMS}" ] && ARGS+=( --platform "${INPUT_PLATFORMS}" )
        [ -n "${INPUT_TARGET}" ] && ARGS+=( --target "${INPUT_TARGET}" )
        # Cache specs contain commas, so unlike tags they must split on newlines only.
        while IFS= read -r cache_from; do
          cache_from="${cache_from#"${cache_from%%[![:space:]]*}"}"
          cache_from="${cache_from%"${cache_from##*[![:space:]]}"}"
          [ -n "${cache_from}" ] && ARGS+=( --cache-from "${cache_from}" )
        done <<< "${INPUT_CACHE_FROM}"
        [ -n "${INPUT_CACHE_TO}" ] && ARGS+=( --cache-to "${INPUT_CACHE_TO}" )
        [ -n "${INPUT_PROVENANCE}" ] && ARGS+=( --provenance "${INPUT_PROVENANCE}" )
        [ -n "${INPUT_SBOM}" ] && ARGS+=( --sbom "${INPUT_SBOM}" )
        [ -n "${INPUT_VERSION}" ] && ARGS+=( --build-arg "VERSION=${INPUT_VERSION}" )

        # Tags arrive newline- or comma-separated.
        while IFS= read -r tag; do
          tag="$(echo "${tag}" | xargs)"
          [ -n "${tag}" ] && ARGS+=( --tag "${tag}" )
        done < <(echo "${INPUT_TAGS}" | tr ',' '\n')

        # Build secrets are exposed to RUN steps via --secret env references;
        # the values never appear in the command line.
        [ -n "${SECRET_TURBO_TEAM}" ] && ARGS+=( --secret "id=turbo_team,env=SECRET_TURBO_TEAM" )
        [ -n "${SECRET_TURBO_TOKEN}" ] && ARGS+=( --secret "id=turbo_token,env=SECRET_TURBO_TOKEN" )
        [ -n "${SECRET_SENTRY_AUTH_TOKEN}" ] && ARGS+=( --secret "id=sentry_auth_token,env=SECRET_SENTRY_AUTH_TOKEN" )

        # A custom --output wins (it can encode push-by-digest / compression /
        # push=true itself); otherwise fall back to the push/load shorthands.
        if [ -n "${INPUT_OUTPUTS}" ]; then
          ARGS+=( --output "${INPUT_OUTPUTS}" )
        elif [ "${INPUT_PUSH}" = "true" ]; then
          ARGS+=( --push )
        elif [ "${INPUT_LOAD}" = "true" ]; then
          ARGS+=( --load )
        fi

        docker buildx build "${ARGS[@]}" "${INPUT_CONTEXT}"

        DIGEST=""
        if [ -f "${METADATA_FILE}" ]; then
          DIGEST=$(jq -r '."containerimage.digest" // empty' "${METADATA_FILE}")
        fi
        echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
