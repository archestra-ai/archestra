name: Docker Image Scanning

# Platform and MCP scans run here on demand when the "run-docker-scan" label
# is added to a PR. Merge-queue scans reuse the images built by
# platform-e2e-tests.yml; the p4 scan remains here because E2E does not build it.
# Remove and re-add the label to re-trigger after new commits.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  merge_group:
  workflow_dispatch:
    inputs:
      image-sha:
        description: "Exact SHA tag produced by Platform E2E (PRs use the synthetic merge SHA)"
        required: true
        type: string

permissions: {}

concurrency:
  group: "docker-image-scanning-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}"
  cancel-in-progress: true

jobs:
  # Required-check placeholders for ordinary PR updates. Trusted PRs can run
  # the real scans explicitly. Fork PRs always get the placeholder — the real
  # scan needs trusted context, and without this a labeled fork PR would run
  # neither job, leaving the required check pending.
  docker-image-scanning-placeholder:
    name: Docker Image Scanning (${{ matrix.name }})
    if: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name != 'run-docker-scan' || github.event.pull_request.head.repo.fork == true) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [Platform, MCP Server Base, p4 Shim]
    steps:
      - name: Skip full image scan on ordinary PR updates
        run: echo "Docker image scanning runs on merge queue or when the run-docker-scan label is added."

  # Platform is isolated from the generic matrix because it scans two images.
  # Attested E2E images take the fast path: Scout reads their build-time SBOMs
  # by immutable digest, so no image layers are pulled or re-indexed. A labeled
  # PR without E2E images still builds and scans both variants locally.
  docker-image-scanning-platform:
    name: Docker Image Scanning (Platform)
    if: ${{ github.event_name == 'pull_request' && github.event.label.name == 'run-docker-scan' && github.event.pull_request.head.repo.fork != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Reclaim disk space (background)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup &

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve attested E2E image digests
        id: e2e-images
        env:
          IMAGE_REPO: europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public/platform
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          full_tag="${IMAGE_REPO}:${GIT_SHA}-e2e"
          slim_tag="${IMAGE_REPO}:${GIT_SHA}-e2e-slim"

          if full_ref=$(bash .github/scripts/resolve-attested-image.sh "$full_tag") \
            && slim_ref=$(bash .github/scripts/resolve-attested-image.sh "$slim_tag"); then
            primary=$full_ref
            additional=$slim_ref
            {
              echo "primary=${primary}"
              echo "additional=${additional}"
              echo "reused=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Using byte-derived local scan for both Platform variants."
            {
              echo "primary=archestra-platform:${GIT_SHA}"
              echo "additional=archestra-platform-slim:${GIT_SHA}"
              echo "reused=false"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build full Platform image with workspace cache
        if: ${{ steps.e2e-images.outputs.reused != 'true' }}
        uses: ./.github/actions/build-docker-image
        with:
          context: ./platform
          dockerfile: ./platform/Dockerfile
          load: "true"
          tags: archestra-platform:${{ github.sha }}
          turbo-team: ${{ secrets.TURBOREPO_REMOTE_CACHING_TEAM }}
          turbo-token: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
          cache-from: |
            type=registry,ref=europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public/platform:buildcache
            type=registry,ref=europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public/platform:buildcache-amd64

      - name: Build slim Platform image with workspace cache
        if: ${{ steps.e2e-images.outputs.reused != 'true' }}
        uses: ./.github/actions/build-docker-image
        with:
          context: ./platform
          dockerfile: ./platform/Dockerfile
          target: unified-slim
          load: "true"
          tags: archestra-platform-slim:${{ github.sha }}
          setup-builder: "false"
          turbo-team: ${{ secrets.TURBOREPO_REMOTE_CACHING_TEAM }}
          turbo-token: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
          cache-from: |
            type=registry,ref=europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public/platform:buildcache
            type=registry,ref=europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public/platform:buildcache-amd64

      - name: Scan full and slim Platform images for CVEs
        uses: ./.github/actions/scan-docker-image
        with:
          image: ${{ steps.e2e-images.outputs.primary }}
          additional-images: ${{ steps.e2e-images.outputs.additional }}
          dockerhub-user: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}
          exit-code: "true"

  manual-platform-byte-scan:
    name: Manual Docker Image Scanning (Platform, byte-derived)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Scan exact full and slim Platform image bytes
        uses: ./.github/actions/scan-platform-image-bytes
        with:
          image-sha: ${{ inputs.image-sha }}
          dockerhub-user: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

  docker-image-scanning:
    name: Docker Image Scanning (${{ matrix.name }})
    # Platform and MCP merge-queue scans run after their E2E image builds in
    # platform-e2e-tests.yml. Keeping this matrix PR-only avoids duplicate
    # same-named checks that could mask a failed required scan.
    if: ${{ github.event_name == 'pull_request' && github.event.label.name == 'run-docker-scan' && github.event.pull_request.head.repo.fork != true }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # Required to checkout the repository and read Docker build inputs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MCP Server Base
            runner: ubuntu-latest
            context: ./platform/mcp_server_docker_image
            dockerfile: ./platform/mcp_server_docker_image/Dockerfile
            local-tag-prefix: mcp-server-base
            use-build-action: false
            scan-exit-code: "true"
            cache-from: type=registry,ref=europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public/mcp-server-base:buildcache
            e2e-image: europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public/mcp-server-base
            e2e-tag-suffix: ""
            e2e-slim-image: ""
            e2e-slim-tag-suffix: ""
          - name: p4 Shim
            runner: ubuntu-latest
            context: ./platform/p4_shim_docker_image
            dockerfile: ./platform/p4_shim_docker_image/Dockerfile
            local-tag-prefix: p4-shim
            use-build-action: false
            scan-exit-code: "true"
            cache-from: type=registry,ref=europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public/p4-shim:buildcache-amd64
            e2e-image: ""
            e2e-tag-suffix: ""
            e2e-slim-image: ""
            e2e-slim-tag-suffix: ""
    steps:
      # Standard runners ship ~14 GB free; drop the unused preinstalled
      # toolchains so the image build + scan never run out of disk.
      - name: Reclaim disk space (background)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup &

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Reuse exact E2E image when available
        id: e2e-image
        if: ${{ matrix.e2e-image != '' }}
        env:
          E2E_IMAGE: ${{ format('{0}:{1}{2}', matrix.e2e-image, github.sha, matrix.e2e-tag-suffix) }}
          LOCAL_IMAGE: ${{ format('{0}:{1}', matrix.local-tag-prefix, github.sha) }}
        run: |
          if docker manifest inspect "$E2E_IMAGE" >/dev/null 2>&1; then
            docker pull "$E2E_IMAGE"
            docker tag "$E2E_IMAGE" "$LOCAL_IMAGE"
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image with workspace cache
        if: ${{ matrix.use-build-action && steps.e2e-image.outputs.reused != 'true' }}
        uses: ./.github/actions/build-docker-image
        with:
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          load: "true"
          tags: ${{ format('{0}:{1}', matrix.local-tag-prefix, github.sha) }}
          turbo-team: ${{ secrets.TURBOREPO_REMOTE_CACHING_TEAM }}
          turbo-token: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
          # Read-only: E2E and native publish paths own their separate exports.
          cache-from: |
            type=registry,ref=europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public/platform:buildcache
            type=registry,ref=europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public/platform:buildcache-amd64

      - name: Build image with registry cache
        if: ${{ !matrix.use-build-action && steps.e2e-image.outputs.reused != 'true' }}
        uses: ./.github/actions/build-docker-image
        with:
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: "false"
          load: "true"
          tags: ${{ format('{0}:{1}', matrix.local-tag-prefix, github.sha) }}
          cache-from: ${{ matrix.cache-from }}

      - name: Scan image for CVEs
        uses: ./.github/actions/scan-docker-image
        with:
          image: ${{ format('{0}:{1}', matrix.local-tag-prefix, github.sha) }}
          dockerhub-user: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}
          exit-code: ${{ matrix.scan-exit-code }}

  # E2E has no p4 image to reuse, so this small scan still builds locally on
  # merge_group. Platform and MCP are deliberately absent from this job: their
  # required checks are emitted by platform-e2e-tests.yml after the exact
  # tested images are available.
  merge-queue-p4-image-scanning:
    name: Docker Image Scanning (p4 Shim)
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Reclaim disk space (background)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup &

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build p4 Shim image
        uses: ./.github/actions/build-docker-image
        with:
          context: ./platform/p4_shim_docker_image
          dockerfile: ./platform/p4_shim_docker_image/Dockerfile
          platforms: linux/amd64
          push: "false"
          load: "true"
          tags: p4-shim:${{ github.sha }}
          cache-from: type=registry,ref=europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public/p4-shim:buildcache-amd64

      - name: Scan image for CVEs
        uses: ./.github/actions/scan-docker-image
        with:
          image: p4-shim:${{ github.sha }}
          dockerhub-user: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}
          exit-code: "true"
