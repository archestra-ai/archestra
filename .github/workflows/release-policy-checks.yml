name: Release Policy Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read

jobs:
  release-policy:
    name: Release Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test release lifecycle and artifact publication
        run: python3 -m unittest discover -s .github/scripts -p 'test_release_*.py' -v

      - name: Check release branch PR policy
        run: python3 .github/scripts/release-policy.py check-pr
