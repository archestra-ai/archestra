{{- if .Values.archestra.orchestrator.kubernetes.serviceAccount.create -}}
{{- $saAnnotations := include "archestra-platform.serviceAccountAnnotations" . | fromYaml -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "archestra-platform.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
  {{- with $saAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.archestra.orchestrator.kubernetes.serviceAccount.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml .Values.archestra.orchestrator.kubernetes.serviceAccount.imagePullSecrets | nindent 2 }}
{{- end }}
{{- end }}
{{- if and .Values.archestra.orchestrator.enabled .Values.archestra.orchestrator.kubernetes.rbac.create }}
{{- $defaultRuntimeOwnerRoleName := include "archestra-platform.mcpRuntimeOwnerRoleName" . }}
{{- $runtimeOwnerRoleName := $defaultRuntimeOwnerRoleName }}
{{- if hasKey .Values.archestra.env "ARCHESTRA_ORCHESTRATOR_MCP_RUNTIME_OWNER_ROLE" }}
{{- $runtimeOwnerRoleName = trim (toString (default "" (get .Values.archestra.env "ARCHESTRA_ORCHESTRATOR_MCP_RUNTIME_OWNER_ROLE"))) }}
{{- end }}
{{- $runtimeOwnerRoleNames := list $defaultRuntimeOwnerRoleName }}
{{- if and $runtimeOwnerRoleName (ne $runtimeOwnerRoleName $defaultRuntimeOwnerRoleName) }}
{{- $runtimeOwnerRoleNames = append $runtimeOwnerRoleNames $runtimeOwnerRoleName }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "archestra-platform.mcpManagerRoleName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
rules:
{{ include "archestra-platform.mcpManagerRules" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "archestra-platform.mcpManagerRoleName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "archestra-platform.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "archestra-platform.mcpManagerRoleName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- /*
This narrow Role owns runtime resources by default and grants the platform read
access to an explicitly configured external owner. It remains during handoff so
deleting its UID cannot garbage-collect existing runtime resources.
*/}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $defaultRuntimeOwnerRoleName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
rules:
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles"]
  resourceNames: {{ $runtimeOwnerRoleNames | toJson }}
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $defaultRuntimeOwnerRoleName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "archestra-platform.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $defaultRuntimeOwnerRoleName }}
  apiGroup: rbac.authorization.k8s.io
{{- /*
Grant the platform ServiceAccount the same MCP-manager permissions in additional
namespaces (the Agent Runtime namespace, the Dagger engine namespace and the K8s namespaces backing
deployment environments). Each gets its own
namespace-scoped Role + RoleBinding; the binding's subject points back at the SA in
the release namespace. The release namespace is skipped — its Role/RoleBinding is
already created above, and re-emitting it would collide on name.
*/}}
{{- $mcpNamespace := .Values.archestra.orchestrator.kubernetes.namespace | default .Release.Namespace }}
{{- $agentRuntimeNamespace := get .Values.archestra.env "ARCHESTRA_AGENT_RUNTIME_K8S_NAMESPACE" | default .Values.archestra.orchestrator.kubernetes.agentRuntimeNamespace }}
{{- $daggerRuntimeNamespace := get .Values.archestra.env "ARCHESTRA_DAGGER_RUNTIME_K8S_NAMESPACE" | default .Values.archestra.orchestrator.kubernetes.daggerRuntimeNamespace }}
{{- $activeNamespaces := concat (list $mcpNamespace) (compact (list $agentRuntimeNamespace $daggerRuntimeNamespace)) (.Values.archestra.orchestrator.kubernetes.rbac.environmentNamespaces | default (list)) | uniq }}
{{- /* A retired namespace keeps the same Roles, so sessions there can finish and nothing is garbage-collected early. */}}
{{- $retiredNamespaces := list }}
{{- range $ns := (.Values.archestra.orchestrator.kubernetes.rbac.retiredNamespaces | default (list)) }}
{{- if not (has $ns $activeNamespaces) }}
{{- $retiredNamespaces = append $retiredNamespaces $ns }}
{{- end }}
{{- end }}
{{- $retiredNamespaces = $retiredNamespaces | uniq }}
{{- $managerNamespaces := concat $activeNamespaces $retiredNamespaces | uniq }}
{{- range $ns := $managerNamespaces }}
{{- if ne $ns $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "archestra-platform.mcpManagerRoleName" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "archestra-platform.labels" $ | nindent 4 }}
rules:
{{ include "archestra-platform.mcpManagerRules" $ }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "archestra-platform.mcpManagerRoleName" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "archestra-platform.labels" $ | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "archestra-platform.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "archestra-platform.mcpManagerRoleName" $ }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $defaultRuntimeOwnerRoleName }}
  namespace: {{ $ns }}
  labels:
    {{- include "archestra-platform.labels" $ | nindent 4 }}
rules:
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles"]
  resourceNames: {{ $runtimeOwnerRoleNames | toJson }}
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $defaultRuntimeOwnerRoleName }}
  namespace: {{ $ns }}
  labels:
    {{- include "archestra-platform.labels" $ | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "archestra-platform.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $defaultRuntimeOwnerRoleName }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
{{- /*
In a retired namespace the platform deletes the runtime owner Role once no
Agent Runtime session is left, so Kubernetes garbage-collects what it owned.
*/}}
{{- $cleanupRoleName := printf "%s-retired-namespace-cleanup" (include "archestra-platform.fullname" .) }}
{{- range $ns := $retiredNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $cleanupRoleName }}
  namespace: {{ $ns }}
  labels:
    {{- include "archestra-platform.labels" $ | nindent 4 }}
rules:
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles"]
  resourceNames: {{ $runtimeOwnerRoleNames | toJson }}
  verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $cleanupRoleName }}
  namespace: {{ $ns }}
  labels:
    {{- include "archestra-platform.labels" $ | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "archestra-platform.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $cleanupRoleName }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
