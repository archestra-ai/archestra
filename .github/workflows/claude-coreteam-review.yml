name: Claude Core Team Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  group: claude-coreteam-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude Review
    if: github.repository == 'archestra-ai/archestra'
    permissions:
      contents: read
      pull-requests: write # Publish PR review comments.
      id-token: write # Support the reusable workflow's Claude GitHub App authentication.
    uses: archestra-ai/.github/.github/workflows/claude-coreteam-review.yml@9c810e95deaf56033c4a7288c67c343e650a7b0d
    with:
      setup_repository: true
    # Organization secrets must grant access to this calling repository.
    secrets:
      ILDAR_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.ILDAR_CLAUDE_CODE_OAUTH_TOKEN }}
      JOEY_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.JOEY_CLAUDE_CODE_OAUTH_TOKEN }}
      MARK_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.MARK_CLAUDE_CODE_OAUTH_TOKEN }}
