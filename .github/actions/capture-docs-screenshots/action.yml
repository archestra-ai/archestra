name: Capture docs screenshots
description: Seed an ephemeral stack, capture screenshots, and check image policy; never publish
inputs:
  only:
    description: Optional publication subset; validation callers must omit this
    default: ""
  platform-image:
    description: Optional exact prebuilt platform image; empty keeps local build fallback
    default: ""
  mcp-server-base-image:
    description: Optional exact MCP server base image for the screenshot stack
    default: ""
runs:
  using: composite
  steps:
    - name: Setup environment
      uses: $/.github/actions/setup-env
      with:
        working-directory: ./platform

    - name: Install Chromium
      working-directory: ./platform
      shell: bash
      run: pnpm --filter @archestra/docs-screenshots exec playwright install --with-deps chromium

    - name: Check screenshot determinism helpers
      working-directory: ./platform
      shell: bash
      run: pnpm --filter @archestra/docs-screenshots exec playwright test --project=determinism

    # Reuses the platform image CI built for this tree when there is one,
    # otherwise builds it. The docs show beta features (Plugins, OpenAPPA),
    # whose routes 404 unless the beta master switch is on, and Agent
    # Runtime, which has its own switch.
    - name: Start Archestra (e2e-lite stack)
      env:
        PLATFORM_IMAGE: ${{ inputs.platform-image }}
        MCP_SERVER_BASE_IMAGE: ${{ inputs.mcp-server-base-image }}
        ARCHESTRA_BETA: "true"
        ARCHESTRA_AGENT_RUNTIME_ENABLED: "true"
      shell: bash
      run: ./platform/scripts/e2e-lite.sh up

    - name: Seed demo data and capture screenshots
      working-directory: ./platform
      env:
        ARCHESTRA_URL: http://localhost:3000
        DOCS_SCREENSHOTS_ONLY: ${{ inputs.only }}
      shell: bash
      run: pnpm docs:screenshots

    # Each failed shot leaves the page's ARIA snapshot (error-context.md),
    # enough to see what the page showed instead.
    - name: Upload capture results
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: docs-screenshots-results
        path: platform/tools/docs-screenshots/test-results
        retention-days: 7

    - name: Docs image policy
      shell: bash
      run: python3 .github/scripts/check-docs-image-policy.py

    - name: Stop Archestra
      if: always()
      shell: bash
      run: ./platform/scripts/e2e-lite.sh down
