# Separate, small VPN-only installation for recording product demos.
# Its database is its own Cloud SQL instance (infra gcp/gke/cloudsql.tf).
fullnameOverride: archestra-demo

archestra:
  replicaCount: 1
  database:
    # The pods log in as the archestra-demo-platform service account through
    # the proxy sidecar; no password exists.
    cloudSqlProxy:
      enabled: true
      instanceConnectionName: friendly-path-465518-r6:us-central1:archestra-demo-pg
  orchestrator:
    kubernetes:
      serviceAccount:
        annotations:
          iam.gke.io/gcp-service-account: archestra-demo-platform@friendly-path-465518-r6.iam.gserviceaccount.com
  worker:
    enabled: false
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      memory: "4Gi"

  env:
    ARCHESTRA_API_BASE_URL: "https://demo.archestra.dev"
    ARCHESTRA_FRONTEND_URL: "https://demo.archestra.dev"
    ARCHESTRA_CHATOPS_WEBHOOK_BASE_URL: "https://a2a-webhook-wkjbuewj5a-uc.a.run.app/demo"
    ARCHESTRA_AGENT_RUNTIME_PLATFORM_BASE_URL: "http://archestra-demo.archestra-demo.svc.cluster.local:9000"
    ARCHESTRA_MCP_SANDBOX_DOMAIN: "demo-sandbox.archestra.dev"
    ARCHESTRA_AUTH_COOKIE_DOMAIN: "demo.archestra.dev"
    # Staging's parent-domain cookies are also sent to this host; isolate names.
    ARCHESTRA_AUTH_COOKIE_PREFIX: "archestra-demo"
    # Demo users sign in with email/password and join by invitation, so
    # re-enable what values-staging-demo-shared.yaml turns off for staging.
    ARCHESTRA_AUTH_DISABLE_BASIC_AUTH: "false"
    ARCHESTRA_AUTH_DISABLE_INVITATIONS: "false"
    # TODO(before merge): replace with the value currently held in the
    # ARCHESTRA_DEMO_AUTH_ADMIN_EMAIL repository secret.
    ARCHESTRA_AUTH_ADMIN_EMAIL: "joey@archestra.ai"
    # Export audit events as OTLP logs, on their own endpoint, to the audit
    # collector that writes them to the organization's security log archive
    # (archestra-ai/infra: gcp/gke/apps/observability/audit-collector.tf).
    # Demo's other telemetry stays off.
    ARCHESTRA_AUDIT_LOG_OTEL_ENABLED: "true"
    ARCHESTRA_AUDIT_LOG_OTEL_ENDPOINT: "http://audit-collector.observability.svc.cluster.local:4318"
    # The security archive's alerts name who acted.
    ARCHESTRA_AUDIT_LOG_OTEL_INCLUDE_ACTOR_IDENTITY: "true"
    OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=demo"

  # Every credential, including the session, encryption and offer-signing
  # keys the chart would otherwise generate, comes from the archestra-demo-runtime Secret
  # that archestra-ai/infra syncs from GCP Secret Manager (gcp/gke/apps/
  # runtime-secrets, one key per env var). These entries replace the chart's
  # generated values. Never also set these names under env: an env entry,
  # even "", would replace the synced value.
  envFromSecrets:
    - name: ARCHESTRA_AUTH_SECRET
      secretName: archestra-demo-runtime
      secretKey: ARCHESTRA_AUTH_SECRET
    - name: ARCHESTRA_AUTH_SESSION_SECRET
      secretName: archestra-demo-runtime
      secretKey: ARCHESTRA_AUTH_SESSION_SECRET
    - name: ARCHESTRA_SECRETS_ENCRYPTION_SECRET
      secretName: archestra-demo-runtime
      secretKey: ARCHESTRA_SECRETS_ENCRYPTION_SECRET
    - name: ARCHESTRA_SECRETS_ENCRYPTION_SECRET_PREVIOUS
      secretName: archestra-demo-runtime
      secretKey: ARCHESTRA_SECRETS_ENCRYPTION_SECRET_PREVIOUS
    - name: ARCHESTRA_OPENAPPA_OFFER_SIGNING_SECRET
      secretName: archestra-demo-runtime
      secretKey: ARCHESTRA_OPENAPPA_OFFER_SIGNING_SECRET
    - name: ARCHESTRA_AUTH_ADMIN_PASSWORD
      secretName: archestra-demo-runtime
      secretKey: ARCHESTRA_AUTH_ADMIN_PASSWORD
    - name: ARCHESTRA_KNOWLEDGE_BASE_MFILES_VAF_ADD_ON_GITHUB_TOKEN
      secretName: archestra-demo-runtime
      secretKey: ARCHESTRA_KNOWLEDGE_BASE_MFILES_VAF_ADD_ON_GITHUB_TOKEN

  gkeBackendConfig:
    enabled: true
  service:
    annotations:
      cloud.google.com/backend-config: '{"ports": {"9000":"archestra-demo-backend-config", "3000":"archestra-demo-frontend-config"}}'
      cloud.google.com/neg: '{"ingress": true}'
  ingress:
    # VPN-only ingress is managed by archestra-ai/infra.
    enabled: false
    annotations:
      kubernetes.io/ingress.class: "gce"
      kubernetes.io/ingress.global-static-ip-name: "archestra-demo-ip"
      ingress.gcp.cloud.google.com/load-balancer-type: "External"
      networking.gke.io/managed-certificates: "archestra-demo-ssl"
      ingress.gcp.cloud.google.com/ssl-redirect: "true"
    hosts:
      - host: demo.archestra.dev
        paths:
          - path: /
            port: 3000
            pathType: Prefix
      - host: "*.demo-sandbox.archestra.dev"
        paths:
          - path: /
            port: 9000
            pathType: Prefix
    tls:
      - hosts:
          - "*.demo-sandbox.archestra.dev"
        secretName: archestra-demo-sandbox-wildcard-tls

postgresql:
  enabled: false
  external_database_url: "postgresql://archestra-demo-platform%40friendly-path-465518-r6.iam@127.0.0.1:5432/archestra_dev?sslmode=disable"
