# Recovery-path regression, paired with the it-desk env: that env's agent system prompt is stale
# and confidently names a nonexistent tool (acme_it__ticket_lookup), so the model's natural move is
# to call that name -- directly, or via run_tool -- and fail. The ask itself is deliberately clean
# (no tool names): the trap lives in the org-authored prompt, mirroring how this failure arises in
# production. Solving the task requires following the platform's unavailable-tool recovery steer
# (search_tools -> run_tool) to the real service-desk tool.
[[stages]]
text = """Dana Lee pinged me asking where her Salesforce access request stands. Could you check
what's on file for dana.lee@acme.test and send me the ticket id, its current status, and the date
it was filed? Call submit_result with
result = {"ticket_id": "...", "status": "...", "filed_on": "..."}."""

[result_schema]
type = "object"
required = ["ticket_id", "status", "filed_on"]
additionalProperties = false

  [result_schema.properties.ticket_id]
  type = "string"
  minLength = 1

  [result_schema.properties.status]
  type = "string"
  minLength = 1

  [result_schema.properties.filed_on]
  type = "string"
  pattern = '^\d{4}-\d{2}-\d{2}$'

[state]
rest = ["/api/agents/{{agent_id}}/tools"]

[verifier]
deps = []
