name: Release PR Generation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

# No workflow-level cancellation: the generated push must not cancel the writer
# which produced its receipt. Only superseded generator jobs cancel each other.
jobs:
  select:
    name: Select release generation
    concurrency:
      group: release-generation-select-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    if: >-
      github.event.pull_request.user.login == 'archestra-ci[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--branches--') &&
      endsWith(github.head_ref, '--components--platform')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: select
        with:
          script: |
            const {selectGeneration} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-pr-generation.mjs`);
            core.setOutput('run', String(await selectGeneration({github, context})));

  openapi:
    name: Generate release OpenAPI
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: ubicloud-standard-16-ubuntu-2404
    timeout-minutes: 25
    concurrency:
      group: release-generation-openapi-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      TURBO_TOKEN: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBOREPO_REMOTE_CACHING_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: .generation-policy
      - uses: $/.github/actions/setup-env
      - uses: $/.github/actions/setup-rust-build
        with:
          workspaces: platform/archestra-rs
          shared-key: backend-unit-tests
          save-if: "false"
      - name: Build and generate against the pinned release source
        working-directory: platform
        run: |
          pnpm build
          pnpm codegen
          pnpm lint:fix
      - name: Seal allowlisted codegen output
        run: node .generation-policy/.github/scripts/release-pr-generation.mjs openapi "$RUNNER_TEMP/openapi.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-generation-openapi-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openapi.json
          if-no-files-found: error
          retention-days: 7

  screenshots:
    name: Generate release screenshots
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    concurrency:
      group: release-generation-screenshots-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: .generation-policy
      - uses: $/.github/actions/capture-docs-screenshots
      - name: Seal allowlisted screenshot output
        run: node .generation-policy/.github/scripts/release-pr-generation.mjs screenshots "$RUNNER_TEMP/screenshots.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-generation-screenshots-${{ github.run_attempt }}
          path: ${{ runner.temp }}/screenshots.json
          if-no-files-found: error
          retention-days: 7

  benchmark:
    name: Generate release benchmark
    needs: select
    if: needs.select.outputs.run == 'true'
    uses: $/.github/workflows/llm-proxy-benchmark.yml
    permissions:
      contents: read
      pull-requests: write # The reusable benchmark maintains the saved measurement comment.
    with:
      release-generation: true

  publish:
    name: Publish combined release generation
    needs: [select, openapi, screenshots, benchmark]
    if: >-
      needs.select.outputs.run == 'true' &&
      needs.openapi.result == 'success' &&
      needs.screenshots.result == 'success' &&
      needs.benchmark.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: release-generation-publish-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # Only trusted base-branch policy executes with the writer's credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-generation-*-${{ github.run_attempt }}
          path: generation-artifacts
      - name: Generate publication token
        id: token
        uses: archestra-ai/.github/actions/github-app-token@840a8b2c85a9deb01869cc956c9c77fbf50ccd68 # v1.1.0
        with:
          app-id: ${{ secrets.ARCHESTRA_RELEASER_GITHUB_APP_ID }}
          private-key: ${{ secrets.ARCHESTRA_RELEASER_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GENERATOR_RESULTS: ${{ toJSON(needs) }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const fs = require('node:fs');
            const {publishGeneration} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-pr-generation.mjs`);
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            context.runAttempt = attempt;
            const read = (kind, file, limit) => {
              const path = `generation-artifacts/release-generation-${kind}-${attempt}/${file}`;
              if (fs.statSync(path).size > limit) throw new Error('Oversized generation artifact');
              return JSON.parse(fs.readFileSync(path, 'utf8'));
            };
            const jobs = JSON.parse(process.env.GENERATOR_RESULTS);
            core.info(await publishGeneration({github, context,
              openapi: read('openapi', 'openapi.json', 80 * 1024 * 1024),
              screenshots: read('screenshots', 'screenshots.json', 80 * 1024 * 1024),
              summary: read('benchmark', 'ci/report.json', 65536),
              results: Object.fromEntries(['openapi', 'screenshots', 'benchmark'].map(key => [key, jobs[key].result])),
            }));
