[package]
name = "openappa_rs"
version = "0.1.0"
edition = "2024"
build = "build.rs"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# OpenAPPA v0.35.1: conditional publication (#685), the replay-only
# appa/do_something call (#670), the [aliases]
# table (#666), void returns for marked spawns (#665), typed refusal classes
# (#681), live policy revisions with snapshot views (#677); then on main,
# replay steps without `expect` (#688) and the deployment targets each
# battery lists (#691), loopback requests staying local (#692),
# parallel subagent spawns waiting for the earlier bind (#694), and plain
# errors for tool names that identify no tool (#698), `[aliases.tool]` (#696)
# and the generic coding battery (#697); then v0.37.0 and libpq TLS
# parameters (`sslmode=verify-full`, `sslrootcert`) in the PostgreSQL URL (#710),
# the attestation offered only where the parent covers its rank (#713),
# and the archestra battery's agent-run rules (#716); then explicit
# no-remedy refusal feedback (#720), a failed subagent reported as stopped
# (#722), and plaintext receipts that hold U+0000 stored under the plaintext
# escape (#724); then v0.38.0 and the remedy's vouch spent at its claim
# (#725), shorter block feedback (#726), the replay stand-in (#739), a
# subagent's return declared without review or ahead of its spawn (#763), and
# the required readers named in reviews and block reasons (#764); then
# v0.38.1 and zip 9, which fixes the archive extract advisories (#680); then
# context-provider answers trimmed largest first (#769), refusal detail in
# provider errors (#770), more shell shapes for the GitHub provider (#771),
# the consult budget in `APPA_CONSULT_TIMEOUT_MS` (#772), and context-provider
# and deployment hints (#773), and the GitHub context provider answering the
# GH_TOKEN, git config, assignment, and heredoc shapes it used to decline (#775);
# then the annotator label-guide fixes and the claude-code verdict cache (#782),
# result trust judged by open-write surfaces (#783), a narrowing's impact
# that leaves per-call labeled tools unjudged (#784), a dotenv file matched in
# the coding shell credential floor as a path, not a substring (#785), and a
# peer read admitted under unscoped output sanitizers while its result is not
# confined (#786); then Google Drive sharing settings for Google Workspace
# audiences (#750), the project's own toolchain releases kept out of the
# label-guide trust gate (#788), every Archestra built-in tool labeled (#789),
# and Claude Code's SendMessage and RemoteTrigger as internal sinks (#787);
# then the planner-cap lint's redispatch index (#792), the battery scripts'
# run lines (#793), kagent demo fixes (#794, #796), and a credential link
# declaration that requires an internal audience (#798); then v0.39.0 and a
# model sanitizer's rewritten value kept unwrapped (#797), the session module
# split (#800), credential files and dotenv modes matched as path tokens with a
# lower-trust return floor (#803), and recorders in place of the runtime file
# ledger, with the consult recorder renamed `ConsultTranscriber` (#790); then
# v0.40.1 and the LLM log tools labeled in the archestra battery (#852); then
# v0.42.0 and empty child turns settled under their recorded return contract (#807);
# then stale call offers refused as superseded (#884), a typed scope on reviews
# (#888), and a return declared ahead kept in the family log (#887);
# then an authority's `except_tags`, and plans that need only stock `approve`
# authorities applied at the block and recorded (#889); then a remedy whose
# annotator gave no answer refused as unanswered (#890); then unsafe integers
# refused in canonical numbers (#891), small runtime and coding battery fixes
# (#893, #895), battery sanitizers the deployment binds, and model and
# archestra builtins named on a sanitizer's declaration, with each archestra
# consult naming its kind (#791).
appa-runtime = { package = "appa", git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "ab8c93dd547395c793985e31bb365950a15add20", features = ["archestra"] }
appa-runtime-api = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "ab8c93dd547395c793985e31bb365950a15add20" }
appa-eventlog = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "ab8c93dd547395c793985e31bb365950a15add20", features = ["postgres"] }
appa-package = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "ab8c93dd547395c793985e31bb365950a15add20" }
opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics", "experimental_metrics_custom_reader", "spec_unstable_metrics_views"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
napi = { version = "3", features = ["tokio_rt"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
tempfile = "3"
toml = "1.1"
# The runtime's own editor speaks this document type; reading a root's declarations
# with their spans needs the same version the runtime holds.
toml_edit = "0.25"
tokio = { version = "1", features = ["sync", "time", "rt", "net", "io-util"] }
futures-util = "0.3"
# Stream bounded receipt lookups through the store's existing PostgreSQL client.
postgres = "0.19"
# The owner id a dispatch leases its receipts under; tests also build consult records with it.
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
# A paused clock: the connection-wait test does not spend its thirty seconds.
tokio = { version = "1", features = ["rt", "test-util"] }
proptest = "1"

[target.'cfg(target_env = "musl")'.dependencies]
# Cross-builds need OpenSSL compiled for musl. The Docker builder uses its
# installed OpenSSL through OPENSSL_NO_VENDOR instead.
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
napi-build = "2"
