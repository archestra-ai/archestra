name: Close External Pull Requests

# We take contributions as human-written text, not code. External changes come
# in as issues that maintainers implement with coding agents. This workflow
# closes every open PR from outside the maintainer group and leaves a comment
# that explains the process.
#
# Who counts as a maintainer: anyone with access to this repository, checked
# with the collaborators API. Org members get that access through the org, so
# the set equals org membership as long as no outside collaborators are added.
# Do NOT use `author_association` for this: org memberships are private, so the
# Actions token reports every org member as a plain CONTRIBUTOR and the
# workflow would close maintainer PRs.
#
# Scheduled polling instead of `pull_request_target`: the privileged trigger runs
# in the base repository security context for untrusted PR events and is a common
# source of Actions incidents (see random-issue-pr-assignee.yml for the same
# reasoning). Polling runs only from the default branch and never consumes
# PR-controlled code.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log the decision for every open PR without commenting or closing.
        type: boolean
        default: false

permissions: {}

env:
  # Bots that open PRs as part of automated processes (release-please, dependabot,
  # backports, task envs) are never closed by this workflow.
  EXEMPT_BOT_LOGINS: '["archestra-ci[bot]","dependabot[bot]","archestra-task-envs[bot]"]'
  CLOSE_MARKER: "<!-- archestra-close-external-prs -->"
  CLOSE_COMMENT: |
    We take contributions as human-written text, not code — see https://www.archestra.ai/docs/contributing.

    Describe the change you'd like in a GitHub issue written by a human (https://github.com/archestra-ai/archestra/issues/new/choose), and if we're aligned we'll handle the implementation with our coding agents.

    This PR is closed automatically.
  DRY_RUN: ${{ inputs.dry_run == true }}

concurrency:
  group: close-external-prs
  cancel-in-progress: false

jobs:
  close-external-prs:
    name: Close External Pull Requests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Required to comment on and close PRs.

    steps:
      - name: Close PRs from non-maintainers
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const exemptBotLogins = JSON.parse(process.env.EXEMPT_BOT_LOGINS);
            const marker = process.env.CLOSE_MARKER;
            const body = `${marker}\n${process.env.CLOSE_COMMENT}`;
            const dryRun = process.env.DRY_RUN === 'true';
            let closedPrs = 0;

            for await (const response of github.paginate.iterator(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'updated',
              direction: 'desc',
              per_page: 100,
            })) {
              for (const pr of response.data) {
                const author = pr.user.login;

                if (pr.user.type === 'Bot' || exemptBotLogins.includes(author)) {
                  console.log(`Keeping #${pr.number}: ${author} is a bot`);
                  continue;
                }

                const membership = await isMaintainer(author);

                if (membership !== 'external') {
                  console.log(`Keeping #${pr.number}: ${author} is ${membership}`);
                  continue;
                }

                if (dryRun) {
                  console.log(`Would close #${pr.number} from ${author} (dry run)`);
                  continue;
                }

                try {
                  await closeExternalPr(pr);
                  closedPrs += 1;
                } catch (error) {
                  console.log(`Failed to close #${pr.number}: ${error.message}`);
                }
              }
            }

            console.log(`Closed ${closedPrs} external pull requests`);

            // Returns 'maintainer' (has repo access), 'external' (confirmed no
            // access), or 'unknown' (the lookup failed). Only 'external' closes a
            // PR: on any lookup error the PR is kept, never closed by mistake.
            async function isMaintainer(login) {
              try {
                await github.rest.repos.checkCollaborator({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: login,
                });
                return 'maintainer';
              } catch (error) {
                if (error.status === 404) {
                  return 'external';
                }
                console.log(`Collaborator lookup failed for ${login}: ${error.message}`);
                return 'unknown';
              }
            }

            async function closeExternalPr(pr) {
              let alreadyCommented = false;

              for await (const commentsResponse of github.paginate.iterator(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              })) {
                if (commentsResponse.data.some((comment) => comment.body?.includes(marker))) {
                  alreadyCommented = true;
                  break;
                }
              }

              if (!alreadyCommented) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body,
                });
              }

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed',
              });

              console.log(`Closed #${pr.number} from ${pr.user.login}${alreadyCommented ? ' without a new comment' : ''}`);
            }
