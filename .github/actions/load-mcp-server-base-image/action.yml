name: Load MCP Server Base Image
description: |
  Loads the MCP server base Docker image from a co-located artifact (faster than pulling from GHCR).
  The build job always uploads a tarball artifact regardless of fork status.

inputs:
  is-fork-pr:
    description: "Whether this is a fork PR (kept for backward compatibility)"
    required: true
  github-token:
    description: "GitHub token (kept for backward compatibility, no longer used for GHCR pulls)"
    required: true

outputs:
  image-tag:
    description: "The resolved MCP server base image tag"
    value: ${{ steps.resolve-tag.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Download MCP server base image artifact
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
      with:
        name: mcp-server-base-docker-image
        path: /tmp

    - name: Load MCP server base Docker image
      shell: bash
      run: |
        gunzip -c /tmp/mcp-server-base-image.tar.gz | docker load

    - name: Resolve MCP server base image tag
      id: resolve-tag
      shell: bash
      env:
        GIT_SHA: ${{ github.sha }}
      run: |
        echo "tag=mcp-server-base:${GIT_SHA}" >> "$GITHUB_OUTPUT"
