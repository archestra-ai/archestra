name: Sync Terraform Provider
run-name: Sync the Terraform provider with ${{ inputs.release_tag }}

# Starts the Terraform Provider Sync agent on staging for one platform
# release. The agent (archestra-ai/infra, archestra/automation) reads what
# changed in the release, updates archestra-ai/terraform-provider-archestra
# (the Terraform provider and the Crossplane provider generated from it) and
# opens or updates a pull request there. It never merges.
#
# Release Finalize dispatches this after it publishes a release from main.
# Run it by hand on main to repeat a release or to catch up on one.
#
# The job holds no Archestra API key and no GitHub credential for the provider
# repository. It trades its GitHub OIDC token for a one-hour token of an
# Archestra service account that can only run that agent (workload identity
# federation). The agent's own GitHub App token never leaves Archestra.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published platform release, such as platform-v1.5.0-rc.36"
        type: string
        required: true

permissions: {}

concurrency:
  group: sync-terraform-provider-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  start:
    name: Start the Terraform Provider Sync agent
    # The Archestra service account and the Google account trust this file on
    # main only; any other ref would be refused at sign-in.
    if: github.repository == 'archestra-ai/archestra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Check out the scripts and read the release.
      id-token: write # Sign in to Google Cloud (staging tunnel) and to Archestra.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # A draft is not a release yet: its images are not published, so the
      # provider's acceptance tests could not run against it.
      - name: Check the release is published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^platform-v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]] \
            || { echo "::error::$RELEASE_TAG is not a platform release tag."; exit 1; }
          draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          [ "$draft" = false ] || { echo "::error::$RELEASE_TAG is not published yet."; exit 1; }

      # The staging API is private. This account can open the IAP tunnel to
      # its TLS forwarder and nothing else.
      - name: Authenticate to Google Cloud
        uses: archestra-ai/.github/actions/google-auth@v1.16.0
        with:
          service_account: ${{ vars.TERRAFORM_PROVIDER_SYNC_GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ vars.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Open the staging API tunnel
        run: .github/scripts/staging-api-tunnel.sh

      - name: Start the agent run
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          BASE_URL: https://backend.archestra.dev
          PUBLIC_URL: https://frontend.archestra.dev
          SERVICE_ACCOUNT_ID: ${{ vars.TERRAFORM_PROVIDER_SYNC_SERVICE_ACCOUNT_ID }}
          AGENT_ID: ${{ vars.TERRAFORM_PROVIDER_SYNC_AGENT_ID }}
        run: python3 .github/scripts/terraform-provider-sync.py
