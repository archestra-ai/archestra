[program:postgres]
user=postgres
# The embedded server only needs to report what the backend cannot: the
# backend logs every query failure it hits itself. PostgreSQL ranks LOG above
# ERROR for this setting, so `fatal` is the level that drops the startup
# banner and per-session warnings (such as SET LOCAL outside a transaction in
# early migrations) while keeping FATAL and PANIC. log_checkpoints=off drops
# the two lines PostgreSQL 15+ writes every checkpoint_timeout (5 minutes).
command=postgres -D /var/lib/postgresql/data -c log_min_messages=fatal -c log_checkpoints=off
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=1
