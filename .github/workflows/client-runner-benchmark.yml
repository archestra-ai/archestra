# Temporary paired benchmark. Wave 3: default lint; frontend 8 BS vs 16 Ubi without compiler archive; native tests.
name: Lint and Frontend Runner Benchmark
'on':
  pull_request:
    branches:
    - main
    paths:
    - .github/workflows/client-runner-benchmark.yml
permissions: {}
concurrency:
  group: client-runner-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  platform-lint-and-unit-tests:
    name: platform-lint-and-unit-tests (${{ matrix.provider }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./platform
    env:
      TURBO_TOKEN: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBOREPO_REMOTE_CACHING_TEAM }}
    steps:
    - name: Check if this is a release-please PR
      id: check-release-please
      working-directory: .
      run: "if [ \"$EVENT_NAME\" = \"pull_request\" ] && [[ \"$HEAD_REF\" == release-please--* ]]; then\n  echo \"is-release-please=true\" >> \"$GITHUB_OUTPUT\"\n\
        \  echo \"Release-please PR detected; generated files will be auto-committed if needed.\"\nelse\n  echo \"is-release-please=false\" >> \"$GITHUB_OUTPUT\"\n\
        fi\n"
      env:
        EVENT_NAME: merge_group
        HEAD_REF: ''
    - name: Checkout project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: aed871b42e40385d17ca40c1b250d07664e617da
    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        working-directory: ./platform
    - name: Record runner identity
      working-directory: .
      run: 'node -e ''const os=require("os"); console.log(JSON.stringify({cpuCount:os.cpus().length,cpuModel:os.cpus()[0].model,memoryBytes:os.totalmem(),node:process.version}))''

        git rev-parse HEAD

        '
    - name: Verify no immature dependencies
      run: pnpm install --fix-lockfile --lockfile-only --ignore-scripts
    - name: Restore Rust build cache
      uses: ./.github/actions/setup-rust-build
      with:
        workspaces: platform/archestra-rs
        shared-key: backend-unit-tests
        save-if: 'false'
    - name: Fetch base ref and release tags for migration checks
      env:
        GH_TOKEN: ${{ github.token }}
        DEFAULT_BRANCH: main
      run: "git -c credential.helper= \\\n    -c credential.helper='!f() { echo username=x-access-token; echo \"password=$GH_TOKEN\"; }; f' \\\n    fetch --depth=1\
        \ origin \\\n    \"+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}\" \\\n    \"+refs/heads/release/*:refs/remotes/origin/release/*\" \\\
        \n    \"+refs/tags/platform-v*:refs/tags/platform-v*\"\n"
    - name: Fetch canonical release histories in the private mirror
      if: github.repository == 'archestra-ai/archestra-private'
      run: "git fetch --depth=1 https://github.com/archestra-ai/archestra.git \\\n  \"+refs/heads/release/*:refs/remotes/origin/release/*\" \\\n  \"+refs/tags/platform-v*:refs/tags/platform-v*\"\
        \n"
    - name: Fetch canonical release histories in the private mirror
      if: github.repository == 'archestra-ai/archestra-private'
      run: "git fetch --depth=1 https://github.com/archestra-ai/archestra.git \\\n  \"+refs/heads/release/*:refs/remotes/origin/release/*\" \\\n  \"+refs/tags/platform-v*:refs/tags/platform-v*\"\
        \n"
    - name: Check migration upgrade paths across release tracks
      env:
        BASE_BRANCH: refs/heads/main
      run: 'python3 ../.github/scripts/test_check_migration_upgrades.py

        python3 ../.github/scripts/check-migration-upgrades.py --base-branch "${BASE_BRANCH#refs/heads/}"

        '
    - name: Type checking, linting, formatting, unit tests
      run: 'pnpm exec turbo check:ci --filter=!@backend

        pnpm exec turbo check:commit --filter=@backend

        '
    - name: Test migration upgrades across release tracks
      run: pnpm --dir backend test:migration-upgrades
    - name: Release skill harness
      run: pnpm test:release-skill
    - name: Test backport automation
      run: python3 ../.github/scripts/test_backport.py
    - name: White-label copy check
      run: pnpm check:white-label
    - name: Production build
      run: pnpm build
    - name: Run validation checks (drizzle-kit, codegen, db migrations)
      env:
        IS_RELEASE_PLEASE_PR: ${{ steps.check-release-please.outputs.is-release-please }}
      run: "set -e\n\n# Start drizzle-kit check in background\necho \"Starting drizzle-kit check in background...\"\n(cd backend && pnpm drizzle-kit check) &\nDRIZZLE_PID=$!\n\
        \n# Run codegen and lint\necho \"Running codegen...\"\npnpm codegen\npnpm lint:fix\n\n# Check for codegen changes\nif ! git -C \"$GITHUB_WORKSPACE\" diff\
        \ --exit-code -- docs/ platform/ || ! git -C \"$GITHUB_WORKSPACE\" diff --cached --exit-code -- docs/ platform/; then\n  if [ \"$IS_RELEASE_PLEASE_PR\" =\
        \ \"true\" ]; then\n    echo \"Waiting for drizzle-kit check before auto-committing generated changes...\"\n    wait $DRIZZLE_PID\n\n    echo \"Release-please\
        \ PR with generated changes detected. Auto-committing...\"\n    git config user.name \"github-actions[bot]\"\n    git config user.email \"github-actions[bot]@users.noreply.github.com\"\
        \n    git -C \"$GITHUB_WORKSPACE\" add docs/ platform/\n    git commit -m \"chore: update docs/openapi.json version for release\"\n    git push\n    echo\
        \ \"Changes committed. Workflow will be re-triggered.\"\n    exit 0\n  else\n    echo \"::error::Codegen produced changes. Please run 'pnpm codegen && pnpm\
        \ lint:fix' locally and commit the results.\"\n    git -C \"$GITHUB_WORKSPACE\" diff --stat -- docs/ platform/\n    exit 1\n  fi\nfi\n\n# Wait for drizzle-kit\
        \ check\necho \"Waiting for drizzle-kit check...\"\nwait $DRIZZLE_PID\n\n# Generate migrations and ensure no new migrations are created\necho \"Checking for\
        \ missing database migrations...\"\nset +e\nif timeout 15s pnpm db:generate > /tmp/db_generate_output.txt 2>&1; then\n  output=$(cat /tmp/db_generate_output.txt)\n\
        \  echo \"$output\"\n  if echo \"$output\" | grep -q \"\u276F\\|Is.*table created or renamed\"; then\n    echo \"::error::Interactive prompt detected. Pending\
        \ database migrations need to be committed.\"\n    exit 1\n  fi\nelse\n  exit_code=$?\n  cat /tmp/db_generate_output.txt 2>/dev/null || true\n  if [ $exit_code\
        \ -eq 124 ]; then\n    echo \"::error::pnpm db:generate timed out, likely waiting for interactive migration input.\"\n  else\n    echo \"::error::pnpm db:generate\
        \ failed with exit code $exit_code.\"\n  fi\n  exit 1\nfi\nset -e\n\nif ! git diff --exit-code -- backend/src/database/migrations/ || ! git diff --cached\
        \ --exit-code -- backend/src/database/migrations/; then\n  echo \"::error::Database schema changes require a migration. Please run 'pnpm db:generate' locally\
        \ and commit the generated migration.\"\n  git diff --stat backend/src/database/migrations/\n  exit 1\nfi\n\necho \"\u2705 All validation checks passed\"\n"
    strategy:
      fail-fast: false
      matrix:
        include:
        - provider: Blacksmith
          runner: blacksmith-16vcpu-ubuntu-2404
        - provider: Ubicloud
          runner: ubicloud-standard-16-ubuntu-2404
  frontend-integration-tests:
    name: frontend-integration-tests (${{ matrix.provider }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./platform
    env:
      TURBO_TOKEN: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBOREPO_REMOTE_CACHING_TEAM }}
    steps:
    - name: Checkout project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: aed871b42e40385d17ca40c1b250d07664e617da
    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        working-directory: ./platform
    - name: Record runner identity
      working-directory: .
      run: 'node -e ''const os=require("os"); console.log(JSON.stringify({cpuCount:os.cpus().length,cpuModel:os.cpus()[0].model,memoryBytes:os.totalmem(),node:process.version}))''

        git rev-parse HEAD

        '
    - name: Resolve Playwright version
      id: pw-version
      run: 'version=$(pnpm --filter @frontend exec playwright --version | awk ''{print $2}'')

        echo "version=$version" >> "$GITHUB_OUTPUT"

        '
    - name: Cache Playwright browsers
      if: runner.os == 'Linux'
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-cold-benchmark-${{ github.run_id }}
    - name: Install Chromium for Playwright
      if: runner.os == 'Linux' && steps.playwright-cache.outputs.cache-hit != 'true'
      run: "pnpm --filter @frontend exec playwright install chromium\nfor attempt in 1 2 3; do\n  if pnpm --filter @frontend exec playwright install-deps chromium;\
        \ then\n    exit 0\n  fi\n  echo \"install-deps attempt ${attempt} failed; retrying in 20s\"\n  sleep 20\ndone\necho \"install-deps failed; verifying Chromium\
        \ launches with existing system libraries\"\npnpm --filter @frontend exec playwright screenshot --browser chromium about:blank /tmp/chromium-deps-check.png\n"
    - name: Install Chromium system dependencies
      if: runner.os == 'Linux' && steps.playwright-cache.outputs.cache-hit == 'true'
      run: "for attempt in 1 2 3; do\n  if pnpm --filter @frontend exec playwright install-deps chromium; then\n    exit 0\n  fi\n  echo \"install-deps attempt ${attempt}\
        \ failed; retrying in 20s\"\n  sleep 20\ndone\necho \"install-deps failed; verifying Chromium launches with existing system libraries\"\npnpm --filter @frontend\
        \ exec playwright screenshot --browser chromium about:blank /tmp/chromium-deps-check.png\n"
    - name: Install Chromium (macOS)
      if: runner.os == 'macOS'
      run: pnpm --filter @frontend exec playwright install chromium
    - name: Cache integration test compiler output
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: platform/frontend/.next-pw-shard-*/dev/cache
        key: frontend-integration-next-${{ runner.os }}-compiler-v2-${{ hashFiles('platform/pnpm-lock.yaml', 'platform/frontend/src/**', 'platform/frontend/*.ts',
          'platform/frontend/*.mjs', 'platform/frontend/*.json') }}-cold-benchmark-${{ github.run_id }}
      if: matrix.provider == 'Blacksmith'
    - name: Reap stale MSW webServers
      if: runner.os == 'macOS'
      run: "for pid in $(pgrep -f \"next dev -H 127.0.0.1\" || true); do\n  age=$(ps -o etime= -p \"$pid\" | tr -d ' ') || continue\n  case \"$age\" in\n    *-*|*:*:*)\
        \ echo \"Reaping orphaned webServer $pid (age $age)\"; kill -9 \"$pid\" || true ;;\n  esac\ndone\n"
    - name: Run integration tests
      shell: bash
      run: "set -euo pipefail\nshard_count=4\npids=()\nfor shard in $(seq 1 \"$shard_count\"); do\n  # Three macOS runner slots share one host. Derive non-overlapping\n\
        \  # ports from the run/attempt/shard instead of discovering a free\n  # port and racing another process to bind it after the probe closes.\n  port=$((20000\
        \ + ((GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT * 97) % 7000) * shard_count + shard))\n  echo \"Starting frontend integration shard ${shard}/${shard_count} on port\
        \ ${port}\"\n  # Playwright writes its config transform cache with plain,\n  # non-atomic writes. Shards that start together and share one cache\n  # can\
        \ load a half-written file and die with \"SyntaxError: Unexpected\n  # end of input\" before running a test, so each shard gets its own.\n  PWTEST_CACHE_DIR=\"\
        ${RUNNER_TEMP}/playwright-transform-cache-${shard}\" \\\n    ARCHESTRA_FRONTEND_INT_TESTS_PORT=\"$port\" \\\n    ARCHESTRA_FRONTEND_INT_TESTS_SHARD=\"$shard\"\
        \ \\\n    pnpm --filter @frontend exec playwright test --shard=\"${shard}/${shard_count}\" &\n  pids+=(\"$!\")\ndone\n\nstatus=0\nfor pid in \"${pids[@]}\"\
        ; do\n  if ! wait \"$pid\"; then\n    status=1\n  fi\ndone\nexit \"$status\"\n"
    - name: Upload Playwright report
      if: failure()
      uses: ./.github/actions/github-upload-artifact
      with:
        name: playwright-integration-report-${{ matrix.provider }}
        path: platform/frontend/playwright-report-shard-*/
        retention-days: '7'
    - name: Upload traces
      if: failure()
      uses: ./.github/actions/github-upload-artifact
      with:
        name: playwright-integration-traces-${{ matrix.provider }}
        path: platform/frontend/test-results-shard-*/
        retention-days: '7'
    strategy:
      fail-fast: false
      matrix:
        include:
        - provider: Blacksmith
          runner: blacksmith-8vcpu-ubuntu-2404
        - provider: Ubicloud
          runner: ubicloud-standard-16-ubuntu-2404
  openappa-native-tests:
    name: openappa-native-tests (${{ matrix.provider }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./platform
    env:
      TURBO_TOKEN: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBOREPO_REMOTE_CACHING_TEAM }}
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: archestra
          POSTGRES_PASSWORD: archestra_ci_password
          POSTGRES_DB: archestra_openappa_test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U archestra -d archestra_openappa_test" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
    - name: Checkout project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: aed871b42e40385d17ca40c1b250d07664e617da
    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        working-directory: ./platform
    - name: Record runner identity
      working-directory: .
      run: 'node -e ''const os=require("os"); console.log(JSON.stringify({cpuCount:os.cpus().length,cpuModel:os.cpus()[0].model,memoryBytes:os.totalmem(),node:process.version}))''

        git rev-parse HEAD

        '
    - name: Cache cargo registry and target
      uses: ./.github/actions/setup-rust-build
      with:
        workspaces: platform/archestra-rs
        shared-key: backend-unit-tests
        save-if: 'false'
    - name: Apply Archestra migrations to the test database
      env:
        ARCHESTRA_DATABASE_URL: postgresql://archestra:archestra_ci_password@localhost:5432/archestra_openappa_test
      run: pnpm --dir backend db:migrate
    - name: Build the native addon
      run: pnpm exec turbo build --filter=@archestra/openappa-rs
    - name: Native runtime and PostgreSQL ledger tests
      env:
        ARCHESTRA_OPENAPPA_TEST_DATABASE_URL: postgresql://archestra:archestra_ci_password@localhost:5432/archestra_openappa_test
      run: pnpm --filter @archestra/openappa-rs test
    strategy:
      fail-fast: false
      matrix:
        include:
        - provider: Blacksmith
          runner: blacksmith-8vcpu-ubuntu-2404
        - provider: Ubicloud
          runner: ubicloud-standard-8-ubuntu-2404
