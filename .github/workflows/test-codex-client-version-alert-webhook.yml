name: Test Codex client version alert webhook

on:
  pull_request:
    types: [synchronize]

permissions: {}

jobs:
  post-test-alerts:
    if: ${{ github.repository == 'archestra-ai/archestra' && github.event.pull_request.number == 8277 && github.head_ref == 'chore/codex-version-updater-alerting' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        result: [failure, success]
    steps:
      - name: Confirm alerting webhook is configured
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTING_WEBHOOK_URL }}
        run: test -n "$SLACK_WEBHOOK_URL"
      - name: Post result to alerting
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTING_WEBHOOK_URL }}
          UPDATE_RESULT: ${{ matrix.result }}
          PULL_REQUEST_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "::warning::SLACK_ALERTING_WEBHOOK_URL not set; skipping Slack notification."
            exit 0
          fi

          if [[ "$UPDATE_RESULT" == "failure" ]]; then
            message=":rotating_light: Codex client version update failed. <$RUN_URL|View workflow run>"
          else
            message="Codex client version update proposed: <$PULL_REQUEST_URL|View pull request>"
          fi
          jq -n --arg text "$message" '{text: $text}' |
            curl --fail-with-body -sS --max-time 15 -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
