# Lima VM for Archestra development. The VM gets no host folders, no SSH
# agent and no host credentials, so code that runs during install, build or
# dev (npm packages, cargo build scripts, MCP server images, privileged pods)
# can only reach what is inside the VM.
#
# Created and driven by platform/scripts/dev-vm.sh; see platform/dev/vm/README.md.
# 2.3: networkOpts.hostLoopback.
minimumLimaVersion: 2.3.0

base:
- template:_images/ubuntu-24.04

vmType: vz
cpus: 10
memory: 24GiB
disk: 100GiB

# No host folders: the repository lives on the VM's own disk.
mounts: []

networkOpts:
  # Lima maps host.lima.internal (192.168.5.2) to the Mac's 127.0.0.1. Off:
  # the VM can't reach the Mac's localhost services (another dev stack, local
  # databases). Enforced by Lima on the Mac, so root in the VM can't undo it.
  # DNS and the internet keep working.
  hostLoopback: false

# Docker (installed by setup-vm.sh) runs kind; containerd from Lima is not needed.
containerd:
  system: false
  user: false

ssh:
  # Never forward the host's SSH agent: code in the VM could sign as you.
  forwardAgent: false
  forwardX11: false
  forwardX11Trusted: false
  # Lima uses its own key; don't copy ~/.ssh/*.pub into the VM.
  loadDotSSHPubKeys: false

# Each synced checkout runs its own stack (dev-vm-sync.py start picks it).
# The first one uses Tilt's default ports, which appear on the Mac with 10000
# added, so they never clash with a stack on the Mac (3000/9000/10350/5432).
# Stacks 1 to 4 use the same ports in the VM and on the Mac: app 13000+N,
# API 19000+N, Tilt 20350+N. Every other guest port stays inside the VM
# (catch-all ignore rules last).
portForwards:
- guestPort: 3000
  hostPort: 13000
- guestPort: 9000
  hostPort: 19000
- guestPort: 10350
  hostPort: 20350
- guestPortRange: [13001, 13004]
  hostPortRange: [13001, 13004]
- guestPortRange: [19001, 19004]
  hostPortRange: [19001, 19004]
- guestPortRange: [20351, 20354]
  hostPortRange: [20351, 20354]
# Both rules are needed: the 0.0.0.0 one doesn't match services bound to
# 127.0.0.1 (kind's API server, containerd, Tilt internals).
- guestIP: 127.0.0.1
  guestPortRange: [1, 65535]
  proto: any
  ignore: true
- guestIP: 0.0.0.0
  guestPortRange: [1, 65535]
  proto: any
  ignore: true

