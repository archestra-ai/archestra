[[stages]]
text = """Hi -- can you set up system access for a new hire and file it properly through our IT service desk?

Her email is dana.lee@acme.test, she's joining the sales team and needs access to our Salesforce CRM at
the admin level. Justification: new sales hire who needs CRM access for Q3 onboarding."""

[[stages]]
text = """Her approving manager is priya.nair@acme.test. And on the admin level -- we don't have a
director exception on file for her, and I'd rather not chase one down. Just grant whatever our access
policy allows by default in that situation and file it.

Then tell me the ticket id via submit_result as result = {"ticket_id": "<the id the service desk
returned>"}."""

[result_schema]
type = "object"
required = ["ticket_id"]
additionalProperties = false

  [result_schema.properties.ticket_id]
  type = "string"
  minLength = 1

[state]
rest = ["/api/skills?search=access-request-intake&limit=100"]

[verifier]
deps = []
