[package]
name = "archestra-db"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aws-config = "1.8.15"
aws-credential-types = "1"
aws-sigv4 = "1"
azure_core = "1"
azure_identity = "1"
base64 = "0.22"
diesel = { version = "~2.3.0", default-features = false, features = ["32-column-tables", "network-address", "postgres_backend", "serde_json", "time", "uuid"] }
diesel-async = { version = "0.9", features = ["postgres", "bb8"] }
http = "1"
ipnetwork = "0.21"
native-tls = "0.2.18"
postgres-native-tls = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1", features = ["time"] }
tokio-postgres = "0.7"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
