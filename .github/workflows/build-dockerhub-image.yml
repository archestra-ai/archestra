# https://docs.github.com/en/actions/tutorials/publish-packages/publish-docker-images#publishing-images-to-docker-hub
name: Build Docker Hub image

on:
  workflow_call:
    inputs:
      image_directory:
        description: "Directory containing the Dockerfile"
        required: true
        type: string
      image_name:
        description: "Name of the Docker image"
        required: true
        type: string
      version:
        description: "Version tag for the Docker image"
        required: true
        type: string
      previous_version:
        description: "Previous release on this branch to carry frontend chunks from; empty skips the carry-over"
        required: false
        type: string
        default: ""
      push_image:
        description: "Whether to push the image to Docker Hub"
        required: true
        type: boolean
      checkout_ref:
        description: "Optional ref to checkout when building the image"
        required: false
        type: string
        default: ""
      environment:
        description: "GitHub Environment whose secrets the publishing jobs read (release-publish for releases); empty for none"
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: build-dockerhub-image-${{ inputs.image_name }}-${{ inputs.version }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dockerhub-image:
    name: Build Docker Hub image
    permissions:
      packages: write # Required by the reusable GHCR-capable publisher.
      contents: read # Required to checkout the repository and build the image.
      id-token: write # Required for Workload Identity Federation when pushing images.
    uses: $/.github/workflows/build-native-multi-arch-image.yml
    with:
      environment: ${{ inputs.environment }}
      image_directory: ${{ inputs.image_directory }}
      image_name: ${{ inputs.image_name }}
      image_registry: docker.io/archestra
      version: ${{ inputs.version }}
      push_image: ${{ inputs.push_image }}
      auth_provider: dockerhub
      # Docker contexts exclude .git, and release builds use an explicit tag.
      # Fetching the full repository history adds ~30s to each native build.
      checkout_fetch_depth: 1
      # Release ARM cache export took 169s in a sampled run. Keep mode=max
      # intermediate layers, but compress new cache layers quickly with zstd.
      # The published image retains its existing gzip output format.
      cache_compression: zstd
      checkout_ref: ${{ inputs.checkout_ref }}
      # Match the 16-core E2E builder; build arm64 natively.
      amd64_runner: ubuntu-24.04-16core
      arm64_runner: ubuntu-24.04-arm-32core
      previous_image: ${{ inputs.previous_version && format('docker.io/archestra/{0}:{1}', inputs.image_name, inputs.previous_version) || '' }}
