apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "archestra-workloads.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archestra-workloads.labels" . | nindent 4 }}
---
# A token that does not expire, for the kubeconfig the platform stores. To
# rotate it, delete this Secret, let the chart recreate it, and give the
# platform the new kubeconfig.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "archestra-workloads.serviceAccountName" . }}-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archestra-workloads.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ include "archestra-workloads.serviceAccountName" . }}
type: kubernetes.io/service-account-token
