name: Setup uv
description: Wrapper around astral-sh/setup-uv pinned to a vetted version.
inputs:
  version:
    description: Version of uv to install. Defaults to the version in pyproject.toml, or latest.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: ${{ inputs.version }}
