name: "✏️ Update an MCP server in the catalog"
description: Request a change to an existing Archestra MCP Catalog entry. Maintainers apply the change.
title: "[MCP Catalog] Update "
labels: ["mcp-catalog"]
body:
  - type: input
    id: server
    attributes:
      label: Catalog entry
      description: The entry name from the catalog URL, for example `microsoft__markitdown__packages__markitdown-mcp`.
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: What should change
      description: Describe the fields to update and their new values. Include sources for facts such as tool lists or configuration.
    validations:
      required: true
