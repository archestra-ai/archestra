name: Claude Core Team Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  group: claude-coreteam-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  author:
    name: Resolve PR Author
    if: github.repository == 'archestra-ai/archestra'
    uses: archestra-ai/.github/.github/workflows/claude-review-context.yml@873368eb4dafea55fc735a492b83d5b812b2369f

  review:
    name: Claude Review
    needs: author
    if: github.repository == 'archestra-ai/archestra'
    permissions:
      contents: read
      pull-requests: write # Publish PR review comments.
      id-token: write # Support the reusable workflow's Claude GitHub App authentication.
    uses: archestra-ai/.github/.github/workflows/claude-coreteam-review.yml@873368eb4dafea55fc735a492b83d5b812b2369f
    # GitHub resolves this lookup before starting the called job; only the
    # matching token is passed, not the caller's complete secrets context.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets[needs.author.outputs.secret_name] }} # zizmor: ignore[overprovisioned-secrets,obfuscation]
