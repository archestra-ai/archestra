{{- if .Values.archestra.orchestrator.kubernetes.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "archestra-platform.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
  {{- with .Values.archestra.orchestrator.kubernetes.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.archestra.orchestrator.kubernetes.serviceAccount.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml .Values.archestra.orchestrator.kubernetes.serviceAccount.imagePullSecrets | nindent 2 }}
{{- end }}
{{- end }}
{{- if .Values.archestra.orchestrator.kubernetes.rbac.create }}
{{- $defaultRuntimeOwnerRoleName := include "archestra-platform.mcpRuntimeOwnerRoleName" . }}
{{- $runtimeOwnerRoleName := $defaultRuntimeOwnerRoleName }}
{{- if hasKey .Values.archestra.env "ARCHESTRA_ORCHESTRATOR_MCP_RUNTIME_OWNER_ROLE" }}
{{- $runtimeOwnerRoleName = trim (toString (default "" (get .Values.archestra.env "ARCHESTRA_ORCHESTRATOR_MCP_RUNTIME_OWNER_ROLE"))) }}
{{- end }}
{{- $runtimeOwnerRoleNames := list $defaultRuntimeOwnerRoleName }}
{{- if and $runtimeOwnerRoleName (ne $runtimeOwnerRoleName $defaultRuntimeOwnerRoleName) }}
{{- $runtimeOwnerRoleNames = append $runtimeOwnerRoleNames $runtimeOwnerRoleName }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "archestra-platform.mcpManagerRoleName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
rules:
{{ include "archestra-platform.mcpManagerRules" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "archestra-platform.mcpManagerRoleName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "archestra-platform.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "archestra-platform.mcpManagerRoleName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- /*
This narrow Role owns runtime resources by default and grants the platform read
access to an explicitly configured external owner. It remains during handoff so
deleting its UID cannot garbage-collect existing runtime resources.
*/}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $defaultRuntimeOwnerRoleName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
rules:
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles"]
  resourceNames: {{ $runtimeOwnerRoleNames | toJson }}
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $defaultRuntimeOwnerRoleName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "archestra-platform.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $defaultRuntimeOwnerRoleName }}
  apiGroup: rbac.authorization.k8s.io
{{- /*
Grant the platform ServiceAccount the same MCP-manager permissions in additional
namespaces (the K8s namespaces backing deployment environments). Each gets its own
namespace-scoped Role + RoleBinding; the binding's subject points back at the SA in
the release namespace. The release namespace is skipped — its Role/RoleBinding is
already created above, and re-emitting it would collide on name.
*/}}
{{- $mcpNamespace := .Values.archestra.orchestrator.kubernetes.namespace | default .Release.Namespace }}
{{- $managerNamespaces := concat (list $mcpNamespace) (.Values.archestra.orchestrator.kubernetes.rbac.environmentNamespaces | default (list)) | uniq }}
{{- range $ns := $managerNamespaces }}
{{- if ne $ns $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "archestra-platform.mcpManagerRoleName" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "archestra-platform.labels" $ | nindent 4 }}
rules:
{{ include "archestra-platform.mcpManagerRules" $ }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "archestra-platform.mcpManagerRoleName" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "archestra-platform.labels" $ | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "archestra-platform.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "archestra-platform.mcpManagerRoleName" $ }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $defaultRuntimeOwnerRoleName }}
  namespace: {{ $ns }}
  labels:
    {{- include "archestra-platform.labels" $ | nindent 4 }}
rules:
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles"]
  resourceNames: {{ $runtimeOwnerRoleNames | toJson }}
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $defaultRuntimeOwnerRoleName }}
  namespace: {{ $ns }}
  labels:
    {{- include "archestra-platform.labels" $ | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "archestra-platform.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $defaultRuntimeOwnerRoleName }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
{{- end }}
