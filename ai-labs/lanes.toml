# Lanes the benchmark can run. A lane is a named (provider, model) endpoint with its own key/base_url.
# Select a subset with `--lanes name1,name2`; omit `--lanes` to run every lane defined here.
#
# Fields:
#   name         unique slug, the selection handle and the lane's agent / log / artifact dir
#   provider     one of: anthropic, openai, gemini, openrouter (what the backend seeds the key as)
#   model        the model id to resolve on that provider
#   base_url         optional endpoint override (e.g. an Anthropic-compatible gateway)
#   api_key_env      optional env var holding the key (default: <PROVIDER>_API_KEY)
#   openrouter_model optional OpenRouter slug to price this lane against. An openrouter lane is priced
#                    off its own model; set this only to map a lane served elsewhere onto an OR
#                    offering. Unset on a non-openrouter lane ⇒ run cost is reported as n/a.
#   advisor          optional name of another lane in this file whose model serves as this lane's
#                    Advisor (the built-in agent the lane's agents may consult via delegation). The
#                    referenced lane must not itself be advised. An advised lane always runs on an
#                    isolated backend (the Advisor's model is per-backend state, so it cannot share
#                    one with concurrently running lanes), and its cost is the sum of both models'
#                    spend, each priced against its own slug.

