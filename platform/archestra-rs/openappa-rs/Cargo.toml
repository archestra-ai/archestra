[package]
name = "openappa_rs"
version = "0.1.0"
edition = "2024"
build = "build.rs"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Published combined OpenAPPA revision: adapter, hosted batteries, independent-root
# forks, and PostgreSQL connection pooling. The embedded reporting helper requires
# upstream's daemon feature.
appa-runtime = { package = "appa", git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "7c7293078fa0d09086fdd67f6d1dcdb7d6789b6a" }
appa-runtime-api = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "7c7293078fa0d09086fdd67f6d1dcdb7d6789b6a" }
appa-eventlog = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "7c7293078fa0d09086fdd67f6d1dcdb7d6789b6a", features = ["postgres"] }
appa-adapter-archestra = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "7c7293078fa0d09086fdd67f6d1dcdb7d6789b6a" }
appa-package = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "7c7293078fa0d09086fdd67f6d1dcdb7d6789b6a" }
napi = { version = "3", features = ["tokio_rt"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
tempfile = "3"
toml = "1.1"
tokio = { version = "1", features = ["sync", "time"] }
futures-util = "0.3"

[dev-dependencies]
# A paused clock: the connection-wait test does not spend its thirty seconds.
tokio = { version = "1", features = ["rt", "test-util"] }

[target.'cfg(target_env = "musl")'.dependencies]
# Cross-builds need OpenSSL compiled for musl. The Docker builder uses its
# installed OpenSSL through OPENSSL_NO_VENDOR instead.
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
napi-build = "2"
