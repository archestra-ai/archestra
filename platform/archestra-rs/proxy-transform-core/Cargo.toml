[package]
name = "proxy_transform_core"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
napi = ["dep:napi", "dep:napi-derive"]

[dependencies]
napi = { version = "3", optional = true }
napi-derive = { version = "3", optional = true }
serde_json = { version = "1", features = ["preserve_order"] }
toon-format = { version = "0.5.0", default-features = false }

[dev-dependencies]
criterion = "0.5"
proptest = "1"
# fixture (de)serialization in the golden-corpus test
serde = { version = "1", features = ["derive"] }

[[bench]]
name = "toon_kernel"
harness = false
