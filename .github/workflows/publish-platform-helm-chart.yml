name: Publish platform Helm chart

on:
  workflow_call:
    inputs:
      version:
        description: "Version tag for the Helm chart"
        required: true
        type: string
      push_chart:
        description: "Whether to push the Helm chart to the repository"
        required: true
        type: boolean
      checkout_ref:
        description: "Optional ref to checkout when packaging the chart"
        required: false
        type: string
        default: ""
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER:
        required: false
      GCP_SERVICE_ACCOUNT_NAME:
        required: false

permissions: {}

concurrency:
  group: publish-platform-helm-chart-${{ inputs.version }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # See here for inspiration on how this was put together:
  # https://medium.com/google-cloud/ci-gitops-with-helm-github-actions-google-artifact-registry-and-config-sync-b48604191fda
  publish-platform-helm-chart:
    name: Publish platform Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to package the chart from the checked-out repository.
      packages: write # Publish the OCI chart to GHCR.
    defaults:
      run:
        working-directory: ./platform/helm/archestra
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}

      - name: Log in to GHCR for Helm
        if: inputs.push_chart
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: helm package
        env:
          IMAGE_TAG: ${{ inputs.version }}
        run: |
          helm package . --version "$IMAGE_TAG" --app-version "$IMAGE_TAG"

      - name: Preserve chart for qualification and publication
        uses: $/.github/actions/github-upload-artifact
        with:
          name: release-helm-chart
          path: platform/helm/archestra/archestra-platform-${{ inputs.version }}.tgz
          if-no-files-found: error

      - name: helm push
        if: inputs.push_chart
        env:
          IMAGE_TAG: ${{ inputs.version }}
        run: |
          helm push "archestra-platform-${IMAGE_TAG}.tgz" oci://ghcr.io/archestra-ai/helm-charts
