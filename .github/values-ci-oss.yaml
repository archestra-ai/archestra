# OSS CI values for the Archestra Helm chart
# This file contains OSS-specific overrides for e2e tests.
# Must be used together with values-ci-base.yaml (base file applied first).
#
# Key differences from Enterprise:
# - ARCHESTRA_ENTERPRISE_LICENSE_ACTIVATED is "false"
# - ARCHESTRA_SECRETS_MANAGER is "DB" (no Vault)
# - Tests tagged with @enterprise are excluded

archestra:
  env:
    # OSS mode: enterprise license is NOT activated
    ARCHESTRA_ENTERPRISE_LICENSE_ACTIVATED: "false"
    # OSS mode: use database-based secrets manager (no Vault)
    ARCHESTRA_SECRETS_MANAGER: "DB"
