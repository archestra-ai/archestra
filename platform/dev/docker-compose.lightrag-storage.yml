# Neo4j and Qdrant for LightRAG integration
# Start with: tilt trigger lightrag-storage
# These services provide graph and vector storage for LightRAG MCP server

services:
  neo4j:
    image: neo4j:5-community
    container_name: archestra-neo4j
    ports:
      - "7474:7474"  # HTTP Browser
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j-data:/data
    networks:
      - archestra-lightrag
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: archestra-qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - archestra-lightrag
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Seed Neo4j with example knowledge graph data
  neo4j-seed:
    image: neo4j:5-community
    container_name: archestra-neo4j-seed
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./lightrag-seed:/seed:ro
    networks:
      - archestra-lightrag
    entrypoint: ["/bin/bash", "/seed/neo4j-seed.sh"]
    restart: "no"

  # Seed Qdrant with example vector data
  qdrant-seed:
    image: python:3.11-slim
    container_name: archestra-qdrant-seed
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./lightrag-seed:/seed:ro
    networks:
      - archestra-lightrag
    command: ["python", "/seed/qdrant-seed.py"]
    restart: "no"

volumes:
  neo4j-data:
  qdrant-data:

networks:
  archestra-lightrag:
    external: false
