apiVersion: v1
kind: Service
metadata:
  name: {{ include "archestra-platform.fullname" . }}
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: backend
      protocol: TCP
      name: backend
    - port: 3000
      targetPort: frontend
      protocol: TCP
      name: frontend
  selector:
    {{- include "archestra-platform.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "archestra-platform.fullname" . }}
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "archestra-platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "archestra-platform.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.archestra.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: backend
              containerPort: 9000
              protocol: TCP
            - name: frontend
              containerPort: 3000
              protocol: TCP
          env:
            {{- include "archestra-platform.env" . | nindent 12 }}
