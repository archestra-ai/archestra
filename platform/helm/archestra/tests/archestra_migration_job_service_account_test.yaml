suite: archestra migration job service account
templates:
  - migration-job-serviceaccount.yaml
  - migration-job.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: runs the migration job as the platform service account by default
    asserts:
      - hasDocuments:
          count: 0
        template: migration-job-serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-archestra-platform
        template: migration-job.yaml

  - it: creates a hook service account with the current platform identity
    template: migration-job-serviceaccount.yaml
    set:
      archestra.migrationJob.serviceAccount.create: true
      archestra.orchestrator.kubernetes.serviceAccount.annotations:
        iam.gke.io/gcp-service-account: platform@example-project.iam.gserviceaccount.com
      archestra.orchestrator.kubernetes.serviceAccount.imagePullSecrets:
        - name: registry-credentials
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-archestra-platform-migrate
      - equal:
          path: metadata.annotations
          value:
            iam.gke.io/gcp-service-account: platform@example-project.iam.gserviceaccount.com
            helm.sh/hook: pre-upgrade
            helm.sh/hook-weight: "-10"
            helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
      - equal:
          path: imagePullSecrets
          value:
            - name: registry-credentials

  - it: carries the IRSA role derived from database IAM auth
    template: migration-job-serviceaccount.yaml
    set:
      archestra.migrationJob.serviceAccount.create: true
      archestra.database.iamAuth.roleArn: arn:aws:iam::111122223333:role/archestra
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::111122223333:role/archestra

  - it: runs the migration job as the hook service account when enabled
    template: migration-job.yaml
    set:
      archestra.migrationJob.serviceAccount.create: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-archestra-platform-migrate

  - it: skips the hook service account when the migration job is disabled
    template: migration-job-serviceaccount.yaml
    set:
      archestra.migrationJob.enabled: false
      archestra.migrationJob.serviceAccount.create: true
    asserts:
      - hasDocuments:
          count: 0
