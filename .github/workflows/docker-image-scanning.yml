name: Docker Image Scanning

# Keep required contexts present on every PR/queue SHA. Only Release Please
# PRs and version-changing queue groups build candidates on both architectures.
# Publication independently scans its bytes; see ../release-image-security.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
  workflow_dispatch:
    inputs:
      image-sha:
        description: "Exact SHA tag produced by Platform E2E (PRs use the synthetic merge SHA)"
        required: true
        type: string

permissions: {}

concurrency:
  group: docker-image-scanning-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify release image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout scan policy and image sources.
    outputs:
      scan: ${{ steps.policy.outputs.scan }}
      matrix: ${{ steps.policy.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify event
        id: policy
        run: python3 .github/scripts/release-image-policy.py classify

  scan-release-images:
    name: Scan release candidate (${{ matrix.image }}, ${{ matrix.arch }})
    needs: [classify]
    if: ${{ needs.classify.outputs.scan == 'true' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify.outputs.matrix) }}
    env:
      IMAGE_NAME: ${{ matrix.image }}
      IMAGE_ARCH: ${{ matrix.arch }}
      IMAGE_REFERENCE: release-scan-${{ matrix.image }}:${{ github.sha }}
      CANDIDATE_DIR: ${{ github.workspace }}/.release-candidate
    steps:
      - name: Reclaim disk space (background)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup &
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Resolve release build inputs
        id: inputs
        run: python3 .github/scripts/release-candidate.py prepare
      - name: Build candidate locally
        uses: ./.github/actions/build-docker-image
        with:
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: "false"
          load: "true"
          tags: ${{ env.IMAGE_REFERENCE }}
          version: ${{ steps.inputs.outputs.version }}
          previous-image: ${{ steps.inputs.outputs.previous-image }}
          require-previous-assets: "true"
          turbo-team: ${{ secrets.TURBOREPO_REMOTE_CACHING_TEAM }}
          turbo-token: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
          sentry-auth-token: ${{ (matrix.image == 'platform' || matrix.image == 'platform-slim') && secrets.PLATFORM_NEXTJS_SOURCE_MAP_SENTRY_AUTH_TOKEN || '' }}
          cache-from: type=registry,ref=europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public/${{ matrix.image == 'platform-slim' && 'platform' || matrix.image }}:buildcache-${{ matrix.arch }}
      - name: Seal candidate bytes for scanning
        run: |
          docker save --output "$CANDIDATE_DIR/image.tar" "$IMAGE_REFERENCE"
          python3 .github/scripts/release-candidate.py seal
      - name: Verify candidate bytes
        id: image
        run: python3 .github/scripts/release-candidate.py verify
      - name: Scan exact candidate bytes
        id: scan
        uses: ./.github/actions/scan-docker-image
        with:
          image: ${{ steps.image.outputs.reference }}
          platform: linux/${{ matrix.arch }}
          dockerhub-user: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}
          exit-code: "true"
      - name: Record successful scan
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: python3 .github/scripts/release-candidate.py scanned
      - name: Retain exact scanned bytes
        uses: ./.github/actions/github-upload-artifact
        with:
          name: release-candidate-${{ matrix.image }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            ${{ env.CANDIDATE_DIR }}/image.tar
            ${{ env.CANDIDATE_DIR }}/build.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
      - name: Transfer scan evidence to gate
        uses: ./.github/actions/github-upload-artifact
        with:
          name: release-evidence-${{ matrix.image }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ env.CANDIDATE_DIR }}/evidence/*
          if-no-files-found: error
          retention-days: 1

  release-image-security:
    name: Release Image Security
    needs: [classify, scan-release-images]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout scan policy and image sources.
      pull-requests: read # Recheck the current release PR head and base after scanning.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download complete scan evidence
        if: ${{ needs.classify.outputs.scan == 'true' && needs.scan-release-images.result == 'success' }}
        uses: ./.github/actions/github-download-artifact
        with:
          pattern: release-evidence-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence
          merge-multiple: true
      - name: Require a complete scan for the current release PR revision
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SCAN_REQUIRED: ${{ needs.classify.outputs.scan }}
          SCAN_RESULT: ${{ needs.scan-release-images.result }}
          EVIDENCE_DIR: ${{ runner.temp }}/release-evidence
          CANDIDATE_INDEX: ${{ runner.temp }}/release-candidate-index.json
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release-image-policy.py gate

      - name: Retain complete successful candidate index
        if: ${{ needs.classify.outputs.scan == 'true' }}
        uses: ./.github/actions/github-upload-artifact
        with:
          name: release-candidate-index-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate-index.json
          if-no-files-found: error
          retention-days: 1

  # Compatibility bridge for current main/release rulesets. These jobs depend on
  # the fail-closed gate, so a skipped/failed scan cannot turn a release PR green.
  required-contexts:
    name: Docker Image Scanning (${{ matrix.name }})
    needs: [release-image-security]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [Platform, MCP Server Base, p4 Shim]
    steps:
      - name: Require release image security decision
        env:
          RESULT: ${{ needs.release-image-security.result }}
        run: test "$RESULT" = success

  # main also requires the historical unexpanded matrix name. Construct it
  # literally without expression interpolation; remove only after ruleset rollout.
  legacy-required-context:
    name: ${{ format('Docker Image Scanning ({0}{1}{1} matrix.name {2}{2})', '$', '{', '}') }} # zizmor: ignore[obfuscation] literal legacy required context contains Actions delimiters
    needs: [release-image-security]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require release image security decision
        env:
          RESULT: ${{ needs.release-image-security.result }}
        run: test "$RESULT" = success

  manual-platform-byte-scan:
    name: Manual Docker Image Scanning (Platform, byte-derived)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Required to checkout scan policy and image sources.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Scan exact full and slim Platform image bytes
        uses: ./.github/actions/scan-platform-image-bytes
        with:
          image-sha: ${{ inputs.image-sha }}
          dockerhub-user: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

  handoff-fixture:
    name: Build non-publishing handoff fixture
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'ci/release-gate-parity-') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout fixture policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Build harmless scratch-image archives
        env:
          FIXTURE_DIR: ${{ runner.temp }}/handoff-fixture
          FIXTURE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/release-handoff-fixture.py create
      - name: Retain non-publishing fixture
        uses: ./.github/actions/github-upload-artifact
        with:
          name: release-handoff-fixture-${{ github.run_attempt }}
          path: ${{ runner.temp }}/handoff-fixture/*
          if-no-files-found: error
          retention-days: 1
