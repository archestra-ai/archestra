services:
  postgres:
    image: bitnamisecure/postgresql:latest
    container_name: archestra-postgres
    environment:
      - POSTGRESQL_DATABASE=archestra_dev
      - POSTGRESQL_USERNAME=archestra
      - POSTGRESQL_PASSWORD=archestra_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archestra -d archestra_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: archestra-backend
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://archestra:archestra_dev_password@postgres:5432/archestra_dev?schema=public
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount migrations for runtime access
      - ./backend/src/database/migrations:/app/backend/src/database/migrations:ro
    command: sh -c "cd /app/backend && npx drizzle-kit migrate && cd /app && node backend/dist/server.js"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: archestra-frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:9000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
