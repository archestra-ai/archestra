{{- if and .Values.archestra.sre.enabled .Values.archestra.orchestrator.kubernetes.mcpServerRbac.create }}
---
# ServiceAccount for the SRE agent's read-only Kubernetes MCP server. It gets
# only the namespaced read-only Role, never the operator account's additional
# bindings.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "archestra-platform.fullname" . }}-sre
  namespace: {{ .Values.archestra.orchestrator.kubernetes.namespace | default .Release.Namespace }}
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: sre-serviceaccount
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "archestra-platform.fullname" . }}-sre
  namespace: {{ .Values.archestra.orchestrator.kubernetes.namespace | default .Release.Namespace }}
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: sre-serviceaccount
subjects:
- kind: ServiceAccount
  name: {{ include "archestra-platform.fullname" . }}-sre
  namespace: {{ .Values.archestra.orchestrator.kubernetes.namespace | default .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "archestra-platform.fullname" . }}-mcp-server-operator
  apiGroup: rbac.authorization.k8s.io
{{- if ne (.Values.archestra.orchestrator.kubernetes.namespace | default .Release.Namespace) .Release.Namespace }}
---
# The platform's own pods live in the release namespace, not the MCP namespace
# above, so the SRE agent gets the same read-only rules here too. A separate
# name: the binding above was once rendered here, and a RoleBinding's roleRef
# cannot change in place.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "archestra-platform.fullname" . }}-sre-platform-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: sre-serviceaccount
rules:
{{ include "archestra-platform.mcpServerOperatorRules" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "archestra-platform.fullname" . }}-sre-platform-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: sre-serviceaccount
subjects:
- kind: ServiceAccount
  name: {{ include "archestra-platform.fullname" . }}-sre
  namespace: {{ .Values.archestra.orchestrator.kubernetes.namespace | default .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "archestra-platform.fullname" . }}-sre-platform-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
