{{- $config := .Values.archestra.agentRuntime.imagePrepull }}
{{- range $image := ($config.images | uniq | sortAlpha) }}
{{- $name := printf "%s-agent-image-%s" (include "archestra-platform.fullname" $ | trunc 37 | trimSuffix "-") ($image | sha256sum | trunc 12) }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "archestra-platform.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ $name }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      automountServiceAccountToken: false
      {{- with $config.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $config.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $config.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with $config.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap
          image: {{ $config.bootstrapImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/cp", "/bin/busybox", "/prepull/true"]
          volumeMounts:
            - name: noop
              mountPath: /prepull
          securityContext: &security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources: &resources
            requests:
              cpu: 1m
              memory: 16Mi
            limits:
              memory: 64Mi
        - name: pull
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          # Execute the static noop, never the target image's entrypoint.
          command: ["/prepull/true"]
          volumeMounts:
            - name: noop
              mountPath: /prepull
              readOnly: true
          securityContext: *security
          resources: *resources
      containers:
        - name: keepalive
          image: {{ $config.bootstrapImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sleep", "infinity"]
          securityContext: *security
          resources: *resources
      volumes:
        - name: noop
          emptyDir:
            sizeLimit: 4Mi
{{- end }}
