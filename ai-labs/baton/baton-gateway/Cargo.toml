[package]
name = "baton-gateway"
version = "0.1.0"
edition = "2024"
publish = false
description = "MCP gateway demo over baton-core: soft-blocks policy-breaching tool calls, escalates to a human, dispatches the exact checked request"

# Standalone on purpose, like baton-core and baton-proxy: a demo harness for
# the baton prototype, not part of the archestra-bench workspace.
[workspace]

[features]
# The demo agent pulls a full agent framework (rig-core) and a real LLM; keep it
# off the default build so the gateway and its tests stay lean.
default = []
demo = [
    "dep:rig-core",
    "rig-core/rmcp",
    "rmcp/client",
    "rmcp/transport-streamable-http-client",
    "rmcp/transport-streamable-http-client-reqwest",
]

[dependencies]
baton-core = { path = "../baton-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "net"] }
axum = "0.8"
rmcp = { version = "1.7", features = ["server", "elicitation", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi"] }
thiserror = "2"
rig-core = { version = "0.39", optional = true }

[[bin]]
name = "baton-gateway"
path = "src/bin/gateway.rs"

[[bin]]
name = "baton-agent"
path = "src/bin/agent.rs"
required-features = ["demo"]
