[package]
name = "proxy_transform_core"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
napi = ["dep:napi", "dep:napi-derive"]

[dependencies]
itoa = "1"
napi = { version = "3", optional = true }
napi-derive = { version = "3", optional = true }
# de traits for the borrowed JSON DOM (src/json.rs); derive only in tests
serde = "1"
serde_json = "1"
# cl100k_base tokenizer for the fused keep/reject token counting (src/tokenize.rs),
# byte-identical ranks to the JS `tiktoken` get_encoding("cl100k_base") the
# adapters used. Pinned exact — the rank table is the parity contract.
tiktoken-rs = "=0.7.0"

[dev-dependencies]
criterion = "0.5"
proptest = "1"
# fixture (de)serialization in the golden-corpus test
serde = { version = "1", features = ["derive"] }
# preserve_order is oracle-only: the production parser builds its own ordered
# JsonObject, but tests compare against toon-format over serde_json::Value,
# which must see document key order. Keeping the feature out of [dependencies]
# drops indexmap from the production (napi) build.
serde_json = { version = "1", features = ["preserve_order"] }
# parity oracle for the encoder (differential + round-trip tests) — the
# production path uses only src/encode.rs
toon-format = { version = "0.5.0", default-features = false }

[[bench]]
name = "toon_kernel"
harness = false
