name: VEX Triage
run-name: Triage the vulnerabilities of ${{ inputs.project || 'every project' }} ${{ inputs.release_tag || '(latest stable release)' }}

# Starts the VEX Triage agent on staging for a release of each project in
# .github/scripts/vex-triage.py: archestra, OpenAPPA and
# terraform-provider-archestra (with its Crossplane package). The agent
# (archestra-ai/infra, archestra/automation) scans the release's public images,
# decides for each finding whether it affects the image as shipped, and opens
# or updates one pull request from automation/vex-triage in that project's
# repository, recording its decisions in vex/openvex.json. It never merges: a
# person reviews every statement. Each project's releases then attest their
# images' statements next to their SBOMs (archestra-ai/.github
# release-publish.yml, vex-document).
#
# It runs from here for every project because the federated credential, the
# Google account and the repository variables live here once.
#
# Weekly, for each project's latest stable release, because new advisories
# arrive for images that did not change. Run it by hand for one release.
#
# The job holds no Archestra API key and no GitHub credential beyond reading
# public repositories. It trades its GitHub OIDC token for a one-hour token of
# an Archestra service account that can only run that agent (workload identity
# federation). The agent's own GitHub App token never leaves Archestra.

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      project:
        description: Project whose release to triage.
        type: choice
        options: [archestra, openappa, terraform-provider-archestra]
        default: archestra
      release_tag:
        description: "Published release, such as platform-v1.4.35 or v0.44.0. Empty: the latest stable release."
        type: string
        default: ""

permissions: {}

jobs:
  plan:
    name: Choose the projects
    if: github.repository == 'archestra-ai/archestra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Check out the script.
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: List the projects
        id: projects
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          projects="$(python3 .github/scripts/vex-triage.py projects)"
          if [ -n "$PROJECT" ]; then
            projects="$(jq -c --arg project "$PROJECT" 'map(select(.project == $project))' <<<"$projects")"
          fi
          jq -e 'length > 0' <<<"$projects" > /dev/null
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  start:
    name: Start the VEX Triage agent for ${{ matrix.project.project }}
    needs: plan
    # The Archestra service account and the Google account trust this file on
    # main only; any other ref would be refused at sign-in.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Check out the scripts and read the releases.
      id-token: write # Sign in to Google Cloud (staging tunnel) and to Archestra.
    strategy:
      fail-fast: false
      # One run at a time: each run trades its own token, and the agent's
      # spend cap is per run.
      max-parallel: 1
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.projects) }}
    concurrency:
      group: vex-triage-${{ matrix.project.project }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # A draft is not a release yet: its images are not published. The
      # script checks the tag against the project's release tags.
      - name: Choose the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ matrix.project.repository }}
          STABLE_TAG: ${{ matrix.project.stable_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="$(gh release list --exclude-drafts --exclude-pre-releases --limit 50 --json tagName \
              | jq -r --arg stable "$STABLE_TAG" '[.[] | select(.tagName | test($stable))][0].tagName // empty')"
          fi
          [ -n "$RELEASE_TAG" ] || { echo "::error::No stable release of $GH_REPO."; exit 1; }
          draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          [ "$draft" = false ] || { echo "::error::$RELEASE_TAG of $GH_REPO is not published yet."; exit 1; }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      # The staging API is private. This account can open the IAP tunnel to
      # its TLS forwarder and nothing else.
      - name: Authenticate to Google Cloud
        uses: archestra-ai/.github/actions/google-auth@v1.25.2
        with:
          service_account: ${{ vars.VEX_TRIAGE_GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ vars.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Open the staging API tunnel
        run: .github/scripts/staging-api-tunnel.sh

      - name: Start the agent run
        env:
          PROJECT: ${{ matrix.project.project }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          BASE_URL: https://backend.archestra.dev
          PUBLIC_URL: https://frontend.archestra.dev
          SERVICE_ACCOUNT_ID: ${{ vars.VEX_TRIAGE_SERVICE_ACCOUNT_ID }}
          AGENT_ID: ${{ vars.VEX_TRIAGE_AGENT_ID }}
        run: python3 .github/scripts/vex-triage.py
