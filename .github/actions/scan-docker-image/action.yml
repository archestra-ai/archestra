name: Scan Docker Image
description: |
  Scans a Docker image for CVEs using Docker Scout.
  Fails if critical or high severity CVEs with available fixes are found.

inputs:
  image:
    description: "Docker image to scan (e.g., ghcr.io/org/repo:tag)"
    required: true
  dockerhub-user:
    description: "Docker Hub username for Scout authentication"
    required: true
  dockerhub-password:
    description: "Docker Hub password for Scout authentication"
    required: true
  only-severities:
    description: "Comma-separated list of severities to check"
    required: false
    default: "critical,high"
  only-fixed:
    description: "Only report CVEs with available fixes"
    required: false
    default: "true"
  exit-code:
    description: "Exit with non-zero code if vulnerabilities are found"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # First attempt is allowed to fail so a transient infrastructure error
    # (e.g. a 403 downloading the Scout binary release asset, which has kicked
    # PRs out of the merge queue) gets one retry. A genuine CVE finding fails
    # the retry identically, so real findings still fail the job.
    - name: Docker Scout CVE Check
      id: scout-first-attempt
      continue-on-error: true
      uses: docker/scout-action@7520205ff60037fdc436b40b6a1d1e55a839ec2d # v1.22.0
      with:
        command: cves
        image: ${{ inputs.image }}
        dockerhub-user: ${{ inputs.dockerhub-user }}
        dockerhub-password: ${{ inputs.dockerhub-password }}
        only-severities: ${{ inputs.only-severities }}
        only-fixed: ${{ inputs.only-fixed }}
        write-comment: false
        exit-code: ${{ inputs.exit-code }}

    - name: Docker Scout CVE Check (retry)
      if: steps.scout-first-attempt.outcome == 'failure'
      uses: docker/scout-action@7520205ff60037fdc436b40b6a1d1e55a839ec2d # v1.22.0
      with:
        command: cves
        image: ${{ inputs.image }}
        dockerhub-user: ${{ inputs.dockerhub-user }}
        dockerhub-password: ${{ inputs.dockerhub-password }}
        only-severities: ${{ inputs.only-severities }}
        only-fixed: ${{ inputs.only-fixed }}
        write-comment: false
        exit-code: ${{ inputs.exit-code }}
