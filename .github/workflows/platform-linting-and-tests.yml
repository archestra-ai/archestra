name: Platform Linting and Tests

on:
  workflow_call:
    inputs:
      should-skip-running-and-always-succeed:
        description: "Whether to force the checks to succeed"
        required: false
        type: boolean

jobs:
  platform-linting-and-tests:
    name: Platform Linting and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./platform
    steps:
      - name: Checkout project
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup environment
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: ./.github/actions/setup-env
        continue-on-error: ${{ inputs.should-skip-running-and-always-succeed }}
        with:
          working-directory: ./platform

      - name: Setup environment variables
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        run: cp .env.example .env

      - name: Type checking, linting, formatting checks
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        run: pnpm check:ci

  platform-e2e-tests:
    name: Platform e2e Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup environment
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: ./.github/actions/setup-env
        with:
          working-directory: ./platform

      - name: Set up Docker Buildx
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build Docker image
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./platform
          file: ./platform/Dockerfile
          push: false
          load: true
          tags: archestra/platform:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start platform with docker compose
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        run: |
          docker compose -f .github/testing/docker-compose-platform.yml up -d
          echo "=== Containers started ==="
          docker compose -f .github/testing/docker-compose-platform.yml ps
          echo ""
          echo "=== Waiting for services to initialize (30s) ==="
          sleep 30
          echo ""
          echo "=== Container status after wait ==="
          docker compose -f .github/testing/docker-compose-platform.yml ps
          echo ""
          echo "=== Quick log check for each container ==="
          docker logs archestra-platform-test --tail 50
          echo ""
          docker logs archestra-platform-test-custom-api-base-url --tail 50
          echo ""
          docker logs archestra-platform-test-custom-database-url --tail 50
          echo ""
          echo "=== Network inspection ==="
          docker network inspect testing_default || echo "Network not found"
          echo ""
          echo "=== Port bindings ==="
          docker port archestra-platform-test || echo "Container not running"
          docker port archestra-platform-test-custom-api-base-url || echo "Container not running"
          docker port archestra-platform-test-custom-database-url || echo "Container not running"

      # E2e tests start
      - name: Install Playwright browsers
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        working-directory: ./platform/e2e-tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        working-directory: ./platform
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: platform/e2e-tests/playwright-report/
          retention-days: 30
      # E2e tests end

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Container Status ==="
          docker compose -f .github/testing/docker-compose-platform.yml ps
          echo ""
          echo "=== Platform Container (default - port 9000) Logs ==="
          docker logs archestra-platform-test || echo "Container not found"
          echo ""
          echo "=== Platform Container (custom API URL - port 9001) Logs ==="
          docker logs archestra-platform-test-custom-api-base-url || echo "Container not found"
          echo ""
          echo "=== Platform Container (custom DB - port 9002) Logs ==="
          docker logs archestra-platform-test-custom-database-url || echo "Container not found"
          echo ""
          echo "=== PostgreSQL Container Logs ==="
          docker logs archestra-platform-test-postgresql || echo "Container not found"
          echo ""
          echo "=== All Container Stats ==="
          docker stats --no-stream --format "table {{.Container}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.NetIO}}\t{{.BlockIO}}"
          echo ""
          echo "=== Port bindings check ==="
          docker port archestra-platform-test || echo "Container not running"
          docker port archestra-platform-test-custom-api-base-url || echo "Container not running"
          docker port archestra-platform-test-custom-database-url || echo "Container not running"
          echo ""
          echo "=== Network connectivity from host ==="
          for port in 9000 9001 9002 3000 3001 3002; do
            echo "Testing port $port..."
            nc -zv localhost $port 2>&1 || echo "Port $port not accessible"
          done

      - name: Cleanup
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        run: |
          docker compose -f .github/testing/docker-compose-platform.yml down -v

  helm-chart-linting-and-tests:
    name: Helm Chart Linting and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./platform/helm
    steps:
      - name: Checkout project
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Linting
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        run: helm lint .

      - name: Tests
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git
          helm unittest .

      - name: helm package
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        # NOTE: can't use ${{ github.sha }} for version here because it's not a valid version number
        # and helm package explicitly checks this
        run: |
          helm package . --version v0.0.1 --app-version v0.0.1

  verify-codegen-code-is-up-to-date:
    name: Verify generated code is up to date
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./platform
    steps:
      - name: Checkout project
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Only use PR head ref if it's not from a fork (forks can't push back to the original repo)
          ref: ${{ github.event.pull_request.head.repo.fork == false && github.event.pull_request.head.ref || '' }}

      - name: Setup environment
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: ./.github/actions/setup-env
        with:
          working-directory: ./platform

      - name: Check for codegen'd changes
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        run: |
          pnpm codegen:api-client
          pnpm lint

          # Check both unstaged and staged changes
          if ! git diff --exit-code || ! git diff --cached --exit-code; then
            echo "::error::Generated code is not up to date. Please run 'pnpm codegen:api-client' locally and commit the changes."
            exit 1
          else
            echo "Generated code is up to date"
            echo "codegen-changes=false" >> $GITHUB_OUTPUT
          fi

  verify-no-pending-database-migrations:
    name: Verify no pending database migrations
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./platform
    steps:
      - name: Checkout project
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          # Only use PR head ref if it's not a PR from a fork (forks can't push back to the original repo)
          ref: ${{ github.event.pull_request.head.repo.fork == false && github.event.pull_request.head.ref || '' }}

      - name: Setup environment
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        uses: ./.github/actions/setup-env
        with:
          working-directory: ./platform

      - name: Verify no pending database migrations
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        id: db-migration-check
        run: |
          # Run db generate with timeout to prevent hanging on interactive prompts
          set +e  # Don't exit on command failure

          echo "Running pnpm db generate -- awaiting up to 15 seconds for a potential drizzle-kit generate interactive prompt (which could indicate a pending database migration, such as a table rename)"

          # Use timeout and expect no interaction - if it hangs, it means there's a pending migration which requires
          # user input to continue
          if timeout 15s pnpm db generate > /tmp/db_generate_output.txt 2>&1; then
            # Command completed successfully within timeout
            output=$(cat /tmp/db_generate_output.txt)
            echo "Output from pnpm db generate:"
            echo "$output"

            # Check if there's an interactive prompt in the output (shouldn't happen if it completed)
            if echo "$output" | grep -q "❯\|Is.*table created or renamed"; then
              echo "❌ Interactive prompt detected - there are pending database migrations that need to be committed"
              echo "Run 'pnpm db generate' locally, make your choices, and commit the resulting migration files"
              exit 1
            fi
          else
            # Command timed out or failed
            exit_code=$?
            output=$(cat /tmp/db_generate_output.txt 2>/dev/null || echo "No output captured")

            echo "Output from pnpm db generate (before timeout/failure):"
            echo "$output"

            if [ $exit_code -eq 124 ]; then
              # Timeout occurred - likely waiting for interactive input
              echo "❌ Command timed out - likely waiting for interactive input about pending database migrations"
              echo "Run 'pnpm db generate' locally, make your choices, and commit the resulting migration files"
            else
              echo "❌ pnpm db generate failed with exit code $exit_code"
            fi
            exit 1
          fi

          set -e  # Re-enable exit on error

          # Check both unstaged and staged changes
          if ! git diff --exit-code || ! git diff --cached --exit-code; then
            echo "New migration files were generated - committing changes"
            echo "db-migration-check=true" >> $GITHUB_OUTPUT
          else
            echo "No new migration files were generated"
            echo "db-migration-check=false" >> $GITHUB_OUTPUT
          fi

      - name: Ensure database migrations run successfully
        if: ${{ inputs.should-skip-running-and-always-succeed != true }}
        run: pnpm db migrate

      - name: Add and commit database migration changes
        # Only commit if changes exist and it's not a PR from a fork
        if: steps.db-migration-check.outputs.db-migration-check == 'true' && github.event.pull_request.head.repo.fork == false
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9.1.4
        with:
          message: "chore: update database migrations"
          committer_name: GitHub Actions
          committer_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Fail if PR from a fork has uncommitted migration changes
        if: steps.db-migration-check.outputs.db-migration-check == 'true' && github.event.pull_request.head.repo.fork == true
        run: |
          echo "::error::Database migrations need to be generated. Please run 'pnpm db:generate' locally and commit the changes."
          exit 1
