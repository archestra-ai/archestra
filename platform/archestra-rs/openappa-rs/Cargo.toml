[package]
name = "openappa_rs"
version = "0.1.0"
edition = "2024"
build = "build.rs"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# OpenAPPA v0.35.1: conditional publication (#685), the replay-only
# appa/do_something call (#670), the [aliases]
# table (#666), void returns for marked spawns (#665), typed refusal classes
# (#681), live policy revisions with snapshot views (#677); then on main,
# replay steps without `expect` (#688) and the deployment targets each
# battery lists (#691), loopback requests staying local (#692),
# parallel subagent spawns waiting for the earlier bind (#694), and plain
# errors for tool names that identify no tool (#698), `[aliases.tool]` (#696)
# and the generic coding battery (#697); then v0.37.0 and libpq TLS
# parameters (`sslmode=verify-full`, `sslrootcert`) in the PostgreSQL URL (#710),
# the attestation offered only where the parent covers its rank (#713),
# and the archestra battery's agent-run rules (#716); then explicit
# no-remedy refusal feedback (#720), a failed subagent reported as stopped
# (#722), and plaintext receipts that hold U+0000 stored under the plaintext
# escape (#724); then v0.38.0 and the remedy's vouch spent at its claim
# (#725), shorter block feedback (#726), the replay stand-in (#739), a
# subagent's return declared without review or ahead of its spawn (#763), and
# the required readers named in reviews and block reasons (#764); then
# v0.38.1 and zip 9, which fixes the archive extract advisories (#680); then
# context-provider answers trimmed largest first (#769), refusal detail in
# provider errors (#770), more shell shapes for the GitHub provider (#771),
# the consult budget in `APPA_CONSULT_TIMEOUT_MS` (#772), and context-provider
# and deployment hints (#773), and the GitHub context provider answering the
# GH_TOKEN, git config, assignment, and heredoc shapes it used to decline (#775);
# then the annotator label-guide fixes and the claude-code verdict cache (#782),
# result trust judged by open-write surfaces (#783), a narrowing's impact
# that leaves per-call labeled tools unjudged (#784), and a peer read admitted
# under unscoped output sanitizers while its result is not confined (#786).
appa-runtime = { package = "appa", git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "a277e91a1f9419da54efea7fcad3993d1026e8f6", features = ["archestra"] }
appa-runtime-api = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "a277e91a1f9419da54efea7fcad3993d1026e8f6" }
appa-eventlog = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "a277e91a1f9419da54efea7fcad3993d1026e8f6", features = ["postgres"] }
appa-package = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "a277e91a1f9419da54efea7fcad3993d1026e8f6" }
opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics", "experimental_metrics_custom_reader", "spec_unstable_metrics_views"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
napi = { version = "3", features = ["tokio_rt"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
tempfile = "3"
toml = "1.1"
# The runtime's own editor speaks this document type; reading a root's declarations
# with their spans needs the same version the runtime holds.
toml_edit = "0.25"
tokio = { version = "1", features = ["sync", "time", "rt", "net", "io-util"] }
futures-util = "0.3"
# Stream bounded receipt lookups through the store's existing PostgreSQL client.
postgres = "0.19"
# The owner id a dispatch leases its receipts under; tests also build consult records with it.
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
# A paused clock: the connection-wait test does not spend its thirty seconds.
tokio = { version = "1", features = ["rt", "test-util"] }
proptest = "1"

[target.'cfg(target_env = "musl")'.dependencies]
# Cross-builds need OpenSSL compiled for musl. The Docker builder uses its
# installed OpenSSL through OPENSSL_NO_VENDOR instead.
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
napi-build = "2"
