name: On commits to main

on:
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "platform/**"
  # Allow manual triggering of the workflow
  workflow_dispatch:

# Set default permissions to empty to enforce least privilege
# Each job will explicitly declare the permissions it needs
permissions: {}

# Concurrency is handled per-job (below) rather than per-workflow so that a new
# commit doesn't have to wait for the previous run to finish end-to-end:
#   - builds for superseded commits are cancelled (safe: images are pushed
#     per-sha and the newer commit contains the older one's changes)
#   - deploys are NEVER cancelled mid-flight (killing `helm upgrade` leaves the
#     release stuck in a pending-upgrade state); instead they queue, and GitHub
#     keeps at most one pending job per group, cancelling older pending ones, so
#     queued deploys collapse to the newest commit

jobs:
  deploy-dev-platform-images:
    name: Build Platform Staging and MCP Server Base Images
    # A newer commit's build supersedes an in-flight one, so cancel it and let
    # the build for the newest commit start immediately (it can also run while
    # the previous commit's deploy is still in progress)
    concurrency:
      group: on-commits-to-main-build-${{ github.ref }}
      cancel-in-progress: true
    uses: $/.github/workflows/deploy-dev-platform-images.yml
    permissions:
      contents: read # Required to invoke the reusable image publishing workflow.
      packages: write # Publish development images and build caches to GHCR.
      id-token: write # Required for Workload Identity Federation.
    with:
      version: ${{ github.sha }}
    secrets:
      DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME: ${{ vars.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
      DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER: ${{ vars.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}

  deploy-to-staging:
    name: Deploy to staging
    needs: [deploy-dev-platform-images]
    # Do not cancel an in-flight Helm upgrade; pending runs collapse to the latest commit.
    concurrency:
      group: on-commits-to-main-deploy-${{ github.ref }}
      cancel-in-progress: false
    uses: $/.github/workflows/deploy-platform-environment.yml
    permissions:
      contents: read # Required by the reusable workflow to check out the chart.
      id-token: write # Required for Google Workload Identity Federation.
    with:
      environment: staging
      version: ${{ github.sha }}
    secrets:
      GCP_DEPLOY_SERVICE_ACCOUNT_NAME: ${{ vars.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER: ${{ vars.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}
      AUTH_ADMIN_EMAIL: ${{ secrets.ARCHESTRA_STAGING_AUTH_ADMIN_EMAIL }}
      AUTH_ADMIN_PASSWORD: ${{ secrets.ARCHESTRA_STAGING_AUTH_ADMIN_PASSWORD }}
      METRICS_SECRET: ${{ secrets.ARCHESTRA_STAGING_METRICS_SECRET }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.ARCHESTRA_STAGING_OTEL_EXPORTER_OTLP_ENDPOINT }}
      AUTH_SECRET: ${{ secrets.ARCHESTRA_STAGING_AUTH_SECRET }}
      BACKEND_DSN: ${{ secrets.ARCHESTRA_STAGING_SENTRY_BACKEND_DSN }}
      FRONTEND_DSN: ${{ secrets.ARCHESTRA_STAGING_SENTRY_FRONTEND_DSN }}
      OUTLOOK_TENANT_ID: ${{ secrets.ARCHESTRA_STAGING_OUTLOOK_TENANT_ID }}
      OUTLOOK_CLIENT_ID: ${{ secrets.ARCHESTRA_STAGING_OUTLOOK_CLIENT_ID }}
      OUTLOOK_CLIENT_SECRET: ${{ secrets.ARCHESTRA_STAGING_OUTLOOK_CLIENT_SECRET }}
      CHAT_ANTHROPIC_API_KEY: ${{ secrets.ARCHESTRA_STAGING_CHAT_ANTHROPIC_API_KEY }}
      MICROSOFT_365_COPILOT_CLIENT_ID: ${{ secrets.ARCHESTRA_STAGING_MICROSOFT_365_COPILOT_CLIENT_ID }}
      MICROSOFT_365_COPILOT_TENANT_ID: ${{ secrets.ARCHESTRA_STAGING_MICROSOFT_365_COPILOT_TENANT_ID }}
      MFILES_VAF_ADD_ON_GITHUB_TOKEN: ${{ secrets.ARCHESTRA_STAGING_MFILES_VAF_ADD_ON_GITHUB_TOKEN }}
      CONTENT_ENCRYPTION_SECRET: ${{ secrets.ARCHESTRA_STAGING_CONTENT_ENCRYPTION_SECRET }}

  deploy-to-demo:
    name: Deploy demo instance
    needs: [deploy-dev-platform-images]
    concurrency:
      group: on-commits-to-main-demo-${{ github.ref }}
      cancel-in-progress: false
    uses: $/.github/workflows/deploy-platform-environment.yml
    permissions:
      contents: read # Required by the reusable workflow to check out the chart.
      id-token: write # Required for Google Workload Identity Federation.
    with:
      environment: demo
      version: ${{ github.sha }}
    secrets:
      GCP_DEPLOY_SERVICE_ACCOUNT_NAME: ${{ vars.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER: ${{ vars.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}
      AUTH_ADMIN_EMAIL: ${{ secrets.ARCHESTRA_DEMO_AUTH_ADMIN_EMAIL }}
      AUTH_ADMIN_PASSWORD: ${{ secrets.ARCHESTRA_DEMO_AUTH_ADMIN_PASSWORD }}
      MFILES_VAF_ADD_ON_GITHUB_TOKEN: ${{ secrets.ARCHESTRA_STAGING_MFILES_VAF_ADD_ON_GITHUB_TOKEN }}

  # Publishes an exact-source cache of backend NAPI binaries on main so fresh
  # PR and merge-group runs can skip the much larger Cargo target restore.
  # On a miss, the existing Cargo cache and build remain the fallback.
  # See backend-test-dependencies in on-pull-requests.yml for the consumer.
  warm-backend-build-cache:
    name: Warm Backend Build Cache
    runs-on: ubicloud-standard-8-ubuntu-2404
    timeout-minutes: 20
    concurrency:
      group: on-commits-to-main-warm-backend-cache
      # Finish publishing the cache; newer pending commits collapse to the latest.
      cancel-in-progress: false
    permissions:
      contents: read # Check out sources for the exact-source declaration cache.
      packages: write # Publish declarations to GHCR.
    defaults:
      run:
        working-directory: ./platform
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup environment
        uses: $/.github/actions/setup-env
        with:
          working-directory: ./platform

      - name: Restore backend NAPI binaries
        id: native-cache
        uses: $/.github/actions/cache-backend-napi

      # shared-key must stay identical to the backend preparation job's.
      - name: Cache cargo registry and target on native cache miss
        if: steps.native-cache.outputs.usable != 'true'
        uses: $/.github/actions/setup-rust-build
        with:
          workspaces: platform/archestra-rs
          shared-key: backend-unit-tests

      # Retry pattern mirrors backend preparation (rustup race on cold builds).
      - name: Build backend workspace dependencies
        if: steps.native-cache.outputs.usable != 'true'
        run: |
          pnpm exec turbo build --filter="@backend^..." || {
            echo "Build failed — syncing pinned Rust toolchain and retrying once..."
            rustup show
            pnpm exec turbo build --filter="@backend^..."
          }

      # Walk the solution even when Turbo has cached a successful dependency
      # check: the portable artifact also needs shared/linter declarations.
      - name: Build portable backend declarations
        run: pnpm --dir backend type-check

      - name: Pack portable backend declarations
        run: node scripts/backend-types-prebuilt.mjs --pack "$RUNNER_TEMP/backend-types-cache"

      # Forks and the private mirror cannot write the public org's packages.
      - name: Log in to GHCR
        if: github.repository == 'archestra-ai/archestra'
        uses: $/.github/actions/docker-login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish portable backend declarations
        if: github.repository == 'archestra-ai/archestra'
        env:
          REPOSITORY: ghcr.io/archestra-ai/ci/backend-types-cache
        run: |
          key="$(node scripts/backend-types-prebuilt.mjs --key)"
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$REPOSITORY:$key" --push --file - "$RUNNER_TEMP/backend-types-cache" <<'EOF'
          FROM scratch
          COPY backend-types.json /
          EOF

  # The only writer of the Turbo cache that Platform Lint and Unit Tests
  # (on-pull-requests.yml) restores. Pull-request and merge-group runs never
  # save it, so a cache hit there replays a result main produced. It runs the
  # same Turbo check tasks on the same runner image, so task hashes match for
  # every package a merge group leaves unchanged. Production builds are left
  # out: their .next and dist outputs would make each entry hundreds of MB.
  warm-turbo-cache:
    name: Warm Turbo Cache
    runs-on: ubicloud-standard-16-ubuntu-2404
    timeout-minutes: 20
    concurrency:
      group: on-commits-to-main-warm-turbo-cache
      # Readers use the newest entry, so a newer commit supersedes this one.
      cancel-in-progress: true
    permissions:
      contents: read # Check out sources and fetch the default branch.
    defaults:
      run:
        working-directory: ./platform
    env:
      # Nothing is restored, so each entry holds only this commit's results.
      TURBO_CACHE_DIR: ${{ github.workspace }}/platform/.turbo/cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup environment
        uses: $/.github/actions/setup-env
        with:
          working-directory: ./platform

      # The backend check:commit migration linter diffs against
      # origin/<default branch>; see the same step in Platform Lint and Unit Tests.
      - name: Fetch base ref for migration checks
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git -c credential.helper= \
              -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
              fetch --depth=1 origin \
              "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"

      - name: Restore Rust build cache
        uses: $/.github/actions/setup-rust-build
        with:
          workspaces: platform/archestra-rs
          shared-key: backend-unit-tests
          save-if: "false"

      # --continue lets the other tasks finish and be cached when one fails.
      - name: Run Platform Lint and Unit Tests Turbo checks
        run: |
          status=0
          pnpm exec turbo check:commit --filter=@backend --continue || status=$?
          pnpm exec turbo check:ci --filter=!@backend --continue || status=$?
          exit "$status"

      # Turbo stores only successful tasks, so a partial run is safe to save.
      - name: Save Turbo cache
        if: ${{ !cancelled() }}
        uses: $/.github/actions/turbo-cache
        with:
          name: platform-lint
          mode: save
