# Stages a platform release image in ghcr.io/archestra-ai/ci/<image_name>:
# platform (the docker run image) or platform-slim (the Kubernetes image). The
# archestra-ai/release-publisher publisher copies the attested digest to
# docker.io/archestra/platform (platform-slim as its <version>-slim tag); this
# repository cannot write there.
name: Build platform release image

on:
  workflow_call:
    inputs:
      image_directory:
        description: "Directory containing the Dockerfile"
        required: true
        type: string
      image_name:
        description: "Name of the Docker image"
        required: true
        type: string
      target:
        description: "Dockerfile target stage; empty for the last (the docker run image)"
        required: false
        type: string
        default: ""
      version:
        description: "Version tag for the Docker image"
        required: true
        type: string
      previous_version:
        description: "Previous release on this branch to carry frontend chunks from; empty skips the carry-over"
        required: false
        type: string
        default: ""
      push_image:
        description: "Whether to push the image to the ci/ staging registry"
        required: true
        type: boolean
      checkout_ref:
        description: "Optional ref to checkout when building the image"
        required: false
        type: string
        default: ""
      environment:
        description: "GitHub Environment for the build jobs (release-publish for releases, like the companion images); empty for none"
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: build-platform-release-image-${{ inputs.image_name }}-${{ inputs.version }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-platform-release-image:
    name: Build platform release image
    permissions:
      packages: write # Push to the ci/ staging registry.
      contents: read # Required to checkout the repository and build the image.
      id-token: write # Required for Workload Identity Federation when pushing images.
      attestations: write # Passed to the image build, which attests CI images.
    uses: $/.github/workflows/build-native-multi-arch-image.yml
    with:
      environment: ${{ inputs.environment }}
      image_directory: ${{ inputs.image_directory }}
      image_name: ${{ inputs.image_name }}
      target: ${{ inputs.target }}
      image_registry: ghcr.io/archestra-ai/ci
      version: ${{ inputs.version }}
      push_image: ${{ inputs.push_image }}
      auth_provider: ghcr
      # Docker contexts exclude .git, and release builds use an explicit tag.
      # Fetching the full repository history adds ~30s to each native build.
      checkout_fetch_depth: 1
      # Release ARM cache export took 169s in a sampled run. Keep mode=max
      # intermediate layers, but compress new cache layers quickly with zstd.
      # The published image retains its existing gzip output format.
      cache_compression: zstd
      checkout_ref: ${{ inputs.checkout_ref }}
      # Match the 16-core E2E builder; build arm64 natively.
      amd64_runner: ubuntu-24.04-16core
      arm64_runner: ubuntu-24.04-arm-32core
      # Both images serve the same frontend chunks; the previous docker run
      # image always exists, unlike a first -slim release's predecessor.
      previous_image: ${{ inputs.previous_version && format('docker.io/archestra/platform:{0}', inputs.previous_version) || '' }}
