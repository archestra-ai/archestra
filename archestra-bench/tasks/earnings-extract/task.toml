[[stages]]
text = """Hi — I've attached our latest earnings PDF, quarterly_earnings.pdf (Acme Corp, Q1 2026). Can you pull the numbers I need for a quick model and hand them back with submit_result?

From the income-statement highlights I need these figures, all dollar amounts in millions ($M) to one decimal: total_revenue, product_revenue, services_revenue, gross_profit, gross_margin_pct (a percentage, e.g. 61.3), operating_income, net_income, adjusted_ebitda, and eps_diluted (dollars per share, e.g. 0.34). Put them in an object called income_statement under exactly those keys.

From the segment performance table I need one entry per geographic segment, listed in this order: North America, Europe, APAC, Rest of World. For each give name, rev_2026 and rev_2025 (the Q1 2026 and Q1 2025 revenue in $M to one decimal), and yoy_growth_pct — which you must COMPUTE yourself as (rev_2026 - rev_2025) / rev_2025 * 100, rounded to 1 decimal (do not just copy the YoY column). Put these as a list called segments, and also give segment_total_2026 = the sum of the four rev_2026 values (it should reconcile to total_revenue).

From the key operating metrics I need an object called kpis with exactly these keys (plain numbers, no units or separators): total_customers, net_revenue_retention_pct, arr_usd_m (annual recurring revenue in $M), customer_acquisition_cost_usd, avg_revenue_per_customer_usd, churn_rate_pct, gross_revenue_retention_pct, employees."""

  [[stages.files]]
  src = "quarterly_earnings.pdf"
  dest = "/home/sandbox/attachments/quarterly_earnings.pdf"
  mime_type = "application/pdf"

[result_schema]
type = "object"
required = ["income_statement", "segments", "segment_total_2026", "kpis"]
additionalProperties = false

  [result_schema.properties.income_statement]
  type = "object"
  required = ["total_revenue", "product_revenue", "services_revenue", "gross_profit", "gross_margin_pct", "operating_income", "net_income", "adjusted_ebitda", "eps_diluted"]
  additionalProperties = false

    [result_schema.properties.income_statement.properties.total_revenue]
    type = "number"

    [result_schema.properties.income_statement.properties.product_revenue]
    type = "number"

    [result_schema.properties.income_statement.properties.services_revenue]
    type = "number"

    [result_schema.properties.income_statement.properties.gross_profit]
    type = "number"

    [result_schema.properties.income_statement.properties.gross_margin_pct]
    type = "number"

    [result_schema.properties.income_statement.properties.operating_income]
    type = "number"

    [result_schema.properties.income_statement.properties.net_income]
    type = "number"

    [result_schema.properties.income_statement.properties.adjusted_ebitda]
    type = "number"

    [result_schema.properties.income_statement.properties.eps_diluted]
    type = "number"

  [result_schema.properties.segments]
  type = "array"
  minItems = 4
  maxItems = 4

    [result_schema.properties.segments.items]
    type = "object"
    required = ["name", "rev_2026", "rev_2025", "yoy_growth_pct"]
    additionalProperties = false

      [result_schema.properties.segments.items.properties.name]
      type = "string"

      [result_schema.properties.segments.items.properties.rev_2026]
      type = "number"

      [result_schema.properties.segments.items.properties.rev_2025]
      type = "number"

      [result_schema.properties.segments.items.properties.yoy_growth_pct]
      type = "number"

  [result_schema.properties.segment_total_2026]
  type = "number"

  [result_schema.properties.kpis]
  type = "object"
  required = ["total_customers", "net_revenue_retention_pct", "arr_usd_m", "customer_acquisition_cost_usd", "avg_revenue_per_customer_usd", "churn_rate_pct", "gross_revenue_retention_pct", "employees"]
  additionalProperties = false

    [result_schema.properties.kpis.properties.total_customers]
    type = "number"

    [result_schema.properties.kpis.properties.net_revenue_retention_pct]
    type = "number"

    [result_schema.properties.kpis.properties.arr_usd_m]
    type = "number"

    [result_schema.properties.kpis.properties.customer_acquisition_cost_usd]
    type = "number"

    [result_schema.properties.kpis.properties.avg_revenue_per_customer_usd]
    type = "number"

    [result_schema.properties.kpis.properties.churn_rate_pct]
    type = "number"

    [result_schema.properties.kpis.properties.gross_revenue_retention_pct]
    type = "number"

    [result_schema.properties.kpis.properties.employees]
    type = "number"

[verifier]
deps = []
