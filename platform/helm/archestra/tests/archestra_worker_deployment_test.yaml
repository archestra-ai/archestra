suite: archestra worker deployment
templates:
  - archestra-worker.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: omits the worker deployment when maintenance mode is enabled
    set:
      archestra.env:
        ARCHESTRA_MAINTENANCE_MODE_MESSAGE: "Scheduled maintenance"
    asserts:
      - hasDocuments:
          count: 0

  - it: worker deployment has default resources configured
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ARCHESTRA_PROCESS_TYPE
            value: worker
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "2"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "1Gi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "2Gi"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ARCHESTRA_NODE_MEMORY_REQUEST_MIB
            valueFrom:
              resourceFieldRef:
                containerName: archestra-platform-worker
                resource: requests.memory
                divisor: 1Mi
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ARCHESTRA_NODE_MEMORY_LIMIT_MIB
            valueFrom:
              resourceFieldRef:
                containerName: archestra-platform-worker
                resource: limits.memory
                divisor: 1Mi

  - it: worker deployment uses percentage-based rolling update defaults
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: "25%"
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: "25%"

  - it: worker deployment inherits global pod annotations
    set:
      archestra.podAnnotations:
        sidecar.istio.io/inject: "true"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["sidecar.istio.io/inject"]
          value: "true"

  - it: worker deployment merges global and worker pod annotations
    set:
      archestra.podAnnotations:
        sidecar.istio.io/inject: "true"
      archestra.worker.podAnnotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["sidecar.istio.io/inject"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["cluster-autoscaler.kubernetes.io/safe-to-evict"]
          value: "true"

  - it: worker deployment forces prometheus scrape port and path to worker metrics endpoint
    set:
      archestra.podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9050"
        prometheus.io/path: "/custom"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "9000"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/path"]
          value: "/metrics"

  - it: worker-specific prometheus scrape annotation also forces worker metrics endpoint
    set:
      archestra.worker.podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9050"
        prometheus.io/path: "/custom"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "9000"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/path"]
          value: "/metrics"

  - it: worker deployment inherits global pod labels
    set:
      archestra.podLabels:
        azure.workload.identity/use: "true"
    asserts:
      - equal:
          path: spec.template.metadata.labels["azure.workload.identity/use"]
          value: "true"

  - it: worker mounts diagnostics volume and env var when diagnostics are enabled
    set:
      archestra.diagnostics.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ARCHESTRA_NODE_DIAGNOSTIC_DIR
            value: /var/diagnostics
      - contains:
          path: spec.template.spec.volumes
          content:
            name: diagnostics
            persistentVolumeClaim:
              claimName: RELEASE-NAME-archestra-platform-diagnostics
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: diagnostics
            mountPath: /var/diagnostics
            readOnly: false

  - it: worker receives code runtime enabled env var but no runner host by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ARCHESTRA_CODE_RUNTIME_ENABLED
            value: "true"
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: ARCHESTRA_CODE_RUNTIME_DAGGER_RUNNER_HOST

  - it: worker receives the code runtime kill switch when disabled
    set:
      archestra.codeRuntime.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ARCHESTRA_CODE_RUNTIME_ENABLED
            value: "false"
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: ARCHESTRA_CODE_RUNTIME_DAGGER_RUNNER_HOST

  - it: worker sets ARCHESTRA_KNOWLEDGE_BASE_PERFORCE_SHIM_IMAGE env var when perforceShim image is configured
    set:
      archestra.knowledgeBase.perforceShim.image: "my-registry/p4-shim:v1.0.0"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ARCHESTRA_KNOWLEDGE_BASE_PERFORCE_SHIM_IMAGE
            value: "my-registry/p4-shim:v1.0.0"

  - it: worker sets heap snapshot env var when diagnostics heap snapshots are enabled
    set:
      archestra.diagnostics.enabled: true
      archestra.diagnostics.heapSnapshotsNearHeapLimit: 1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ARCHESTRA_NODE_HEAPSNAPSHOT_NEAR_HEAP_LIMIT
            value: "1"

  # The worker runs a single Node process, so it owns its whole memory limit and
  # must keep the unreserved old-space ceiling. Reserving here would shrink its
  # heap to pay for a frontend it does not run.
  - it: worker does not reserve memory for a co-located frontend
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: ARCHESTRA_NODE_MEMORY_RESERVED_MIB

  - it: worker supports overriding the wait-for-postgres image
    set:
      archestra.initContainers.busyboxImage: registry.internal.example.com/platform/busybox:1.36
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-postgres
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: registry.internal.example.com/platform/busybox:1.36

  - it: worker waits for migrations after postgres is reachable by default
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-postgres
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: wait-for-migrations

  - it: worker can disable the wait-for-migrations init container
    set:
      archestra.initContainers.waitForMigrations.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: wait-for-migrations
          any: true

  - it: worker applies shared resources to chart-managed init containers
    set:
      archestra.initContainers.resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          memory: 128Mi
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].resources
          value:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 128Mi

  # The worker renders the same env block as the platform Deployment and runs
  # the same MCP runtime, so it must learn the release name the same way: a
  # worker that inferred a different name would create a second, orphaned
  # pre-pull DaemonSet beside the platform's.
  - it: worker is told the Helm release name
    release:
      name: "my-release"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ARCHESTRA_ORCHESTRATOR_HELM_RELEASE_NAME
            value: "my-release"
