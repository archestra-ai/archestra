# Separate, small staging installation for recording public product demos.
# The bundled PostgreSQL release has its own persistent volume in archestra-demo.
fullnameOverride: archestra-demo

archestra:
  replicaCount: 1
  worker:
    enabled: false
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      memory: "4Gi"

  env:
    ARCHESTRA_ANALYTICS: disabled
    ARCHESTRA_ENTERPRISE_LICENSE_ACTIVATED: "true"
    ARCHESTRA_API_BASE_URL: "https://demo.archestra.dev"
    ARCHESTRA_FRONTEND_URL: "https://demo.archestra.dev"
    ARCHESTRA_AUTH_COOKIE_DOMAIN: "demo.archestra.dev"
    # Staging's parent-domain cookies are also sent to this host; isolate names.
    ARCHESTRA_AUTH_COOKIE_PREFIX: "archestra-demo"
    ARCHESTRA_AUTH_DISABLE_BASIC_AUTH: "true"
    ARCHESTRA_AUTH_DISABLE_INVITATIONS: "true"
    ARCHESTRA_TRUST_PROXY: "35.191.0.0/16,130.211.0.0/22"
    ARCHESTRA_GEMINI_VERTEX_AI_ENABLED: "true"
    ARCHESTRA_GEMINI_VERTEX_AI_PROJECT: "friendly-path-465518-r6"
    ARCHESTRA_GEMINI_VERTEX_AI_LOCATION: "us-central1"
    ARCHESTRA_GEMINI_VERTEX_AI_ALLOW_GLOBAL_ENDPOINT: "true"
    ARCHESTRA_CHAT_DEFAULT_PROVIDER: "gemini"
    ARCHESTRA_CHAT_DEFAULT_MODEL: "gemini-2.5-flash"

  orchestrator:
    kubernetes:
      serviceAccount:
        annotations:
          iam.gke.io/gcp-service-account: archestra-vertex-ai@friendly-path-465518-r6.iam.gserviceaccount.com

  gkeBackendConfig:
    enabled: true
  service:
    annotations:
      cloud.google.com/backend-config: '{"ports": {"9000":"archestra-demo-backend-config", "3000":"archestra-demo-frontend-config"}}'
      cloud.google.com/neg: '{"ingress": true}'
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: "gce"
      kubernetes.io/ingress.global-static-ip-name: "archestra-demo-ip"
      ingress.gcp.cloud.google.com/load-balancer-type: "External"
      networking.gke.io/managed-certificates: "archestra-demo-ssl"
      ingress.gcp.cloud.google.com/ssl-redirect: "true"
    hosts:
      - host: demo.archestra.dev
        paths:
          - path: /
            port: 3000
            pathType: Prefix

postgresql:
  enabled: true
