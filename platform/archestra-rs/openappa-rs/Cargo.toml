[package]
name = "openappa_rs"
version = "0.1.0"
edition = "2024"
build = "build.rs"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to OpenAPPA main after the merge of #394 (the annotator-only jev
# battery; on top of #386's hosted root document declaring its batteries and
# their credentials) on top of v0.24.0. Re-pin to the first release that includes it. The embedded reporting helper
# currently requires upstream's daemon feature.
appa-runtime = { package = "appa", git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "41aa3951bcfc30c3cdf26cfbc5312813d67db8cd" }
appa-runtime-api = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "41aa3951bcfc30c3cdf26cfbc5312813d67db8cd" }
appa-eventlog = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "41aa3951bcfc30c3cdf26cfbc5312813d67db8cd", features = ["postgres"] }
appa-package = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "41aa3951bcfc30c3cdf26cfbc5312813d67db8cd" }
napi = { version = "3", features = ["tokio_rt"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
tempfile = "3"
toml = "1.1"
# The runtime's own editor speaks this document type; reading a root's declarations
# with their spans needs the same version the runtime holds.
toml_edit = "0.25"
tokio = { version = "1", features = ["sync", "time"] }
futures-util = "0.3"

[dev-dependencies]
# A paused clock: the connection-wait test does not spend its thirty seconds.
tokio = { version = "1", features = ["rt", "test-util"] }
proptest = "1"

[target.'cfg(target_env = "musl")'.dependencies]
# Cross-builds need OpenSSL compiled for musl. The Docker builder uses its
# installed OpenSSL through OPENSSL_NO_VENDOR instead.
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
napi-build = "2"
