{{- if .Values.archestra.orchestrator.kubernetes.mcpServerRbac.create }}
---
# ServiceAccount specifically for MCP servers that need Kubernetes API access
# This is used ONLY by the Kubernetes MCP server - other MCP servers use the default service account with no permissions
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "archestra-platform.fullname" . }}-mcp-k8s-reader
  namespace: {{ .Values.archestra.orchestrator.kubernetes.namespace | default .Release.Namespace }}
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server-rbac
---
# ClusterRole with read-only permissions for Kubernetes resources
# Only granted to the mcp-k8s-reader service account, not to all MCP server pods
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "archestra-platform.fullname" . }}-mcp-server-read
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server-rbac
rules:
# Core API group resources
- apiGroups: [""]
  resources: ["pods", "services", "nodes", "namespaces", "events", "configmaps"]
  verbs: ["get", "list", "watch"]
# Apps API group resources
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
# Batch API group resources
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
---
# ClusterRoleBinding that grants the ClusterRole to the mcp-k8s-reader service account
# This is the critical security boundary - only pods that explicitly use this service account get K8s API access
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "archestra-platform.fullname" . }}-mcp-server-read
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server-rbac
subjects:
- kind: ServiceAccount
  name: {{ include "archestra-platform.fullname" . }}-mcp-k8s-reader
  namespace: {{ .Values.archestra.orchestrator.kubernetes.namespace | default .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "archestra-platform.fullname" . }}-mcp-server-read
  apiGroup: rbac.authorization.k8s.io
{{- end }}
