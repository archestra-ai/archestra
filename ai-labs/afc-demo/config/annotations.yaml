# Per-tool annotations: effects, how results are labeled, and each sink's ceiling.
# `legacy.dump` is deliberately absent — an unlabeled tool whose results are Unknown.
tools:
  drive.read_doc:
    effects: [read]
    label_source: resolver        # tier2: the result label comes from the doc's ACL at call time
    schema:
      doc: str

  drive.write_doc:
    effects: [write]
    schema:
      doc: str
      content: str
    sink:
      readers: { kind: from_arg_acl, field: doc }   # sink audience = the target doc's ACL

  web.fetch:
    effects: [read]
    label_source: static          # tier3: web content is public but untrusted
    result:
      readers: { kind: public }
      integrity: tainted
    schema:
      url: str

  email.send:
    effects: [egress, consequential]
    schema:
      to: subject
      body: str
    sink:
      readers: { kind: from_arg_recipient, field: to }  # sink audience = the recipient

  crm.export:
    effects: [egress, consequential]
    schema:
      region: str
      record: str
    sink:
      readers: { kind: principal }                 # export stays within the principal's audience
      dims:
        region: { kind: from_arg, field: region }  # but must satisfy the export's declared region
