[[stages]]
text = """Using Yahoo Finance data fetched from the sandbox, find the price of Bitcoin (ticker BTC-USD) and Solana (ticker SOL-USD) at 2026-06-01 16:00 UTC. Install whatever you need (e.g. yfinance) following the run_command tool's guidance, fetch the historical intraday data, and read off the price at that timestamp. Submit your answer with result = {"btc_usd": <number>, "sol_usd": <number>} (prices in USD)."""

[result_schema]
type = "object"
required = ["btc_usd", "sol_usd"]
additionalProperties = false

  [result_schema.properties.btc_usd]
  type = "number"
  exclusiveMinimum = 0

  [result_schema.properties.sol_usd]
  type = "number"
  exclusiveMinimum = 0

[verifier]
deps = []
