# Live qualification policy for the OpenAPPA root tool flow.
#
# Install it as the organization guardrails policy and run the scenarios as
# described in this directory's README.md. It carries no credentials.
#
# One policy, three stock clients. The proxy submits each client's own tool
# names, so every scenario is named three times — Claude Code's `host/claude-code/*`,
# Codex's `builtin:*`, OpenCode's `builtin:*` — and the gateway's own tools by
# their platform names.
#
# The scenario files below are absolute paths, seeded by `setup-lab.sh`. They
# name the default lab directory, `${APPA_LAB_HOME:-/tmp/appa-root-flow}/lab`;
# a lab somewhere else needs these paths rewritten before the policy is
# installed (setup-lab.sh prints the one-liner when it detects this).
#
# Scenarios, each reachable from a single prompt:
#
#   S1 accept    reading /tmp/appa-root-flow/lab/secret.txt restricts the
#                session's audience, so the read is blocked with an acceptance
#                plan.
#   S1c proof    the same call answers differently before and after S1, which
#                is what shows the acceptance narrowed the session rather than
#                merely completing a round trip. Chat reaches it through
#                `archestra__load_skill`; see README.md.
#   S2 input     sending that content out needs the `redactor` input sanitizer,
#                which rewrites the arguments and releases the call.
#   S3 output    reading /tmp/appa-root-flow/lab/report.txt stages its output
#                behind the `summarize` output sanitizer, which returns the
#                admitted value.
#   S4 authority publishing needs the `operator` authority, a URL fixture this
#                run controls (approve / deny / timeout / no answer).
#   S5 planless  a tool the policy does not name is blocked with no plan.

[policy]
version = 2
trust_chain = ["untrusted", "trusted"]

# --- the session's ordinary tools -------------------------------------------

[[policy.tool]]
name = "host/claude-code/Glob"
delta = {}

[[policy.tool]]
name = "host/claude-code/Grep"
delta = {}

[[policy.tool]]
name = "host/claude-code/TodoWrite"
delta = {}

[[policy.tool]]
name = "builtin:list"
delta = {}

[[policy.tool]]
name = "builtin:glob"
delta = {}

[[policy.tool]]
name = "builtin:grep"
delta = {}

[[policy.tool]]
name = "builtin:todowrite"
delta = {}

# --- S1: a read that restricts the session ----------------------------------

[[policy.tool]]
name = "host/claude-code/Read(file_path:/tmp/appa-root-flow/lab/secret.txt)"
delta = { audience = ["lab@archestra.local"] }

[[policy.tool]]
name = "builtin:read(filePath:/tmp/appa-root-flow/lab/secret.txt)"
delta = { audience = ["lab@archestra.local"] }

[[policy.tool]]
name = "builtin:shell(command:*secret.txt*)"
delta = { audience = ["lab@archestra.local"] }

[[policy.tool]]
name = "builtin:exec_command(cmd:*secret.txt*)"
delta = { audience = ["lab@archestra.local"] }

# --- S3: a read whose output is staged behind a sanitizer -------------------

[[policy.tool]]
name = "host/claude-code/Read(file_path:/tmp/appa-root-flow/lab/report.txt)"
delta = { trust = "untrusted" }

[[policy.tool]]
name = "builtin:read(filePath:/tmp/appa-root-flow/lab/report.txt)"
delta = { trust = "untrusted" }

# Codex has no read tool of its own; it reads a file with a shell command.
[[policy.tool]]
name = "builtin:exec_command(cmd:*report.txt*)"
delta = { trust = "untrusted" }

# --- ordinary reads ----------------------------------------------------------

[[policy.tool]]
name = "host/claude-code/Read"
delta = {}

[[policy.tool]]
name = "builtin:read"
delta = {}

# --- S2: the sink that carries content out ----------------------------------

[[policy.tool]]
name = "host/claude-code/Write"
requires = { audience = { contains = ["public"] } }
delta = {}

[[policy.tool]]
name = "builtin:write"
requires = { audience = { contains = ["public"] } }
delta = {}

[[policy.tool]]
name = "builtin:apply_patch"
requires = { audience = { contains = ["public"] } }
delta = {}

# --- S4: the sink a person must clear ---------------------------------------

[[policy.tool]]
name = "host/claude-code/Bash(command:*appa-publish*)"
requires = { attention = ["operator-signoff"] }
delta = {}

[[policy.tool]]
name = "builtin:shell(command:*appa-publish*)"
requires = { attention = ["operator-signoff"] }
delta = {}

[[policy.tool]]
name = "builtin:bash(command:*appa-publish*)"
requires = { attention = ["operator-signoff"] }
delta = {}

[[policy.tool]]
name = "builtin:exec_command(cmd:*appa-publish*)"
requires = { attention = ["operator-signoff"] }
delta = {}

# --- ordinary shells ---------------------------------------------------------

[[policy.tool]]
name = "host/claude-code/Bash"
delta = {}

[[policy.tool]]
name = "builtin:shell"
delta = {}

[[policy.tool]]
name = "builtin:bash"
delta = {}

# Codex's own tools, under the names the proxy submits for it.
[[policy.tool]]
name = "builtin:exec_command"
delta = {}

[[policy.tool]]
name = "builtin:write_stdin"
delta = {}

[[policy.tool]]
name = "builtin:view_image"
delta = {}

[[policy.tool]]
name = "builtin:request_user_input"
delta = {}

[[policy.tool]]
name = "builtin:list_mcp_resources"
delta = {}

[[policy.tool]]
name = "builtin:list_mcp_resource_templates"
delta = {}

[[policy.tool]]
name = "builtin:read_mcp_resource"
delta = {}

[[policy.tool]]
name = "builtin:get_goal"
delta = {}

[[policy.tool]]
name = "builtin:create_goal"
delta = {}

[[policy.tool]]
name = "builtin:update_goal"
delta = {}

# Codex writes files through a free-form custom tool; the proxy carries its one
# argument as `input`, so the policy names it like any other sink.
[[policy.tool]]
name = "builtin:apply_patch"
requires = { audience = { contains = ["public"] } }
delta = {}

# --- Archestra Chat, under the gateway tool names the proxy submits for it ---
#
# Chat has no filesystem tools of its own, so it reaches S1 through a gateway
# tool instead: listing the skills restricts the session's audience, so the call
# is blocked with the same acceptance plan the other clients get for reading the
# secret. Chat needs no entry for the APPA tools themselves — the gateway
# advertises them to every conversation while OpenAPPA is enabled.

[[policy.tool]]
name = "archestra__list_skills"
delta = { audience = ["lab@archestra.local"] }

[[policy.tool]]
name = "archestra__search_tools"
delta = {}

[[policy.tool]]
# S1c. Chat's proof that the acceptance actually changed the session, not just
# that the round trip happened: loading a skill is fine while the session is
# public, and the same call stops meeting this requirement once list_skills
# has narrowed the audience. The `redactor` input sanitizer below is the
# remedy offered for it, exactly as it is for the clients' own write tools.
name = "archestra__load_skill"
requires = { audience = { contains = ["public"] } }
delta = {}

# --- the remedies -----------------------------------------------------------

[[policy.sanitizer]]
name = "redactor"
on = ["tool_input"]

[policy.sanitizer.permits]
audience = { from = ["lab@archestra.local"], to = ["public"] }

[[policy.sanitizer]]
name = "summarize"
on = ["tool_output"]

[policy.sanitizer.permits]
trust = { from = "untrusted", to = "trusted" }

# The result points an output sanitizer may apply to: reading the report stages
# its output until the session accepts the summarized value. Codex reads with
# its shell tool, so that tool is a result point too.
[policy.deployment]
confined_results = ["host/claude-code/Read", "builtin:read", "builtin:exec_command"]

[[policy.authority]]
name = "operator"
hint = "The operator on call. Consult them before anything is published."

[policy.authority.permits]
attention = ["operator-signoff"]

[externals]
timeout_ms = 5000
review_timeout_ms = 20000
max_body_bytes = 65536

# The fixture this run controls (`externals-fixture.mjs`): it answers as
# approve, deny, timeout or no answer, which is the only boundary this
# qualification mocks. Change the port here if you start it on another one.
[externals.authorities.operator]
url = "http://127.0.0.1:8899/authority"

[externals.sanitizers.redactor]
url = "http://127.0.0.1:8899/sanitizer/redact"

[externals.sanitizers.summarize]
url = "http://127.0.0.1:8899/sanitizer/summarize"
