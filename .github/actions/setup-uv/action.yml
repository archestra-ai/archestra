name: Setup uv
description: Wrapper around astral-sh/setup-uv pinned to a vetted version.
inputs:
  version:
    description: Version of uv to install. Defaults to the version in pyproject.toml, or latest.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: ${{ inputs.version }}
