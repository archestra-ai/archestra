name: GitHub App Token
description: Wrapper around actions/create-github-app-token pinned to a vetted version.
inputs:
  app-id:
    description: GitHub App ID.
    required: true
  private-key:
    description: GitHub App private key.
    required: true
  owner:
    description: Owner of the GitHub App installation.
    required: false
  repositories:
    description: Comma or newline-separated repositories to grant token access to.
    required: false
  permission-actions:
    description: Actions permission level for the generated token.
    required: false
outputs:
  token:
    description: Generated GitHub App token.
    value: ${{ steps.create-token.outputs.token }}
runs:
  using: composite
  steps:
    - name: Create GitHub App token
      id: create-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repositories }}
        permission-actions: ${{ inputs.permission-actions }}
