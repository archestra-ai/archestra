    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.repository.private
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - provider: Blacksmith
          slug: blacksmith
          runner: blacksmith-16vcpu-ubuntu-2404
        - provider: Ubicloud
          slug: ubicloud
          runner: ubicloud-standard-16-ubuntu-2404
    steps:
    - name: Checkout benchmark source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: 52e58e213bd2e3e49e77f5afe5288b82b7d9008e
    - name: Record runner identity
      run: 'node -e ''const os=require("os"); console.log(JSON.stringify({cpuCount:os.cpus().length,cpuModel:os.cpus()[0].model,memoryBytes:os.totalmem()}))''

        git rev-parse HEAD

        docker version --format ''{{.Server.Version}}''

        '
    - name: Authenticate to Google Artifact Registry
      uses: ./.github/actions/auth-to-gar
      with:
        service_account: ${{ secrets.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
        workload_identity_provider: ${{ secrets.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}
    - name: Build slim Platform image (lite/K8s jobs, no Dagger engine tar) and push
      uses: ./.github/actions/build-docker-image
      with:
