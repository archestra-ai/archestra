suite: test MCP runtime ownership anchor
templates:
  - mcp-runtime-anchor.yaml
tests:
  - it: creates an anchor in the release namespace by default
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - matchRegex:
          path: metadata.name
          pattern: -archestra-platform-mcp-runtime$

  - it: creates the anchor in a custom MCP namespace
    set:
      archestra.orchestrator.kubernetes.namespace: mcp-runtime
    asserts:
      - equal:
          path: metadata.namespace
          value: mcp-runtime

  - it: honors nameOverride through the chart fullname
    set:
      nameOverride: custom-platform
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: -custom-platform-mcp-runtime$

  - it: creates an anchor in each configured runtime namespace
    documentIndex: 1
    set:
      archestra.orchestrator.kubernetes.namespace: mcp-runtime
      archestra.orchestrator.kubernetes.rbac.environmentNamespaces:
        - environment-runtime
    asserts:
      - equal:
          path: metadata.namespace
          value: environment-runtime
