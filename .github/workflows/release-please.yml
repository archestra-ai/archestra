name: Release Please
run-name: ${{ inputs.handoff-fixture && 'Non-publishing image handoff fixture' || 'Release Please' }}

on:
  push:
    branches:
      - main
      - "release/*"
  workflow_dispatch:
    inputs:
      handoff-fixture:
        description: "Run only the non-publishing artifact handoff rehearsal"
        type: boolean
        default: false
      fixture-artifact-id:
        description: "Tiny scratch-image fixture artifact from this branch's PR workflow"
        type: string
        default: ""

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  # Do not interrupt a release while its artifacts are being built and published.
  cancel-in-progress: false

jobs:
  release-policy:
    name: Check release policy
    if: ${{ !inputs.handoff-fixture && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the repository and its release refs.
    outputs:
      requested: ${{ steps.policy.outputs.requested }}
      create_pr: ${{ steps.policy.outputs.create_pr }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Recheck after merge against current release refs, before creating a release.
      - name: Check migration upgrade paths across release tracks
        working-directory: ./platform
        env:
          BASE_BRANCH: ${{ github.ref_name }}
        run: python3 ../.github/scripts/check-migration-upgrades.py --base-branch "$BASE_BRANCH"

      - name: Validate branch release policy
        id: policy
        env:
          BRANCH: ${{ github.ref_name }}
          RELEASE_FREEZE: ${{ vars.RELEASE_FREEZE }}
        shell: bash
        run: |
          test "$RELEASE_FREEZE" != true || { echo "::error::Releases are frozen"; exit 1; }
          CONFIG=.github/release-please/release-please-config.json
          VERSION=$(jq -r '.platform' .github/release-please/.release-please-manifest.json)
          OVERRIDE=$(jq -r '.packages.platform["release-as"] // empty' "$CONFIG")
          NEXT=${OVERRIDE:-$VERSION}
          jq -e '.packages.platform.draft == true' "$CONFIG" \
            || { echo "::error::Config must keep draft=true; releases are published after all builds succeed"; exit 1; }
          if [ "$BRANCH" = main ]; then
            [[ "$NEXT" =~ ^[0-9]+\.[0-9]+\.0-rc\.[1-9][0-9]*$ ]] \
              || { echo "::error::Main must release X.Y.0-rc.N"; exit 1; }
            jq -e '.packages.platform | .prerelease == true and .versioning == "prerelease" and .["prerelease-type"] == "rc"' "$CONFIG" \
              || { echo "::error::Main config must set prerelease=true, versioning=prerelease, and prerelease-type=rc"; exit 1; }
          else
            [[ "$NEXT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "${NEXT%.*}" = "${BRANCH#release/}" ]] \
              || { echo "::error::Stable version must match release/X.Y"; exit 1; }
            jq -e '.packages.platform | .prerelease == false and .versioning == "always-bump-patch"' "$CONFIG" \
              || { echo "::error::Stable config must set prerelease=false and versioning=always-bump-patch"; exit 1; }
          fi
          echo "requested=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "$OVERRIDE" ]; then
            echo "create_pr=false" >> "$GITHUB_OUTPUT"
          else
            echo "create_pr=true" >> "$GITHUB_OUTPUT"
          fi

  # release-please runs in TWO invocations (releases first, then PRs) instead of one.
  # A single invocation creates the GitHub release for a just-merged release PR as a
  # DRAFT (no git tag yet) and then immediately builds the next release PR in the same
  # process. That PR build looks up the manifest version's tag (e.g. platform-v1.3.3),
  # finds nothing, loses its "commits since last release" anchor, and walks deep
  # history — where old `Release-As: 1.3.0` commits force the new PR to a bogus stale
  # version with a months-long changelog (self-healing only on the next push to main).
  # Splitting lets us create the git tag for the draft release BEFORE the PR build, so
  # the version calculation is always anchored to the real latest release.
  #
  # Both passes run through the organization's shared workflow, which authenticates
  # as the release App and never with GITHUB_TOKEN. It runs no cloud sign-in: steps
  # that use Workload Identity stay in this file's jobs, which the trust names.
  create-releases:
    name: Create releases for merged release PRs
    needs: release-policy
    permissions: {} # The shared workflow writes with the release App token only.
    uses: archestra-ai/.github/.github/workflows/release-please.yml@da5a22fd61f56b4a7fa6bd888292018982e1139e # v1.15.0
    with:
      target-branch: ${{ github.ref_name }}
      skip-github-pull-request: true
    secrets:
      APP_ID: ${{ secrets.ARCHESTRA_RELEASER_GITHUB_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.ARCHESTRA_RELEASER_GITHUB_APP_PRIVATE_KEY }}

  release-please:
    name: Release Please
    needs: [release-policy, create-releases]
    # The fixture skips release-policy and create-releases.
    if: ${{ !cancelled() && (inputs.handoff-fixture || needs.create-releases.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the repository; the App token makes every write.
      id-token: write # Required for Workload Identity Federation in downstream release jobs.
    outputs:
      handoff_fixture: ${{ inputs.handoff-fixture }}
      platform_should_publish: ${{ steps.resolve-release.outputs.should_publish }}
      platform_version: ${{ steps.resolve-release.outputs.version }}
      platform_tag_name: ${{ steps.resolve-release.outputs.tag_name }}
      platform_checkout_ref: ${{ steps.resolve-release.outputs.checkout_ref }}
      platform_previous_version: ${{ steps.previous-release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.handoff-fixture && 1 || '0' }}
          persist-credentials: false

      - name: Generate a token
        id: generate-token
        uses: archestra-ai/.github/actions/github-app-token@3a014e2fa0a740f1ec68f6379b602470a418cd6e # v1.13.0
        with:
          # Read scanned queue artifacts from other runs.
          permission-actions: read
          # Read draft releases and create release tags; the fixture only reads.
          permission-contents: ${{ inputs.handoff-fixture && 'read' || 'write' }}
          app-id: ${{ secrets.ARCHESTRA_RELEASER_GITHUB_APP_ID }}
          private-key: ${{ secrets.ARCHESTRA_RELEASER_GITHUB_APP_PRIVATE_KEY }}

      # All releases start as drafts. Both channels publish automatically after
      # all artifacts are ready.
      #
      # We do NOT toggle a published release back to draft: GitHub's immutable-releases
      # feature rejects that ("state cannot be changed when release is immutable", HTTP
      # 422), which is what previously failed the release-please job and silently skipped
      # every downstream image/chart publish job.
      #
      # Draft releases don't create the underlying git tag, but downstream build jobs
      # check out the tag ref (checkout_ref) and release-please needs the tag to exist
      # when calculating the next version (otherwise it creates bogus PRs with stale
      # versions). Resolve a just-created release or an interrupted matching draft before
      # creating that tag ourselves, pinned to the release commit.
      - name: Resolve release to publish or recover
        if: ${{ !inputs.handoff-fixture }}
        id: resolve-release
        env:
          ACTION_RELEASE_CREATED: ${{ fromJSON(needs.create-releases.outputs.releases || '{}')['platform--release_created'] }}
          ACTION_VERSION: ${{ fromJSON(needs.create-releases.outputs.releases || '{}')['platform--version'] }}
          ACTION_TAG_NAME: ${{ fromJSON(needs.create-releases.outputs.releases || '{}')['platform--tag_name'] }}
          ACTION_RELEASE_SHA: ${{ fromJSON(needs.create-releases.outputs.releases || '{}')['platform--sha'] }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_VERSION: ${{ needs.release-policy.outputs.requested }}
        run: |
          if [ "$ACTION_RELEASE_CREATED" = "true" ] && [ "$ACTION_VERSION" != "$REQUESTED_VERSION" ]; then
            echo "::error::Release-please produced a version other than the merged manifest."
            exit 1
          fi

          SHOULD_PUBLISH=false
          TAG_NAME=
          RELEASE_SHA=
          if [ "$ACTION_RELEASE_CREATED" = "true" ]; then
            SHOULD_PUBLISH=true
            TAG_NAME=$ACTION_TAG_NAME
            RELEASE_SHA=$ACTION_RELEASE_SHA
          else
            EXPECTED_TAG=platform-v${REQUESTED_VERSION}
            if RELEASE=$(gh release view "$EXPECTED_TAG" --json isDraft,targetCommitish 2>/dev/null); then
              if [ "$(jq -r .isDraft <<<"$RELEASE")" = true ]; then
                SHOULD_PUBLISH=true
                TAG_NAME=$EXPECTED_TAG
                RELEASE_SHA=$(jq -r .targetCommitish <<<"$RELEASE")
                echo "Recovering draft release ${TAG_NAME}"
              fi
            fi
          fi

          if [ "$SHOULD_PUBLISH" = true ]; then
            RELEASE=$(gh release view "$TAG_NAME" --json isDraft,targetCommitish)
            [ "$(jq -r .isDraft <<<"$RELEASE")" = true ] \
              || { echo "::error::Release ${TAG_NAME} is already published"; exit 1; }
            [ "$(jq -r .targetCommitish <<<"$RELEASE")" = "$RELEASE_SHA" ] \
              || { echo "::error::Draft ${TAG_NAME} does not target the selected release commit"; exit 1; }
            git cat-file -e "${RELEASE_SHA}^{commit}" \
              || { echo "::error::Release commit ${RELEASE_SHA} is unavailable in this checkout"; exit 1; }
            git merge-base --is-ancestor "$RELEASE_SHA" "$GITHUB_SHA" \
              || { echo "::error::Release commit ${RELEASE_SHA} is not on ${GITHUB_REF_NAME}"; exit 1; }
          fi

          {
            echo "should_publish=${SHOULD_PUBLISH}"
            echo "version=${REQUESTED_VERSION}"
            echo "tag_name=${TAG_NAME}"
            echo "checkout_ref=${TAG_NAME}"
            echo "release_sha=${RELEASE_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Select the exact scanned queue artifacts
        if: ${{ !inputs.handoff-fixture && (steps.resolve-release.outputs.should_publish == 'true') }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          RELEASE_SHA: ${{ steps.resolve-release.outputs.release_sha }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          EXPECTED_VERSION: ${{ steps.resolve-release.outputs.version }}
          SELECTION_FILE: ${{ runner.temp }}/release-candidate-selection.json
        run: python3 .github/scripts/release-handoff.py select

      - name: Relay scanned platform archives
        if: ${{ !inputs.handoff-fixture && (steps.resolve-release.outputs.should_publish == 'true') }}
        uses: $/.github/actions/relay-release-candidate
        with:
          image_name: platform
          selection: ${{ runner.temp }}/release-candidate-selection.json
          token: ${{ steps.generate-token.outputs.token }}

      - name: Relay scanned mcp-server-base archives
        if: ${{ !inputs.handoff-fixture && (steps.resolve-release.outputs.should_publish == 'true') }}
        uses: $/.github/actions/relay-release-candidate
        with:
          image_name: mcp-server-base
          selection: ${{ runner.temp }}/release-candidate-selection.json
          token: ${{ steps.generate-token.outputs.token }}

      - name: Relay scanned p4-shim archives
        if: ${{ !inputs.handoff-fixture && (steps.resolve-release.outputs.should_publish == 'true') }}
        uses: $/.github/actions/relay-release-candidate
        with:
          image_name: p4-shim
          selection: ${{ runner.temp }}/release-candidate-selection.json
          token: ${{ steps.generate-token.outputs.token }}

      - name: Relay scanned sandbox-base archives
        if: ${{ !inputs.handoff-fixture && (steps.resolve-release.outputs.should_publish == 'true') }}
        uses: $/.github/actions/relay-release-candidate
        with:
          image_name: sandbox-base
          selection: ${{ runner.temp }}/release-candidate-selection.json
          token: ${{ steps.generate-token.outputs.token }}

      - name: Relay scanned agent-claude-code archives
        if: ${{ !inputs.handoff-fixture && (steps.resolve-release.outputs.should_publish == 'true') }}
        uses: $/.github/actions/relay-release-candidate
        with:
          image_name: agent-claude-code
          selection: ${{ runner.temp }}/release-candidate-selection.json
          token: ${{ steps.generate-token.outputs.token }}

      - name: Relay scanned agent-codex archives
        if: ${{ !inputs.handoff-fixture && (steps.resolve-release.outputs.should_publish == 'true') }}
        uses: $/.github/actions/relay-release-candidate
        with:
          image_name: agent-codex
          selection: ${{ runner.temp }}/release-candidate-selection.json
          token: ${{ steps.generate-token.outputs.token }}

      - name: Relay scanned agent-opencode archives
        if: ${{ !inputs.handoff-fixture && (steps.resolve-release.outputs.should_publish == 'true') }}
        uses: $/.github/actions/relay-release-candidate
        with:
          image_name: agent-opencode
          selection: ${{ runner.temp }}/release-candidate-selection.json
          token: ${{ steps.generate-token.outputs.token }}

      - name: Relay scanned agent-hermes archives
        if: ${{ !inputs.handoff-fixture && (steps.resolve-release.outputs.should_publish == 'true') }}
        uses: $/.github/actions/relay-release-candidate
        with:
          image_name: agent-hermes
          selection: ${{ runner.temp }}/release-candidate-selection.json
          token: ${{ steps.generate-token.outputs.token }}

      - name: Relay scanned agent-openclaw archives
        if: ${{ !inputs.handoff-fixture && (steps.resolve-release.outputs.should_publish == 'true') }}
        uses: $/.github/actions/relay-release-candidate
        with:
          image_name: agent-openclaw
          selection: ${{ runner.temp }}/release-candidate-selection.json
          token: ${{ steps.generate-token.outputs.token }}

      - name: Relay scanned agent-grok archives
        if: ${{ !inputs.handoff-fixture && (steps.resolve-release.outputs.should_publish == 'true') }}
        uses: $/.github/actions/relay-release-candidate
        with:
          image_name: agent-grok
          selection: ${{ runner.temp }}/release-candidate-selection.json
          token: ${{ steps.generate-token.outputs.token }}

      - name: Relay scanned agent-kimi archives
        if: ${{ !inputs.handoff-fixture && (steps.resolve-release.outputs.should_publish == 'true') }}
        uses: $/.github/actions/relay-release-candidate
        with:
          image_name: agent-kimi
          selection: ${{ runner.temp }}/release-candidate-selection.json
          token: ${{ steps.generate-token.outputs.token }}

      - name: Relay scanned agent-copilot archives
        if: ${{ !inputs.handoff-fixture && (steps.resolve-release.outputs.should_publish == 'true') }}
        uses: $/.github/actions/relay-release-candidate
        with:
          image_name: agent-copilot
          selection: ${{ runner.temp }}/release-candidate-selection.json
          token: ${{ steps.generate-token.outputs.token }}

      - name: Retain verified candidate selection for publishers
        if: ${{ !inputs.handoff-fixture && (steps.resolve-release.outputs.should_publish == 'true') }}
        uses: $/.github/actions/github-upload-artifact
        with:
          name: release-candidate-selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate-selection.json
          if-no-files-found: error
          retention-days: 1

      - name: Create git tag for draft release
        if: ${{ !inputs.handoff-fixture && (steps.resolve-release.outputs.should_publish == 'true') }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.resolve-release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.resolve-release.outputs.release_sha }}
        run: |
          if gh api "repos/${GH_REPO}/git/ref/tags/${TAG_NAME}" >/dev/null 2>&1; then
            EXISTING_SHA=$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG_NAME}" --jq '.object.sha')
            test "$EXISTING_SHA" = "$RELEASE_SHA" \
              || { echo "::error::Tag ${TAG_NAME} exists at ${EXISTING_SHA}, expected ${RELEASE_SHA}"; exit 1; }
          else
            gh api "repos/${GH_REPO}/git/refs" \
              -f ref="refs/tags/${TAG_NAME}" \
              -f sha="${RELEASE_SHA}"
            echo "Created tag ${TAG_NAME} -> ${RELEASE_SHA}"
          fi

      - name: Resolve previous release on this branch
        if: ${{ !inputs.handoff-fixture && (steps.resolve-release.outputs.should_publish == 'true') }}
        id: previous-release
        env:
          RELEASE_SHA: ${{ steps.resolve-release.outputs.release_sha }}
        run: |
          # The platform image carries the previous release's frontend chunks so
          # open tabs survive an upgrade. Take them from the release this branch
          # upgrades from, not from a floating tag.
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'platform-v*' "${RELEASE_SHA}^" 2>/dev/null || true)
          echo "version=${PREVIOUS_TAG#platform-v}" >> "${GITHUB_OUTPUT}"
          echo "Previous release: ${PREVIOUS_TAG:-none}"

      - name: Verify non-publishing cross-run fixture with the existing App
        if: ${{ inputs.handoff-fixture }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          FIXTURE_ARTIFACT_ID: ${{ inputs.fixture-artifact-id }}
          FIXTURE_DIR: ${{ runner.temp }}/handoff-fixture-relay
        run: python3 .github/scripts/release-handoff-fixture.py relay

      - name: Relay non-publishing fixture to a tokenless consumer
        if: ${{ inputs.handoff-fixture }}
        uses: $/.github/actions/github-upload-artifact
        with:
          name: handoff-fixture-relay-${{ github.run_attempt }}
          path: ${{ runner.temp }}/handoff-fixture-relay/*
          if-no-files-found: error
          retention-days: 1

  # Native rolling PRs on each branch, after the release tag exists. Pause only for
  # consumed cutover overrides, which must be cleared after the seed/final release has
  # built successfully.
  release-pr:
    name: Create or update the next release PR
    needs: [release-policy, release-please]
    if: ${{ !inputs.handoff-fixture && needs.release-policy.outputs.create_pr == 'true' }}
    permissions: {} # The shared workflow writes with the release App token only.
    uses: archestra-ai/.github/.github/workflows/release-please.yml@da5a22fd61f56b4a7fa6bd888292018982e1139e # v1.15.0
    with:
      target-branch: ${{ github.ref_name }}
      skip-github-release: true
    secrets:
      APP_ID: ${{ secrets.ARCHESTRA_RELEASER_GITHUB_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.ARCHESTRA_RELEASER_GITHUB_APP_PRIVATE_KEY }}

  build-and-push-mcp-server-docker-image:
    name: Build and push MCP Server Docker image
    if: ${{ needs.release-please.outputs.platform_should_publish == 'true' }}
    uses: $/.github/workflows/build-base-mcp-server-docker-image.yml
    needs:
      - release-please
    permissions:
      packages: write # Required by the reusable GHCR-capable publisher.
      contents: read # Required to invoke the reusable image build workflow.
      id-token: write # Required for Workload Identity Federation.
    with:
      push_to_gcr: true
      version: ${{ needs.release-please.outputs.platform_version }}
      checkout_ref: ${{ needs.release-please.outputs.platform_checkout_ref }}
      environment: release-publish
    secrets:
      GCP_SERVICE_ACCOUNT_NAME: ${{ vars.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER: ${{ vars.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}

  build-and-push-agent-catalog-images:
    name: Build and push Agent Catalog images
    if: ${{ needs.release-please.outputs.platform_should_publish == 'true' }}
    uses: $/.github/workflows/build-agent-catalog-images.yml
    needs:
      - release-please
    permissions:
      packages: write # Required by the reusable GHCR-capable publisher.
      contents: read # Required to invoke the reusable Agent image workflow.
      id-token: write # Required for Workload Identity Federation.
    with:
      push_to_gcr: true
      version: ${{ needs.release-please.outputs.platform_version }}
      checkout_ref: ${{ needs.release-please.outputs.platform_checkout_ref }}
      environment: release-publish
    secrets:
      GCP_SERVICE_ACCOUNT_NAME: ${{ vars.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER: ${{ vars.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}

  build-and-push-p4-shim-docker-image:
    name: Build and push p4 Shim Docker image
    # The backend defaults the Perforce permission-sync shim pod to
    # p4-shim:<appVersion>, so the image ships with every platform release.
    if: ${{ needs.release-please.outputs.platform_should_publish == 'true' }}
    uses: $/.github/workflows/build-p4-shim-docker-image.yml
    needs:
      - release-please
    permissions:
      packages: write # Required by the reusable GHCR-capable publisher.
      contents: read # Required to invoke the reusable image build workflow.
      id-token: write # Required for Workload Identity Federation.
    with:
      push_to_gcr: true
      version: ${{ needs.release-please.outputs.platform_version }}
      checkout_ref: ${{ needs.release-please.outputs.platform_checkout_ref }}
      environment: release-publish
    secrets:
      GCP_SERVICE_ACCOUNT_NAME: ${{ vars.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER: ${{ vars.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}

  build-and-push-sandbox-base-docker-image:
    name: Build and push Sandbox Base Docker image
    # The sandbox base ships with every platform release: the engine pulls it as
    # the pre-baked code-runtime base, so it is published whenever the platform is.
    if: ${{ needs.release-please.outputs.platform_should_publish == 'true' }}
    uses: $/.github/workflows/build-sandbox-base-docker-image.yml
    needs:
      - release-please
    permissions:
      packages: write # Required by the reusable GHCR-capable publisher.
      contents: read # Required to invoke the reusable image build workflow.
      id-token: write # Required for Workload Identity Federation.
    with:
      push_to_gcr: true
      version: ${{ needs.release-please.outputs.platform_version }}
      checkout_ref: ${{ needs.release-please.outputs.platform_checkout_ref }}
      environment: release-publish
    secrets:
      GCP_SERVICE_ACCOUNT_NAME: ${{ vars.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER: ${{ vars.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}

  build-and-push-platform-docker-image-to-dockerhub:
    name: Build and push platform Docker image to Docker Hub
    # The platform Docker image references the MCP server base image tag via
    # ARCHESTRA_ORCHESTRATOR_MCP_SERVER_BASE_IMAGE env var, but does NOT use it as a FROM base image.
    # The tag is baked as a default value at build time, so the MCP server image doesn't need to
    # exist yet. Both images are built in parallel and the publish-github-release job gates on
    # all artifacts being ready before un-drafting the release.
    if: ${{ needs.release-please.outputs.platform_should_publish == 'true' }}
    uses: $/.github/workflows/build-dockerhub-image.yml
    needs:
      - release-please
    permissions:
      contents: read # Required to invoke the reusable Docker build workflow.
      packages: write # Required by the reusable GHCR-capable publisher.
      id-token: write # Required for Workload Identity Federation.
    with:
      image_directory: ./platform
      image_name: platform
      version: ${{ needs.release-please.outputs.platform_version }}
      previous_version: ${{ needs.release-please.outputs.platform_previous_version }}
      push_image: true
      checkout_ref: ${{ needs.release-please.outputs.platform_checkout_ref }}
      environment: release-publish

  publish-platform-helm-chart:
    name: Publish platform Helm chart
    # The Helm chart only references the version tag (not image content), so it can run
    # in parallel with Docker image builds. The publish-github-release job ensures all
    # artifacts are ready before the release is made visible.
    if: ${{ needs.release-please.outputs.platform_should_publish == 'true' }}
    uses: $/.github/workflows/publish-platform-helm-chart.yml
    needs:
      - release-please
    permissions:
      contents: write # Required to publish Helm chart metadata from the repository.
      id-token: write # Required for Workload Identity Federation.
    with:
      version: ${{ needs.release-please.outputs.platform_version }}
      # Stable charts remain workflow artifacts until the publication job.
      push_chart: ${{ contains(needs.release-please.outputs.platform_version, '-') }}
      checkout_ref: ${{ needs.release-please.outputs.platform_checkout_ref }}
    secrets:
      GCP_SERVICE_ACCOUNT_NAME: ${{ vars.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER: ${{ vars.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}

  publish-github-release:
    name: Publish release
    # No failed or skipped build is acceptable. Publish automatically after all builds.
    if: ${{ needs.release-please.outputs.platform_should_publish == 'true' }}
    runs-on: ubuntu-latest
    # Docker Hub OIDC grants push only to this environment (main, release/*).
    environment: release-publish
    concurrency:
      # Serialize publication within each release channel.
      group: release-publication-${{ github.ref_name == 'main' && 'beta' || 'stable' }}
      cancel-in-progress: false
    needs:
      - release-please
      - build-and-push-mcp-server-docker-image
      - build-and-push-agent-catalog-images
      - build-and-push-p4-shim-docker-image
      - build-and-push-sandbox-base-docker-image
      - build-and-push-platform-docker-image-to-dockerhub
      - publish-platform-helm-chart
    permissions:
      contents: write # Attach the saved chart and publish the release.
      packages: write # Publish new release images to GHCR.
      id-token: write # Keep publishing the Helm chart at its existing GAR URL.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.release-please.outputs.platform_version }}
      TAG_NAME: ${{ needs.release-please.outputs.platform_tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check publication is still allowed
        id: publication-policy
        shell: bash
        env:
          RELEASE_FREEZE: ${{ vars.RELEASE_FREEZE }}
        run: |
          test "$RELEASE_FREEZE" != true || { echo "::error::Releases are frozen"; exit 1; }
          PRESERVE_LATEST=false
          if [[ "$VERSION" != *-* ]]; then
            RELEASE_LINE=${VERSION%.*}
            test "${GITHUB_REF_NAME:-}" = "release/$RELEASE_LINE" \
              || { echo "::error::Stable version does not match its release branch"; exit 1; }
            # Fetch every page before comparing: process substitution hides API failures.
            # Include drafts so a partially published newer patch still blocks a downgrade.
            STABLE_TAGS=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.prerelease | not) | .tag_name') \
              || { echo "::error::Cannot verify stable release ordering; retry when the release list is available"; exit 1; }
            while IFS= read -r RELEASE_TAG; do
              [[ "$RELEASE_TAG" =~ ^platform-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
              RELEASE_VERSION=${RELEASE_TAG#platform-v}
              [ "$RELEASE_VERSION" != "$VERSION" ] || continue
              # Ubuntu's GNU sort -V compares numeric stable versions.
              if [ "$(printf '%s\n' "$VERSION" "$RELEASE_VERSION" | sort -V | tail -1)" = "$RELEASE_VERSION" ]; then
                if [ "${RELEASE_VERSION%.*}" = "$RELEASE_LINE" ]; then
                  echo "::error::Newer stable release ${RELEASE_TAG} exists on this line (published or draft); cannot publish ${TAG_NAME}"
                  exit 1
                fi
                # Older lines may ship patches without taking over a newer channel.
                PRESERVE_LATEST=true
              fi
            done <<< "$STABLE_TAGS"
          fi
          echo "preserve_latest=$PRESERVE_LATEST" >> "$GITHUB_OUTPUT"

      - name: Download saved chart
        uses: $/.github/actions/github-download-artifact
        with:
          name: release-helm-chart

      - name: Download saved image references
        uses: $/.github/actions/github-download-artifact
        with:
          pattern: release-image-*-${{ github.run_attempt }}
          path: release-images
          merge-multiple: true

      - name: Authenticate to artifact registry
        if: ${{ github.ref_name != 'main' }}
        uses: archestra-ai/.github/actions/google-auth@3a014e2fa0a740f1ec68f6379b602470a418cd6e # v1.13.0
        with:
          service_account: ${{ vars.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
          workload_identity_provider: ${{ vars.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}
          registry: europe-west1-docker.pkg.dev

      - name: Log in to Docker Hub
        uses: $/.github/actions/docker-login
        with:
          username: archestra
          dockerhub-oidc-connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTION_ID }}

      - name: Log in to GHCR
        uses: $/.github/actions/docker-login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish stable artifacts without rebuilding
        if: ${{ github.ref_name != 'main' }}
        shell: bash
        env:
          PRESERVE_LATEST: ${{ steps.publication-policy.outputs.preserve_latest }}
        run: |
          test -s release-images/mcp-server-base
          helm push "archestra-platform-${VERSION}.tgz" oci://europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public/helm-charts
          if [ "$PRESERVE_LATEST" = true ]; then
            echo "Published the older-line patch chart; preserving newer image latest tags."
            exit 0
          fi
          for file in release-images/*; do
            [ "${file##*/}" = platform ] && continue
            IMAGE=$(cat "$file")
            # supply-chain-policy: allow-latest stable release channel
            docker buildx imagetools create --tag "${IMAGE%@*}:latest" "$IMAGE"
          done

      - name: Move the platform latest tag
        shell: bash
        env:
          PRESERVE_LATEST: ${{ steps.publication-policy.outputs.preserve_latest }}
        run: |
          # Quickstart pulls archestra/platform:latest, so it follows the newest
          # published release, release candidates included. Companion and agent
          # images keep :latest on the stable line: stable platforms reference
          # the agent images by that tag. This step runs after the companion
          # images are tagged, so a stable platform never points ahead of them.
          PLATFORM_IMAGE=$(cat release-images/platform)
          if [ "$PRESERVE_LATEST" = true ]; then
            echo "Preserving the newer platform latest tag."
            exit 0
          fi
          version_is_newer() {
            local a_base=${1%%-*} b_base=${2%%-*} a_pre= b_pre=
            [[ "$1" == *-* ]] && a_pre=${1#*-}
            [[ "$2" == *-* ]] && b_pre=${2#*-}
            if [ "$a_base" != "$b_base" ]; then
              [ "$(printf '%s\n' "$a_base" "$b_base" | sort -V | tail -1)" = "$a_base" ]
              return
            fi
            # A stable release outranks its own release candidates.
            if [ -z "$a_pre" ] || [ -z "$b_pre" ]; then
              [ -z "$a_pre" ] && [ -n "$b_pre" ]
              return
            fi
            [ "$a_pre" != "$b_pre" ] \
              && [ "$(printf '%s\n' "$a_pre" "$b_pre" | sort -V | tail -1)" = "$a_pre" ]
          }
          # A newer draft may have moved latest before publication failed.
          # Include it to prevent rollback; this version's own draft permits retry.
          RELEASE_TAGS=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | .tag_name') \
            || { echo "::error::Cannot list releases to order the platform latest tag"; exit 1; }
          while IFS= read -r RELEASE_TAG; do
            [[ "$RELEASE_TAG" =~ ^platform-v[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]] || continue
            if version_is_newer "${RELEASE_TAG#platform-v}" "$VERSION"; then
              echo "Newer release ${RELEASE_TAG} may already hold the platform latest tag"
              exit 0
            fi
          done <<< "$RELEASE_TAGS"
          # supply-chain-policy: allow-latest newest published platform release
          docker buildx imagetools create --tag "${PLATFORM_IMAGE%@*}:latest" "$PLATFORM_IMAGE"

      - name: Publish GitHub release
        shell: bash
        env:
          PRESERVE_LATEST: ${{ steps.publication-policy.outputs.preserve_latest }}
        run: |
          # A retry may find an already published immutable release.
          IS_DRAFT=$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)
          [ "$IS_DRAFT" = true ] || exit 0
          gh release upload "$TAG_NAME" "archestra-platform-${VERSION}.tgz" --clobber
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$TAG_NAME" --draft=false --prerelease --latest=false
          elif [ "$PRESERVE_LATEST" = true ]; then
            gh release edit "$TAG_NAME" --draft=false --prerelease=false --latest=false
          else
            gh release edit "$TAG_NAME" --draft=false --prerelease=false --latest
          fi

  update-terraform-provider:
    name: Start Terraform provider update
    # Propose each release from main to the Terraform provider as soon as it is
    # published, instead of at the updater's next daily run. A workflow_dispatch
    # sent with GITHUB_TOKEN starts a run; the release event it caused does not.
    if: ${{ github.ref == 'refs/heads/main' && needs.publish-github-release.result == 'success' }}
    needs:
      - publish-github-release
    runs-on: ubuntu-latest
    permissions:
      actions: write # Start the Update Terraform Provider workflow.
    steps:
      - name: Start Update Terraform Provider
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run update-terraform-provider.yml --ref main

  notify-release-failure:
    name: Notify release failure
    # Pages #alerting when a release that was ACTUALLY being published fails, so a broken
    # release (e.g. an image or chart that never published) is surfaced immediately
    # instead of failing silently.
    #
    # The release-please job runs in two contexts: on release branch pushes it rebuilds
    # the release PR (should_publish=false), and only when a release PR is merged does it
    # actually cut a release (should_publish=true). We gate on platform_should_publish so
    # transient flakes in the former context (e.g. release-please's "other side closed"
    # API blips, which self-heal on the next commit) don't page anyone. Real publish
    # failures set should_publish=true before any downstream step can fail, so they still
    # alert.
    needs:
      - release-please
      - build-and-push-mcp-server-docker-image
      - build-and-push-agent-catalog-images
      - build-and-push-p4-shim-docker-image
      - build-and-push-sandbox-base-docker-image
      - build-and-push-platform-docker-image-to-dockerhub
      - publish-platform-helm-chart
      - publish-github-release
    if: ${{ always() && needs.release-please.outputs.platform_should_publish == 'true' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Workload Identity Federation to read the webhook from Secret Manager.
    steps:
      # The webhook lives in GCP Secret Manager. A dedicated service account
      # reads only the alerting secrets, so no repository secret holds it.
      - name: Authenticate to read the alerting webhook
        uses: archestra-ai/.github/actions/google-auth@3a014e2fa0a740f1ec68f6379b602470a418cd6e # v1.13.0
        with:
          service_account: ${{ vars.CI_ALERTS_SECRETS_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ vars.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}

      - name: Read the alerting webhook
        id: alerting
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            slack_webhook_url:friendly-path-465518-r6/ci-alerts-slack-webhook-url

      - name: Post failure alert to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ steps.alerting.outputs.slack_webhook_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ needs.release-please.outputs.platform_version }}
          RP_RESULT: ${{ needs.release-please.result }}
          MCP_RESULT: ${{ needs.build-and-push-mcp-server-docker-image.result }}
          AGENT_CATALOG_RESULT: ${{ needs.build-and-push-agent-catalog-images.result }}
          P4_SHIM_RESULT: ${{ needs.build-and-push-p4-shim-docker-image.result }}
          SANDBOX_RESULT: ${{ needs.build-and-push-sandbox-base-docker-image.result }}
          PLATFORM_RESULT: ${{ needs.build-and-push-platform-docker-image-to-dockerhub.result }}
          HELM_RESULT: ${{ needs.publish-platform-helm-chart.result }}
          PUBLISH_RESULT: ${{ needs.publish-github-release.result }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "::warning::The alerting webhook secret is empty; skipping Slack alert."
            exit 0
          fi
          TEXT=":rotating_light: *Platform release failed* — \`${VERSION:-unknown}\`
          A job in the release pipeline failed, so release artifacts may not have published.
          • release-please: \`${RP_RESULT}\`
          • platform image (Docker Hub): \`${PLATFORM_RESULT}\`
          • MCP server image: \`${MCP_RESULT}\`
          • agent catalog images: \`${AGENT_CATALOG_RESULT}\`
          • p4 shim image: \`${P4_SHIM_RESULT}\`
          • sandbox base image: \`${SANDBOX_RESULT}\`
          • Helm chart: \`${HELM_RESULT}\`
          • publish GitHub release: \`${PUBLISH_RESULT}\`
          Check whether \`platform-v${VERSION}\` is already published. If it is still a draft, start a *new* Release Please workflow run on this branch to recover the complete artifact set. 'Rerun failed jobs' cannot regenerate artifacts from successful jobs.
          <${RUN_URL}|View failed CI run> · <https://github.com/${GITHUB_REPOSITORY}/actions/workflows/release-please.yml|Start a new release run>"
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -sSf -X POST -H 'Content-type: application/json' --data @- "${SLACK_WEBHOOK_URL}"

  verify-handoff-fixture:
    name: Verify non-publishing artifact handoff
    needs: [release-please]
    if: ${{ needs.release-please.outputs.handoff_fixture == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout fixture policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Download same-run fixture without the App token
        uses: $/.github/actions/github-download-artifact
        with:
          name: handoff-fixture-relay-${{ github.run_attempt }}
          path: ${{ runner.temp }}/handoff-fixture-loaded
      - name: Verify both architecture image identities without publishing
        env:
          FIXTURE_DIR: ${{ runner.temp }}/handoff-fixture-loaded
        run: python3 .github/scripts/release-handoff-fixture.py load
