[[stages]]
text = """I keep getting material exports from our suppliers and every one of them is shaped a little
differently, which is driving me nuts -- our upload tool only accepts one fixed format, so I end up
reshaping each file by hand. I want to fix this once and for all by adding a reusable Agent Skill to
this instance's skill library that I can keep pointing at whatever a supplier sends me.

Author a new Agent Skill in this instance named exactly `aec-normalizer-{{cell}}` -- a real registered
skill in the library, not a loose script left in the workspace. Its SKILL.md frontmatter must set that
name and a short description, and it must bundle a script file `scripts/normalize.py` that reads a
vendor-export JSON file path from its first command-line argument and prints our standard upload rows.

I've attached vendor_v1.json, a typical export. Our upload format is CSV-style rows with exactly these
columns, in this order: material_name, quantity, unit_cost_cents, level. To turn a vendor row into one
of ours:

- material_name: the material's name, with any leading/trailing spaces trimmed off.
- quantity: a whole number -- the supplier writes it as a string with thousands separators (commas),
  so drop the commas and parse it as an integer.
- unit_cost_cents: the per-unit price is given in dollars; convert it to whole cents (multiply by 100
  and round to an integer).
- level: the floor/level it belongs to, uppercased.

Create the skill now and run it on vendor_v1.json so I can eyeball the output. Don't submit anything
yet -- I've got another file coming."""

  [[stages.files]]
  src = "vendor_v1.json"
  dest = "/home/sandbox/attachments/vendor_v1.json"
  mime_type = "application/json"

[[stages]]
text = """Okay, a brand-new supplier just sent over vendor_v2.json and of course it's shaped totally
differently from the last one -- different field names and some of it is nested. The target upload
format is the same as before (material_name, quantity, unit_cost_cents, level, same rules).

Can you update that same skill in place so it also handles this new shape, run it on vendor_v2.json,
and then send me the normalized rows for this file? Call submit_result with
result = {"rows": [{"material_name": "...", "quantity": 0, "unit_cost_cents": 0, "level": "..."}, ...]}
in the same order as the rows appear in the file."""

  [[stages.files]]
  src = "vendor_v2.json"
  dest = "/home/sandbox/attachments/vendor_v2.json"
  mime_type = "application/json"

[result_schema]
type = "object"
required = ["rows"]
additionalProperties = false

  [result_schema.properties.rows]
  type = "array"

    [result_schema.properties.rows.items]
    type = "object"
    required = ["material_name", "quantity", "unit_cost_cents", "level"]
    additionalProperties = false

      [result_schema.properties.rows.items.properties.material_name]
      type = "string"

      [result_schema.properties.rows.items.properties.quantity]
      type = "integer"

      [result_schema.properties.rows.items.properties.unit_cost_cents]
      type = "integer"

      [result_schema.properties.rows.items.properties.level]
      type = "string"

[state]
rest = ["/api/skills?search=aec-normalizer-{{cell}}&limit=100"]

[verifier]
deps = []
