name: Update Codex Client Version

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-codex-client-version
  cancel-in-progress: false

jobs:
  update:
    name: Propose latest stable Codex client version
    if: github.repository == 'archestra-ai/archestra'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./platform
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-env

      - name: Resolve latest stable Codex release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/openai/codex/releases/latest --jq .tag_name)"
          if [[ ! "$tag" =~ ^rust-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected Codex stable release tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#rust-v}" >> "$GITHUB_OUTPUT"

      # The App token makes pushes and the new PR trigger ordinary CI.
      - name: Generate releaser token
        id: token
        uses: ./.github/actions/github-app-token
        with:
          app-id: ${{ secrets.ARCHESTRA_RELEASER_GITHUB_APP_ID }}
          private-key: ${{ secrets.ARCHESTRA_RELEASER_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Prepare automation branch
        id: branch
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: automation/codex-models-client-version
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com --force
          git config user.name "Archestra releaser automation"
          git config user.email "releaser-bot@users.noreply.github.com"
          git fetch origin main

          target="$RUNNER_TEMP/codex-client-version-branch"
          existing="$(git ls-remote --heads origin "refs/heads/$BRANCH")"
          if [[ -n "$existing" ]]; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git worktree add -b "$BRANCH" "$target" "origin/$BRANCH"
            git -C "$target" -c core.hooksPath=/dev/null merge --no-edit origin/main
          else
            git worktree add -b "$BRANCH" "$target" origin/main
          fi
          echo "path=$target" >> "$GITHUB_OUTPUT"

      # This script comes from the trusted main checkout. It only reads and
      # changes the source file in the separate automation worktree.
      - name: Update Codex client version
        id: update
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TARGET: ${{ steps.branch.outputs.path }}
        run: |
          set -euo pipefail
          source_file="platform/backend/src/routes/chat/model-fetchers/openai.ts"
          pnpm --dir backend update:codex-models-client-version "$TAG" "$TARGET/$source_file"
          if git -C "$TARGET" diff --quiet -- "$source_file"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push update
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TARGET: ${{ steps.branch.outputs.path }}
          VERSION: ${{ steps.release.outputs.version }}
          BRANCH: automation/codex-models-client-version
        run: |
          set -euo pipefail
          source_file="platform/backend/src/routes/chat/model-fetchers/openai.ts"
          git -C "$TARGET" add -- "$source_file"
          git -C "$TARGET" -c core.hooksPath=/dev/null commit -m "chore(openai): update Codex client version to $VERSION"
          git -C "$TARGET" push origin "HEAD:refs/heads/$BRANCH"

      # Also recovers a branch pushed by an earlier run whose PR creation failed.
      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ steps.branch.outputs.path }}
          BRANCH: automation/codex-models-client-version
        run: |
          set -euo pipefail
          source_file="platform/backend/src/routes/chat/model-fetchers/openai.ts"
          if git -C "$TARGET" diff --quiet origin/main HEAD -- "$source_file"; then
            echo "Codex client version already matches main."
            exit 0
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi
          fi

          pr_title="chore(openai): update Codex client version"
          pr_body="Track a stable Codex CLI release so the ChatGPT subscription model catalog stays current."
          owner="${GH_REPO%%/*}"
          existing_pr="$(gh api "repos/$GH_REPO/pulls?state=open&head=$owner:$BRANCH&base=main&per_page=1" --jq '.[0].number // empty')"
          if [[ -z "$existing_pr" ]]; then
            pr="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$pr_title" \
              --body "$pr_body")"
          else
            pr="$existing_pr"
            gh pr edit "$pr" --title "$pr_title" --body "$pr_body"
          fi

          auto_merge_enabled="$(gh pr view "$pr" --repo "$GH_REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [[ "$auto_merge_enabled" == "false" ]]; then
            gh pr merge "$pr" --repo "$GH_REPO" --auto
          fi
