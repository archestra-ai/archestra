[[stages]]
text = """Using the Archestra platform API, create three agents named exactly `delta`, `epsilon`, and
`zeta`. A name is enough. When all three exist, say so."""

[[stages]]
text = """A teammate left review notes about these agents at /home/sandbox/attachments/agent-review-notes.md.
Read that file, then give me two things: the review reference code printed in the notes, and the
roster of the agents we currently have. Call submit_result with
result = {"review_reference": "<the code from the notes>", "agent_names": [<the names of our agents>]}."""

  [[stages.files]]
  src = "agent-review-notes.md"
  dest = "/home/sandbox/attachments/agent-review-notes.md"
  mime_type = "text/markdown"

[result_schema]
type = "object"
required = ["review_reference", "agent_names"]
additionalProperties = false

  [result_schema.properties.review_reference]
  type = "string"
  minLength = 1

  [result_schema.properties.agent_names]
  type = "array"

    [result_schema.properties.agent_names.items]
    type = "string"

[state]
rest = ["/api/agents"]

[verifier]
deps = []
