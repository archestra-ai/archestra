[[stages]]
text = """I need a Q1 2024 sales analysis off the two attached files in /home/sandbox/attachments/: daily_sales.csv (one row per product per date, with columns date, product_id, category, revenue, units) and products.csv (product_id, product_name, category). Use whatever tool you like to compute it, then hand it back via submit_result.

Definitions -- follow these exactly so the numbers are unambiguous:

- Q1 2024 window: the rows whose date is >= 2024-01-01 AND <= 2024-03-30 (that's the start date 2024-01-01 plus 90 days, inclusive of both ends; the explicit end date is 2024-03-30). Everything below is computed over this window only.
- Daily revenue (for a given date) = the sum of the `revenue` column across all products on that date.
- total_q1_revenue = the sum of `revenue` over every row in the Q1 window, rounded to 2 decimals.
- q1_row_count = the number of sales rows in the Q1 window.
- top_products_per_category = for each category, the top 3 product_ids by total Q1 revenue (each product's summed `revenue` over the window). Tie-break: total revenue descending, then product_id ascending. Return the product_ids themselves (e.g. "P001"), not the product names. If a category has fewer than 3 products, return all of them in that order.
- revenue_trend = one row per DISTINCT date present in the Q1 window, ordered by date ascending. For each such date:
    - cumulative_revenue = the running sum of daily revenue up to and including that date, rounded to 2 decimals.
    - rolling_7d_avg = the mean of the daily revenue totals over the trailing 7 calendar days inclusive of the current date -- i.e. averaged over the dates that are present in the window [date - 6 days, date]. Round to 2 decimals.

Submit via submit_result with exactly these fields: total_q1_revenue (number), q1_row_count (integer), top_products_per_category (object mapping each category to an array of product_id strings), and revenue_trend (array of objects each with date as "YYYY-MM-DD", cumulative_revenue, and rolling_7d_avg)."""

  [[stages.files]]
  src = "daily_sales.csv"
  dest = "/home/sandbox/attachments/daily_sales.csv"
  mime_type = "text/csv"

  [[stages.files]]
  src = "products.csv"
  dest = "/home/sandbox/attachments/products.csv"
  mime_type = "text/csv"

[result_schema]
type = "object"
required = ["total_q1_revenue", "q1_row_count", "top_products_per_category", "revenue_trend"]
additionalProperties = false

  [result_schema.properties.total_q1_revenue]
  type = "number"
  minimum = 0

  [result_schema.properties.q1_row_count]
  type = "integer"
  minimum = 0

  [result_schema.properties.top_products_per_category]
  type = "object"

    [result_schema.properties.top_products_per_category.additionalProperties]
    type = "array"

      [result_schema.properties.top_products_per_category.additionalProperties.items]
      type = "string"

  [result_schema.properties.revenue_trend]
  type = "array"

    [result_schema.properties.revenue_trend.items]
    type = "object"
    required = ["date", "cumulative_revenue", "rolling_7d_avg"]
    additionalProperties = false

      [result_schema.properties.revenue_trend.items.properties.date]
      type = "string"

      [result_schema.properties.revenue_trend.items.properties.cumulative_revenue]
      type = "number"

      [result_schema.properties.revenue_trend.items.properties.rolling_7d_avg]
      type = "number"

[verifier]
deps = ["pandas==2.2.3"]
