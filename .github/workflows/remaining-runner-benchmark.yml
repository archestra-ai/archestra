# Temporary experiment, wave 1. Source/images fixed to a successful merge group.
name: Remaining CI Runner Benchmark
'on':
  pull_request:
    branches:
    - main
    paths:
    - .github/workflows/remaining-runner-benchmark.yml
permissions: {}
concurrency:
  group: remaining-runner-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: false
env:
  PLATFORM_IMAGE_REGISTRY: europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public
  PLATFORM_IMAGE_NAME: platform
  MCP_SERVER_BASE_IMAGE_REGISTRY: europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public
  MCP_SERVER_BASE_IMAGE_NAME: mcp-server-base
  UNTRUSTED_PR: 'false'
jobs:
  images:
    name: Pin existing verified-run images
    runs-on: ubuntu-24.04
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.repository.private
    permissions:
      contents: read
    outputs:
      platform-full: ${{ steps.images.outputs.platform-full }}
      platform-slim: ${{ steps.images.outputs.platform-slim }}
      mcp-base: ${{ steps.images.outputs.mcp-base }}
    steps:
    - name: Checkout benchmark source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: 52e58e213bd2e3e49e77f5afe5288b82b7d9008e
    - name: Resolve shared immutable images
      id: images
      env:
        SOURCE_SHA: 52e58e213bd2e3e49e77f5afe5288b82b7d9008e
      run: "set -euo pipefail\nresolve() {\n  local tag=\"$1\" output=\"$2\" file digest\n  file=$(mktemp)\n  docker buildx imagetools inspect \"$tag\" --raw > \"\
        $file\"\n  jq -e '.schemaVersion == 2' \"$file\" >/dev/null\n  digest=\"sha256:$(sha256sum \"$file\" | awk '{print $1}')\"\n  rm \"$file\"\n  printf '%s=%s@%s\n\
        ' \"$output\" \"${tag%:*}\" \"$digest\" >> \"$GITHUB_OUTPUT\"\n  printf 'Pinned %s@%s\n' \"${tag%:*}\" \"$digest\"\n}\nresolve \"${PLATFORM_IMAGE_REGISTRY}/${PLATFORM_IMAGE_NAME}:${SOURCE_SHA}-e2e\"\
        \ platform-full\nresolve \"${PLATFORM_IMAGE_REGISTRY}/${PLATFORM_IMAGE_NAME}:${SOURCE_SHA}-e2e-slim\" platform-slim\nresolve \"${MCP_SERVER_BASE_IMAGE_REGISTRY}/${MCP_SERVER_BASE_IMAGE_NAME}:${SOURCE_SHA}\"\
        \ mcp-base\n"
  platform-e2e-k8s-tests:
    name: platform-e2e-k8s-tests (${{ matrix.name || 'single' }}, ${{ matrix.provider }})
    needs:
    - images
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.repository.private
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
    - name: Reclaim disk space (background)
      run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup &
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: 52e58e213bd2e3e49e77f5afe5288b82b7d9008e
    - name: Record runner identity
      run: 'node -e ''const os=require("os"); console.log(JSON.stringify({cpuCount:os.cpus().length,cpuModel:os.cpus()[0].model,memoryBytes:os.totalmem()}))''

        git rev-parse HEAD

        docker version --format ''{{.Server.Version}}''

        '
    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        working-directory: ./platform
    - name: Load platform image (untrusted PRs, from artifact)
      if: ${{ env.UNTRUSTED_PR == 'true' }}
      uses: ./.github/actions/load-platform-image
      with:
        source: artifact
        image-tag: archestra-platform:${{ '52e58e213bd2e3e49e77f5afe5288b82b7d9008e' }}
        wait-timeout-seconds: '60'
    - name: Load MCP server base image (untrusted PRs, from artifact)
      if: ${{ env.UNTRUSTED_PR == 'true' }}
      uses: ./.github/actions/load-mcp-server-base-image
      with:
        source: artifact
        image-tag: mcp-server-base:${{ '52e58e213bd2e3e49e77f5afe5288b82b7d9008e' }}
        wait-timeout-seconds: '60'
    - name: Prepare blob report workspace
      run: 'rm -rf platform/e2e-tests/blob-report platform/e2e-tests/blob-reports

        mkdir -p platform/e2e-tests/blob-reports

        '
    - name: Setup Archestra Platform
      id: setup-platform
      uses: ./.github/actions/setup-archestra-platform
      with:
        kind-config-path: .github/kind.yaml
        kind-cluster-name: archestra-ci-cluster
        helm-values-path: .github/values-ci.yaml
        deploy-e2e-dependencies: 'true'
        e2e-dependencies-install-mode: foreground
        e2e-dependencies-extra-helm-set: vault.k8sAuth.enabled=true,vault.k8sAuth.boundServiceAccountName=archestra-platform,vault.k8sAuth.boundServiceAccountNamespace=default
        e2e-dependencies-wait-for-vault: 'true'
        build-platform-image: 'false'
        platform-image-tag: ${{ env.UNTRUSTED_PR == 'true' && format('archestra-platform:{0}', '52e58e213bd2e3e49e77f5afe5288b82b7d9008e') || needs.images.outputs.platform-slim
          }}
        platform-context: ./platform
        platform-image-in-cluster-pull: ${{ env.UNTRUSTED_PR == 'true' && 'false' || 'true' }}
        mcp-server-base-image-tag: ${{ env.UNTRUSTED_PR == 'true' && format('mcp-server-base:{0}', '52e58e213bd2e3e49e77f5afe5288b82b7d9008e') || needs.images.outputs.mcp-base
          }}
        image-pull-timeout-seconds: '60'
    - name: Run K8s-bound E2E tests
      id: e2e
      continue-on-error: true
      uses: ./.github/actions/run-e2e-tests
      with:
        projects: api-k8s --project=vault-k8s
        timeout: '20'
    - name: Upload blob report
      if: ${{ !cancelled() }}
      continue-on-error: true
      uses: ./.github/actions/github-upload-artifact
      with:
        name: blob-report-k8s-${{ matrix.provider }}
        path: platform/e2e-tests/blob-report/
        retention-days: 1
    - name: Show logs on failure or flaky tests
      if: always() && (steps.setup-platform.outcome == 'failure' || steps.e2e.outcome == 'failure' || steps.e2e.outputs.has_flaky_tests == 'true')
      run: "echo \"=== Kubernetes Pods ===\"\nkubectl get pods -o wide || true\n\necho \"=== Kubernetes Services ===\"\nkubectl get services || true\n\necho \"===\
        \ Archestra Platform Logs (main container) ===\"\nkubectl logs -l app.kubernetes.io/name=archestra-platform -c archestra-platform --tail=200 2>/dev/null ||\
        \ true\n\n# The external-IdP validation logs (validateExternalIdpToken /\n# \"JWKS JWT validation failed\") fire mid-run, well before this dump,\n# so the\
        \ --tail=200 above misses them. Grep the full backend log so a\n# flaky JWKS-gateway 401 can be traced to the branch that rejected\n# the token. --tail=-1\
        \ is required: with a label selector, kubectl\n# logs otherwise caps output at the last 10 lines.\necho \"=== External IdP validation (full-log grep) ===\"\
        \nkubectl logs -l app.kubernetes.io/name=archestra-platform \\\n  -c archestra-platform --tail=-1 2>/dev/null \\\n  | grep -iE 'validateExternalIdpToken|JWKS\
        \ JWT validation failed|Invalid token for this profile' \\\n  || echo \"(no external-IdP validation log found)\"\n\necho \"=== Platform Init Container: vault-secrets\
        \ ===\"\nkubectl logs -l app.kubernetes.io/name=archestra-platform -c vault-secrets --tail=200 2>/dev/null || true\n\necho \"=== Platform Init Container:\
        \ setup-postgres-extensions ===\"\nkubectl logs -l app.kubernetes.io/name=archestra-platform -c setup-postgres-extensions --tail=200 2>/dev/null || true\n\
        \necho \"=== Platform Init Container: wait-for-postgres ===\"\nkubectl logs -l app.kubernetes.io/name=archestra-platform -c wait-for-postgres --tail=200 2>/dev/null\
        \ || true\n\necho \"=== PostgreSQL Logs ===\"\nkubectl logs -l app.kubernetes.io/name=postgresql --tail=200 || true\n\necho \"=== WireMock Logs ===\"\nkubectl\
        \ logs -l app=e2e-tests-wiremock --tail=200 2>/dev/null || true\n\necho \"=== Keycloak Logs ===\"\nkubectl logs -l app.kubernetes.io/name=keycloak --tail=200\
        \ 2>/dev/null || true\n\necho \"=== Vault Logs ===\"\nkubectl logs -l app.kubernetes.io/name=vault --tail=200 2>/dev/null || true\n\necho \"=== MCP Example\
        \ OAuth Server Logs ===\"\nkubectl logs -l app.kubernetes.io/name=mcp-example-oauth --tail=200 2>/dev/null || true\n\necho \"=== Describe Platform Pod ===\"\
        \nkubectl describe pod -l app.kubernetes.io/name=archestra-platform || true\n\necho \"=== Describe PostgreSQL Pod ===\"\nkubectl describe pod -l app.kubernetes.io/name=postgresql\
        \ || true\n\necho \"=== PostgreSQL StatefulSet & PVCs ===\"\nkubectl get statefulset,pvc -l app.kubernetes.io/name=postgresql -o wide || true\n\necho \"===\
        \ Recent Cluster Events ===\"\nkubectl get events --sort-by=.lastTimestamp -A 2>/dev/null | tail -60 || true\n"
    - name: Fail if K8s-bound E2E tests failed
      if: ${{ always() && steps.e2e.outcome == 'failure' }}
      run: exit 1
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: single
          provider: Blacksmith
          runner: blacksmith-8vcpu-ubuntu-2404
        - name: single
          provider: Ubicloud
          runner: ubicloud-standard-8-ubuntu-2404
  platform-e2e-lite-tests:
    name: platform-e2e-lite-tests (${{ matrix.name || 'single' }}, ${{ matrix.provider }})
    needs:
    - images
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.repository.private
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: chromium-1of2
          chromium_shard: '1'
          secondary_projects_default: api --project=identity-providers
          secondary_projects_nightly: api --project=identity-providers --project=identity-providers-saml --project=firefox --project=webkit
          provider: Blacksmith
          runner: blacksmith-8vcpu-ubuntu-2404
        - name: chromium-1of2
          chromium_shard: '1'
          secondary_projects_default: api --project=identity-providers
          secondary_projects_nightly: api --project=identity-providers --project=identity-providers-saml --project=firefox --project=webkit
          provider: Ubicloud
          runner: ubicloud-standard-8-ubuntu-2404
        - name: chromium-2of2
          chromium_shard: '2'
          provider: Blacksmith
          runner: blacksmith-8vcpu-ubuntu-2404
        - name: chromium-2of2
          chromium_shard: '2'
          provider: Ubicloud
          runner: ubicloud-standard-8-ubuntu-2404
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
    - name: Reclaim disk space (background)
      run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup &
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: 52e58e213bd2e3e49e77f5afe5288b82b7d9008e
    - name: Record runner identity
      run: 'node -e ''const os=require("os"); console.log(JSON.stringify({cpuCount:os.cpus().length,cpuModel:os.cpus()[0].model,memoryBytes:os.totalmem()}))''

        git rev-parse HEAD

        docker version --format ''{{.Server.Version}}''

        '
    - name: Pre-pull Lite images (background)
      env:
        TRUSTED_PLATFORM_IMAGE: ${{ needs.images.outputs.platform-slim }}
        IS_UNTRUSTED_PR: ${{ env.UNTRUSTED_PR }}
      run: "if [ \"$IS_UNTRUSTED_PR\" != \"true\" ]; then\n  docker pull \"$TRUSTED_PLATFORM_IMAGE\" >\"${RUNNER_TEMP}/lite-platform-pull.log\" 2>&1 &\nfi\nversion=$(jq\
        \ -r '.devDependencies[\"@playwright/test\"]' platform/e2e-tests/package.json | sed 's/^[\\^~]//')\ndocker pull \"mcr.microsoft.com/playwright:v${version}-noble\"\
        \ >\"${RUNNER_TEMP}/lite-playwright-pull.log\" 2>&1 &\n"
    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        working-directory: ./platform
    - name: Load platform image
      id: load-platform-image
      uses: ./.github/actions/load-platform-image
      with:
        source: ${{ env.UNTRUSTED_PR == 'true' && 'artifact' || 'registry' }}
        image-tag: ${{ env.UNTRUSTED_PR == 'true' && format('archestra-platform:{0}', '52e58e213bd2e3e49e77f5afe5288b82b7d9008e') || needs.images.outputs.platform-slim
          }}
        wait-timeout-seconds: '60'
    - name: Wait for MCP server base image
      if: ${{ env.UNTRUSTED_PR != 'true' }}
      env:
        MCP_SERVER_BASE_IMAGE: ${{ needs.images.outputs.mcp-base }}
      run: "deadline=$(( $(date +%s) + 60 ))\nuntil docker buildx imagetools inspect \"${MCP_SERVER_BASE_IMAGE}\" > /dev/null 2>&1; do\n  if [ \"$(date +%s)\" -ge\
        \ \"${deadline}\" ]; then\n    echo \"Timed out waiting for ${MCP_SERVER_BASE_IMAGE} to appear in the registry\"\n    exit 1\n  fi\n  echo \"${MCP_SERVER_BASE_IMAGE}\
        \ not pushed yet, retrying in 10s...\"\n  sleep 10\ndone\necho \"${MCP_SERVER_BASE_IMAGE} is available\"\n"
    - name: Start lite e2e stack
      env:
        PLATFORM_IMAGE: ${{ steps.load-platform-image.outputs.image-tag }}
        ARCHESTRA_BETA: 'false'
        MCP_SERVER_BASE_IMAGE: ${{ env.UNTRUSTED_PR == 'true' && format('{0}/{1}:latest', env.MCP_SERVER_BASE_IMAGE_REGISTRY, env.MCP_SERVER_BASE_IMAGE_NAME) || needs.images.outputs.mcp-base
          }}
      run: ./platform/scripts/e2e-lite.sh up
    - name: Configure embedded Kind registry cache
      uses: ./.github/actions/configure-kind-registry-cache
      with:
        cluster-name: archestra-mcp
    - name: Create e2e test env file
      run: "# UI/API must be \"localhost\", not 127.0.0.1: the SSO specs bounce the\n# browser to Keycloak, which redirects back to the realm's registered\n# http://localhost:3000\
        \ redirect URI \u2014 starting the flow on 127.0.0.1\n# strands better-auth's state cookie on the other host and every SSO\n# login fails with state_mismatch.\
        \ (The K8s job's specs run on the\n# same localhost defaults.)\n# The *_INTERNAL/BACKEND URLs are what the containerized backend must\n# resolve \u2014 the\
        \ sidecars' docker network names (see e2e-lite.sh).\n{\n  echo \"E2E_UI_BASE_URL=http://localhost:3000\"\n  echo \"E2E_API_BASE_URL=http://localhost:9000\"\
        \n  echo \"E2E_WIREMOCK_BASE_URL=http://127.0.0.1:9092\"\n  echo \"E2E_WIREMOCK_INTERNAL_URL=http://e2e-tests-wiremock:8080\"\n  echo \"E2E_KEYCLOAK_BACKEND_URL=http://e2e-tests-keycloak:8080\"\
        \n  # Selects this leg's chromium files (playwright.config.ts).\n  echo \"E2E_CHROMIUM_SHARD=${CHROMIUM_SHARD}\"\n} > /tmp/lite-e2e.env\ncat /tmp/lite-e2e.env\n"
      env:
        CHROMIUM_SHARD: ${{ matrix.chromium_shard }}
    - name: Run lite E2E tests
      id: e2e
      uses: ./.github/actions/run-e2e-tests
      with:
        projects: chromium
        extra_args: --grep-invert '@quickstart' --workers=3
        timeout: '20'
        env_file: /tmp/lite-e2e.env
        blob_report_name: report-chromium-shard-${{ matrix.chromium_shard }}.zip
    - name: Run API and identity provider E2E tests on the same stack
      if: ${{ matrix.name == 'chromium-1of2' }}
      uses: ./.github/actions/run-e2e-tests
      with:
        projects: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.secondary_projects_nightly || matrix.secondary_projects_default
          }}
        extra_args: --grep-invert '@quickstart'
        timeout: '20'
        env_file: /tmp/lite-e2e.env
        blob_report_dir: blob-report-api
    - name: Upload blob report
      if: ${{ !cancelled() }}
      continue-on-error: true
      uses: ./.github/actions/github-upload-artifact
      with:
        name: blob-report-lite-${{ matrix.name }}-${{ matrix.provider }}
        path: platform/e2e-tests/blob-report/
        retention-days: 1
    - name: Upload API and identity provider blob report
      if: ${{ !cancelled() && matrix.name == 'chromium-1of2' }}
      continue-on-error: true
      uses: ./.github/actions/github-upload-artifact
      with:
        name: blob-report-lite-api-${{ matrix.provider }}
        path: platform/e2e-tests/blob-report-api/
        retention-days: 1
    - name: Show platform logs on failure
      if: failure()
      run: 'echo "=== Lite Platform Container Logs ==="

        docker logs archestra-lite --tail=500 2>&1 || echo "Could not get container logs"


        echo "=== Keycloak Container Logs ==="

        docker logs e2e-tests-keycloak --tail=200 2>&1 || echo "Could not get Keycloak logs"


        echo "=== WireMock Container Logs ==="

        docker logs e2e-tests-wiremock --tail=200 2>&1 || echo "Could not get WireMock logs"


        echo "=== Embedded Kind Pods (MCP servers, Dagger engine) ==="

        docker exec archestra-lite kubectl --kubeconfig /app/data/.kubeconfig get pods -A -o wide 2>&1 || true


        echo "=== Docker Container Status ==="

        docker ps -a

        '
  platform-quickstart-e2e-tests:
    name: platform-quickstart-e2e-tests (${{ matrix.name || 'single' }}, ${{ matrix.provider }})
    needs:
    - images
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.repository.private
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
    - name: Reclaim disk space (background)
      run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup &
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: 52e58e213bd2e3e49e77f5afe5288b82b7d9008e
    - name: Record runner identity
      run: 'node -e ''const os=require("os"); console.log(JSON.stringify({cpuCount:os.cpus().length,cpuModel:os.cpus()[0].model,memoryBytes:os.totalmem()}))''

        git rev-parse HEAD

        docker version --format ''{{.Server.Version}}''

        '
    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        working-directory: ./platform
    - name: Load OpenAPPA platform image
      id: load-openappa-image
      uses: ./.github/actions/load-platform-image
      with:
        source: ${{ env.UNTRUSTED_PR == 'true' && 'artifact' || 'registry' }}
        image-tag: ${{ env.UNTRUSTED_PR == 'true' && format('archestra-platform:{0}', '52e58e213bd2e3e49e77f5afe5288b82b7d9008e') || needs.images.outputs.platform-slim
          }}
        wait-timeout-seconds: '60'
    - name: Wait for MCP server base image
      if: ${{ env.UNTRUSTED_PR != 'true' }}
      env:
        MCP_SERVER_BASE_IMAGE: ${{ needs.images.outputs.mcp-base }}
      run: "deadline=$(( $(date +%s) + 60 ))\nuntil docker buildx imagetools inspect \"${MCP_SERVER_BASE_IMAGE}\" > /dev/null 2>&1; do\n  if [ \"$(date +%s)\" -ge\
        \ \"${deadline}\" ]; then\n    echo \"Timed out waiting for ${MCP_SERVER_BASE_IMAGE} to appear in the registry\"\n    exit 1\n  fi\n  echo \"${MCP_SERVER_BASE_IMAGE}\
        \ not pushed yet, retrying in 10s...\"\n  sleep 10\ndone\necho \"${MCP_SERVER_BASE_IMAGE} is available\"\n"
    - name: Start lite e2e stack (OpenAPPA on)
      id: openappa-stack
      continue-on-error: true
      env:
        PLATFORM_IMAGE: ${{ steps.load-openappa-image.outputs.image-tag }}
        ARCHESTRA_BETA: 'true'
        MCP_SERVER_BASE_IMAGE: ${{ env.UNTRUSTED_PR == 'true' && format('{0}/{1}:latest', env.MCP_SERVER_BASE_IMAGE_REGISTRY, env.MCP_SERVER_BASE_IMAGE_NAME) || needs.images.outputs.mcp-base
          }}
      run: ./platform/scripts/e2e-lite.sh up
    - name: Configure embedded Kind registry cache (OpenAPPA)
      if: ${{ steps.openappa-stack.outcome == 'success' }}
      continue-on-error: true
      uses: ./.github/actions/configure-kind-registry-cache
      with:
        cluster-name: archestra-mcp
    - name: Create OpenAPPA e2e test env file
      if: ${{ steps.openappa-stack.outcome == 'success' }}
      run: "# Same values as the lite job's env file; see the notes there.\n{\n  echo \"E2E_UI_BASE_URL=http://localhost:3000\"\n  echo \"E2E_API_BASE_URL=http://localhost:9000\"\
        \n  echo \"E2E_WIREMOCK_BASE_URL=http://127.0.0.1:9092\"\n  echo \"E2E_WIREMOCK_INTERNAL_URL=http://e2e-tests-wiremock:8080\"\n  echo \"E2E_KEYCLOAK_BACKEND_URL=http://e2e-tests-keycloak:8080\"\
        \n} > /tmp/lite-e2e.env\ncat /tmp/lite-e2e.env\n"
    - name: Run OpenAPPA E2E tests
      id: openappa-e2e
      if: ${{ steps.openappa-stack.outcome == 'success' }}
      continue-on-error: true
      uses: ./.github/actions/run-e2e-tests
      with:
        projects: openappa
        extra_args: --grep-invert '@quickstart'
        timeout: '20'
        env_file: /tmp/lite-e2e.env
        blob_report_dir: blob-report-openappa
    - name: Upload OpenAPPA blob report
      if: ${{ !cancelled() && steps.openappa-stack.outcome == 'success' }}
      continue-on-error: true
      uses: ./.github/actions/github-upload-artifact
      with:
        name: blob-report-lite-openappa-${{ matrix.provider }}
        path: platform/e2e-tests/blob-report-openappa/
        retention-days: 1
    - name: Show OpenAPPA platform logs on failure
      if: ${{ always() && (steps.openappa-stack.outcome == 'failure' || steps.openappa-e2e.outcome == 'failure') }}
      run: 'echo "=== Lite Platform Container Logs ==="

        docker logs archestra-lite --tail=500 2>&1 || echo "Could not get container logs"


        echo "=== WireMock Container Logs ==="

        docker logs e2e-tests-wiremock --tail=200 2>&1 || echo "Could not get WireMock logs"


        echo "=== Embedded Kind Pods (MCP servers) ==="

        docker exec archestra-lite kubectl --kubeconfig /app/data/.kubeconfig get pods -A -o wide 2>&1 || true


        echo "=== Docker Container Status ==="

        docker ps -a

        '
    - name: Tear down lite e2e stack
      if: ${{ always() }}
      run: ./platform/scripts/e2e-lite.sh down
    - name: Load platform image
      id: load-platform-image
      if: ${{ env.UNTRUSTED_PR != 'true' }}
      uses: ./.github/actions/load-platform-image
      with:
        source: registry
        image-tag: ${{ needs.images.outputs.platform-full }}
        wait-timeout-seconds: '60'
    - name: Start WireMock for LLM provider mocking
      env:
        E2E_MAPPINGS_DIR: ${{ github.workspace }}/platform/helm/e2e-tests/mappings
      run: "# Create a shared Docker network so the quickstart container can reach WireMock by name\ndocker network create archestra-quickstart-net || true\n\n# Start\
        \ WireMock with the same mappings used in regular e2e tests\ndocker run -d \\\n  --name archestra-wiremock \\\n  --network archestra-quickstart-net \\\n \
        \ -p 9092:8080 \\\n  -v \"${E2E_MAPPINGS_DIR}:/home/wiremock/mappings:ro\" \\\n  wiremock/wiremock:3.13.1 \\\n  --global-response-templating --disable-gzip\
        \ --verbose\n\n# Wait for WireMock to be ready\nfor i in {1..15}; do\n  if curl -sf http://127.0.0.1:9092/__admin/health > /dev/null 2>&1; then\n    echo\
        \ \"WireMock is ready!\"\n    break\n  fi\n  echo \"Waiting for WireMock... (attempt $i/15)\"\n  sleep 1\ndone\n"
    - name: Start platform in quickstart mode
      env:
        PLATFORM_IMAGE_TAG: ${{ steps.load-platform-image.outputs.image-tag || steps.load-openappa-image.outputs.image-tag }}
      run: "echo \"Starting Archestra platform in quickstart mode...\"\n\n# Create named volumes for data persistence\ndocker volume create archestra-ci-postgres-data\
        \ || true\ndocker volume create archestra-ci-app-data || true\n\n# Start the platform container\n# Note: Uses the public MCP server base image with 'latest'\
        \ tag because:\n# 1. The embedded Kind cluster cannot easily access images loaded on the host Docker daemon\n# 2. Release-please bumps the version in config.ts\
        \ before the image is published,\n#    causing failures when running on release PRs (the new version doesn't exist yet)\n# Using 'latest' ensures the image\
        \ is always available regardless of version bumps\n#\n# supply-chain-policy: allow-latest quickstart needs a published public fallback\n# Provider base URLs\
        \ point to WireMock so quickstart tests can mock LLM responses\n# Rate limiting is disabled like in the lite and K8s environments:\n# the auth setup's sign-in/sign-out\
        \ churn (amplified by Playwright\n# retries) trips better-auth's per-IP limiter and fails user setup\n# with 429s \u2014 measured on standard runners, where\
        \ slower cores\n# bunch the retries tighter than the old hardware did.\ndocker run -d \\\n  --name archestra-quickstart \\\n  --network archestra-quickstart-net\
        \ \\\n  -p 127.0.0.1:9000:9000 \\\n  -p 127.0.0.1:3000:3000 \\\n  -e ARCHESTRA_QUICKSTART=true \\\n  -e ARCHESTRA_AUTH_RATE_LIMIT_DISABLED=true \\\n  -e ARCHESTRA_ORCHESTRATOR_MCP_SERVER_BASE_IMAGE=europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public/mcp-server-base:latest\
        \ \\\n  -e ARCHESTRA_ANALYTICS=disabled \\\n  -e ARCHESTRA_OPENAI_BASE_URL=http://archestra-wiremock:8080/v1 \\\n  -e ARCHESTRA_ANTHROPIC_BASE_URL=http://archestra-wiremock:8080\
        \ \\\n  -e ARCHESTRA_GEMINI_BASE_URL=http://archestra-wiremock:8080 \\\n  -v /var/run/docker.sock:/var/run/docker.sock \\\n  -v archestra-ci-postgres-data:/var/lib/postgresql/data\
        \ \\\n  -v archestra-ci-app-data:/app/data \\\n  \"${PLATFORM_IMAGE_TAG}\"\n\necho \"Container started, waiting for platform to be ready...\"\n"
    - name: Wait for platform to be healthy
      run: "echo \"Waiting for platform services to be healthy...\"\n\n# Startup liveness can succeed before the API takes over its port.\n# Wait for backend readiness\
        \ before running application assertions (max 3 minutes).\n# Use 127.0.0.1 instead of localhost to avoid IPv6 issues with Docker port mapping\necho \"Checking\
        \ backend readiness...\"\nfor i in {1..90}; do\n  if curl -sf http://127.0.0.1:9000/ready > /dev/null 2>&1; then\n    echo \"Backend is ready!\"\n    break\n\
        \  fi\n  echo \"Waiting for backend... (attempt $i/90)\"\n  sleep 2\ndone\n\n# Verify the application API is ready\nif ! curl -sf http://127.0.0.1:9000/ready;\
        \ then\n  echo \"Backend readiness check failed after 3 minutes\"\n  docker logs archestra-quickstart --tail=200\n  exit 1\nfi\n\n# Wait for frontend (max\
        \ 1 minute - should be quick after backend is ready)\necho \"Checking frontend health...\"\nfor i in {1..30}; do\n  if curl -sf http://127.0.0.1:3000/ > /dev/null\
        \ 2>&1; then\n    echo \"Frontend is healthy!\"\n    break\n  fi\n  echo \"Waiting for frontend... (attempt $i/30)\"\n  sleep 2\ndone\n\n# Verify frontend\
        \ is accessible\nif ! curl -sf http://127.0.0.1:3000/; then\n  echo \"Frontend health check failed after 1 minute\"\n  docker logs archestra-quickstart --tail=200\n\
        \  exit 1\nfi\n\necho \"All services are ready!\"\n"
    - name: Configure embedded Kind registry cache
      uses: ./.github/actions/configure-kind-registry-cache
      with:
        cluster-name: archestra-mcp
    - name: Assert the container never dials a dead loopback address
      run: "# Context only \u2014 never the reason the step fails.\necho \"--- container facts ---\"\ndocker exec archestra-quickstart node -e '\n  const listening\
        \ = (f) => require(\"fs\").readFileSync(f, \"utf8\").trim().split(\"\\n\").slice(1)\n    .map((l) => l.trim().split(/\\s+/)).filter((c) => c[3] === \"0A\"\
        )\n    .map((c) => c[1].split(\":\")).map(([a, p]) => parseInt(p, 16)).sort((a, b) => a - b);\n  console.log(\"  listening on v4:\", listening(\"/proc/net/tcp\"\
        ).join(\" \"));\n  console.log(\"  listening on v6:\", listening(\"/proc/net/tcp6\").join(\" \"));\n  require(\"dns\").lookup(\"localhost\", { all: true },\
        \ (_, a) =>\n    console.log(\"  localhost resolves to:\", JSON.stringify(a)));\n' || true\n\n# Each assertion records its own result so one failure still\
        \ reports\n# the others, rather than aborting the step on the first.\nrc=0\n\n# 1. The runtime knob the SSR paths and the generated API client read.\necho\
        \ \"1/3 The image's internal API URL is an address, not a name...\"\ndocker exec archestra-quickstart node -e '\n  const base = process.env.ARCHESTRA_INTERNAL_API_BASE_URL;\n\
        \  if (!base) { console.error(\"FAILED: ARCHESTRA_INTERNAL_API_BASE_URL is unset in the image\"); process.exit(1); }\n  const { hostname } = new URL(base);\n\
        \  console.log(`  ARCHESTRA_INTERNAL_API_BASE_URL=${base}`);\n  if (require(\"net\").isIP(hostname) === 0) {\n    console.error(`FAILED: ${hostname} is a\
        \ name; it resolves to ::1 first, where nothing listens`);\n    process.exit(1);\n  }\n' || rc=1\n\n# 2. The frontend proxies /api, /v1 and /ws to the backend\
        \ through\n#    Next.js rewrites. With output: \"standalone\" those destinations are\n#    resolved during `next build` and frozen into routes-manifest.json,\n\
        #    so no runtime environment can retarget them \u2014 the shipped manifest\n#    IS the dial list, and it is what carried `http://localhost:9000`\n#   \
        \ into the proxy errors users reported.\necho \"2/3 No baked proxy destination names localhost...\"\ndocker exec archestra-quickstart node -e '\n  const m\
        \ = require(\"/app/frontend/.next/routes-manifest.json\").rewrites;\n  // Some destinations carry :params in the host (the Sentry tunnel),\n  // which is\
        \ not a parseable URL and can never be a loopback dial.\n  const parsed = [...(m.beforeFiles ?? []), ...(m.afterFiles ?? []), ...(m.fallback ?? [])]\n   \
        \ .map((r) => { try { return new URL(r.destination); } catch { return null; } })\n    .filter((u) => u && /^https?:$/.test(u.protocol));\n  const named =\
        \ parsed.filter((u) => u.hostname === \"localhost\");\n  console.log(`  ${parsed.length} absolute destinations, ${named.length} naming localhost`);\n  if\
        \ (named.length) {\n    console.error(`FAILED: these resolve to ::1 first, where nothing listens: ${JSON.stringify(named.map((u) => u.href))}`);\n    process.exit(1);\n\
        \  }\n' || rc=1\n\n# 3. The same destinations, actually dialled \u2014 with the resolver pinned\n#    to verbatim order and Happy Eyeballs off, so Node connects\
        \ to the\n#    FIRST address only. That is what a non-Node client in the container\n#    does, and it is what turns an ambiguous name from \"slow\" into\n\
        #    \"refused\". Both flags are passed on argv, which beats NODE_OPTIONS,\n#    and NODE_OPTIONS itself is overridden here with something an\n#    operator\
        \ plausibly sets: the fix must not live anywhere a user's\n#    `docker run -e NODE_OPTIONS=...` could replace it.\necho \"3/3 Every proxy destination answers\
        \ on its first-resolved address...\"\ndocker exec \\\n  -e NODE_OPTIONS=--max-old-space-size=4096 \\\n  archestra-quickstart \\\n  node --dns-result-order=verbatim\
        \ --no-network-family-autoselection -e '\n    const isLoopback = (h) => h === \"localhost\" || h === \"[::1]\" || h.startsWith(\"127.\");\n    const m = require(\"\
        /app/frontend/.next/routes-manifest.json\").rewrites;\n    const origins = [...new Set([...(m.beforeFiles ?? []), ...(m.afterFiles ?? []), ...(m.fallback\
        \ ?? [])]\n      .map((r) => { try { return new URL(r.destination); } catch { return null; } })\n      .filter((u) => u && /^https?:$/.test(u.protocol) &&\
        \ isLoopback(u.hostname))\n      .map((u) => u.origin))];\n    if (!origins.length) { console.error(\"FAILED: no loopback proxy destination found to test\"\
        ); process.exit(1); }\n    Promise.all(origins.map((origin) =>\n      fetch(new URL(\"/health\", origin))\n        .then((r) => r.json())\n        .then((j)\
        \ => console.log(`  ${origin} -> ${JSON.stringify(j)}`))\n        .catch((e) => {\n          console.error(`FAILED: ${origin} unreachable on its first-resolved\
        \ address: ${e.cause?.message ?? e.message}`);\n          process.exitCode = 1;\n        })\n    ));\n  ' || rc=1\n\nif [ \"$rc\" -ne 0 ]; then\n  echo \"\
        The container dials an address it does not listen on \u2014 see issues #4917 / #6933.\"\n  exit 1\nfi\necho \"The container dials only addresses it actually\
        \ listens on.\"\n"
    - name: Assert embedded Dagger Engine is live
      run: "KUBECONFIG_PATH=/app/data/.kubeconfig\n\necho \"Waiting for the Dagger Engine statefulset to be Ready...\"\nif ! docker exec archestra-quickstart \\\n\
        \    kubectl --kubeconfig \"${KUBECONFIG_PATH}\" rollout status \\\n    statefulset/dagger-runtime-engine -n default --timeout=120s; then\n  echo \"FAILED:\
        \ Dagger Engine statefulset did not become Ready\"\n  docker exec archestra-quickstart kubectl --kubeconfig \"${KUBECONFIG_PATH}\" get pods -n default -o\
        \ wide || true\n  docker exec archestra-quickstart kubectl --kubeconfig \"${KUBECONFIG_PATH}\" describe statefulset/dagger-runtime-engine -n default || true\n\
        \  docker exec archestra-quickstart kubectl --kubeconfig \"${KUBECONFIG_PATH}\" get events -n default --sort-by=.lastTimestamp 2>/dev/null | tail -40 || true\n\
        \  docker logs archestra-quickstart --tail=200 2>&1 || true\n  exit 1\nfi\n\n# rollout status only proves the pod is Ready. The entrypoint's own gate\n# is\
        \ 60s; if it timed out there but the pod became Ready a few seconds\n# later, the backend env exports never ran and the runtime stays OFF for\n# users even\
        \ though the pod is up. The success log line is the authoritative\n# signal that the feature actually flipped on.\n# Match against the captured logs with\
        \ shell pattern matching rather\n# than `docker logs | grep -q`: under Actions' default `bash -o pipefail`\n# a `grep -q` that exits early can SIGPIPE the\
        \ producer and fail the\n# whole pipeline, spuriously reporting the confirmation as missing.\necho \"Verifying the entrypoint enabled the code runtime...\"\
        \nLOGS=$(docker logs archestra-quickstart 2>&1)\nif [[ \"${LOGS}\" == *\"code runtime stays disabled\"* ]]; then\n  echo \"FAILED: entrypoint reported the\
        \ Dagger Engine did not become ready in time\"\n  exit 1\nfi\nif [[ \"${LOGS}\" != *\"Dagger Engine ready - code runtime enabled\"* ]]; then\n  echo \"FAILED:\
        \ did not find the code-runtime-enabled confirmation in container logs\"\n  exit 1\nfi\necho \"Dagger Engine is live and the code runtime is enabled.\"\n"
    - name: Create e2e test env file
      run: '# Use 127.0.0.1 instead of localhost to avoid IPv6 issues with Docker

        echo "E2E_UI_BASE_URL=http://127.0.0.1:3000" > /tmp/quickstart-e2e.env

        echo "E2E_API_BASE_URL=http://127.0.0.1:9000" >> /tmp/quickstart-e2e.env

        echo "E2E_WIREMOCK_BASE_URL=http://127.0.0.1:9092" >> /tmp/quickstart-e2e.env

        cat /tmp/quickstart-e2e.env

        '
    - name: Run quickstart E2E tests
      id: e2e
      uses: ./.github/actions/run-e2e-tests
      with:
        projects: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'quickstart --project=quickstart-recovery' || 'quickstart'
          }}
        extra_args: --grep '@quickstart'
        env_file: /tmp/quickstart-e2e.env
    - name: Upload blob report
      if: ${{ !cancelled() }}
      continue-on-error: true
      uses: ./.github/actions/github-upload-artifact
      with:
        name: blob-report-quickstart-${{ matrix.provider }}
        path: platform/e2e-tests/blob-report/
        retention-days: 1
    - name: Show platform logs on failure
      if: failure()
      run: 'echo "=== Archestra Quickstart Container Logs ==="

        docker logs archestra-quickstart --tail=500 2>&1 || echo "Could not get container logs"


        echo "=== WireMock Container Logs ==="

        docker logs archestra-wiremock --tail=200 2>&1 || echo "Could not get WireMock logs"


        echo "=== Docker Container Status ==="

        docker ps -a


        echo "=== Docker Volumes ==="

        docker volume ls

        '
    - name: Cleanup
      if: always()
      run: 'docker stop archestra-quickstart archestra-wiremock 2>/dev/null || true

        docker rm archestra-quickstart archestra-wiremock 2>/dev/null || true

        docker network rm archestra-quickstart-net 2>/dev/null || true

        docker volume rm archestra-ci-postgres-data 2>/dev/null || true

        docker volume rm archestra-ci-app-data 2>/dev/null || true

        '
    - name: Fail if OpenAPPA E2E tests failed
      if: ${{ always() && (steps.openappa-stack.outcome == 'failure' || steps.openappa-e2e.outcome == 'failure') }}
      run: exit 1
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: single
          provider: Blacksmith
          runner: blacksmith-8vcpu-ubuntu-2404
        - name: single
          provider: Ubicloud
          runner: ubicloud-standard-8-ubuntu-2404
  platform-e2e-vault-tests:
    name: platform-e2e-vault-tests (${{ matrix.name || 'single' }}, ${{ matrix.provider }})
    needs:
    - images
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.repository.private
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Reclaim disk space (background)
      run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup &
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: 52e58e213bd2e3e49e77f5afe5288b82b7d9008e
    - name: Record runner identity
      run: 'node -e ''const os=require("os"); console.log(JSON.stringify({cpuCount:os.cpus().length,cpuModel:os.cpus()[0].model,memoryBytes:os.totalmem()}))''

        git rev-parse HEAD

        docker version --format ''{{.Server.Version}}''

        '
    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        working-directory: ./platform
    - name: Setup Archestra Platform with Readonly Vault
      uses: ./.github/actions/setup-archestra-platform
      with:
        kind-config-path: .github/kind.yaml
        kind-cluster-name: archestra-ci-cluster
        helm-values-path: .github/values-ci.yaml
        deploy-e2e-dependencies: 'true'
        e2e-dependencies-install-mode: foreground
        e2e-dependencies-extra-helm-set: vault.k8sAuth.enabled=true,vault.k8sAuth.boundServiceAccountName=archestra-platform,vault.k8sAuth.boundServiceAccountNamespace=default
        e2e-dependencies-wait-for-vault: 'true'
        build-platform-image: 'false'
        platform-image-tag: ${{ needs.images.outputs.platform-slim }}
        platform-context: ./platform
        platform-image-in-cluster-pull: 'true'
        mcp-server-base-image-tag: ${{ needs.images.outputs.mcp-base }}
        image-pull-timeout-seconds: '60'
        extra-helm-set: archestra.env.ARCHESTRA_SECRETS_MANAGER=READONLY_VAULT
    - name: Run Readonly Vault E2E tests
      uses: ./.github/actions/run-e2e-tests
      with:
        projects: credentials-with-vault
        timeout: '20'
    - name: Upload blob report
      if: ${{ !cancelled() }}
      continue-on-error: true
      uses: ./.github/actions/github-upload-artifact
      with:
        name: blob-report-vault-${{ matrix.provider }}
        path: platform/e2e-tests/blob-report/
        retention-days: 1
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: single
          provider: Blacksmith
          runner: blacksmith-8vcpu-ubuntu-2404
        - name: single
          provider: Ubicloud
          runner: ubicloud-standard-8-ubuntu-2404
        - name: single
          provider: GitHub
          runner: ubuntu-24.04
  platform-e2e-hibernation-tests:
    name: platform-e2e-hibernation-tests (${{ matrix.name || 'single' }}, ${{ matrix.provider }})
    needs:
    - images
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.repository.private
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: capacity
          spec: tests/mcp-hibernation-capacity.spec.ts
          provider: Blacksmith
          runner: blacksmith-16vcpu-ubuntu-2404
        - name: capacity
          spec: tests/mcp-hibernation-capacity.spec.ts
          provider: Ubicloud
          runner: ubicloud-standard-16-ubuntu-2404
        - name: capacity
          spec: tests/mcp-hibernation-capacity.spec.ts
          provider: GitHub
          runner: ubuntu-24.04
        - name: recovery
          spec: tests/mcp-hibernation-recovery.spec.ts
          provider: Blacksmith
          runner: blacksmith-16vcpu-ubuntu-2404
        - name: recovery
          spec: tests/mcp-hibernation-recovery.spec.ts
          provider: Ubicloud
          runner: ubicloud-standard-16-ubuntu-2404
        - name: recovery
          spec: tests/mcp-hibernation-recovery.spec.ts
          provider: GitHub
          runner: ubuntu-24.04
        - name: topology
          spec: tests/mcp-hibernation-topology.spec.ts
          provider: Blacksmith
          runner: blacksmith-16vcpu-ubuntu-2404
        - name: topology
          spec: tests/mcp-hibernation-topology.spec.ts
          provider: Ubicloud
          runner: ubicloud-standard-16-ubuntu-2404
        - name: topology
          spec: tests/mcp-hibernation-topology.spec.ts
          provider: GitHub
          runner: ubuntu-24.04
        - name: wake
          spec: tests/mcp-hibernation.spec.ts
          provider: Blacksmith
          runner: blacksmith-16vcpu-ubuntu-2404
        - name: wake
          spec: tests/mcp-hibernation.spec.ts
          provider: Ubicloud
          runner: ubicloud-standard-16-ubuntu-2404
        - name: wake
          spec: tests/mcp-hibernation.spec.ts
          provider: GitHub
          runner: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
    - name: Reclaim disk space (background)
      run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup &
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: 52e58e213bd2e3e49e77f5afe5288b82b7d9008e
    - name: Record runner identity
      run: 'node -e ''const os=require("os"); console.log(JSON.stringify({cpuCount:os.cpus().length,cpuModel:os.cpus()[0].model,memoryBytes:os.totalmem()}))''

        git rev-parse HEAD

        docker version --format ''{{.Server.Version}}''

        '
    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        working-directory: ./platform
    - name: Load platform image (untrusted PRs, from artifact)
