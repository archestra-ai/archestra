{{- $hasExternalDbUrl := and .Values.postgresql.external_database_url (ne (toString .Values.postgresql.external_database_url) "from_vault") -}}
{{- $awsSecretAccessKey := index .Values.archestra.env "AWS_SECRET_ACCESS_KEY" | default "" -}}
{{- $awsSessionToken := index .Values.archestra.env "AWS_SESSION_TOKEN" | default "" -}}
{{- $hasAwsSecretCreds := or (ne (toString $awsSecretAccessKey) "") (ne (toString $awsSessionToken) "") -}}
{{- if and .Values.archestra.migrationJob.enabled (ne (include "archestra-platform.maintenanceModeEnabled" .) "true") (or $hasExternalDbUrl $hasAwsSecretCreds) }}
{{/*
Hook-only database URL and AWS credential Secret for the migration Job.

Pre-upgrade hooks run before normal chart resources are applied, so the Job
cannot rely on an updated chart-managed auth Secret during the same upgrade.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "archestra-platform.migrationJobAuthSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archestra-platform.migrationJobLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
type: Opaque
data:
  {{- if $hasExternalDbUrl }}
  database-url: {{ .Values.postgresql.external_database_url | b64enc }}
  {{- end }}
  {{- if ne (toString $awsSecretAccessKey) "" }}
  aws-secret-access-key: {{ $awsSecretAccessKey | toString | b64enc }}
  {{- end }}
  {{- if ne (toString $awsSessionToken) "" }}
  aws-session-token: {{ $awsSessionToken | toString | b64enc }}
  {{- end }}
{{- end }}
