name: Update Client Versions

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-client-versions
  cancel-in-progress: false

jobs:
  update:
    name: Propose latest stable client versions
    if: github.repository == 'archestra-ai/archestra'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      summary: ${{ steps.update.outputs.summary }}
      pull_request_url: ${{ steps.pr.outputs.url }}
    defaults:
      run:
        working-directory: ./platform
    env:
      BRANCH: automation/client-versions
      CODEX_FILE: platform/backend/src/routes/chat/model-fetchers/openai.ts
      GROK_FILE: platform/backend/src/services/xai-subscription-token.ts
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-env

      # Each client resolves on its own, so one unreachable source does not
      # hold back the other. The last step fails the job for any miss.
      - name: Resolve latest stable Codex release
        id: codex
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          page=1
          while :; do
            tag="$(gh api "repos/openai/codex/releases?per_page=30&page=$page" --jq '
              if length == 0 then "END"
              else ([.[] | select(.draft == false and .prerelease == false and
                (.tag_name | test("^rust-v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | .tag_name] | first // "")
              end')"
            if [[ "$tag" == "END" ]]; then
              echo "::error::No stable Codex CLI release found"
              exit 1
            fi
            [[ -n "$tag" ]] && break
            ((page += 1))
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The same channel pointer and fallback that https://x.ai/cli/install.sh reads.
      - name: Resolve latest stable Grok CLI release
        id: grok
        continue-on-error: true
        run: |
          set -euo pipefail
          version=""
          for url in \
            "https://x.ai/cli/stable" \
            "https://storage.googleapis.com/grok-build-public-artifacts/cli/stable"; do
            if body="$(curl -fsSL --max-time 15 "$url")"; then
              version="$(printf '%s' "$body" | tr -d '\r' | head -n1 | tr -d '[:space:]')"
              break
            fi
          done
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No valid stable Grok CLI version found"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The App token makes pushes and the new PR trigger ordinary CI.
      - name: Generate releaser token
        id: token
        uses: ./.github/actions/github-app-token
        with:
          app-id: ${{ secrets.ARCHESTRA_RELEASER_GITHUB_APP_ID }}
          private-key: ${{ secrets.ARCHESTRA_RELEASER_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Prepare automation branch
        id: branch
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com --force
          git config user.name "Archestra releaser automation"
          git config user.email "releaser-bot@users.noreply.github.com"
          git fetch origin main

          target="$RUNNER_TEMP/client-versions-branch"
          existing="$(git ls-remote --heads origin "refs/heads/$BRANCH")"
          if [[ -n "$existing" ]]; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git worktree add -b "$BRANCH" "$target" "origin/$BRANCH"
            git -C "$target" -c core.hooksPath=/dev/null merge --no-edit origin/main
          else
            git worktree add -b "$BRANCH" "$target" origin/main
          fi
          echo "path=$target" >> "$GITHUB_OUTPUT"

      # These scripts come from the trusted main checkout. They only read and
      # change the source files in the separate automation worktree.
      - name: Update client versions
        id: update
        env:
          CODEX_TAG: ${{ steps.codex.outputs.tag }}
          GROK_VERSION: ${{ steps.grok.outputs.version }}
          TARGET: ${{ steps.branch.outputs.path }}
        run: |
          set -euo pipefail
          if [[ -n "$CODEX_TAG" ]]; then
            pnpm --dir backend update:codex-models-client-version "$CODEX_TAG" "$TARGET/$CODEX_FILE"
          fi
          if [[ -n "$GROK_VERSION" ]]; then
            pnpm --dir backend update:grok-client-version "$GROK_VERSION" "$TARGET/$GROK_FILE"
          fi

          # git diff --quiet exits 1 for a change and above 1 for an error.
          file_changed() {
            if git -C "$TARGET" diff --quiet -- "$1"; then
              return 1
            else
              local status=$?
              if [[ "$status" -ne 1 ]]; then
                exit "$status"
              fi
              return 0
            fi
          }
          summary=()
          if file_changed "$CODEX_FILE"; then
            summary+=("Codex ${CODEX_TAG#rust-v}")
          fi
          if file_changed "$GROK_FILE"; then
            summary+=("Grok CLI $GROK_VERSION")
          fi
          if [[ "${#summary[@]}" -eq 0 ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          joined="$(printf '%s, ' "${summary[@]}")"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "summary=${joined%, }" >> "$GITHUB_OUTPUT"

      - name: Commit and push update
        id: push
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TARGET: ${{ steps.branch.outputs.path }}
          SUMMARY: ${{ steps.update.outputs.summary }}
        run: |
          set -euo pipefail
          git -C "$TARGET" add -- "$CODEX_FILE" "$GROK_FILE"
          git -C "$TARGET" -c core.hooksPath=/dev/null commit -m "chore: update client versions ($SUMMARY)"
          git -C "$TARGET" push origin "HEAD:refs/heads/$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Also recovers a branch pushed by an earlier run whose PR creation failed.
      - name: Open or update pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ steps.branch.outputs.path }}
        run: |
          set -euo pipefail
          if git -C "$TARGET" diff --quiet origin/main HEAD -- "$CODEX_FILE" "$GROK_FILE"; then
            echo "Client versions already match main."
            exit 0
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi
          fi

          pr_title="chore: update client versions"
          pr_body="Track stable Codex CLI and Grok CLI releases. Codex filters the ChatGPT subscription model catalog by client version, and xAI's SuperGrok session proxy rejects Grok CLI versions below its minimum."
          owner="${GH_REPO%%/*}"
          existing_pr="$(gh api "repos/$GH_REPO/pulls?state=open&head=$owner:$BRANCH&base=main&per_page=1" --jq '.[0].number // empty')"
          if [[ -z "$existing_pr" ]]; then
            pr="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$pr_title" \
              --body "$pr_body")"
          else
            pr="$existing_pr"
            gh pr edit "$pr" --title "$pr_title" --body "$pr_body"
          fi

          auto_merge_enabled="$(gh pr view "$pr" --repo "$GH_REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [[ "$auto_merge_enabled" == "false" ]]; then
            gh pr merge "$pr" --repo "$GH_REPO" --auto
          fi
          gh pr view "$pr" --repo "$GH_REPO" --json url --jq '"url=" + .url' >> "$GITHUB_OUTPUT"

      - name: Fail for an unresolved client
        if: steps.codex.outcome == 'failure' || steps.grok.outcome == 'failure'
        env:
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
          GROK_OUTCOME: ${{ steps.grok.outcome }}
        run: |
          echo "::error::Could not resolve every client version (Codex: $CODEX_OUTCOME, Grok CLI: $GROK_OUTCOME)"
          exit 1

  # Hourly runs stay quiet unless a run fails or pushes a new version.
  notify:
    name: Report update result
    needs: update
    if: ${{ always() && github.repository == 'archestra-ai/archestra' && (needs.update.result == 'failure' || needs.update.outputs.pushed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Post result to alerting
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTING_WEBHOOK_URL }}
          UPDATE_RESULT: ${{ needs.update.result }}
          SUMMARY: ${{ needs.update.outputs.summary }}
          PULL_REQUEST_URL: ${{ needs.update.outputs.pull_request_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "::warning::SLACK_ALERTING_WEBHOOK_URL not set; skipping Slack notification."
            exit 0
          fi

          if [[ "$UPDATE_RESULT" == "failure" ]]; then
            message=":rotating_light: Client version update failed. <$RUN_URL|View workflow run>"
          elif [[ -n "$PULL_REQUEST_URL" ]]; then
            message="Client version update proposed ($SUMMARY): <$PULL_REQUEST_URL|View pull request>"
          else
            message="Client version update pushed ($SUMMARY), but no pull request was found. <$RUN_URL|View workflow run>"
          fi
          jq -n --arg text "$message" '{text: $text}' |
            curl --fail-with-body -sS --max-time 15 -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
