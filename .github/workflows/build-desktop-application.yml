name: On Pull Requests

on:
  workflow_call:
    inputs:
      dry_run:
        description: Whether to run publish in dry run mode or not (i.e. don't actually upload the build to GitHub)
        type: boolean
        required: false
        default: false
    secrets:
      ARCHESTRA_RELEASER_GITHUB_APP_ID:
        required: true
      ARCHESTRA_RELEASER_GITHUB_APP_PRIVATE_KEY:
        required: true
      APPLE_SIGNING_CERTIFICATE_BASE64:
        required: true
      APPLE_SIGNING_CERTIFICATE_PASSWORD:
        required: true
      KEYCHAIN_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_PASSWORD:
        required: true
      APPLE_TEAM_ID:
        required: true
      WINDOWS_CODE_SIGNING_GCP_KMS_KEY_RESOURCE_ID:
        required: false
      WINDOWS_CODE_SIGNING_WORKFLOW_IDENTITY_FEDERATION_PROVIDER:
        required: false
      WINDOWS_CODE_SIGNING_SERVICE_ACCOUNT:
        required: false
      WINDOWS_SIGNING_CERT_BASE64:
        required: false
      WINDOWS_CODE_SIGNING_GCP_KMS_PROJECT_ID:
        required: false

jobs:
  build-desktop-application:
    name: Build desktop application (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job#standard-github-hosted-runners-for-public-repositories
        include:
          - platform: macos-latest # M1 (arm64)
            os: macos
            arch: arm64
          - platform: macos-13 # Intel (x64)
            os: macos
            arch: x64
          - platform: windows-11-arm
            os: windows
            arch: arm64
          - platform: windows-latest
            os: windows
            arch: x64
          - platform: ubuntu-latest
            os: linux
            arch: x64
          - platform: ubuntu-24.04-arm
            os: linux
            arch: arm64
    permissions:
      # publisher requires write permissions to the repo's contents to create new releases
      # https://www.electronforge.io/config/publishers/github#authentication
      contents: write
      # Required for Workload Identity Federation (OIDC) authentication
      id-token: write
    defaults:
      run:
        working-directory: desktop_app
    steps:
      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Generate a token
        id: generate-token
        # Only generate app token if secrets are available (not for PRs from forks)
        if: ${{ github.event.pull_request.head.repo.fork == false }}
        uses: ./.github/actions/generate-release-token
        with:
          app-id: ${{ secrets.ARCHESTRA_RELEASER_GITHUB_APP_ID }}
          private-key: ${{ secrets.ARCHESTRA_RELEASER_GITHUB_APP_PRIVATE_KEY }}

      - name: Setup environment
        uses: ./.github/actions/setup-env

      # See https://brunoscheufler.com/blog/2023-11-12-setting-up-hosted-macos-github-actions-workflows-for-electron-builds
      # was super helpful for getting macOS signing working on GitHub Actions
      #
      # See also:
      # https://docs.github.com/en/actions/how-tos/deploy/deploy-to-third-party-platforms/sign-xcode-applications
      # https://help.apple.com/xcode/mac/current/#/dev154b28f09
      - name: Install Apple codesigning certificate
        if: matrix.os == 'macos' && github.event.pull_request.head.repo.fork == false
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Authenticate to Google Cloud via Workload Identity Federation
        if: matrix.os == 'windows' && github.event.pull_request.head.repo.fork == false && inputs.dry_run == false
        id: auth
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          workload_identity_provider: ${{ secrets.WINDOWS_CODE_SIGNING_WORKFLOW_IDENTITY_FEDERATION_PROVIDER }}
          service_account: ${{ secrets.WINDOWS_CODE_SIGNING_SERVICE_ACCOUNT }}
          # Explicitly create a credentials file for the Google Cloud KMS CNG Provider.
          # The CNG Provider needs Application Default Credentials to authenticate with KMS.
          # This creates a JSON credentials file and sets GOOGLE_APPLICATION_CREDENTIALS.
          # See: https://github.com/google-github-actions/auth?tab=readme-ov-file#inputs-miscellaneous
          create_credentials_file: true

      # See the following resources for more information:
      #
      # https://cloud.google.com/kms/docs/reference/cng-signtool
      # https://github.com/electron/windows-sign?tab=readme-ov-file#use-with-cloud-hsm-providers
      - name: Install Google Cloud KMS CNG Provider
        if: matrix.os == 'windows' && github.event.pull_request.head.repo.fork == false && inputs.dry_run == false
        run: |
          Write-Host "Downloading Google Cloud KMS CNG Provider v1.2..."

          $downloadUrl = "https://github.com/GoogleCloudPlatform/kms-integrations/releases/download/cng-v1.2/kmscng-1.2-windows-amd64.zip"
          $zipPath = "$env:RUNNER_TEMP\kmscng.zip"
          $extractPath = "$env:RUNNER_TEMP\kmscng"

          Write-Host "Downloading from: $downloadUrl"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $zipPath

          Write-Host "Extracting CNG Provider..."
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

          # Find the MSI file in the extracted contents
          $msiFile = Get-ChildItem -Path $extractPath -Filter "*.msi" -Recurse | Select-Object -First 1

          if ($msiFile) {
            Write-Host "Found MSI: $($msiFile.FullName)"
            Write-Host "Installing Google Cloud KMS CNG Provider..."
            
            # Install the MSI
            $process = Start-Process msiexec.exe -ArgumentList "/i", $msiFile.FullName, "/quiet", "/norestart", "/l*v", "$env:RUNNER_TEMP\cng_install.log" -PassThru -Wait
            
            if ($process.ExitCode -eq 0) {
              Write-Host "Google Cloud KMS CNG Provider installed successfully"
              
              # Verify installation in registry
              $cngProvider = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Cryptography\Defaults\Provider\Google Cloud KMS Provider" -ErrorAction SilentlyContinue
              if ($cngProvider) {
                Write-Host "✓ Verified: CNG Provider registered at: $($cngProvider.'Image Path')"
              } else {
                Write-Host "Warning: CNG Provider installed but not found in registry. Checking alternative locations..."
                
                # Check 32-bit registry on 64-bit system
                $cngProvider32 = Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Defaults\Provider\Google Cloud KMS Provider" -ErrorAction SilentlyContinue
                if ($cngProvider32) {
                  Write-Host "Found in 32-bit registry: $($cngProvider32.'Image Path')"
                }
                
                # Display installation log for debugging
                if (Test-Path "$env:RUNNER_TEMP\cng_install.log") {
                  Write-Host "Installation log tail:"
                  Get-Content "$env:RUNNER_TEMP\cng_install.log" -Tail 20
                }
              }
            } else {
              Write-Error "MSI installation failed with exit code: $($process.ExitCode)"
              
              # Display installation log for debugging
              if (Test-Path "$env:RUNNER_TEMP\cng_install.log") {
                Write-Host "Installation log:"
                Get-Content "$env:RUNNER_TEMP\cng_install.log"
              }
              
              exit 1
            }
          } else {
            Write-Error "MSI file not found in the extracted archive"
            exit 1
          }

      - name: Set up gcloud CLI
        if: matrix.os == 'windows' && github.event.pull_request.head.repo.fork == false && inputs.dry_run == false
        uses: google-github-actions/setup-gcloud@6a7c903a70c8625ed6700fa299f5ddb4ca6022e9 # v2.1.5
        with:
          project_id: ${{ secrets.WINDOWS_CODE_SIGNING_GCP_KMS_PROJECT_ID }}

      # TODO: remove this when done testing...
      - name: Configure CNG Provider authentication
        if: matrix.os == 'windows' && github.event.pull_request.head.repo.fork == false && inputs.dry_run == false
        run: |
          Write-Host "Setting up Google Cloud authentication for CNG Provider..."

          # Display credential file location
          Write-Host "GOOGLE_APPLICATION_CREDENTIALS: $env:GOOGLE_APPLICATION_CREDENTIALS"

          # The CNG Provider may need credentials in specific Windows locations
          # Copy credentials to standard Windows locations where Google Cloud tools expect them
          $credFile = $env:GOOGLE_APPLICATION_CREDENTIALS

          # Create necessary directories
          $appDataPath = "$env:APPDATA\gcloud"
          if (-not (Test-Path $appDataPath)) {
            New-Item -ItemType Directory -Path $appDataPath -Force | Out-Null
          }

          # Copy credentials to AppData location
          Copy-Item -Path $credFile -Destination "$appDataPath\application_default_credentials.json" -Force
          Write-Host "Copied credentials to $appDataPath\application_default_credentials.json"

          # Also set up for the CNG Provider which may check ProgramData
          $programDataPath = "C:\ProgramData\Google\Auth"
          if (-not (Test-Path $programDataPath)) {
            New-Item -ItemType Directory -Path $programDataPath -Force | Out-Null
          }
          Copy-Item -Path $credFile -Destination "$programDataPath\application_default_credentials.json" -Force
          Write-Host "Copied credentials to $programDataPath\application_default_credentials.json"

          # Verify the configuration
          gcloud config list

          # Test KMS access to verify authentication is working
          Write-Host "Testing KMS access..."
          gcloud kms keys list --location=europe-west1 --keyring=windows-code-signing

          # List the key versions to check algorithm
          Write-Host "Checking key algorithm..."
          gcloud kms keys versions list --key=archestra-windows-signing-ec --keyring=windows-code-signing --location=europe-west1

      - name: Install Windows signing certificate and verify SignTool
        if: matrix.os == 'windows' && github.event.pull_request.head.repo.fork == false && inputs.dry_run == false
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
        run: |
          Write-Host "Installing Windows signing certificate..."

          # CRITICAL: Ensure we're using x64 SignTool (not x86)
          # The CNG Provider requires x64 SignTool to work properly
          Write-Host "Checking SignTool architecture..."

          # Find all SignTool versions
          $signTools = @()
          $kitPaths = @(
            "C:\Program Files (x86)\Windows Kits\10\bin",
            "C:\Program Files\Windows Kits\10\bin"
          )

          foreach ($kitPath in $kitPaths) {
            if (Test-Path $kitPath) {
              $versions = Get-ChildItem -Path $kitPath -Directory | Sort-Object Name -Descending
              foreach ($version in $versions) {
                $x64SignTool = Join-Path $version.FullName "x64\signtool.exe"
                if (Test-Path $x64SignTool) {
                  $signTools += $x64SignTool
                  Write-Host "Found x64 SignTool: $x64SignTool"
                }
              }
            }
          }

          if ($signTools.Count -eq 0) {
            Write-Error "No x64 SignTool found! Windows signing will fail."
            exit 1
          }

          # Use the first (newest) x64 SignTool found
          $signToolPath = $signTools[0]
          Write-Host "Using SignTool: $signToolPath"

          # Set environment variable for Electron Forge to use
          echo "SIGNTOOL_PATH=$signToolPath" >> $env:GITHUB_ENV
          Write-Host "Set SIGNTOOL_PATH environment variable"

          # Decode the certificate from base64
          $certPath = "$env:RUNNER_TEMP\archestra-signing.crt"

          if ($env:WINDOWS_SIGNING_CERT_BASE64) {
            Write-Host "Using certificate from GitHub secret"
            [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
          } else {
            Write-Host "Warning: No certificate found in WINDOWS_SIGNING_CERT_BASE64 secret"
            Write-Host "Attempting to continue without certificate (may fail during signing)"
          }

          # Install certificate to Windows certificate store if it exists
          if (Test-Path $certPath) {
            Write-Host "Installing certificate to Windows certificate store..."

            # Import to CurrentUser\My (Personal) store
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($certPath)
            $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("My", "CurrentUser")
            $store.Open("ReadWrite")
            $store.Add($cert)
            $store.Close()

            Write-Host "Certificate installed successfully. Thumbprint: $($cert.Thumbprint)"
            Write-Host "Subject: $($cert.Subject)"

            # Also try using certutil for additional installation
            certutil -user -addstore "My" $certPath

            # Set environment variable for forge config to use
            echo "WINDOWS_SIGNING_CERT_PATH=$certPath" >> $env:GITHUB_ENV
          } else {
            Write-Host "No certificate file found, continuing without certificate installation"
          }

      - name: Verify Windows signing configuration
        if: matrix.os == 'windows' && github.event.pull_request.head.repo.fork == false && inputs.dry_run == false
        env:
          WINDOWS_CODE_SIGNING_GCP_KMS_KEY_RESOURCE_ID: ${{ secrets.WINDOWS_CODE_SIGNING_GCP_KMS_KEY_RESOURCE_ID }}
        run: |
          Write-Host "=== Windows Signing Configuration Verification ==="

          # Check SignTool path
          if ($env:SIGNTOOL_PATH) {
            Write-Host "✓ SignTool path is set: $env:SIGNTOOL_PATH"
            & $env:SIGNTOOL_PATH /? 2>&1 | Select-Object -First 2
          } else {
            Write-Host "✗ SIGNTOOL_PATH not set"
          }

          # Check certificate
          if ($env:WINDOWS_SIGNING_CERT_PATH -and (Test-Path $env:WINDOWS_SIGNING_CERT_PATH)) {
            Write-Host "✓ Certificate file exists: $env:WINDOWS_SIGNING_CERT_PATH"
            certutil -dump $env:WINDOWS_SIGNING_CERT_PATH | Select-String "Subject:", "Signature Algorithm:", "Public Key Algorithm:"
          } else {
            Write-Host "✗ Certificate file not found"
          }

          # Check KMS key resource ID
          if ($env:WINDOWS_CODE_SIGNING_GCP_KMS_KEY_RESOURCE_ID) {
            Write-Host "✓ KMS key resource ID is set: $env:WINDOWS_CODE_SIGNING_GCP_KMS_KEY_RESOURCE_ID"
          } else {
            Write-Host "✗ KMS key resource ID not set"
          }

          # Check Google Cloud authentication files
          Write-Host "`nAuthentication file locations:"
          $authLocations = @(
            $env:GOOGLE_APPLICATION_CREDENTIALS,
            "$env:APPDATA\gcloud\application_default_credentials.json",
            "C:\ProgramData\Google\Auth\application_default_credentials.json"
          )

          foreach ($location in $authLocations) {
            if ($location -and (Test-Path $location)) {
              Write-Host "✓ Found: $location"
            } else {
              Write-Host "✗ Missing: $location"
            }
          }

          # Test CNG Provider is installed
          Write-Host "`nChecking CNG Provider installation..."
          $cngProvider = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Cryptography\Defaults\Provider\Google Cloud KMS Provider" -ErrorAction SilentlyContinue
          $cngProvider32 = Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Defaults\Provider\Google Cloud KMS Provider" -ErrorAction SilentlyContinue
          
          if ($cngProvider) {
            Write-Host "✓ Google Cloud KMS CNG Provider is installed (64-bit)"
            Write-Host "  Image Path: $($cngProvider.'Image Path')"
          } elseif ($cngProvider32) {
            Write-Host "✓ Google Cloud KMS CNG Provider is installed (32-bit)"
            Write-Host "  Image Path: $($cngProvider32.'Image Path')"
          } else {
            Write-Host "✗ Google Cloud KMS CNG Provider not found in registry"
            Write-Host "  Checking if DLL exists directly..."
            
            # Check common installation paths
            $dllPaths = @(
              "C:\Windows\System32\kmscng.dll",
              "C:\Windows\SysWOW64\kmscng.dll",
              "C:\Program Files\Google\Cloud KMS CNG Provider\kmscng.dll",
              "C:\Program Files (x86)\Google\Cloud KMS CNG Provider\kmscng.dll"
            )
            
            foreach ($dllPath in $dllPaths) {
              if (Test-Path $dllPath) {
                Write-Host "  Found DLL at: $dllPath"
              }
            }
          }

          Write-Host "=== End Configuration Verification ==="

      - name: Build desktop application
        env:
          # Use app token if available, fallback to GITHUB_TOKEN for fork PRs
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          # Pass Google Cloud credentials to the build process for Windows signing
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
          # Pass the x64 SignTool path if found
          SIGNTOOL_PATH: ${{ env.SIGNTOOL_PATH }}
          # These will be empty for fork PRs, which is fine - forge.config.ts handles it
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CODE_SIGNING_GCP_KMS_KEY_RESOURCE_ID: ${{ secrets.WINDOWS_CODE_SIGNING_GCP_KMS_KEY_RESOURCE_ID }} # Windows signing credentials
          # Enable verbose debug output for Windows signing
          DEBUG: ${{ matrix.os == 'windows' && inputs.dry_run == false && 'electron-windows-sign' || '' }}
        run: pnpm run publish${{ inputs.dry_run && ' --dry-run' || '' }}

      # https://brunoscheufler.com/blog/2023-11-12-setting-up-hosted-macos-github-actions-workflows-for-electron-builds
      - name: Clean up keychain
        if: ${{ always() && matrix.os == 'macos' && github.event.pull_request.head.repo.fork == false }}
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
