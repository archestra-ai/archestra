suite: web and worker scheduling
templates:
  - archestra-platform.yaml
  - archestra-worker.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: web omits scheduling constraints by default
    template: archestra-platform.yaml
    documentIndex: 1
    asserts:
      - isNull:
          path: spec.template.spec.nodeSelector
      - isNull:
          path: spec.template.spec.tolerations
      - isNull:
          path: spec.template.spec.affinity
  - it: web inherits every shared scheduling field
    template: archestra-platform.yaml
    documentIndex: 1
    set: &sharedScheduling
      archestra.nodeSelector: &sharedSelector
        kubernetes.io/os: linux
        nodepool: shared
      archestra.tolerations: &sharedTolerations
        - key: shared
          operator: Exists
          effect: NoSchedule
      archestra.affinity: &sharedAffinity
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/part-of: archestra
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value: *sharedSelector
      - equal:
          path: spec.template.spec.tolerations
          value: *sharedTolerations
      - equal:
          path: spec.template.spec.affinity
          value: *sharedAffinity
  - it: web inherits shared scheduling for explicit null fields
    template: archestra-platform.yaml
    documentIndex: 1
    set:
      archestra.nodeSelector: *sharedSelector
      archestra.tolerations: *sharedTolerations
      archestra.affinity: *sharedAffinity
      archestra.web.nodeSelector: null
      archestra.web.tolerations: null
      archestra.web.affinity: null
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value: *sharedSelector
      - equal:
          path: spec.template.spec.tolerations
          value: *sharedTolerations
      - equal:
          path: spec.template.spec.affinity
          value: *sharedAffinity
  - it: web clears shared scheduling with explicit empty collections
    template: archestra-platform.yaml
    documentIndex: 1
    set:
      archestra.nodeSelector: *sharedSelector
      archestra.tolerations: *sharedTolerations
      archestra.affinity: *sharedAffinity
      archestra.web.nodeSelector: {}
      archestra.web.tolerations: []
      archestra.web.affinity: {}
    asserts:
      - isNull:
          path: spec.template.spec.nodeSelector
      - isNull:
          path: spec.template.spec.tolerations
      - isNull:
          path: spec.template.spec.affinity
  - it: web uses its own selector, taint tolerations and required affinity without merging shared or
      other tier fields
    template: archestra-platform.yaml
    documentIndex: 1
    set:
      archestra.nodeSelector: *sharedSelector
      archestra.tolerations: *sharedTolerations
      archestra.affinity: *sharedAffinity
      archestra.web.nodeSelector: &webSelector
        nodepool: general-purpose
      archestra.web.tolerations: &webTolerations
        - key: dedicated
          operator: Equal
          value: web
          effect: NoSchedule
      archestra.web.affinity: &webAffinity
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nodepool
                    operator: In
                    values:
                      - general-purpose
      archestra.worker.nodeSelector: &workerSelector
        nodepool: memory-optimized
      archestra.worker.tolerations: &workerTolerations
        - key: dedicated
          operator: Equal
          value: workers
          effect: NoSchedule
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
      archestra.worker.affinity: &workerAffinity
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nodepool
                    operator: In
                    values:
                      - memory-optimized
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value: *webSelector
      - equal:
          path: spec.template.spec.tolerations
          value: *webTolerations
      - equal:
          path: spec.template.spec.affinity
          value: *webAffinity
  - it: web overrides nodeSelector while inheriting other shared fields
    template: archestra-platform.yaml
    documentIndex: 1
    set:
      archestra.nodeSelector: *sharedSelector
      archestra.tolerations: *sharedTolerations
