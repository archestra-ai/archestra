name: Cache Rust build
description: Restore and optionally save Cargo registry and build artifacts

inputs:
  workspaces:
    description: Cargo workspace whose target directory is cached
    required: true
  shared-key:
    description: Cache key shared between jobs that build the same workspace
    required: false
    default: ""
  save-if:
    description: Whether this job may save an updated cache
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: ${{ inputs.workspaces }}
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.save-if }}
