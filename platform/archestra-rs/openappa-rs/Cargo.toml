[package]
name = "openappa_rs"
version = "0.1.0"
edition = "2024"
build = "build.rs"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to `Runtime::open_fork` (OpenAPPA branch `piercypixel/runtime-open-fork`),
# on top of the first commit after OpenAPPA v0.23.1, which adds the PostgreSQL
# connection pool. The embedded reporting helper currently requires upstream's
# daemon feature.
appa-runtime = { package = "appa", git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "ea4af105ded453d361c28eaf1dbf4686e05cfffd" }
appa-runtime-api = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "ea4af105ded453d361c28eaf1dbf4686e05cfffd" }
appa-eventlog = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "ea4af105ded453d361c28eaf1dbf4686e05cfffd", features = ["postgres"] }
napi = { version = "3", features = ["tokio_rt"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
toml = "1.1"
tokio = { version = "1", features = ["sync", "time"] }
futures-util = "0.3"

[dev-dependencies]
# A paused clock: the connection-wait test does not spend its thirty seconds.
tokio = { version = "1", features = ["rt", "test-util"] }

[target.'cfg(target_env = "musl")'.dependencies]
# Cross-builds need OpenSSL compiled for musl. The Docker builder uses its
# installed OpenSSL through OPENSSL_NO_VENDOR instead.
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
napi-build = "2"
