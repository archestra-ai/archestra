{{- if .Values.archestra.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "archestra-platform.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archestra-platform.labels" . | nindent 4 }}
  {{- with .Values.archestra.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.archestra.ingress.spec }}
  {{- toYaml .Values.archestra.ingress.spec | nindent 2 }}
  {{- else }}
  {{- if .Values.archestra.ingress.tls }}
  tls:
    {{- range .Values.archestra.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.archestra.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- /*
            A host that serves the UI gets the backend's own API prefixes routed
            straight to the backend port, unless it already routes them itself.
            /v1 (the LLM proxy) and /v2 (A2A) have no Next.js route — the
            frontend only forwards them — and /v1 carries multi-megabyte request
            bodies held open for the length of a completion. Sending that through
            the frontend port puts it on the single-threaded Node process that
            also answers the dashboard's API calls, so the UI slows down while an
            agent is working. Everything else, /api/auth included, stays on the
            frontend: that one IS a real app route.
          */}}
          {{- $frontendPaths := list }}
          {{- $ownsBackendApis := false }}
          {{- range .paths }}
            {{- if eq (int .port) 3000 }}
              {{- $frontendPaths = append $frontendPaths .path }}
            {{- end }}
            {{- if or (hasPrefix "/v1" .path) (hasPrefix "/v2" .path) }}
              {{- $ownsBackendApis = true }}
            {{- end }}
          {{- end }}
          {{- if and $.Values.archestra.ingress.routeBackendApisDirectly (gt (len $frontendPaths) 0) (not $ownsBackendApis) }}
          {{- range $prefix := (list "/v1" "/v2") }}
          - path: {{ $prefix }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "archestra-platform.fullname" $ }}
                port:
                  number: 9000
          {{- end }}
          {{- end }}
          {{- range .paths }}
          - path: {{ .path }}
            {{- if .pathType }}
            pathType: {{ .pathType }}
            {{- else }}
            pathType: Prefix
            {{- end }}
            backend:
              service:
                name: {{ include "archestra-platform.fullname" $ }}
                port:
                  number: {{ .port }}
          {{- end }}
    {{- end }}
  {{- end }}
{{- end }}