suite: pod security hardening
templates:
  - archestra-platform.yaml
  - archestra-worker.yaml
  - migration-job.yaml
tests:
  - it: runs web pods under the runtime's default seccomp profile without privilege escalation
    template: archestra-platform.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "wait-for-postgres")].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "setup-postgres-extensions")].securityContext.allowPrivilegeEscalation
          value: false

  - it: hardens worker pods and their init containers the same way
    template: archestra-worker.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "wait-for-migrations")].securityContext.allowPrivilegeEscalation
          value: false

  - it: hardens the migration pod the same way
    template: migration-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: applies an operator's stricter container context to the app and init containers
    template: archestra-platform.yaml
    documentIndex: 1
    set:
      archestra.initContainers.vaultSecrets.enabled: true
      archestra.containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: ["ALL"]
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "vault-secrets")].securityContext.capabilities.drop
          value: ["ALL"]
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "wait-for-postgres")].securityContext.capabilities.drop
          value: ["ALL"]

  - it: keeps the Cloud SQL Auth Proxy sidecar's own non-root context
    template: archestra-platform.yaml
    documentIndex: 1
    set:
      postgresql.enabled: false
      postgresql.external_database_url: postgresql://app@127.0.0.1:5432/archestra
      archestra.database.cloudSqlProxy.enabled: true
      archestra.database.cloudSqlProxy.instanceConnectionName: project:region:instance
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "cloud-sql-proxy")].securityContext.runAsNonRoot
          value: true

  - it: leaves pod and container contexts unset when an operator clears them
    template: archestra-platform.yaml
    documentIndex: 1
    set:
      archestra.runAsNonRoot: false
      archestra.podSecurityContext: null
      archestra.containerSecurityContext: null
    asserts:
      - notExists:
          path: spec.template.spec.securityContext
      - notExists:
          path: spec.template.spec.containers[0].securityContext

  - it: runs the web, worker, and migration pods as the image's non-root user by default
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
        documentSelector:
          path: kind
          value: Deployment
          matchMany: true
          skipEmptyTemplates: true
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
        documentSelector:
          path: kind
          value: Deployment
          matchMany: true
          skipEmptyTemplates: true

  - it: runs the migration pod as the non-root user too
    template: migration-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 10001
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: ["ALL"]

  - it: keeps an operator's own user and group over the runAsNonRoot defaults
    template: archestra-platform.yaml
    documentIndex: 1
    set:
      archestra.runAsNonRoot: true
      archestra.podSecurityContext:
        runAsUser: 20000
        fsGroup: 20000
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 20000
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 20000
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: runs the pods as root, without a fixed user, when runAsNonRoot is off
    set:
      archestra.runAsNonRoot: false
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            seccompProfile:
              type: RuntimeDefault
        documentSelector:
          path: kind
          value: Deployment
          matchMany: true
          skipEmptyTemplates: true
      - notExists:
          path: spec.template.spec.containers[0].securityContext.capabilities
        documentSelector:
          path: kind
          value: Deployment
          matchMany: true
          skipEmptyTemplates: true
