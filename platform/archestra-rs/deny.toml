[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# zip 8.6.0 comes only from OpenAPPA's appa crate, which writes archives and
# reads one checked entry with ZipArchive::by_index. It never calls the
# extract() APIs these advisories cover. The fixed zip 9 releases are younger
# than the 7-day Cargo release-age rule; remove these entries once appa moves
# to zip 9.
ignore = [
  { id = "RUSTSEC-2026-0367", reason = "appa never extracts ZIP archives; remove once appa uses zip 9" },
  { id = "RUSTSEC-2026-0368", reason = "appa never extracts ZIP archives; remove once appa uses zip 9" },
  { id = "RUSTSEC-2026-0369", reason = "appa never extracts ZIP archives; remove once appa uses zip 9" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  # permissive data license covering webpki-roots' bundled mozilla CA set,
  # pulled in by the sandbox-rs OTLP exporter's rustls stack.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[licenses.private]
# Internal workspace crates inherit the repository license and are not published
# to crates.io. This does not bypass license checks for third-party crates.
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The embedded OpenAPPA source is pinned to a reviewed commit.
allow-git = ["https://github.com/archestra-ai/OpenAPPA.git"]
required-git-spec = "rev"
