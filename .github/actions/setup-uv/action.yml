name: Setup uv
description: Wrapper around astral-sh/setup-uv pinned to a vetted version.
inputs:
  version:
    description: Version of uv to install. Defaults to the version in pyproject.toml, or latest.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: ${{ inputs.version }}
