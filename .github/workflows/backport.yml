name: Open Backport PRs

on:
  push:
    branches: [main]
  # Only merged PRs from branches in this repository can request backports.
  pull_request:
    branches: [main]
    types: [labeled]
  # Recover after event/API failures. GitHub can delay scheduled runs.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pull_request:
        description: Merged main PR number to backport
        required: true
        type: string
      target_branch:
        description: Optional configured release branch; otherwise use the PR's backport labels
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Every automatic run scans all outstanding labels, so replacement of a
  # pending run by a newer event cannot drop that pending run's requests.
  group: backport-requests
  cancel-in-progress: false

jobs:
  backport:
    name: Open requested backport PRs
    if: github.repository == 'archestra-ai/archestra' && (github.event_name != 'pull_request' || (github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == github.event.repository.default_branch && startsWith(github.event.label.name, 'backport ')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only run automation from the trusted default branch. Cherry-picked code
      # is never executed and no dependencies or repository hooks are installed.
      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      # An App token makes push/PR events trigger ordinary CI. GITHUB_TOKEN
      # would suppress those events and leave the backport without its checks.
      - name: Generate a backport token
        id: token
        uses: ./.github/actions/github-app-token
        with:
          app-id: ${{ secrets.ARCHESTRA_RELEASER_GITHUB_APP_ID }}
          private-key: ${{ secrets.ARCHESTRA_RELEASER_GITHUB_APP_PRIVATE_KEY }}

      - name: Open backport pull requests
        working-directory: ./platform
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_PR: ${{ inputs.pull_request }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: python3 ../.github/scripts/backport.py
