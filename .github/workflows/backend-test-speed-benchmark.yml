name: Backend Test Speed Benchmark

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  one-job:
    name: Full backend suite on one runner
    if: github.event.label.name == 'benchmark-backend-test-speed'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ./platform
    env:
      TURBO_TOKEN: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBOREPO_REMOTE_CACHING_TEAM }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          working-directory: ./platform

      - name: Ensure Zsh for shell startup tests
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zsh
          fi

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: platform/archestra-rs
          shared-key: backend-unit-tests
          save-if: 'false'

      - name: Cache Node compile data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/node-compile-cache
          key: backend-node-compile-${{ runner.os }}-${{ runner.arch }}-node24-one-job-${{ hashFiles('platform/pnpm-lock.yaml', 'platform/backend/vitest.config.ts', 'platform/backend/src/**/*.ts') }}
          restore-keys: |
            backend-node-compile-${{ runner.os }}-${{ runner.arch }}-node24-

      - name: Build backend workspace dependencies
        run: pnpm exec turbo build --filter="@backend^..."

      - name: Run complete backend suite
        working-directory: ./platform/backend
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: pnpm exec vitest run --hookTimeout=120000

  checkout:
    name: Checkout ${{ matrix.mode }} sample ${{ matrix.sample }}
    if: github.event.label.name == 'benchmark-backend-test-speed'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [full, sparse, blob-filter]
        sample: [1, 2]
    steps:
      - name: Checkout full repository
        if: matrix.mode == 'full'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout platform and actions only
        if: matrix.mode == 'sparse'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github
            platform

      - name: Checkout with blob filter
        if: matrix.mode == 'blob-filter'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none

      - name: Check backend inputs
        run: |
          test -f platform/pnpm-lock.yaml
          test -f platform/agent_images/bin/archestra-tui-run
          test -f .github/actions/setup-env/action.yml
          du -sh platform

  native-build:
    name: Build native bindings once
    if: github.event.label.name == 'benchmark-backend-native-artifact'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./platform
    env:
      TURBO_TOKEN: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBOREPO_REMOTE_CACHING_TEAM }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          working-directory: ./platform

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: platform/archestra-rs
          shared-key: backend-unit-tests
          save-if: 'false'

      - name: Build backend workspace dependencies
        run: pnpm exec turbo build --filter="@backend^..."

      - name: Upload native bindings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-native-bindings
          if-no-files-found: error
          retention-days: 1
          path: |
            platform/archestra-rs/app-runtime-rs/*.node
            platform/archestra-rs/image-rs/*.node
            platform/archestra-rs/openappa-rs/*.node
            platform/archestra-rs/sandbox-rs/*.node

  native-consumer:
    name: Restore shared native bindings
    needs: native-build
    if: github.event.label.name == 'benchmark-backend-native-artifact'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./platform
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          working-directory: ./platform

      - name: Download native bindings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-native-bindings
          path: platform/archestra-rs

      - name: Smoke native bindings
        run: |
          pnpm --filter @archestra/app-runtime-rs smoke
          pnpm --filter @archestra/image-rs smoke
          pnpm --filter @archestra/openappa-rs smoke:load
          pnpm --filter @archestra/sandbox-rs smoke

  native-control:
    name: Rebuild native bindings on consumer
    if: github.event.label.name == 'benchmark-backend-native-artifact'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./platform
    env:
      TURBO_TOKEN: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBOREPO_REMOTE_CACHING_TEAM }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          working-directory: ./platform

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: platform/archestra-rs
          shared-key: backend-unit-tests
          save-if: 'false'

      - name: Build backend workspace dependencies
        run: pnpm exec turbo build --filter="@backend^..."

      - name: Smoke native bindings
        run: |
          pnpm --filter @archestra/app-runtime-rs smoke
          pnpm --filter @archestra/image-rs smoke
          pnpm --filter @archestra/openappa-rs smoke:load
          pnpm --filter @archestra/sandbox-rs smoke
