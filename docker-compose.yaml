version: '3.8'

services:
  archestra:
    # 🛑 CRITICAL FIX: We use the pre-downloaded image.
    # This prevents the "Out of Memory" crash so you can record the UI!
    image: archestra/platform:latest
    container_name: archestra_app
    ports:
      - "3000:3000"
      - "9000:9000"
    environment:
      # Connects the app to the K3s cluster automatically
      - KUBECONFIG=/k8s/kubeconfig.yaml
      - KUBERNETES_SERVICE_HOST=k3s
      - KUBERNETES_SERVICE_PORT=6443
    volumes:
      - k3s_kubeconfig:/k8s
    depends_on:
      - k3s

  k3s:
    image: rancher/k3s:v1.27.1-k3s1
    container_name: k3s
    command: server --disable-agent --tls-san k3s --write-kubeconfig-mode 644
    tmpfs:
      - /run
      - /var/run
    privileged: true
    environment:
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
      - K3S_KUBECONFIG_MODE=666
    volumes:
      - k3s_server:/var/lib/rancher/k3s
      - k3s_kubeconfig:/output
    ports:
      - 6443:6443

volumes:
  k3s_server:
  k3s_kubeconfig: