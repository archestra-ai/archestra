[package]
name = "openappa_rs"
version = "0.1.0"
edition = "2024"
build = "build.rs"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to OpenAPPA main after the merge of #402 and #401 (the consult
# recorder and url diagnostics; on top of #394's annotator-only jev battery)
# on top of v0.24.0. Re-pin to the first release that includes it. The embedded
# reporting helper currently requires upstream's daemon feature.
appa-runtime = { package = "appa", git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "7468837da348135cc018fc24cc82e3d18318e1e6" }
appa-runtime-api = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "7468837da348135cc018fc24cc82e3d18318e1e6" }
appa-eventlog = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "7468837da348135cc018fc24cc82e3d18318e1e6", features = ["postgres"] }
appa-package = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "7468837da348135cc018fc24cc82e3d18318e1e6" }
napi = { version = "3", features = ["tokio_rt"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
tempfile = "3"
toml = "1.1"
# The runtime's own editor speaks this document type; reading a root's declarations
# with their spans needs the same version the runtime holds.
toml_edit = "0.25"
tokio = { version = "1", features = ["sync", "time"] }
futures-util = "0.3"

[dev-dependencies]
# A paused clock: the connection-wait test does not spend its thirty seconds.
tokio = { version = "1", features = ["rt", "test-util"] }
proptest = "1"
# Building a consult record by hand: the runtime's own id and clock types.
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(target_env = "musl")'.dependencies]
# Cross-builds need OpenSSL compiled for musl. The Docker builder uses its
# installed OpenSSL through OPENSSL_NO_VENDOR instead.
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
napi-build = "2"
