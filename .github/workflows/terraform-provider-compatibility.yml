name: Terraform Provider Compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - docs/openapi.json
      - platform/scripts/check-terraform-provider.py
      - platform/scripts/terraform-provider/**
      - .github/workflows/terraform-provider-compatibility.yml
      - .github/workflows/update-terraform-provider.yml
      # test_workflow.py also checks that the required workflow stays independent.
      - .github/workflows/on-pull-requests.yml
  workflow_dispatch:
    inputs:
      platform_ref:
        description: "Platform branch, tag, or commit SHA. The check reads docs/openapi.json from it."
        type: string
        required: true
        default: main
      provider_ref:
        description: "Provider branch, tag, or commit SHA to check."
        type: string
        required: true
        default: main

permissions: {}

concurrency:
  group: terraform-provider-compatibility-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  terraform-provider-compatibility:
    name: Terraform Provider Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./platform
    steps:
      - name: Checkout platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A manual run from main shares the default branch's cache scope, so it
      # reads only docs/openapi.json from platform_ref and never checks it out.
      # The token is passed to this one git command only, as in On Pull Requests.
      - name: Read selected platform spec
        id: spec
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PLATFORM_REF: ${{ inputs.platform_ref }}
        run: |
          set -euo pipefail
          spec="$RUNNER_TEMP/openapi.json"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Ref names only: no option-like values, no shell or path syntax.
            # Git also rejects "..", but say so here instead of relying on it.
            case "$PLATFORM_REF" in
              "" | -* | *..* | *[!A-Za-z0-9._/-]*)
                echo "::error::platform_ref must be a branch, tag or commit SHA."
                exit 2
                ;;
            esac
            git -c credential.helper= \
                -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
                fetch --no-tags --depth=1 origin "$PLATFORM_REF"
            git show FETCH_HEAD:docs/openapi.json > "$spec"
            platform_sha="$(git rev-parse FETCH_HEAD)"
          else
            cp ../docs/openapi.json "$spec"
            platform_sha="$(git rev-parse HEAD)"
          fi
          echo "file=$spec" >> "$GITHUB_OUTPUT"
          echo "Platform spec commit: $platform_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: archestra-ai/terraform-provider-archestra
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.provider_ref || 'main' }}
          path: terraform-provider
          fetch-depth: 0
          persist-credentials: false
      # The next steps run provider code. Refuse a commit that is only in a
      # fork's pull request, so a manual run from main never runs it there.
      - name: Check provider revision
        run: |
          set -euo pipefail
          provider_sha="$(git -C ../terraform-provider rev-parse HEAD)"
          if [ -z "$(git -C ../terraform-provider for-each-ref --contains "$provider_sha" refs/remotes/origin refs/tags)" ]; then
            echo "::error::provider_ref must be a branch or tag of archestra-ai/terraform-provider-archestra, or a commit on one of them."
            exit 2
          fi
          echo "Provider commit: $provider_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup provider Go toolchain
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: terraform-provider/go.mod
          cache-dependency-path: |
            terraform-provider/go.sum
            terraform-provider/tools/go.sum
      - name: Test provider update automation
        run: python3 -m unittest discover -s scripts/terraform-provider -p "test_*.py"
      - name: Check provider request contracts and regenerated unit tests
        env:
          SPEC_FILE: ${{ steps.spec.outputs.file }}
        run: python3 scripts/check-terraform-provider.py --provider ../terraform-provider --spec "$SPEC_FILE"
