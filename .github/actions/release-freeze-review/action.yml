name: Release Freeze Review
description: Request changes or approve release-please PRs based on freeze status
inputs:
  action:
    description: "Action to perform: 'freeze' to request changes, 'unfreeze' to approve"
    required: true
  app-id:
    description: The GitHub App ID for the release freeze checker
    required: true
  private-key:
    description: The GitHub App private key for the release freeze checker
    required: true
  pr-number:
    description: "PR number to review. If not provided, reviews all open release-please PRs."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Generate a token
      id: generate-token
      uses: ./.github/actions/github-app-token
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}

    - name: Find or validate release-please PRs and update reviews
      shell: bash
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_ACTION: ${{ inputs.action }}
      run: |
        if [ -n "$INPUT_PR_NUMBER" ]; then
          echo "Using provided PR number: $INPUT_PR_NUMBER"
          PR_NUMBERS="$INPUT_PR_NUMBER"
        else
          echo "Looking for open release-please PRs..."
          PR_NUMBERS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("release-please--")) | .number') \
            || { echo "::error::Cannot discover open release-please PRs; retry when the GitHub API is available"; exit 1; }

          if [ -z "$PR_NUMBERS" ]; then
            echo "No open release-please PR found."
            exit 0
          fi
        fi

        FREEZE_MARKER="release freeze system"

        for PR_NUMBER in $PR_NUMBERS; do
          if [ -z "$INPUT_PR_NUMBER" ]; then
            echo "Found release-please PR: #$PR_NUMBER"
          fi

          # Look for reviews containing our marker text to identify our bot's reviews.
          # This avoids needing to call /user which requires different permissions.
          LATEST_REVIEW=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
            --jq "[.[] | select(.body | contains(\"$FREEZE_MARKER\"))] | last")

          if [ "$LATEST_REVIEW" = "null" ] || [ -z "$LATEST_REVIEW" ]; then
            echo "No existing release freeze review found"
            REVIEW_STATE=NONE
          else
            REVIEW_STATE=$(echo "$LATEST_REVIEW" | jq -r '.state')
            echo "Found existing release freeze review with state: $REVIEW_STATE"
          fi

          if [ "$INPUT_ACTION" = "freeze" ]; then
            if [ "$REVIEW_STATE" = "CHANGES_REQUESTED" ]; then
              echo "⏭️ Skipping - already have CHANGES_REQUESTED review on this PR"
              continue
            fi

            echo "Requesting changes on PR #$PR_NUMBER to block merging..."
            gh pr review "$PR_NUMBER" --request-changes --body "## ❄️ Release Freeze Active

            A release freeze is currently in effect. This PR cannot be merged until the freeze is lifted.

            ### How to unfreeze

            1. Go to **Actions** → **Toggle Release Freeze** → **Run workflow**
            2. Select \`false\` from the dropdown
            3. Click **Run workflow**

            Once the freeze is lifted, this review will be dismissed automatically.

            ---
            *This review was posted automatically by the release freeze system.*"
            echo "✅ Requested changes on PR #$PR_NUMBER"
          elif [ "$INPUT_ACTION" = "unfreeze" ]; then
            if [ "$REVIEW_STATE" = "APPROVED" ]; then
              echo "⏭️ Skipping - already have APPROVED review on this PR"
              continue
            fi

            echo "Approving PR #$PR_NUMBER to dismiss freeze block..."
            gh pr review "$PR_NUMBER" --approve --body "## 🚀 Release Freeze Lifted

            The release freeze has been lifted. This PR can now be merged.

            ---
            *This approval was posted automatically by the release freeze system.*"
            echo "✅ Approved PR #$PR_NUMBER"
          fi
        done
