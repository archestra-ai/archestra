name: Evaluate MCP Catalog Servers

# Moved from archestra-ai/website (evaluate-mcp-servers.yml) when the catalog
# data moved into this repository. The evaluation scripts still live in the
# website repo; this workflow checks it out, runs the scripts against the data
# in mcp-catalog/, and PRs the resulting evaluation files back here.
#
# Requires the GEMINI_API_KEY repository secret.

on:
  push:
    branches:
      - main
    paths:
      - "mcp-catalog/mcp-servers.json"
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-evaluation of all servers"
        required: false
        default: false
        type: boolean
      concurrency:
        description: "Number of parallel requests"
        required: false
        default: "1"
        type: string
      model:
        description: "AI model to use for evaluation"
        required: false
        default: "gemini-2.5-flash"
        type: string

permissions: {}

concurrency:
  group: "evaluate-mcp-catalog-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate MCP Servers
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 90
    permissions:
      contents: write # Push the bot branch with evaluation results
      pull-requests: write # Open the PR with evaluation results

    steps:
      - name: Checkout this repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2 # Enough history to diff mcp-servers.json against the previous commit

      - name: Checkout website repository (evaluation scripts)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: archestra-ai/website
          path: website
          persist-credentials: false
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.4.1"
          cache: "pnpm"
          cache-dependency-path: website/app/pnpm-lock.yaml

      - name: Install website dependencies
        working-directory: website/app
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Copy catalog data into website checkout
        run: |
          mkdir -p website/app/app/mcp-catalog/data
          cp mcp-catalog/mcp-servers.json website/app/app/mcp-catalog/data/mcp-servers.json
          rm -rf website/app/app/mcp-catalog/data/mcp-evaluations
          cp -R mcp-catalog/mcp-evaluations website/app/app/mcp-catalog/data/mcp-evaluations

      - name: Run evaluation script
        working-directory: website/app
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
          CONCURRENCY_INPUT: ${{ github.event.inputs.concurrency }}
          MODEL_INPUT: ${{ github.event.inputs.model }}
          EVENT_NAME: ${{ github.event_name }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          # Set the model parameter
          MODEL_PARAM="--model ${MODEL_INPUT:-gemini-2.5-flash}"
          echo "Using AI model: ${MODEL_INPUT:-gemini-2.5-flash}"

          # Determine evaluation mode
          if [[ "$FORCE_INPUT" == "true" ]]; then
            echo "Running forced evaluation of all servers..."
            pnpm catalog:evaluate --all --force --concurrency ${CONCURRENCY_INPUT:-5} $MODEL_PARAM
          elif [[ "$EVENT_NAME" == "push" ]]; then
            echo "Detecting newly added servers from git diff..."

            # Get the diff of mcp-servers.json (in this repo's checkout)
            git -C "$WORKSPACE" diff HEAD~1 HEAD -- mcp-catalog/mcp-servers.json > diff.txt || true

            # Extract only added URLs (lines starting with +)
            grep '^+  "https://github.com' diff.txt | sed 's/^+  "//' | sed 's/",$//' | sed 's/"$//' > new_servers.txt || true

            if [ -s new_servers.txt ]; then
              echo "Found $(wc -l < new_servers.txt) new servers to evaluate:"
              cat new_servers.txt

              # Evaluate each new server
              while IFS= read -r url; do
                echo "Evaluating: $url"
                pnpm catalog:evaluate "$url" --all $MODEL_PARAM || echo "Failed to evaluate $url"
              done < new_servers.txt
            else
              echo "No new servers found in this commit"
            fi
          else
            echo "Evaluating only missing servers..."
            pnpm catalog:evaluate --missing-only --all --concurrency ${CONCURRENCY_INPUT:-5} $MODEL_PARAM
          fi

      - name: Copy evaluation results back
        run: |
          rm -rf mcp-catalog/mcp-evaluations
          cp -R website/app/app/mcp-catalog/data/mcp-evaluations mcp-catalog/mcp-evaluations

      - name: Generate evaluation report
        if: always()
        run: |
          echo "## 📊 MCP Server Evaluation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count statistics
          TOTAL_SERVERS=$(cat mcp-catalog/mcp-servers.json | jq 'length')
          TOTAL_EVALS=$(ls mcp-catalog/mcp-evaluations/*.json 2>/dev/null | wc -l || echo "0")
          MISSING=$((TOTAL_SERVERS - TOTAL_EVALS))

          echo "### Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- **Total servers:** $TOTAL_SERVERS" >> $GITHUB_STEP_SUMMARY
          echo "- **Evaluated servers:** $TOTAL_EVALS" >> $GITHUB_STEP_SUMMARY
          echo "- **Missing evaluations:** $MISSING" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # List servers with quality scores
          echo "### Top Servers by Quality Score" >> $GITHUB_STEP_SUMMARY
          echo "| Server | Score | Category |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|----------|" >> $GITHUB_STEP_SUMMARY

          for file in mcp-catalog/mcp-evaluations/*.json; do
            if [ -f "$file" ]; then
              jq -r '[.display_name // .name, .quality_score // "N/A", .category // "N/A"] | @tsv' "$file"
            fi
          done | sort -t$'\t' -k2 -rn | head -10 | while IFS=$'\t' read -r name score category; do
            echo "| $name | $score | $category |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Commit and Push or Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Show git status for debugging
          echo "=== Git status before adding files ==="
          git status

          # Add evaluation files
          git add mcp-catalog/mcp-evaluations

          # Show what will be committed
          echo "=== Git status after adding files ==="
          git status

          # Check for changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Create commit message
          if [[ "$FORCE_INPUT" == "true" ]]; then
            COMMIT_MSG="chore: force re-evaluate all MCP servers"
            PR_TITLE="chore: Force re-evaluate all MCP servers"
          elif [[ "$EVENT_NAME" == "push" ]] && [ -f website/app/new_servers.txt ] && [ -s website/app/new_servers.txt ]; then
            NEW_COUNT=$(wc -l < website/app/new_servers.txt)
            COMMIT_MSG="chore: evaluate $NEW_COUNT newly added MCP server(s)"
            PR_TITLE="chore: Evaluate $NEW_COUNT newly added MCP server(s)"
          else
            COMMIT_MSG="chore: evaluate missing MCP servers"
            PR_TITLE="chore: Evaluate missing MCP servers"
          fi

          # Create a new branch for the changes
          BRANCH_NAME="bot/mcp-evaluation-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"

          # Commit changes
          git commit -m "$COMMIT_MSG

          Triggered by: $EVENT_NAME
          Workflow: $WORKFLOW_NAME #$RUN_NUMBER"

          # Push the new branch
          git push origin "$BRANCH_NAME"

          # Create PR using GitHub CLI
          PR_BODY="## Automated MCP Server Evaluation

          This PR contains automated evaluation results for MCP servers.

          **Triggered by:** $EVENT_NAME
          **Workflow run:** $WORKFLOW_NAME #$RUN_NUMBER

          ### Changes
          - Updated evaluation data for MCP servers
          - Quality scores and metadata refreshed

          ---
          *This PR was automatically created by GitHub Actions*"

          gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH_NAME" || echo "PR creation failed or already exists"
