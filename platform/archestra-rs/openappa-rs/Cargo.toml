[package]
name = "openappa_rs"
version = "0.1.0"
edition = "2024"
build = "build.rs"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["telemetry"]
telemetry = ["dep:opentelemetry", "dep:opentelemetry-appender-tracing", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:tracing", "dep:tracing-opentelemetry", "dep:tracing-subscriber"]

[dependencies]
# Includes #430's value-safe telemetry. The embedding host owns the exporters.
# The embedded reporting helper still requires upstream's daemon feature.
appa-runtime = { package = "appa", git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "5555b90ba963ef968d0778637b77de53d0cb9a0c" }
appa-runtime-api = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "5555b90ba963ef968d0778637b77de53d0cb9a0c" }
appa-eventlog = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "5555b90ba963ef968d0778637b77de53d0cb9a0c", features = ["postgres"] }
appa-package = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "5555b90ba963ef968d0778637b77de53d0cb9a0c" }
opentelemetry = { version = "0.32", optional = true }
opentelemetry-appender-tracing = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "logs", "metrics", "reqwest-blocking-client", "trace"], optional = true }
opentelemetry_sdk = { version = "0.32", features = ["logs", "metrics", "trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-opentelemetry = { version = "0.33", default-features = false, optional = true }
tracing-subscriber = { version = "0.3", features = ["registry"], optional = true }
napi = { version = "3", features = ["tokio_rt"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
tempfile = "3"
toml = "1.1"
# The runtime's own editor speaks this document type; reading a root's declarations
# with their spans needs the same version the runtime holds.
toml_edit = "0.25"
tokio = { version = "1", features = ["sync", "time"] }
futures-util = "0.3"

[dev-dependencies]
axum = "0.8"
prost = "0.14"
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "trace", "logs", "metrics"] }
# A paused clock: the connection-wait test does not spend its thirty seconds.
tokio = { version = "1", features = ["rt", "test-util"] }
proptest = "1"
# Building a consult record by hand: the runtime's own id and clock types.
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(target_env = "musl")'.dependencies]
# Cross-builds need OpenSSL compiled for musl. The Docker builder uses its
# installed OpenSSL through OPENSSL_NO_VENDOR instead.
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
napi-build = "2"
