name: Setup Docker Builder
description: |
  Wrapper around the organization's provider-compatible Docker builder setup.
  Creates a docker-container driver builder (the default docker driver cannot
  export registry build caches). The action's default buildkitd flags allow
  the network.host entitlement our builds use.
runs:
  using: composite
  steps:
    - name: Setup Docker builder
      uses: archestra-ai/.github/actions/setup-docker-builder@13f35fa7ee72120bcebe2ad663da42260e629818 # zizmor: ignore[stale-action-refs]
