name: Deploy Dev Platform Images

on:
  workflow_call:
    inputs:
      version:
        description: "Version tag for the Docker images"
        required: true
        type: string
    secrets:
      DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME:
        required: false
      DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER:
        required: false
      PLATFORM_NEXTJS_SOURCE_MAP_SENTRY_AUTH_TOKEN:
        required: false
      TURBOREPO_REMOTE_CACHING_TOKEN:
        required: false
      TURBOREPO_REMOTE_CACHING_TEAM:
        required: false
  workflow_dispatch:
  pull_request:
    types:
      - labeled

permissions: {}

concurrency:
  group: deploy-dev-platform-images-${{ github.event.pull_request.number || inputs.version || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-previous-platform-image:
    name: Resolve previous platform image
    if: ${{ github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.label.name == 'deploy-dev-platform-images' && github.event.pull_request.head.repo.fork != true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to resolve the currently deployed platform image from staging.
      id-token: write # Required for Workload Identity Federation and GKE credential retrieval.
    outputs:
      previous_image: ${{ steps.previous-main-image.outputs.previous-image || steps.deployed-platform-image.outputs.previous-image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Authenticate to Google Artifact Registry
        uses: archestra-ai/.github/actions/google-auth@840a8b2c85a9deb01869cc956c9c77fbf50ccd68 # v1.1.0
        with:
          service_account: ${{ secrets.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME || vars.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
          workload_identity_provider: ${{ secrets.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER || vars.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}
          registry: europe-west1-docker.pkg.dev

      # The previous main image already contains older static chunks. Fall back
      # to the deployed image when that commit did not publish an image.
      - name: Check previous main image
        id: previous-main-image
        if: ${{ github.event_name == 'push' && github.event.before != '' }}
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
          IMAGE_VERSION: ${{ inputs.version || github.sha }}
        run: |
          candidate="ghcr.io/archestra-ai/ci/platform:${PREVIOUS_SHA}"
          if [ "$PREVIOUS_SHA" != "$IMAGE_VERSION" ] && docker buildx imagetools inspect "$candidate" >/dev/null 2>&1; then
            echo "previous-image=$candidate" >> "$GITHUB_OUTPUT"
          fi

      - name: Install gke-gcloud-auth-plugin
        if: ${{ steps.previous-main-image.outputs.previous-image == '' }}
        run: gcloud components install gke-gcloud-auth-plugin

      - name: Configure kubectl
        if: ${{ steps.previous-main-image.outputs.previous-image == '' }}
        env:
          GKE_USE_DNS_ENDPOINT: ${{ vars.GKE_USE_DNS_ENDPOINT }}
        run: |
          endpoint_args=()
          if [[ "$GKE_USE_DNS_ENDPOINT" == "true" ]]; then
            endpoint_args+=(--dns-endpoint)
          fi
          gcloud container clusters get-credentials archestra-staging \
            --zone us-central1-a --project friendly-path-465518-r6 "${endpoint_args[@]}"

      - name: Resolve deployed platform image
        id: deployed-platform-image
        if: ${{ steps.previous-main-image.outputs.previous-image == '' }}
        run: |
          PREV_IMAGE=$(kubectl get deployment archestra-platform -n archestra \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null) || true

          if [ -n "$PREV_IMAGE" ] && [ "${PREV_IMAGE##*:}" != "$IMAGE_VERSION" ]; then
            echo "previous-image=${PREV_IMAGE}" >> "$GITHUB_OUTPUT"
          else
            echo "previous-image=" >> "$GITHUB_OUTPUT"
          fi
        env:
          IMAGE_VERSION: ${{ inputs.version || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}

  publish-dev-platform-image:
    name: Build Platform Dev Docker Image
    needs:
      - resolve-previous-platform-image
    if: ${{ github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.label.name == 'deploy-dev-platform-images' && github.event.pull_request.head.repo.fork != true) }}
    permissions:
      contents: read # Required to checkout the repository and build the image.
      packages: write # Publish development images and build caches to GHCR.
      id-token: write # Required for Workload Identity Federation when pushing images.
    uses: $/.github/workflows/build-native-multi-arch-image.yml
    with:
      image_directory: ./platform
      image_name: platform
      image_registry: ghcr.io/archestra-ai/ci
      version: ${{ inputs.version || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
      push_image: true
      auth_provider: ghcr
      # amd64-only ONLY for the automated staging deploy (push to main, via
      # on-commits-to-main): staging runs amd64 nodes, so the arm64 leg (~9-10
      # min, the long pole) produced an image nothing schedules. The
      # `deploy-dev-platform-images` label and workflow_dispatch stay multi-arch
      # so a dev build handed to a tester runs natively on Apple Silicon (arm64).
      # Release images (build-dockerhub-image.yml) are always multi-arch.
      amd64_only: ${{ github.event_name == 'push' }}
      # Match the 16-CPU Blacksmith E2E builder; use native Blacksmith ARM.
      amd64_runner: blacksmith-16vcpu-ubuntu-2404
      arm64_runner: blacksmith-32vcpu-ubuntu-2404-arm
      # PRs consume publisher caches read-only instead of spending over a minute
      # rewriting mode=max. Push and manual multi-arch builds still refresh them.
      export_cache: ${{ github.event_name != 'pull_request' }}
      # PR images use the faster E2E-proven output; staging/manual stay unchanged.
      zstd_compression: ${{ github.event_name == 'pull_request' }}
      checkout_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      previous_image: ${{ needs.resolve-previous-platform-image.outputs.previous_image }}
    secrets:
      GCP_SERVICE_ACCOUNT_NAME: ${{ secrets.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME || vars.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER: ${{ secrets.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER || vars.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}
      PLATFORM_NEXTJS_SOURCE_MAP_SENTRY_AUTH_TOKEN: ${{ secrets.PLATFORM_NEXTJS_SOURCE_MAP_SENTRY_AUTH_TOKEN }}
      TURBOREPO_REMOTE_CACHING_TOKEN: ${{ secrets.TURBOREPO_REMOTE_CACHING_TOKEN }}
      TURBOREPO_REMOTE_CACHING_TEAM: ${{ secrets.TURBOREPO_REMOTE_CACHING_TEAM }}

  publish-dev-mcp-server-base-image:
    name: Build MCP Server Base Dev Image
    if: ${{ github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.label.name == 'deploy-dev-platform-images' && github.event.pull_request.head.repo.fork != true) }}
    uses: $/.github/workflows/build-base-mcp-server-docker-image.yml
    permissions:
      contents: read # Required to invoke the reusable MCP server base image workflow.
      packages: write # Publish development images and build caches to GHCR.
      id-token: write # Required for Workload Identity Federation.
    with:
      image_registry: ghcr.io/archestra-ai/ci
      push_to_gcr: true
      version: ${{ inputs.version || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
      reuse_from_version: ${{ github.event_name == 'push' && github.event.before || '' }}
    secrets:
      GCP_SERVICE_ACCOUNT_NAME: ${{ secrets.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME || vars.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER: ${{ secrets.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER || vars.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}

  publish-dev-agent-catalog-images:
    name: Build Agent Catalog Dev Images
    if: ${{ github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.label.name == 'deploy-dev-platform-images' && github.event.pull_request.head.repo.fork != true) }}
    uses: $/.github/workflows/build-agent-catalog-images.yml
    permissions:
      contents: read # Required to invoke the reusable Agent image workflow.
      packages: write # Publish development images and build caches to GHCR.
      id-token: write # Required for Workload Identity Federation.
    with:
      image_registry: ghcr.io/archestra-ai/ci
      push_to_gcr: true
      version: ${{ inputs.version || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
      checkout_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      reuse_from_version: ${{ github.event_name == 'push' && github.event.before || '' }}
    secrets:
      GCP_SERVICE_ACCOUNT_NAME: ${{ secrets.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME || vars.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER: ${{ secrets.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER || vars.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}

  publish-dev-p4-shim-image:
    name: Build p4 Shim Dev Image
    if: ${{ github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.label.name == 'deploy-dev-platform-images' && github.event.pull_request.head.repo.fork != true) }}
    uses: $/.github/workflows/build-p4-shim-docker-image.yml
    permissions:
      contents: read # Required to invoke the reusable p4 shim image workflow.
      packages: write # Publish development images and build caches to GHCR.
      id-token: write # Required for Workload Identity Federation.
    with:
      image_registry: ghcr.io/archestra-ai/ci
      push_to_gcr: true
      version: ${{ inputs.version || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
      # Main publishes p4 under each commit SHA. If its Docker context did not
      # change, retag the previous main image instead of rebuilding both arches.
      reuse_from_version: ${{ github.event_name == 'push' && github.event.before || '' }}
    secrets:
      GCP_SERVICE_ACCOUNT_NAME: ${{ secrets.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME || vars.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER: ${{ secrets.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER || vars.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}

  publish-dev-sandbox-base-image:
    name: Build Sandbox Base Dev Image
    if: ${{ github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.label.name == 'deploy-dev-platform-images' && github.event.pull_request.head.repo.fork != true) }}
    uses: $/.github/workflows/build-sandbox-base-docker-image.yml
    permissions:
      contents: read # Required to invoke the reusable sandbox base image workflow.
      packages: write # Publish development images and build caches to GHCR.
      id-token: write # Required for Workload Identity Federation.
    with:
      image_registry: ghcr.io/archestra-ai/ci
      push_to_gcr: true
      version: ${{ inputs.version || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
      reuse_from_version: ${{ github.event_name == 'push' && github.event.before || '' }}
    secrets:
      GCP_SERVICE_ACCOUNT_NAME: ${{ secrets.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME || vars.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER: ${{ secrets.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER || vars.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}
