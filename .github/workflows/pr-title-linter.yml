name: PR Title Linter

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
  # This check can be required with merge queue enabled. The shared action
  # passes on merge_group, where there is no title to lint.
  merge_group:

permissions: {}

concurrency:
  group: "pr-title-linter-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}"
  cancel-in-progress: true

jobs:
  # The rules live in archestra-ai/.github (actions/lint-pr-title/commitlint.config.js).
  lint-pr-title:
    name: PR Title Linter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Lint PR title
        uses: archestra-ai/.github/actions/lint-pr-title@dbb529ba77ba07dd8f71f16ccb1b2317f4587312 # v1.24.0
