name: Release Qualification
description: Record public-safe verification of a stable release's exact artifacts.
title: "Release qualification: "
body:
  - type: markdown
    attributes:
      value: |
        This record is public. Use fictional test data and sanitized results only.
        Do not include customer identifiers, secrets, private URLs, or raw operational logs.
        Follow [.github/RELEASING.md](https://github.com/archestra-ai/archestra/blob/main/.github/RELEASING.md).
  - type: input
    id: version
    attributes:
      label: Stable version
      placeholder: "1.4.0"
    validations:
      required: true
  - type: input
    id: manifest
    attributes:
      label: Artifact manifest SHA-256
      description: Checksum of the release-artifacts.json used during qualification.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build run
      description: Link to the successful Release Please run in this public repository.
    validations:
      required: true
  - type: input
    id: upgrade
    attributes:
      label: Upgrade source version
      description: Latest supported stable patch used for populated upgrade testing.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Qualification
      options:
        - label: Final image digests and chart archive match the recorded manifest.
        - label: Fresh installation passes with beta disabled and no experimental opt-ins.
        - label: Populated upgrade preserves data and access restrictions.
        - label: Core workflows and changed paths pass on supported deployment modes.
        - label: Migration safety and recovery were reviewed and exercised where applicable.
        - label: Representative use shows no release-blocking errors or resource regressions.
        - label: Evidence contains no private information.
  - type: textarea
    id: results
    attributes:
      label: Results and release decision
      description: Record scenarios, results, architectures, qualification duration, and any blockers or exceptions.
    validations:
      required: true
