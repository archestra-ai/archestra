name: Build p4 Shim Docker Image

# The p4 shim image (platform/docker_images/p4_shim) is the in-cluster pod used
# by Perforce permission sync. It has zero npm dependencies (no lockfiles), so
# unlike the MCP server base image workflow there is no lockfile-drift job.
#
# Reusable via workflow_call (release + dev publishes); also runs a build-only
# validation (no push) on pull requests that touch the image.
on:
  workflow_call:
    inputs:
      image_registry:
        description: "Destination registry prefix"
        type: string
        default: ghcr.io/archestra-ai
      push_image:
        description: "Whether to push the built image"
        required: true
        type: boolean
      version:
        description: "Version tag for the Docker image"
        required: true
        type: string
      checkout_ref:
        description: "Optional ref to checkout when building the image"
        required: false
        type: string
        default: ""
      reuse_from_version:
        description: "Previous main SHA whose image may be reused when inputs are unchanged"
        required: false
        type: string
        default: ""
      environment:
        description: "GitHub Environment whose secrets the publishing jobs read (release-publish for releases); empty for none"
        required: false
        type: string
        default: ""
  pull_request:
    paths:
      - "platform/docker_images/p4_shim/**"
      - ".github/workflows/build-p4-shim-docker-image.yml"

permissions: {}

concurrency:
  group: build-p4-shim-docker-image-${{ inputs.version || github.event.pull_request.number || github.ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # workflow_call path (release-please / deploy-dev): callers always pass a
  # version, so gate on it — `github.event_name` is the CALLER's event here.
  build-p4-shim-image:
    name: Build p4 Shim Image
    if: ${{ inputs.version != '' }}
    permissions:
      contents: read # Required to checkout the repository and build the image.
      packages: write # Publish CI images with the repository token.
      id-token: write # Required for Workload Identity Federation when pushing images.
      attestations: write # Passed to the image build, which attests CI images.
    uses: $/.github/workflows/build-native-multi-arch-image.yml
    with:
      environment: ${{ inputs.environment }}
      image_directory: ./platform/docker_images/p4_shim
      dockerfile: ./platform/docker_images/p4_shim/Dockerfile
      image_name: p4-shim
      image_registry: ${{ inputs.image_registry }}
      version: ${{ inputs.version }}
      push_image: ${{ inputs.push_image }}
      auth_provider: ghcr
      checkout_ref: ${{ inputs.checkout_ref }}
      reuse_from_version: ${{ inputs.reuse_from_version }}
      reuse_paths: '["platform/docker_images/p4_shim", ".github/workflows/build-p4-shim-docker-image.yml"]'

  # Direct pull_request path: build-only validation, never pushes. A plain
  # single-arch build (same pattern docker-image-scanning.yml uses for the MCP
  # server base image) instead of the reusable multi-arch workflow, because
  # that workflow's jobs request `id-token: write`, which fork PRs are not
  # allowed and which would fail the run.
  validate-p4-shim-image:
    name: Validate p4 Shim Image Build
    if: ${{ inputs.version == '' }}
    runs-on: ubuntu-24.04-16core
    permissions:
      contents: read # Required to checkout the repository and build the image.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build p4 shim image
        uses: $/.github/actions/build-docker-image
        with:
          context: ./platform/docker_images/p4_shim
          dockerfile: ./platform/docker_images/p4_shim/Dockerfile
          platforms: linux/amd64
          push: "false"
          load: "true"
          tags: p4-shim:${{ github.sha }}
          # Pull requests do not receive the dhi.io OIDC credential.
          build-args: RUNTIME_BASE=public
          # Read-only: the publish paths own cache export for this image.
          cache-from: type=registry,ref=ghcr.io/archestra-ai/ci/p4-shim:buildcache-amd64
