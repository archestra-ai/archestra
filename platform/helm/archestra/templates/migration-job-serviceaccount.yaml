{{- if and .Values.archestra.migrationJob.enabled (.Values.archestra.migrationJob.serviceAccount).create (ne (include "archestra-platform.maintenanceModeEnabled" .) "true") }}
{{/*
Hook-only ServiceAccount for the database migration Job.

Pre-upgrade hooks run before normal chart resources are applied, so a Job on
the platform ServiceAccount would still carry its previous annotations (for
example a changed workload identity). This account is created right before
the Job with the current annotations and removed once the hooks finish.
*/}}
{{- $saAnnotations := include "archestra-platform.serviceAccountAnnotations" . | fromYaml }}
{{- $_ := set $saAnnotations "helm.sh/hook" "pre-upgrade" }}
{{- $_ := set $saAnnotations "helm.sh/hook-weight" "-10" }}
{{- $_ := set $saAnnotations "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded,hook-failed" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "archestra-platform.migrationJobServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archestra-platform.migrationJobLabels" . | nindent 4 }}
  annotations:
    {{- toYaml $saAnnotations | nindent 4 }}
{{- with .Values.archestra.orchestrator.kubernetes.serviceAccount.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
