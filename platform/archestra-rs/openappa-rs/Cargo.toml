[package]
name = "openappa_rs"
version = "0.1.0"
edition = "2024"
build = "build.rs"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Actor-scoped peer messaging from OpenAPPA #593, the `archestra` annotator builtin from #595, and the `search_tools`, `search_files`, and `load_skill` battery rules from #596 and #601, and the shared guide core from #598.
appa-runtime = { package = "appa", git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "10aa0e09e32d8c6704bdb030dc3c66140bf81915", features = ["archestra"] }
appa-runtime-api = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "10aa0e09e32d8c6704bdb030dc3c66140bf81915" }
appa-eventlog = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "10aa0e09e32d8c6704bdb030dc3c66140bf81915", features = ["postgres"] }
appa-package = { git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "10aa0e09e32d8c6704bdb030dc3c66140bf81915" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
napi = { version = "3", features = ["tokio_rt"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
tempfile = "3"
toml = "1.1"
# The runtime's own editor speaks this document type; reading a root's declarations
# with their spans needs the same version the runtime holds.
toml_edit = "0.25"
tokio = { version = "1", features = ["sync", "time"] }
futures-util = "0.3"
# Stream bounded receipt lookups through the store's existing PostgreSQL client.
postgres = "0.19"

[dev-dependencies]
# A paused clock: the connection-wait test does not spend its thirty seconds.
tokio = { version = "1", features = ["rt", "test-util"] }
proptest = "1"
# Building a consult record by hand: the runtime's own id and clock types.
uuid = { version = "1", features = ["v7"] }

[target.'cfg(target_env = "musl")'.dependencies]
# Cross-builds need OpenSSL compiled for musl. The Docker builder uses its
# installed OpenSSL through OPENSSL_NO_VENDOR instead.
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
napi-build = "2"
