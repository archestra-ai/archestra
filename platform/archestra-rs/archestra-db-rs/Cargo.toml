[package]
name = "archestra_db_rs"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
archestra-db = { path = "../archestra-db" }
futures-util = "0.3"
napi = { version = "3", features = ["tokio_rt"] }
napi-derive = "3"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[build-dependencies]
napi-build = "2"
