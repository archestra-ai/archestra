archestra:
  # Cloud Provider Configuration - GKE
  # Enable BackendConfig for streaming timeout support (chat and MCP operations)
  cloudProvider:
    gke:
      backendConfig:
        enabled: true
        # 600 seconds (10 minutes) to support long-running MCP tool operations
        timeoutSec: 600

  service:
    annotations:
      # GKE BackendConfig reference - links Service to BackendConfig for timeout configuration
      cloud.google.com/backend-config: '{"ports": {"9000":"archestra-platform-backend-config"}}'

  ingress:
    enabled: true
    annotations:
      # GKE Ingress Controller configuration
      kubernetes.io/ingress.class: "gce"
      kubernetes.io/ingress.global-static-ip-name: "archestra-staging-ip"
      ingress.gcp.cloud.google.com/load-balancer-type: "External"
      networking.gke.io/managed-certificates: "archestra-platform-staging-ssl"
      ingress.gcp.cloud.google.com/ssl-redirect: "true"

    hosts:
      - host: frontend.archestra.dev
        paths:
          - path: /
            port: 3000
            pathType: Prefix
      - host: backend.archestra.dev
        paths:
          # Block public access to metrics endpoint
          - path: /metrics
            port: 1
            pathType: Exact
          - path: /
            port: 9000
            pathType: Prefix
