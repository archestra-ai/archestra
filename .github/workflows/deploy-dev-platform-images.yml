name: Deploy Dev Platform Images

on:
  workflow_call:
    inputs:
      version:
        description: "Version tag for the Docker images"
        required: true
        type: string
    secrets:
      DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME:
        required: false
      DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER:
        required: false
      # Supplied by the staging-build environment, which reads it only when
      # every caller in the chain passes it by name.
      PLATFORM_NEXTJS_SOURCE_MAP_SENTRY_AUTH_TOKEN:
        required: false
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-dev-platform-images-${{ inputs.version || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-previous-platform-image:
    name: Resolve previous platform image
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to resolve the currently deployed platform image from staging.
      id-token: write # Required for Workload Identity Federation and GKE credential retrieval.
    outputs:
      previous_image: ${{ steps.previous-platform-image.outputs.previous-image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Authenticate to Google Artifact Registry
        uses: ./.github/actions/auth-to-gar
        with:
          service_account: ${{ secrets.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
          workload_identity_provider: ${{ secrets.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}

      - name: Install gke-gcloud-auth-plugin
        run: gcloud components install gke-gcloud-auth-plugin

      - name: Configure kubectl
        run: |
          gcloud container clusters get-credentials archestra-staging \
            --zone us-central1-a --project friendly-path-465518-r6

      - name: Resolve previous platform image
        id: previous-platform-image
        run: |
          PREV_TAG=$(kubectl get deployment archestra-platform -n archestra \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null \
            | cut -d: -f2) || true

          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$IMAGE_VERSION" ]; then
            echo "previous-image=europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public/platform:${PREV_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "previous-image=" >> "$GITHUB_OUTPUT"
          fi
        env:
          IMAGE_VERSION: ${{ inputs.version || github.sha }}

  publish-dev-platform-image:
    name: Build Platform Dev Docker Image
    needs:
      - resolve-previous-platform-image
    permissions:
      contents: read # Required to checkout the repository and build the image.
      id-token: write # Required for Workload Identity Federation when pushing images.
    uses: ./.github/workflows/build-native-multi-arch-image.yml
    with:
      image_directory: ./platform
      image_name: platform
      image_registry: europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public
      version: ${{ inputs.version || github.sha }}
      push_image: true
      auth_provider: gar
      # amd64-only ONLY for the automated staging deploy (push to main, via
      # on-commits-to-main): staging runs amd64 nodes, so the arm64 leg (~9-10
      # min, the long pole) produced an image nothing schedules.
      # workflow_dispatch stays multi-arch so a dev build handed to a tester
      # runs natively on Apple Silicon (arm64).
      # Release images (build-dockerhub-image.yml) are always multi-arch.
      amd64_only: ${{ github.event_name == 'push' }}
      # Cold PR evidence: 11m36s on 4-vCPU ubuntu-latest versus 3m26s for the
      # complete full-image build on this 16-vCPU runner. Use it for every
      # compile-bound amd64 Platform build, including PR/manual multi-arch runs.
      amd64_runner: ubuntu-24.04-16core
      # 16-vCPU ARM measured 5m11s after cache/export optimization; use the
      # native 32-vCPU tier to keep the complete job below the five-minute budget.
      arm64_runner: ubuntu-24.04-arm-32core
      previous_image: ${{ needs.resolve-previous-platform-image.outputs.previous_image }}
      # The Sentry source-map token lives in the staging-build environment,
      # which only main may use. Dispatches from other branches build without
      # uploading source maps.
      environment: ${{ github.ref == 'refs/heads/main' && 'staging-build' || '' }}
    secrets:
      GCP_SERVICE_ACCOUNT_NAME: ${{ secrets.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER: ${{ secrets.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}
      PLATFORM_NEXTJS_SOURCE_MAP_SENTRY_AUTH_TOKEN: ${{ secrets.PLATFORM_NEXTJS_SOURCE_MAP_SENTRY_AUTH_TOKEN }}

  publish-dev-mcp-server-base-image:
    name: Build MCP Server Base Dev Image
    uses: ./.github/workflows/build-base-mcp-server-docker-image.yml
    permissions:
      contents: read # Required to invoke the reusable MCP server base image workflow.
      id-token: write # Required for Workload Identity Federation.
    with:
      push_to_gcr: true
      version: ${{ inputs.version || github.sha }}
    secrets:
      GCP_SERVICE_ACCOUNT_NAME: ${{ secrets.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER: ${{ secrets.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}

  publish-dev-agent-catalog-images:
    name: Build Agent Catalog Dev Images
    uses: ./.github/workflows/build-agent-catalog-images.yml
    permissions:
      contents: read # Required to invoke the reusable Agent image workflow.
      id-token: write # Required for Workload Identity Federation.
    with:
      push_to_gcr: true
      version: ${{ inputs.version || github.sha }}
    secrets:
      GCP_SERVICE_ACCOUNT_NAME: ${{ secrets.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER: ${{ secrets.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}

  publish-dev-p4-shim-image:
    name: Build p4 Shim Dev Image
    uses: ./.github/workflows/build-p4-shim-docker-image.yml
    permissions:
      contents: read # Required to invoke the reusable p4 shim image workflow.
      id-token: write # Required for Workload Identity Federation.
    with:
      push_to_gcr: true
      version: ${{ inputs.version || github.sha }}
    secrets:
      GCP_SERVICE_ACCOUNT_NAME: ${{ secrets.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER: ${{ secrets.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}

  publish-dev-sandbox-base-image:
    name: Build Sandbox Base Dev Image
    uses: ./.github/workflows/build-sandbox-base-docker-image.yml
    permissions:
      contents: read # Required to invoke the reusable sandbox base image workflow.
      id-token: write # Required for Workload Identity Federation.
    with:
      push_to_gcr: true
      version: ${{ inputs.version || github.sha }}
    secrets:
      GCP_SERVICE_ACCOUNT_NAME: ${{ secrets.DEVELOPMENT_GCP_DEPLOY_SERVICE_ACCOUNT_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER: ${{ secrets.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}
