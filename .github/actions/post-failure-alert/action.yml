name: Post a failure alert
description: >-
  Post a workflow run's failed jobs to #alerts. The webhook is read from GCP
  Secret Manager by ci-archestra-alerts, which trusts only the workflows listed
  in archestra-ai/infra gcp/workload_identity/ci-workflow-trust.tf. The calling
  job grants `actions: read` and `id-token: write`. With slack-channel set it
  posts as the same Slack app's bot instead (release-image-scan-slack-bot-token)
  and returns the message's channel and ts, so a later job can reply in its
  thread (start-alert-fix-agent.yml); a webhook post returns neither.
inputs:
  summary:
    description: One line saying what failed and what it means, such as "VEX Triage did not start".
    required: true
  details:
    description: Lines to post under the summary in place of the run's failed jobs, for an alert that is not a job failure.
    required: false
    default: ""
  test:
    description: '"true" posts a test message instead of the run''s failures.'
    required: false
    default: "false"
  service-account:
    description: The CI_ALERTS_SECRETS_SERVICE_ACCOUNT repository variable.
    required: true
  workload-identity-provider:
    description: The DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER repository variable.
    required: true
  github-token:
    description: "A token that can read this run's jobs: github.token, with the job granting actions read."
    required: true
  slack-channel:
    description: The CI_ALERTS_SLACK_CHANNEL_ID repository variable. Set, the alert posts as a bot and returns channel and ts; empty, it posts through the webhook.
    required: false
    default: ""
outputs:
  channel:
    description: The channel the alert was posted to. Empty for a webhook post.
    value: ${{ steps.post.outputs.channel }}
  ts:
    description: The alert message's timestamp, the thread to reply in. Empty for a webhook post.
    value: ${{ steps.post.outputs.ts }}
runs:
  using: composite
  steps:
    - name: Authenticate to read the alerting webhook
      uses: archestra-ai/.github/actions/google-auth@7cf2603035c4049f674ce8b63bbf9a275c3dfde2 # v1.32.0
      with:
        service_account: ${{ inputs.service-account }}
        workload_identity_provider: ${{ inputs.workload-identity-provider }}

    # The #alerts webhook (ci-alerts-slack-webhook-url posts to #approvals).
    - name: Read the alerting webhook
      id: alerting
      if: inputs.slack-channel == ''
      uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
      with:
        secrets: |-
          slack_webhook_url:friendly-path-465518-r6/ci-release-image-scan-slack-webhook-url

    # The bot of Release Image Scan, the app the webhook posts as, so the
    # alert looks the same. Unlike the webhook, its post returns the ts.
    - name: Read the alerting bot token
      id: bot
      if: inputs.slack-channel != ''
      uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
      with:
        secrets: |-
          bot_token:friendly-path-465518-r6/release-image-scan-slack-bot-token

    - name: Post to #alerts
      id: post
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SLACK_WEBHOOK_URL: ${{ steps.alerting.outputs.slack_webhook_url }}
        SLACK_BOT_TOKEN: ${{ steps.bot.outputs.bot_token }}
        SLACK_CHANNEL: ${{ inputs.slack-channel }}
        SUMMARY: ${{ inputs.summary }}
        DETAILS: ${{ inputs.details }}
        TEST_ALERT: ${{ inputs.test }}
        WORKFLOW: ${{ github.workflow }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        JOBS_URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
      run: |
        set -euo pipefail
        if [[ -z "$SLACK_WEBHOOK_URL" && -z "$SLACK_BOT_TOKEN" ]]; then
          echo "::warning::The alerting secret is empty; skipping Slack notification."
          exit 0
        fi
        if [[ "$TEST_ALERT" == "true" ]]; then
          message=":test_tube: Test of the ${WORKFLOW} failure alert; nothing ran, nothing to do. <$RUN_URL|View workflow run>"
        elif [[ -n "$DETAILS" ]]; then
          message=":rotating_light: ${SUMMARY} <$RUN_URL|View workflow run>"$'\n'"$DETAILS"
        else
          # One line per failed job, with its first failed step.
          failures="$(gh api --paginate "$JOBS_URL?per_page=100" --jq '
            .jobs[] | select(.conclusion == "failure") |
            ([.steps[] | select(.conclusion == "failure") | .name][0] // "setup") as $step |
            "• <\(.html_url)|\(.name)>: failed at \($step)"')"
          message=":rotating_light: ${SUMMARY} <$RUN_URL|View workflow run>"$'\n'"${failures:-• No failed job was listed; check the run.}"
        fi
        if [[ -z "$SLACK_CHANNEL" ]]; then
          jq -n --arg text "$message" '{text: $text}' |
            curl --fail-with-body -sS --max-time 15 -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
          exit 0
        fi
        response="$(jq -n --arg channel "$SLACK_CHANNEL" --arg text "$message" '{channel: $channel, text: $text, unfurl_links: false}' |
          curl --fail-with-body -sS --max-time 15 -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H 'Content-type: application/json; charset=utf-8' --data @-)"
        jq -e '.ok' <<<"$response" > /dev/null || { echo "::error::Slack refused the alert: $(jq -r '.error // "no error given"' <<<"$response")"; exit 1; }
        {
          echo "channel=$(jq -r '.channel' <<<"$response")"
          echo "ts=$(jq -r '.ts' <<<"$response")"
        } >> "$GITHUB_OUTPUT"
