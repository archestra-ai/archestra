name: Prune E2E Platform Tree Tags

# The image-reuse path in platform-e2e-tests.yml publishes a `tree-<oid>` tag per
# distinct ./platform tree to the archestra-public/platform repo in Artifact
# Registry. Recent tree tags ARE the reuse cache; old ones are dead weight. This
# job prunes tree-* tags older than the reuse window so they don't accumulate
# unbounded.
#
# Scope is deliberately minimal and additive:
#   - it only touches the `platform` package;
#   - it only deletes tags whose name starts with `tree-`;
#   - it deletes the TAG pointer only (never a digest, never a `:${sha}` tag);
#   - it does NOT set/replace any GAR cleanup policy, so it cannot clobber a
#     retention policy managed elsewhere (e.g. an infra repo).
#
# Ships in DRY-RUN by default (scheduled and manual runs both list-only until
# armed). To arm: run once via workflow_dispatch with dry_run=false, review the
# deletions, confirm the service account has artifactregistry delete permission,
# then set DRY_RUN's fallback below to 'false'.

on:
  schedule:
    - cron: "23 4 * * 0" # weekly, Sunday, before European hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List tags that would be deleted without deleting them"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: prune-e2e-platform-tree-tags
  cancel-in-progress: false

env:
  IMAGE_REPO: europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public/platform
  MAX_AGE_DAYS: "30"

jobs:
  prune:
    name: Prune E2E Platform Tree Tags
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read # Checkout the local auth-to-gar action.
      id-token: write # Workload Identity Federation for Artifact Registry.
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Authenticate to Google Artifact Registry
        uses: ./.github/actions/auth-to-gar
        with:
          service_account: ${{ secrets.DEVELOPMENT_OAUTH_PROXY_RELEASER_GCP_SERVICE_ACCOUNT_NAME }}
          workload_identity_provider: ${{ secrets.DEVELOPMENT_OAUTH_PROXY_RELEASER_GCP_WORKLOAD_IDENTITY_PROVIDER_IDENTIFIER }}

      - name: Prune stale tree-* tags
        shell: bash
        # Fallback keeps scheduled runs (which carry no inputs) in dry-run.
        # Flip this to 'false' to arm the schedule after reviewing a manual run.
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
        run: |
          set -euo pipefail

          CUTOFF=$(date -u -d "-${MAX_AGE_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          echo "Pruning tree-* tags on images created before ${CUTOFF} (DRY_RUN=${DRY_RUN})"

          gcloud artifacts docker images list "${IMAGE_REPO}" \
            --include-tags --format=json > /tmp/images.json

          # Select tree-* tags on image versions created before the cutoff.
          # Handle `tags` as either a JSON array or a comma-joined string across
          # gcloud versions.
          mapfile -t STALE_TAGS < <(
            jq -r --arg cutoff "$CUTOFF" '
              .[]
              | select(.createTime < $cutoff)
              | ((.tags // []) | if type == "array" then .[] else split(", ")[] end)
              | select(startswith("tree-"))
            ' /tmp/images.json
          )

          echo "Found ${#STALE_TAGS[@]} stale tree-* tag(s)."
          if [ "${#STALE_TAGS[@]}" -eq 0 ]; then
            echo "Nothing to prune."
            exit 0
          fi

          for tag in "${STALE_TAGS[@]}"; do
            ref="${IMAGE_REPO}:${tag}"
            if [ "${DRY_RUN}" = "true" ]; then
              echo "[dry-run] would delete tag ${ref}"
            else
              echo "Deleting tag ${ref}"
              gcloud artifacts docker tags delete "${ref}" --quiet || echo "::warning::failed to delete ${ref}"
            fi
          done
          echo "Done."
