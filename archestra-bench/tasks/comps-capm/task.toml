    required = ["max", "p75", "median", "p25", "min"]
    additionalProperties = false
      [result_schema.properties.comps.properties.ev_ebitda.properties.max]
      type = "number"
      [result_schema.properties.comps.properties.ev_ebitda.properties.p75]
      type = "number"
      [result_schema.properties.comps.properties.ev_ebitda.properties.median]
      type = "number"
      [result_schema.properties.comps.properties.ev_ebitda.properties.p25]
      type = "number"
      [result_schema.properties.comps.properties.ev_ebitda.properties.min]
